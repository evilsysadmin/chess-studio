name = "chess-studio-narrative-ai-staging"
main = "worker/staging.js"
compatibility_date = "2026-08-22"
workers_dev = false

# El Custom Domain se adjunta explícitamente con Workers Domains API después
# de subir script + secret. No usamos [[routes]] aquí: Wrangler lo traduce a
# la API de Workers Routes de zona, que exigiría un permiso adicional que el
# pipeline no necesita para un Custom Domain.
#
# staging.js envuelve únicamente /health para publicar BUILD_SHA. El runtime
# funcional sigue delegando en worker/index.js, compartido con producción.

[ai]
binding = "AI"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1606602"

  [ratelimits.simple]
  limit = 300
  period = 60
