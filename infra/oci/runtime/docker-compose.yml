services:
  backend:
    build:
      context: .
      dockerfile: backend-image.Dockerfile
      args:
        BACKEND_IMAGE: ghcr.io/evilsysadmin/chess-studio-backend:oci-${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    image: chess-studio-backend:oci-${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    env_file:
      - ${CHESS_STUDIO_ENV_FILE:-/etc/chess-studio/backend.env}
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
      PORT: "4000"
      # Staging owns its browser origin at deploy time. The deploy wrapper
      # exports CHESS_STUDIO_CORS_ORIGINS explicitly so a stale host env cannot
      # silently replace staging CORS with production-only configuration.
      CORS_ORIGINS: "${CHESS_STUDIO_CORS_ORIGINS:-https://staging.chess-studio.shadowops.dpdns.org}"
    ports:
      - "127.0.0.1:${CHESS_STUDIO_BACKEND_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Transitional compatibility shim for A1 hosts whose root-owned deploy
  # wrapper still expects a service named `alloy`. Grafana Alloy is deliberately
  # disabled for now so telemetry cannot block staging. The exact backend image
  # is already pulled by the wrapper, so this service performs no registry pull,
  # accepts the legacy `validate` probe, and otherwise stays inert.
  alloy:
    image: ghcr.io/evilsysadmin/chess-studio-backend:oci-${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    pull_policy: never
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$${1:-}" = "validate" ]; then
          exit 0
        fi
        while :; do sleep 3600; done
      - --
    command:
      - idle
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
