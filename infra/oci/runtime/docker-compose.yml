services:
  backend:
    build:
      context: .
      dockerfile: backend-image.Dockerfile
      args:
        BACKEND_IMAGE: ghcr.io/evilsysadmin/chess-studio-backend:oci-${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    image: chess-studio-backend:oci-${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    env_file:
      - ${CHESS_STUDIO_ENV_FILE:-/etc/chess-studio/backend.env}
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
      PORT: "4000"
      # Staging must remain browser-reachable even if a migrated runtime env
      # accidentally carries production-only CORS. Production can override it.
      CORS_ORIGINS: "${CHESS_STUDIO_CORS_ORIGINS:-https://staging.chess-studio.shadowops.dpdns.org}"
    ports:
      - "127.0.0.1:${CHESS_STUDIO_BACKEND_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.19.2
    env_file:
      - ${CHESS_STUDIO_ENV_FILE:-/etc/chess-studio/backend.env}
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
