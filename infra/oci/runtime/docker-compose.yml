services:
  backend:
    image: ghcr.io/evilsysadmin/chess-studio-backend:oci-${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
    # The deploy wrapper pulls this immutable image before it touches the
    # currently-serving backend. `up` itself is deliberately offline/fail-closed.
    pull_policy: never
    env_file:
      - ${CHESS_STUDIO_ENV_FILE:-/etc/chess-studio/backend.env}
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
      PORT: "4000"
      # Staging owns its browser origin at deploy time. The deploy wrapper
      # exports CHESS_STUDIO_CORS_ORIGINS explicitly so a stale host env cannot
      # silently replace staging CORS with production-only configuration.
      CORS_ORIGINS: "${CHESS_STUDIO_CORS_ORIGINS:-https://staging.chess-studio.shadowops.dpdns.org}"
      # The OCI deploy wrapper sets this only because both staging and temporary
      # production are reachable exclusively through the outbound Cloudflare Tunnel.
      TRUST_CLOUDFLARE_CLIENT_IP: "${CHESS_STUDIO_TRUST_CLOUDFLARE_CLIENT_IP:-false}"
    ports:
      - "127.0.0.1:${CHESS_STUDIO_BACKEND_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Host telemetry is deliberately independent from the product backend.
  # The deploy wrapper starts/validates Alloy only after backend accreditation
  # and treats every telemetry failure as fail-open.
  alloy:
    image: grafana/alloy:v1.19.2
    env_file:
      - ${CHESS_STUDIO_ENV_FILE:-/etc/chess-studio/backend.env}
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
      OCI_LOG_SERVICE_NAME: "${CHESS_STUDIO_OCI_LOG_SERVICE_NAME:-chess-studio-oci-backend-staging-stdout}"
    command:
      - run
      - --stability.level=public-preview
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - "${CHESS_STUDIO_STATE_DIR:-/var/lib/chess-studio}/observability:/var/lib/chess-studio/observability:ro"
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  alloy-data:
