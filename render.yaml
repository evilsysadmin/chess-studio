# render.yaml — Blueprint de referencia para el backend de producción.
#
# La release normal NO usa autodeploy ni este Blueprint: GitHub Actions
# reconcilia Render por API y promociona únicamente el SHA acreditado en
# staging. Este archivo se conserva como configuración reproducible/recuperación
# manual. Los secretos usan sync:false y nunca se commitean.

services:
  - type: web
    name: chess-study-backend
    runtime: docker
    dockerfilePath: ./backend-python/Dockerfile
    dockerContext: ./backend-python
    plan: free
    healthCheckPath: /api/ready
    # El frontend de producción vive en Cloudflare Pages bajo el dominio propio;
    # la API usa su subdominio independiente de Render.
    domains:
      - api.chess-studio.shadowops.dpdns.org
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: chess_study
      - key: JWT_SECRET
        sync: false
      # Recuperación de contraseña. RESEND_API_KEY es secreto.
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://chess-studio.shadowops.dpdns.org/
      - key: ENVIRONMENT
        value: production
      # OpenTelemetry -> Grafana Cloud: trazas, métricas y logs por el mismo gateway OTLP.
      # Los valores OTLP son secretos; sin endpoint las señales quedan desactivadas fail-open.
      - key: OTEL_SERVICE_NAME
        value: chess-studio-backend
      - key: OTEL_TRACES_ENABLED
        value: "true"
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "1.0"
      - key: OTEL_METRICS_ENABLED
        value: "true"
      - key: OTEL_LOGS_ENABLED
        value: "true"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # Recuperación por email activa. Durante la prueba, onboarding@resend.dev
      # puede usarse con las restricciones de Resend; tras verificar
      # shadowops.dpdns.org configura PASSWORD_RESET_FROM en el dashboard.
      - key: ENABLE_EMAIL_RECOVERY
        value: "true"
      - key: PASSWORD_RESET_FROM
        value: Chess Studio <onboarding@resend.dev>
      - key: EXPOSE_API_DOCS
        value: "false"
      # Ponlo en "false" cuando quieras congelar altas nuevas en producción.
      - key: ALLOW_REGISTRATION
        value: "true"
      # Si lo configuras, el registro exige este código además de usuario/contraseña.
      - key: INVITE_CODE
        sync: false
      - key: CORS_ORIGINS
        value: https://chess-studio.shadowops.dpdns.org
