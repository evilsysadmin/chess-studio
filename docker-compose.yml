services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # The API is the Go edge on its own (GO_PYTHON_RETIRED): every route is
  # native, there is no Python behind it.
  backend:
    build:
      context: ./backend-go
    ports:
      - "${BACKEND_PORT:-4000}:8080"
    environment:
      PORT: "8080"
      GO_PYTHON_RETIRED: "true"
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: chess_study
      ENVIRONMENT: development
      # Local only: the same default Python used, so existing local sessions
      # keep working. Staging and production set their own secret.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      ENABLE_EMAIL_RECOVERY: "false"
      # Sin RESEND_API_KEY, el backend imprime el enlace de recuperación en logs.
      PASSWORD_RESET_URL: http://localhost:${FRONTEND_PORT:-5173}/
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_FROM: "${PASSWORD_RESET_FROM:-Chess Studio <onboarding@resend.dev>}"
      ALLOW_REGISTRATION: "true"
      INVITE_CODE: ${INVITE_CODE:-}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      # Desarrollo local: cualquier cuenta autenticada es admin.
      ADMIN_USERNAMES: "*"
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Le decimos al build del frontend en qué URL va a encontrar al backend.
        # Como el navegador corre en el host (no dentro de la red de Docker),
        # tiene que ser el puerto publicado, no el nombre del servicio.
        VITE_API_URL: http://localhost:${BACKEND_PORT:-4000}/api
        # Compose debe ofrecer las mismas War Rooms que staging/prod. Puede
        # deshabilitarse explícitamente con VITE_WAR_ROOM_VARIANTS_ENABLE=0.
        VITE_WAR_ROOM_VARIANTS_ENABLE: ${VITE_WAR_ROOM_VARIANTS_ENABLE:-1}
        VITE_GRAFANA_CLOUD_URL: ${VITE_GRAFANA_CLOUD_URL:-}
        VITE_GRAFANA_LOGS_DASHBOARD_URL: ${VITE_GRAFANA_LOGS_DASHBOARD_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
