<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171b1f;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: 0;
      background: #171b1f;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="$GODOT_PROJECT_NAME"></canvas>
  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const canvas = document.getElementById("canvas");
      const engine = new Engine($GODOT_CONFIG);
      engine.startGame({ canvas })
        .then(() => {
          try {
            canvas.focus({ preventScroll: true });
          } catch (_) {
            canvas.focus();
          }
        })
        .catch((error) => {
          console.error("Pawn Slug Godot failed to start", error);
          try {
            window.parent.postMessage(
              { source: "pawn-slug-godot", type: "load-error" },
              "*"
            );
          } catch (_) {}
        });
    })();
  </script>
</body>
</html>
