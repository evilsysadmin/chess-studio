name: Pawn Slug P0 repair

on:
  push:
    branches:
      - feat/pawn-slug-platforms

permissions:
  contents: write

jobs:
  repair-platform-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pawn-slug-platforms
          fetch-depth: 0

      - name: Repair runtime typo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pawnSlugThree.js')
          source = path.read_text()
          bad = "const lane = pawnSlugSturmBISHOP_META?.suppressionBurstShots ? pawnSlugSturmBishopSuppressionLane(shotIndex) : pawnSlugSturmBishopSuppressionLane(shotIndex);"
          good = "const lane = pawnSlugSturmBishopSuppressionLane(shotIndex);"
          count = source.count(bad)
          if count != 1:
              raise SystemExit(f'expected one typo anchor, found {count}')
          path.write_text(source.replace(bad, good, 1))
          PY

      - name: Syntax check
        run: node --check frontend/src/pawnSlugThree.js

      - name: Commit runtime repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pawnSlugThree.js
          git diff --cached --check
          git commit -m "fix: repair Pawn Slug platform runtime"
          git push origin HEAD:feat/pawn-slug-platforms
