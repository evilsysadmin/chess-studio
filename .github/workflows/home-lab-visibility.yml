name: Home Laboratorio visibility

on:
  pull_request:
    paths:
      - 'frontend/src/components/Menu.jsx'
      - 'frontend/src/styles.css'
      - 'frontend/src/styles/29-home-lab-shortcut.css'
      - 'e2e/home-lab-visibility.spec.js'
      - '.github/workflows/home-lab-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Laboratorio · Home visibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install dependencies
        shell: bash
        run: |
          cd frontend && npm ci
          cd ../e2e && npm ci
          ./node_modules/.bin/playwright install chromium

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Laboratorio is discoverable before disclosure
        working-directory: e2e
        run: ./node_modules/.bin/playwright test home-lab-visibility.spec.js --workers=2 --retries=0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: home-lab-visibility-diagnostics
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 5
