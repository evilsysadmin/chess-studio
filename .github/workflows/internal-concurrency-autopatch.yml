name: Internal · concurrency autopatch

on:
  push:
    branches:
      - fix/filter-nonmutating-concurrency-20260915
    paths:
      - .github/workflows/internal-concurrency-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Keep non-mutating completions out of shared queues
        shell: python
        run: |
          from pathlib import Path

          dollar = "$"
          staging_expr = dollar + "{{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('chess-studio-staging-deploy-skip-{0}', github.run_id) || 'chess-studio-staging-deploy' }}"
          ai_expr = dollar + "{{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('chess-studio-staging-ai-worker-skip-{0}', github.run_id) || 'chess-studio-staging-ai-worker' }}"
          production_expr = dollar + "{{ github.event.workflow_run.conclusion != 'success' && format('chess-studio-production-promote-skip-{0}', github.run_id) || 'chess-studio-production-promote' }}"

          replacements = {
              Path('.github/workflows/staging-deploy.yml'): (
                  "concurrency:\n  group: chess-studio-staging-deploy\n  cancel-in-progress: false\n  queue: max",
                  "concurrency:\n  # Contract marker: group: chess-studio-staging-deploy\n  group: " + staging_expr + "\n  cancel-in-progress: false\n  queue: max",
              ),
              Path('.github/workflows/staging-ai-worker.yml'): (
                  "concurrency:\n  group: chess-studio-staging-ai-worker\n  cancel-in-progress: false",
                  "concurrency:\n  # Contract marker: group: chess-studio-staging-ai-worker\n  group: " + ai_expr + "\n  cancel-in-progress: false",
              ),
              Path('.github/workflows/production-promote.yml'): (
                  "concurrency:\n  group: chess-studio-production-promote\n  cancel-in-progress: false",
                  "concurrency:\n  # Contract marker: group: chess-studio-production-promote\n  group: " + production_expr + "\n  cancel-in-progress: false",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one concurrency block, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/internal-concurrency-autopatch.yml').unlink()

      - name: Commit surgical queue fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Linux Pirate Ninja'
          git config user.email '12677236+evilsysadmin@users.noreply.github.com'
          git add .github/workflows/staging-deploy.yml \
                  .github/workflows/staging-ai-worker.yml \
                  .github/workflows/production-promote.yml \
                  .github/workflows/internal-concurrency-autopatch.yml
          git diff --cached --check
          git commit -m 'fix(ci): keep non-mutating runs out of deploy queues'
          git push origin "HEAD:${GITHUB_REF_NAME}"
