name: Staging · AI Worker

on:
  workflow_run:
    workflows:
      - Staging · deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: chess-studio-staging-ai-worker
  cancel-in-progress: false

jobs:
  accredit:
    name: Accredit coherent staging generation
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://ai-staging.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGER_EVENT: ${{ github.event_name }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event || '' }}
      STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
      STAGING_AI_URL: https://ai-staging.shadowops.dpdns.org

    steps:
      - name: Validate accredited source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA inválido: $DEPLOY_SHA"; exit 1; }
          if [[ "$TRIGGER_EVENT" == 'workflow_run' && "$UPSTREAM_EVENT" != 'workflow_run' ]]; then
            echo "::error::Staging AI fue encadenado desde un Staging · deploy manual ($UPSTREAM_EVENT); puede probar staging, pero no acreditar producción."
            exit 1
          fi

      - name: Checkout staging-accredited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Main puede avanzar mientras una generación coherente de staging termina.
      # Eso no invalida lo ya probado: sólo rechazamos el SHA si dejó de pertenecer
      # a la línea de main. Los checks exactos de backend/frontend/Worker de abajo
      # siguen decidiendo si staging todavía sirve realmente esta generación.
      - name: Supersede stale staging accreditation outside current main lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          compare_status="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...$current_main" \
            --jq '.status')"
          case "$compare_status" in
            identical|ahead)
              ;;
            *)
              echo "::notice title=Staging accreditation superseded::El SHA acreditable $DEPLOY_SHA ya no pertenece a la línea de main ($current_main, compare=$compare_status). No emito credencial de producción."
              {
                echo '### Acreditación de staging superseded'
                echo
                echo "- Staging SHA verificado: \`$DEPLOY_SHA\`"
                echo "- Current main: \`$current_main\`"
                echo "- Compare status: \`$compare_status\`"
                echo '- Acción: `autocancelar antes de emitir credencial de promoción`'
                echo '- Producción: `no se dispara para un SHA fuera de la línea de main`'
              } >> "$GITHUB_STEP_SUMMARY"

              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

              echo 'Cancelación solicitada; permanezco fail-closed hasta que GitHub detenga el runner.'
              while :; do
                sleep 30
              done
              ;;
          esac

          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "::notice title=Staging accreditation retained::main avanzó a $current_main, pero $DEPLOY_SHA sigue siendo ancestro. La acreditación continúa y los checks live decidirán si staging todavía sirve ese SHA."
          fi
          echo "Staging accreditation lineage OK: $DEPLOY_SHA pertenece a main actual $current_main."

      - name: Verify staging backend still serves approved SHA
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/staging-backend-release.json"
          status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_API_URL/release?sha=$DEPLOY_SHA")"
          [[ "$status" == 200 ]] || { echo "::error::Backend staging release HTTP $status"; exit 1; }
          python3 - "$body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = sys.argv[2].lower()
          actual = str(payload.get('build') or '').lower()
          raise SystemExit(0 if actual == expected else f"Backend staging sirve {actual or '<sin build>'}, esperaba {expected}")
          PY

      - name: Verify staging frontend still serves approved SHA
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/staging-frontend-release.json"
          status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_URL/release.json?sha=$DEPLOY_SHA")"
          [[ "$status" == 200 ]] || { echo "::error::Frontend staging release HTTP $status"; exit 1; }
          python3 - "$body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = sys.argv[2].lower()
          actual = str(payload.get('build') or '').lower()
          raise SystemExit(0 if actual == expected else f"Frontend staging sirve {actual or '<sin build>'}, esperaba {expected}")
          PY

      - name: Verify staging AI health and build identity
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/staging-ai-health.json"
          status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_AI_URL/health")"
          [[ "$status" == 200 ]] || { echo "::error::Workers AI staging health HTTP $status"; exit 1; }
          python3 scripts/cloudflare_health_contract.py "$body"
          python3 - "$body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = sys.argv[2].lower()
          actual = str(payload.get('build') or '').lower()
          raise SystemExit(0 if actual == expected else f"Workers AI staging sirve {actual or '<sin build>'}, esperaba {expected}")
          PY

      - name: Shared Workers AI live contract
        run: python3 scripts/cloudflare_ai_preflight.py --worker-url "$STAGING_AI_URL"

      - name: Write immutable production accreditation
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          STAGING_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/staging-promotion-accreditation.json" "$DEPLOY_SHA" "$STAGING_DEPLOY_RUN_ID" "$GITHUB_RUN_ID" "$UPSTREAM_EVENT" <<'PY'
          import json, pathlib, sys
          target, sha, staging_deploy_run_id, staging_ai_run_id, upstream_event = sys.argv[1:]
          payload = {
              "schema": 1,
              "sha": sha.lower(),
              "staging_deploy_run_id": int(staging_deploy_run_id),
              "staging_ai_run_id": int(staging_ai_run_id),
              "upstream_event": upstream_event,
          }
          pathlib.Path(target).write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable production accreditation
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v6
        with:
          name: staging-promotion-accreditation
          path: ${{ runner.temp }}/staging-promotion-accreditation.json
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Staging acreditado para promoción'
            echo
            echo "- Source SHA: \`$DEPLOY_SHA\`"
            echo '- Backend: `mismo SHA · OK`'
            echo '- Frontend: `mismo SHA · OK`'
            echo '- Workers AI: `mismo SHA + health + routing · OK`'
            if [[ "$TRIGGER_EVENT" == 'workflow_run' ]]; then
              echo '- Credencial de promoción: `artifact inmutable ligado a este run`'
            else
              echo '- Credencial de promoción: `no emitida en ejecución manual`'
            fi
            echo '- Este workflow ya no exige que el SHA siga siendo HEAD: basta con que permanezca en la línea de main y que staging siga sirviéndolo coherentemente.'
            echo "- Upstream event: \`${UPSTREAM_EVENT:-manual}\`"
          } >> "$GITHUB_STEP_SUMMARY"
