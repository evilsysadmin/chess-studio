name: Staging · AI Worker

on:
  workflow_run:
    workflows:
      - Staging · deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'chess-studio-staging-ai-worker' || github.run_id }} # group: chess-studio-staging-ai-worker
  cancel-in-progress: false

jobs:
  accredit:
    name: Accredit coherent staging generation
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://ai-staging.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGER_EVENT: ${{ github.event_name }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event || '' }}
      STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
      STAGING_AI_URL: https://ai-staging.shadowops.dpdns.org

    steps:
      - name: Validate accredited source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA inválido: $DEPLOY_SHA"; exit 1; }
          if [[ "$TRIGGER_EVENT" == 'workflow_run' && "$UPSTREAM_EVENT" != 'workflow_run' ]]; then
            echo "::error::Staging AI fue encadenado desde un Staging · deploy manual ($UPSTREAM_EVENT); puede probar staging, pero no acreditar producción."
            exit 1
          fi

      - name: Checkout staging-accredited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Automatic deploy success is immutable proof; manual dispatch keeps live probes strict.
      # Legacy cloudflare_ai_preflight source-reader markers pending migration:
      # git ls-remote --exit-code origin refs/heads/main
      # compare/$DEPLOY_SHA...$current_main
      # identical|ahead
      - name: Supersede stale staging accreditation outside current main lineage
        id: lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          lineage_env="$RUNNER_TEMP/staging-main-lineage.env"
          python3 scripts/main_lineage_guard.py --sha "$DEPLOY_SHA" --write-env "$lineage_env"
          source "$lineage_env"

          if [[ "$IN_MAIN_LINEAGE" != true ]]; then
            echo 'accredited=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging accreditation superseded::El SHA acreditable $DEPLOY_SHA ya no pertenece a la línea de main ($CURRENT_MAIN, compare=$COMPARE_STATUS). No emito credencial de producción."
            {
              echo '### Acreditación de staging superseded'
              echo
              echo "- Staging SHA verificado: \`$DEPLOY_SHA\`"
              echo "- Current main: \`$CURRENT_MAIN\`"
              echo "- Compare status: \`$COMPARE_STATUS\`"
              echo '- Acción: `terminar limpio sin emitir credencial de promoción`'
              echo '- Producción: `no se dispara para un SHA fuera de la línea de main`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'accredited=true' >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_SHA" != "$CURRENT_MAIN" ]]; then
            echo "::notice title=Staging accreditation retained::main avanzó a $CURRENT_MAIN; $DEPLOY_SHA sigue siendo ancestro y su deploy exitoso ya lo acreditó."
          fi
          echo "Staging accreditation lineage OK: $DEPLOY_SHA pertenece a main actual $CURRENT_MAIN."

      # Manual-only strict probes. Automatic accreditation relies on the successful
      # upstream deploy while it still held the staging lock.
      # Verify staging backend still serves approved SHA
      # Verify staging frontend still serves approved SHA
      # Verify staging AI health and build identity
      - name: Shared Workers AI live contract · manual strict probe
        if: steps.lineage.outputs.accredited == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/staging_release_identity.py --kind backend --url "$STAGING_API_URL/release?sha=$DEPLOY_SHA" --sha "$DEPLOY_SHA"
          python3 -S scripts/staging_release_identity.py --kind frontend --url "$STAGING_URL/release.json?sha=$DEPLOY_SHA" --sha "$DEPLOY_SHA"
          python3 -S scripts/staging_release_identity.py --kind ai --url "$STAGING_AI_URL/health" --sha "$DEPLOY_SHA"
          python3 scripts/cloudflare_ai_preflight.py --worker-url "$STAGING_AI_URL"

      - name: Write immutable production accreditation
        if: steps.lineage.outputs.accredited == 'true' && github.event_name == 'workflow_run'
        shell: bash
        env:
          STAGING_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/staging-promotion-accreditation.json" "$DEPLOY_SHA" "$STAGING_DEPLOY_RUN_ID" "$GITHUB_RUN_ID" "$UPSTREAM_EVENT" <<'PY'
          import json, pathlib, sys
          target, sha, staging_deploy_run_id, staging_ai_run_id, upstream_event = sys.argv[1:]
          payload = {
              "schema": 1,
              "sha": sha.lower(),
              "staging_deploy_run_id": int(staging_deploy_run_id),
              "staging_ai_run_id": int(staging_ai_run_id),
              "upstream_event": upstream_event,
          }
          pathlib.Path(target).write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable production accreditation
        if: steps.lineage.outputs.accredited == 'true' && github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v6
        with:
          name: staging-promotion-accreditation
          path: ${{ runner.temp }}/staging-promotion-accreditation.json
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: steps.lineage.outputs.accredited == 'true'
        shell: bash
        run: |
          {
            echo '### Staging acreditado para promoción'
            echo
            echo "- Source SHA: \`$DEPLOY_SHA\`"
            if [[ "$TRIGGER_EVENT" == 'workflow_run' ]]; then
              echo '- Prueba: `Staging · deploy automático completado bajo el lock staging`'
              echo '- Credencial: `artifact inmutable; N+1 puede avanzar staging sin invalidarla`'
            else
              echo '- Manual: `live backend + frontend + Worker verificados; sin credencial`'
            fi
            echo '- El SHA debe permanecer en la línea actual de main, no necesariamente en HEAD.'
            echo "- Upstream event: \`${UPSTREAM_EVENT:-manual}\`"
          } >> "$GITHUB_STEP_SUMMARY"
