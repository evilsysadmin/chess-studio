name: zfrq feedback delete finalize

on:
  push:
    branches:
      - feature/zfrq-feedback-delete

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zfrq-feedback-delete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused zfrq changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          RELEASE = 'v16.6dm46zfrq'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend: owner-scoped deletion is atomic in Mongo and deliberately
          # indistinguishable from a missing id when another user owns the row.
          replace_once(
              'backend-python/feedback_store.py',
              '''async def delete_feedback(feedback_id: str) -> bool:\n''',
              '''async def delete_feedback_for_user(feedback_id: str, username: str) -> bool:\n    col = await _get_collection()\n    if col is not None:\n        try:\n            result = await col.delete_one({"_id": feedback_id, "username": username})\n            return bool(getattr(result, "deleted_count", 0))\n        except PyMongoError as exc:\n            raise PersistentStorageUnavailable("MongoDB no está disponible para borrar tu feedback.") from exc\n\n    row = _memory_feedback.get(feedback_id)\n    if not row or row.get("username") != username:\n        return False\n    _memory_feedback.pop(feedback_id, None)\n    return True\n\n\nasync def delete_feedback(feedback_id: str) -> bool:\n''',
          )

          replace_once(
              'backend-python/system_api.py',
              '''import db\nimport users_store as ustore\n''',
              '''import db\nimport feedback_store as fstore\nimport users_store as ustore\n''',
          )
          replace_once(
              'backend-python/system_api.py',
              '''    @router.get("/api/status")\n''',
              '''    @router.delete("/api/feedback/{feedback_id}", status_code=204)\n    async def delete_own_feedback(feedback_id: str, username: str = Depends(auth_dependency)):\n        # id + owner are matched in the same storage operation. A feedback id\n        # owned by somebody else is intentionally indistinguishable from one\n        # that does not exist, so this endpoint cannot be used for enumeration.\n        deleted = await fstore.delete_feedback_for_user(feedback_id, username)\n        if not deleted:\n            raise HTTPException(404, "Feedback no encontrado.")\n        return Response(status_code=204)\n\n    @router.get("/api/status")\n''',
          )

          # Frontend API client.
          replace_once(
              'frontend/src/feedback.js',
              '''export async function deleteAdminFeedback(feedbackId) {\n''',
              '''export async function deleteMyFeedback(feedbackId) {\n  const response = await request(`${BASE_URL}/feedback/${encodeURIComponent(feedbackId)}`, {\n    method: 'DELETE',\n    headers: { ...authHeader() },\n  });\n  if (!response.ok) {\n    let detail = `HTTP ${response.status}`;\n    try { detail = (await response.json())?.detail || detail; } catch { /* 204/binary-safe */ }\n    throw new Error(detail);\n  }\n  return true;\n}\n\nexport async function deleteAdminFeedback(feedbackId) {\n''',
          )

          # User-facing self-service UI stays behind progressive disclosure.
          replace_once(
              'frontend/src/components/FeedbackModal.jsx',
              '''import { fetchMyFeedback, submitFeedback } from '../feedback.js';\n''',
              '''import { deleteMyFeedback, fetchMyFeedback, submitFeedback } from '../feedback.js';\n''',
          )
          replace_once(
              'frontend/src/components/FeedbackModal.jsx',
              '''  const [history, setHistory] = useState([]);\n''',
              '''  const [history, setHistory] = useState([]);\n  const [deletingId, setDeletingId] = useState(null);\n''',
          )
          replace_once(
              'frontend/src/components/FeedbackModal.jsx',
              '''  function handleDrop(event) {\n    event.preventDefault();\n    const selected = Array.from(event.dataTransfer?.files || []);\n    if (selected.length) acceptImages(selected);\n  }\n\n  return (\n''',
              '''  function handleDrop(event) {\n    event.preventDefault();\n    const selected = Array.from(event.dataTransfer?.files || []);\n    if (selected.length) acceptImages(selected);\n  }\n\n  async function handleDeleteFeedback(feedbackId) {\n    if (!feedbackId || deletingId) return;\n    if (typeof window !== 'undefined' && !window.confirm('¿Eliminar este feedback? Esta acción no se puede deshacer.')) return;\n    setDeletingId(feedbackId);\n    setError(null);\n    try {\n      await deleteMyFeedback(feedbackId);\n      if (mountedRef.current) setHistory((current) => current.filter((item) => item.id !== feedbackId));\n    } catch (err) {\n      if (mountedRef.current) setError(userFacingError(err, 'No se pudo eliminar el feedback.'));\n    } finally {\n      if (mountedRef.current) setDeletingId(null);\n    }\n  }\n\n  return (\n''',
          )
          old_history = '''            {history.some((item) => item.admin_reply) && (\n              <details className="feedback-thread-history">\n                <summary>Respuestas de los admins</summary>\n                <div className="feedback-thread-list">\n                  {history.filter((item) => item.admin_reply).slice(0, 5).map((item) => (\n                    <article key={item.id} className="feedback-thread-item">\n                      <small>{item.status === 'resolved' ? 'Resuelto' : 'Respondido'} · {item.context || 'Feedback'}</small>\n                      <p>{item.admin_reply}</p>\n                    </article>\n                  ))}\n                </div>\n              </details>\n            )}\n'''
          new_history = '''            {history.length > 0 && (\n              <details className="feedback-thread-history">\n                <summary>Tus envíos ({history.length})</summary>\n                <div className="feedback-thread-list">\n                  {history.slice(0, 5).map((item) => (\n                    <article key={item.id} className="feedback-thread-item">\n                      <small>{item.status === 'resolved' ? 'Resuelto' : item.status === 'read' ? 'Leído' : 'Enviado'} · {item.context || 'Feedback'} · {item.category || 'general'}</small>\n                      <p>{item.message}</p>\n                      {item.admin_reply && <p><b>Respuesta del admin:</b> {item.admin_reply}</p>}\n                      <button\n                        type="button"\n                        className="secondary-btn"\n                        disabled={deletingId === item.id}\n                        onClick={() => handleDeleteFeedback(item.id)}\n                        aria-label="Eliminar este feedback"\n                      >\n                        {deletingId === item.id ? 'Eliminando…' : 'Eliminar'}\n                      </button>\n                    </article>\n                  ))}\n                </div>\n              </details>\n            )}\n'''
          replace_once('frontend/src/components/FeedbackModal.jsx', old_history, new_history)

          replace_once(
              'frontend/src/feedback.test.js',
              '''import { deleteAdminFeedback, fetchAdminFeedback, fetchAdminFeedbackSummary, submitFeedback, updateAdminFeedbackStatus } from './feedback.js';\n''',
              '''import { deleteAdminFeedback, deleteMyFeedback, fetchAdminFeedback, fetchAdminFeedbackSummary, submitFeedback, updateAdminFeedbackStatus } from './feedback.js';\n''',
          )
          replace_once(
              'frontend/src/feedback.test.js',
              '''  it('borra feedback admin con DELETE explícito', async () => {\n''',
              '''  it('borra el feedback propio con el endpoint de autoservicio', async () => {\n    global.fetch.mockResolvedValueOnce({ ok: true, status: 204, json: async () => ({}) });\n    await expect(deleteMyFeedback('mine-1')).resolves.toBe(true);\n    expect(global.fetch.mock.calls[0][0]).toContain('/feedback/mine-1');\n    expect(global.fetch.mock.calls[0][0]).not.toContain('/admin/');\n    expect(global.fetch.mock.calls[0][1].method).toBe('DELETE');\n    expect(global.fetch.mock.calls[0][1].headers.Authorization).toBe('Bearer session-token');\n  });\n\n  it('borra feedback admin con DELETE explícito', async () => {\n''',
          )

          Path('backend-python/test_feedback_self_service.py').write_text('''import asyncio\n\nfrom fastapi.testclient import TestClient\n\nfrom auth import create_token\nimport feedback_store as fstore\nfrom main import app\n\n\nclient = TestClient(app)\n\n\ndef _auth(username: str) -> dict[str, str]:\n    return {"Authorization": f"Bearer {create_token(username)}"}\n\n\ndef setup_function():\n    fstore._memory_feedback.clear()\n\n\ndef _create(username: str = "owner") -> dict:\n    return asyncio.run(fstore.create_feedback(\n        username=username,\n        category="general",\n        message="Quiero poder retirar este comentario.",\n        context="Home",\n    ))\n\n\ndef test_feedback_owner_can_delete_own_submission():\n    created = _create()\n    response = client.delete(f"/api/feedback/{created['id']}", headers=_auth("owner"))\n    assert response.status_code == 204\n    assert asyncio.run(fstore.list_feedback_for_user("owner")) == []\n\n\ndef test_feedback_owner_delete_does_not_delete_another_users_submission():\n    created = _create("owner")\n    response = client.delete(f"/api/feedback/{created['id']}", headers=_auth("intruder"))\n    assert response.status_code == 404\n    remaining = asyncio.run(fstore.list_feedback_for_user("owner"))\n    assert [row["id"] for row in remaining] == [created["id"]]\n\n\ndef test_feedback_owner_delete_hides_missing_and_foreign_ids_the_same_way():\n    response = client.delete('/api/feedback/does-not-exist', headers=_auth("owner"))\n    assert response.status_code == 404\n\n\ndef test_feedback_owner_delete_requires_authentication():\n    created = _create()\n    response = client.delete(f"/api/feedback/{created['id']}")\n    assert response.status_code == 401\n''')

          # Release identity and player-facing note.
          Path('RELEASE.txt').write_text(RELEASE + '\n')
          replace_once('backend-python/release_info.py', 'APP_RELEASE = "v16.6dm46zfrp"', f'APP_RELEASE = "{RELEASE}"')
          replace_once('frontend/src/release.js', "export const APP_RELEASE = 'v16.6dm46zfrp';", f"export const APP_RELEASE = '{RELEASE}';")
          Path('frontend/public/release.json').write_text('{\n  "release": "' + RELEASE + '"\n}\n')
          note_anchor = "export const USER_RELEASE_NOTES = Object.freeze([\n"
          note = '''{\n  release: 'v16.6dm46zfrq',\n  title: 'Tu feedback también lo controlas tú',\n  highlights: [\n    'El historial de feedback propio queda accesible dentro del formulario y conserva las respuestas de administración junto al mensaje original.',\n    'Puedes eliminar uno de tus propios envíos desde ese historial. La API comprueba propietario e identificador en la misma operación y nunca permite borrar comentarios de otra cuenta.',\n  ],\n},\n\n'''
          replace_once('frontend/src/userReleaseNotes.js', note_anchor, note_anchor + note)
          PY
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install backend test dependencies
        run: python -m pip install --upgrade -r backend-python/requirements-dev.txt
      - name: Directed frontend feedback tests
        run: cd frontend && ./node_modules/.bin/vitest run src/feedback.test.js
      - name: Directed backend owner-delete tests
        run: cd backend-python && python -m pytest -q test_feedback_self_service.py
      - name: Static preflight
        run: make static-preflight
      - name: Commit finalized release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v16.6dm46zfrq · Self-service feedback deletion"
          git push origin HEAD:feature/zfrq-feedback-delete
