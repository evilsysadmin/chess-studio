name: Cloudflare · legacy redirect hotfix

on:
  push:
    branches:
      - hotfix/cf-legacy-redirect
    paths:
      - '.github/workflows/cloudflare-edge-hotfix.yml'
      - 'scripts/cloudflare_legacy_redirect_guard.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-studio-cloudflare-edge-hotfix
  cancel-in-progress: false

jobs:
  repair:
    name: Retire GitHub Pages redirect loop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://chess-studio.shadowops.dpdns.org
      EXPECTED_BUILD: aa48324416e28f281f849ef378ea2ee36382bd43
    steps:
      - uses: actions/checkout@v7

      - name: Validate guard logic
        run: python3 -S scripts/cloudflare_legacy_redirect_guard.py --self-test

      - name: Audit and retire only legacy GitHub Pages redirects
        run: python3 scripts/cloudflare_legacy_redirect_guard.py --fix

      - name: Verify public production no longer redirects away
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/prod-headers.txt"
          body="$RUNNER_TEMP/prod-release.json"
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/release.json?hotfix=$GITHUB_RUN_ID")"
          cat "$headers"
          [[ "$status" == 200 ]] || { echo "::error::Production devolvió HTTP $status"; exit 1; }
          if grep -qi '^location:' "$headers"; then
            echo '::error::Production todavía devuelve Location; el loop no está cerrado'
            exit 1
          fi
          python3 - "$body" "$EXPECTED_BUILD" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          actual = str(payload.get('build') or '').lower()
          expected = sys.argv[2].lower()
          raise SystemExit(0 if actual == expected else f'build={actual or "<vacío>"}, esperaba {expected}')
          PY

      - name: Verify production home responds directly
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --max-redirs 0 "$PRODUCTION_URL/" >/dev/null
