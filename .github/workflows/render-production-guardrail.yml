name: Render production · deployment guardrail

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'
  push:
    branches:
      - main
    paths:
      - 'render.yaml'
      - 'infra/cloudflare/main.tf'
      - 'scripts/render_production_guardrail.py'
      - 'scripts/production_ingress_smoke.py'
      - '.github/workflows/render-production-guardrail.yml'

permissions:
  contents: read

concurrency:
  group: chess-studio-render-production-guardrail
  cancel-in-progress: true

jobs:
  guardrail:
    name: Production ingress · locked
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Validate Render credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo '::error::Falta RENDER_API_KEY'; exit 1; }

      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Guardrail contract self-test
        run: python3 -S scripts/render_production_guardrail.py --self-test

      - name: Ingress smoke contract self-test
        run: python3 -S scripts/production_ingress_smoke.py --self-test

      - name: Enforce production auto-deploy and direct-origin lock
        id: render_guardrail
        run: python3 scripts/render_production_guardrail.py

      # Push runs reconcile configuration immediately. The synthetic Internet
      # probe stays weekly/manual so ordinary development does not burn Actions
      # minutes or race the separate production-promotion Terraform apply.
      - name: Verify live production ingress
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: ingress_smoke
        run: python3 -S scripts/production_ingress_smoke.py

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Production ingress protegido'
            echo
            echo '- Render auto-deploy: `off`'
            echo '- Hostname directo `*.onrender.com`: `disabled`'
            echo '- Dominio público esperado: `Cloudflare -> Render`'
            echo "- Config corregida en este run: \`${{ steps.render_guardrail.outputs.changed || 'false' }}\`"
            if [[ "${{ github.event_name }}" == 'schedule' || "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
              echo '- Smoke vivo de perímetro: `OK`'
            else
              echo '- Smoke vivo de perímetro: `se ejecuta semanalmente o bajo workflow_dispatch`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
