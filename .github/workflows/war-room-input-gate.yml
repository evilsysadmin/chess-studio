name: War Room 3D input gate

on:
  pull_request:
    paths:
      - 'frontend/src/components/Board3D.jsx'
      - 'frontend/src/components/Board3D*.js'
      - 'frontend/src/components/Board3D*.css'
      - 'frontend/src/components/WarRoom3D*.js'
      - 'frontend/src/components/WarRoom3D*.css'
      - 'frontend/src/components/GameBoardView.jsx'
      - 'e2e/three-d-war-room.spec.js'
      - 'e2e/helpers.js'
      - '.github/workflows/war-room-input-gate.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/components/Board3D.jsx'
      - 'frontend/src/components/Board3D*.js'
      - 'frontend/src/components/Board3D*.css'
      - 'frontend/src/components/WarRoom3D*.js'
      - 'frontend/src/components/WarRoom3D*.css'
      - 'frontend/src/components/GameBoardView.jsx'
      - 'e2e/three-d-war-room.spec.js'
      - 'e2e/helpers.js'
      - '.github/workflows/war-room-input-gate.yml'

permissions:
  contents: read

concurrency:
  group: war-room-input-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-input:
    name: Desktop canvas click + fixed camera
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Install Playwright
        run: |
          npm ci --prefix e2e
          cd e2e
          ./node_modules/.bin/playwright install chromium

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Prove War Room desktop input
        working-directory: e2e
        run: ./node_modules/.bin/playwright test three-d-war-room.spec.js --grep "Partida rápida · una partida activa · vista 3D" --workers=1 --retries=0
