name: TEMP · Chess Football v16 canonical sync

on:
  push:
    branches:
      - track-art/chess-football-sprites-v16
    paths:
      - scripts/art/chess_football_sprite_forge.py
      - scripts/art/contracts/chess_football_players_v1.json
      - .github/workflows/tmp-chess-football-v16-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: track-art/chess-football-sprites-v16
      - name: Regenerate canonical Chess Football sprites
        run: |
          set -euo pipefail
          python3 -S scripts/art/chess_football_sprite_forge.py generate             --assets-dir games/chess-football-godot/assets/players
          python3 -S scripts/art/chess_football_sprite_forge.py verify             --assets-dir games/chess-football-godot/assets/players
      - name: Commit canonical outputs
        run: |
          set -euo pipefail
          if git diff --quiet -- games/chess-football-godot/assets/players; then
            echo "No canonical drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/chess-football-godot/assets/players
          git commit -m "art(football): canonicalize v16 motion sprites"
          git push origin HEAD:track-art/chess-football-sprites-v16
