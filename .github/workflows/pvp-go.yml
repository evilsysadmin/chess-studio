name: PvP · Go edge

on:
  pull_request:
    paths:
      - 'backend-go/**'
      - '.github/workflows/pvp-go.yml'
  push:
    branches:
      - main
    paths:
      - 'backend-go/**'
      - '.github/workflows/pvp-go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvp-go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go · test + vet + arm64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend-go/go.mod
      - name: Unit tests
        run: |
          go mod tidy
          echo '--- BEGIN GENERATED GO.MOD ---'
          cat go.mod
          echo '--- END GENERATED GO.MOD ---'
          echo '--- BEGIN GENERATED GO.SUM ---'
          cat go.sum
          echo '--- END GENERATED GO.SUM ---'
          go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux ARM64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /tmp/pvp-edge ./cmd/pvp-edge
