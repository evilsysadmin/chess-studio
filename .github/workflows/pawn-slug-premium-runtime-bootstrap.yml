name: Pawn Slug premium runtime bootstrap

on:
  push:
    branches:
      - fix/pawn-slug-use-premium-matthias
    paths:
      - '.github/workflows/pawn-slug-premium-runtime-bootstrap.yml'

permissions:
  contents: write

jobs:
  install-approved-atlases:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pawn-slug-use-premium-matthias
      - name: Download approved Blender atlases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pawn-slug-premium frontend/src/assets/pawnSlug
          fetch_asset() {
            artifact_id="$1"
            weapon="$2"
            work="/tmp/pawn-slug-premium/$weapon"
            mkdir -p "$work"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$work/artifact.zip"
            unzip -q "$work/artifact.zip" -d "$work/unpacked"
            src="$work/unpacked/matthias_${weapon}_premium_v2.b64"
            test -s "$src"
            python3 - "$src" <<'PY'
          import base64, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          payload = path.read_text().strip()
          raw = base64.b64decode(payload, validate=True)
          assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP', raw[:12]
          PY
            cp "$src" "frontend/src/assets/pawnSlug/matthias_${weapon}_premium_v2.b64"
          }
          fetch_asset 10416535940 pistol
          fetch_asset 10415589048 machinegun
          fetch_asset 10416611406 shotgun
          fetch_asset 10416316831 panzerfaust
      - name: Commit atlases and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/pawn-slug-premium-runtime-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/assets/pawnSlug/matthias_*_premium_v2.b64 .github/workflows/pawn-slug-premium-runtime-bootstrap.yml
          git commit -m 'art(pawn-slug): install approved premium Matthias atlases'
          git push origin HEAD:fix/pawn-slug-use-premium-matthias
