name: Home Matthias Blender asset

on:
  push:
    branches:
      - 'codex/home-matthias-blender-canonical-v1'
    paths:
      - 'scripts/blender/build_home_matthias.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/blender/home_matthias_animations.py'
      - '.github/workflows/home-matthias-blender.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-matthias-blender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-canonical-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Build canonical .blend + .glb
        run: |
          blender -b --python scripts/blender/build_home_matthias.py -- \
            --blend frontend/art-source/matthias-home-canonical.blend \
            --glb frontend/public/models/matthias-home-canonical.glb
          test -s frontend/art-source/matthias-home-canonical.blend
          test -s frontend/public/models/matthias-home-canonical.glb
      - name: Validate animation clips
        run: |
          python - <<'PY'
          import json, struct
          path = 'frontend/public/models/matthias-home-canonical.glb'
          required = {'Idle', 'Speak', 'Think', 'Read', 'Write', 'Dossier', 'Sip', 'Bite', 'Sleep'}
          with open(path, 'rb') as handle:
              magic, version, length = struct.unpack('<4sII', handle.read(12))
              assert magic == b'glTF' and version == 2 and length > 20
              chunk_len, chunk_type = struct.unpack('<II', handle.read(8))
              assert chunk_type == 0x4E4F534A
              payload = json.loads(handle.read(chunk_len).decode('utf-8').rstrip('\x00 '))
          clips = {item.get('name') for item in payload.get('animations', [])}
          missing = required - clips
          assert not missing, f'missing Matthias clips: {sorted(missing)}; got {sorted(clips)}'
          print('Matthias animation clips:', ', '.join(sorted(clips)))
          PY
      - name: Commit generated canonical assets
        run: |
          if git diff --quiet -- frontend/art-source/matthias-home-canonical.blend frontend/public/models/matthias-home-canonical.glb && \
             git ls-files --error-unmatch frontend/art-source/matthias-home-canonical.blend frontend/public/models/matthias-home-canonical.glb >/dev/null 2>&1; then
            echo 'Canonical assets already match generator.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/art-source/matthias-home-canonical.blend frontend/public/models/matthias-home-canonical.glb
          git commit -m 'art(home): generate canonical Blender Matthias assets'
          git push
