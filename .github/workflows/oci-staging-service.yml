name: OCI staging · service control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Service operation
        type: choice
        options: [diagnose, backend-diagnose, mongo-target-diagnose, mongo-network-diagnose, reserved-egress, smoke, reboot-agent, deploy, bringup, runtime-sync, vault-bootstrap, vault-validate, vault-validate-pending, k3s-start, k3s-status, k3s-rollback]
        default: smoke
        required: true
      secret_key:
        description: Vault key used only by vault-validate-pending
        type: choice
        options: [MONGO_URL, JWT_SECRET, INVITE_CODE, CHESS_AI_SHARED_SECRET, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS]
        default: JWT_SECRET
        required: false
      repo_ref:
        description: Immutable 40-character SHA for deploy/bringup/K3s accreditation; defaults to workflow SHA
        type: string
        required: false

permissions:
  contents: read

# Only host/control-plane mutations share the repository-wide OCI mutex with
# canonical backend deploys, K3s assets and Terraform. Read-only diagnostics get
# a per-run group so they never queue behind an unrelated release or mutation.
concurrency:
  group: >-
    ${{ contains(fromJSON('["reserved-egress","reboot-agent","deploy","bringup","runtime-sync","vault-bootstrap","k3s-start","k3s-rollback"]'), inputs.operation)
        && 'oci-staging-mutations'
        || format('oci-staging-observe-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  control:
    name: OCI staging · service control
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python for Render-only Mongo target diagnosis
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'mongo-target-diagnose'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore cached OCI SDK toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'mongo-target-diagnose'
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'

      - name: Validate selected OCI service contract
        if: github.event_name == 'workflow_dispatch'
        env:
          OPERATION: ${{ inputs.operation }}
        run: python3 -S scripts/oci_service_contracts.py "$OPERATION"

      - name: Diagnose Render staging Mongo target
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'mongo-target-diagnose'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/render_mongo_target_diagnose.py

      # Host/agent registration convergence belongs to the infrastructure apply.
      # Runtime sync performs one direct transport health check and fails fast if
      # the already-converged host is unhealthy instead of hiding a 10-minute wait.
      - name: Sync private runtime config
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'runtime-sync'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/oci_runtime_config.py sync

      - name: Bootstrap missing OCI Vault values from Render staging
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'vault-bootstrap'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/oci_vault_bootstrap.py bootstrap

      - name: Validate CURRENT OCI Vault runtime secrets
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'vault-bootstrap' || inputs.operation == 'vault-validate')
        run: python3 scripts/oci_vault_runtime.py validate

      - name: Validate one PENDING OCI Vault rotation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'vault-validate-pending'
        env:
          VAULT_SECRET_KEY: ${{ inputs.secret_key }}
        run: python3 scripts/oci_vault_runtime.py validate-pending --key "$VAULT_SECRET_KEY"

      - name: Recover stale OCI agent after explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reboot-agent'
        run: python3 scripts/oci_run_command.py reboot-agent

      - name: Diagnose OCI agent transport
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose'
        run: python3 scripts/oci_run_command.py diagnose

      - name: Diagnose OCI backend runtime
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'backend-diagnose'
        run: python3 scripts/oci_backend_diagnose.py

      - name: Diagnose OCI Mongo network
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'mongo-network-diagnose'
        run: python3 scripts/oci_mongo_network_diagnose.py

      - name: Reserve stable OCI egress IP
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reserved-egress'
        run: python3 scripts/oci_reserve_egress_ip.py

      - name: Reconcile K3s bootstrap assets before explicit start
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'k3s-start'
        run: |
          python3 scripts/oci_k3s_bundle_publish.py reconcile
          python3 scripts/oci_k3s_bundle_probe.py install

      - name: Start or ensure guarded single-node K3s
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'k3s-start'
        run: python3 scripts/oci_k3s_control.py start

      - name: Roll back K3s to inert state
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'k3s-rollback'
        run: python3 scripts/oci_k3s_control.py rollback

      - name: Read K3s status and resource snapshot
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'k3s-start' || inputs.operation == 'k3s-status' || inputs.operation == 'k3s-rollback')
        run: python3 scripts/oci_k3s_status.py

      - name: Prove Docker staging survived K3s lifecycle change
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'k3s-start' || inputs.operation == 'k3s-rollback')
        env:
          EXPECTED_SHA: ${{ inputs.repo_ref || github.sha }}
          STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
        run: >-
          python3 scripts/verify_backend_staging.py
          --api-url "$STAGING_API_URL"
          --sha "$EXPECTED_SHA"
          --attempts 20
          --interval 2

      - name: Smoke OCI agent transport
        id: smoke
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'smoke' || inputs.operation == 'reboot-agent' || inputs.operation == 'bringup')
        continue-on-error: ${{ inputs.operation == 'bringup' }}
        run: python3 scripts/oci_run_command.py smoke

      - name: Explain tolerated bringup host-contract drift
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bringup' && steps.smoke.outcome == 'failure'
        run: >-
          echo '::warning::Bringup continues after host-contract smoke failure; the immutable deploy itself remains blocking and proves the effective privileged path.'

      - name: Deploy immutable backend release
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == 'bringup')
        env:
          DEPLOY_REF: ${{ inputs.repo_ref || github.sha }}
        run: python3 scripts/oci_run_command.py deploy --repo-ref "$DEPLOY_REF"
