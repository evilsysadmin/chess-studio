name: OCI staging · service control

on:
  push:
    branches: [main]
    paths:
      - 'infra/oci/ops/agent-reboot.request'
      - 'infra/oci/ops/bringup.request'
      - 'infra/oci/ops/backend-diagnose.request'
      - '.github/workflows/oci-staging-service.yml'
  workflow_run:
    workflows:
      - OCI staging · auto apply
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Service operation
        type: choice
        options: [diagnose, backend-diagnose, smoke, reboot-agent, deploy, runtime-sync]
        default: smoke
        required: true
      repo_ref:
        description: Immutable 40-character SHA for deploy; defaults to workflow SHA
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: oci-staging-service-control
  cancel-in-progress: false

jobs:
  control:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: OCI staging · service control
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect explicit OCI operations requested by main
        id: ops
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          files=''
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" --)"
          fi

          if grep -Fxq 'infra/oci/ops/agent-reboot.request' <<<"$files"; then
            echo 'reboot=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reboot=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Fxq 'infra/oci/ops/bringup.request' <<<"$files"; then
            echo 'bringup=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bringup=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Fxq 'infra/oci/ops/backend-diagnose.request' <<<"$files"; then
            echo 'backend_diagnose=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend_diagnose=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate OCI service contracts
        run: |
          python3 -S scripts/oci_run_command.py --self-test
          python3 -S scripts/oci_runtime_config.py --self-test
          python3 -S scripts/oci_backend_diagnose.py --self-test

      - name: Install OCI SDK
        run: python3 -m pip install --disable-pip-version-check 'oci==2.185.2'

      - name: Sync private runtime config
        if: >-
          (github.event_name == 'push' && steps.ops.outputs.bringup == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'runtime-sync')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/oci_runtime_config.py sync

      - name: Recover stale OCI agent after explicit request
        if: >-
          (github.event_name == 'push' && steps.ops.outputs.reboot == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'reboot-agent')
        run: python3 scripts/oci_run_command.py reboot-agent

      - name: Diagnose OCI agent transport
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose'
        run: python3 scripts/oci_run_command.py diagnose

      - name: Diagnose OCI backend runtime
        if: >-
          (github.event_name == 'push' && steps.ops.outputs.backend_diagnose == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'backend-diagnose')
        run: python3 scripts/oci_backend_diagnose.py

      - name: Smoke OCI agent transport
        id: smoke
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'push' && steps.ops.outputs.backend_diagnose != 'true') ||
          (github.event_name == 'workflow_dispatch' &&
            (inputs.operation == 'smoke' || inputs.operation == 'reboot-agent'))
        continue-on-error: ${{ github.event_name == 'push' && steps.ops.outputs.bringup == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            log="${RUNNER_TEMP}/oci-agent-smoke-${attempt}.log"
            set +e
            python3 scripts/oci_run_command.py smoke >"$log" 2>&1
            rc=$?
            set -e

            if [[ "$rc" -eq 0 ]]; then
              cat "$log"
              exit 0
            fi
            if grep -Fq 'Plugin Compute Instance Run Command not present for instance' "$log" && [[ "$attempt" -lt 30 ]]; then
              echo "OCI Run Command plugin not registered yet (attempt ${attempt}/30); retrying in 10s"
              sleep 10
              continue
            fi
            cat "$log"
            exit "$rc"
          done

      - name: Explain tolerated P0 host-contract drift
        if: >-
          github.event_name == 'push' &&
          steps.ops.outputs.bringup == 'true' &&
          steps.smoke.outcome == 'failure'
        run: >-
          echo '::warning::P0 bring-up continues after host-contract smoke failure; the immutable deploy itself remains blocking and proves the effective privileged path.'

      - name: Deploy immutable backend release
        if: >-
          (github.event_name == 'push' && steps.ops.outputs.bringup == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.repo_ref || github.sha }}
        run: python3 scripts/oci_run_command.py deploy --repo-ref "$DEPLOY_REF"
