name: OCI staging · service control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Service operation
        type: choice
        options: [diagnose, backend-diagnose, mongo-target-diagnose, mongo-network-diagnose, reserved-egress, smoke, reboot-agent, deploy, bringup, runtime-sync, vault-bootstrap, vault-validate, vault-validate-pending]
        default: smoke
        required: true
      secret_key:
        description: Vault key used only by vault-validate-pending
        type: choice
        options: [MONGO_URL, JWT_SECRET, INVITE_CODE, CHESS_AI_SHARED_SECRET, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS]
        default: JWT_SECRET
        required: false
      repo_ref:
        description: Immutable 40-character SHA for deploy/bringup; defaults to workflow SHA
        type: string
        required: false

permissions:
  contents: read

# Service operations share the same repository-wide mutation lock as canonical
# backend deploys and Terraform so manual recovery cannot race staging changes.
concurrency:
  group: oci-staging-mutations
  cancel-in-progress: false

jobs:
  control:
    name: OCI staging · service control
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Python for Render-only Mongo target diagnosis
        if: inputs.operation == 'mongo-target-diagnose'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore cached OCI SDK toolchain
        if: inputs.operation != 'mongo-target-diagnose'
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'

      - name: Validate OCI service contracts
        run: |
          python3 -S scripts/oci_run_command.py --self-test
          python3 -S scripts/oci_runtime_config.py --self-test
          python3 -S scripts/oci_vault_runtime.py --self-test
          python3 -S scripts/oci_vault_bootstrap.py --self-test
          python3 -S scripts/oci_backend_diagnose.py --self-test
          python3 -S scripts/render_mongo_target_diagnose.py --self-test
          python3 -S scripts/oci_mongo_network_diagnose.py --self-test
          python3 -S scripts/oci_reserve_egress_ip.py --self-test

      - name: Diagnose Render staging Mongo target
        if: inputs.operation == 'mongo-target-diagnose'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/render_mongo_target_diagnose.py

      - name: Wait for OCI Run Command registration before runtime sync
        if: inputs.operation == 'runtime-sync' || inputs.operation == 'bringup'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            log="${RUNNER_TEMP}/oci-agent-ready-${attempt}.log"
            set +e
            python3 scripts/oci_run_command.py diagnose >"$log" 2>&1
            rc=$?
            set -e

            if [[ "$rc" -eq 0 ]]; then
              cat "$log"
              exit 0
            fi
            if grep -Fq 'Plugin Compute Instance Run Command not present for instance' "$log" && [[ "$attempt" -lt 60 ]]; then
              echo "OCI Run Command plugin not registered yet (attempt ${attempt}/60); retrying in 10s"
              sleep 10
              continue
            fi
            cat "$log"
            exit "$rc"
          done

      - name: Sync private runtime config
        if: inputs.operation == 'runtime-sync' || inputs.operation == 'bringup'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/oci_runtime_config.py sync

      - name: Bootstrap missing OCI Vault values from Render staging
        if: inputs.operation == 'vault-bootstrap'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/oci_vault_bootstrap.py bootstrap

      - name: Validate CURRENT OCI Vault runtime secrets
        if: inputs.operation == 'vault-bootstrap' || inputs.operation == 'vault-validate'
        run: python3 scripts/oci_vault_runtime.py validate

      - name: Validate one PENDING OCI Vault rotation
        if: inputs.operation == 'vault-validate-pending'
        env:
          VAULT_SECRET_KEY: ${{ inputs.secret_key }}
        run: python3 scripts/oci_vault_runtime.py validate-pending --key "$VAULT_SECRET_KEY"

      - name: Recover stale OCI agent after explicit request
        if: inputs.operation == 'reboot-agent'
        run: python3 scripts/oci_run_command.py reboot-agent

      - name: Diagnose OCI agent transport
        if: inputs.operation == 'diagnose'
        run: python3 scripts/oci_run_command.py diagnose

      - name: Diagnose OCI backend runtime
        if: inputs.operation == 'backend-diagnose'
        run: python3 scripts/oci_backend_diagnose.py

      - name: Diagnose OCI Mongo network
        if: inputs.operation == 'mongo-network-diagnose'
        run: python3 scripts/oci_mongo_network_diagnose.py

      - name: Reserve stable OCI egress IP
        if: inputs.operation == 'reserved-egress'
        run: python3 scripts/oci_reserve_egress_ip.py

      - name: Smoke OCI agent transport
        id: smoke
        if: inputs.operation == 'smoke' || inputs.operation == 'reboot-agent' || inputs.operation == 'bringup'
        continue-on-error: ${{ inputs.operation == 'bringup' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            log="${RUNNER_TEMP}/oci-agent-smoke-${attempt}.log"
            set +e
            python3 scripts/oci_run_command.py smoke >"$log" 2>&1
            rc=$?
            set -e

            if [[ "$rc" -eq 0 ]]; then
              cat "$log"
              exit 0
            fi
            if grep -Fq 'Plugin Compute Instance Run Command not present for instance' "$log" && [[ "$attempt" -lt 30 ]]; then
              echo "OCI Run Command plugin not registered yet (attempt ${attempt}/30); retrying in 10s"
              sleep 10
              continue
            fi
            cat "$log"
            exit "$rc"
          done

      - name: Explain tolerated bringup host-contract drift
        if: inputs.operation == 'bringup' && steps.smoke.outcome == 'failure'
        run: >-
          echo '::warning::Bringup continues after host-contract smoke failure; the immutable deploy itself remains blocking and proves the effective privileged path.'

      - name: Deploy immutable backend release
        if: inputs.operation == 'deploy' || inputs.operation == 'bringup'
        env:
          DEPLOY_REF: ${{ inputs.repo_ref || github.sha }}
        run: python3 scripts/oci_run_command.py deploy --repo-ref "$DEPLOY_REF"
