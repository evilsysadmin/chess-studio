name: OCI readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-python/Dockerfile'
      - 'backend-python/requirements*.txt'
      - 'infra/oci/runtime/**'
      - 'scripts/oci_arm64_smoke.sh'
      - 'scripts/oci_existing_a1_deploy.sh'
      - 'scripts/oci_staging_cors_contract.py'
      # Terraform/Floci PR contracts already run inside required Quality preflight.
      - '.github/workflows/oci-readiness.yml'

permissions:
  contents: read

concurrency:
  group: oci-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  staging-cors-contract:
    name: Staging · CORS deploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -S scripts/oci_staging_cors_contract.py
      - run: bash -n scripts/oci_existing_a1_deploy.sh

  backend-arm64:
    name: Backend · linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/oci_arm64_smoke.sh

  # PR Terraform/Floci is already protected by Preflight · contracts. Manual
  # dispatch keeps this standalone full-OCI diagnostic escape hatch available.
  terraform:
    name: Terraform · contracts + Floci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: make -C infra/oci static
      - name: Secret-surface guard
        run: make -C infra/oci secret-guard
      - run: make -C infra/oci floci
