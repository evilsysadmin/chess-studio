name: OCI readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-python/Dockerfile'
      - 'backend-python/requirements*.txt'
      - 'infra/oci/runtime/**'
      - 'scripts/oci_arm64_smoke.sh'
      - 'scripts/oci_existing_a1_deploy.sh'
      - 'scripts/oci_staging_cors_contract.py'
      # Terraform/Floci PR contracts already run inside required Quality preflight.
      - '.github/workflows/oci-readiness.yml'

permissions:
  contents: read

concurrency:
  group: oci-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify OCI readiness surface
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      arm64: ${{ steps.scope.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Decide whether linux/arm64 image smoke is required
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'arm64=true' >> "$GITHUB_OUTPUT"
            echo 'Manual readiness run: full arm64 smoke enabled.'
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid PR boundary SHA: $sha" >&2; exit 1; }
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          arm64=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              backend-python/Dockerfile|backend-python/requirements*.txt|scripts/oci_arm64_smoke.sh|.github/workflows/oci-readiness.yml)
                arm64=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)

          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"
          if [[ "$arm64" == true ]]; then
            echo 'OCI readiness: arm64 image surface changed; QEMU smoke required.'
          else
            echo 'OCI readiness: deploy/CORS/runtime-only change; skip QEMU arm64 image smoke.'
          fi

  staging-cors-contract:
    name: Staging · CORS deploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -S scripts/oci_staging_cors_contract.py
      - run: bash -n scripts/oci_existing_a1_deploy.sh

  backend-arm64:
    name: Backend · linux/arm64
    needs: classify
    if: needs.classify.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/oci_arm64_smoke.sh

  # PR Terraform/Floci is already protected by Preflight · contracts. Manual
  # dispatch keeps this standalone full-OCI diagnostic escape hatch available.
  terraform:
    name: Terraform · contracts + Floci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: make -C infra/oci static
      - name: Secret-surface guard
        run: make -C infra/oci secret-guard
      - run: make -C infra/oci floci
