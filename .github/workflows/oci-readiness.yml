name: OCI readiness
on:
  workflow_dispatch:
  pull_request:
    paths: [backend-python/Dockerfile, 'backend-python/requirements*.txt', 'infra/oci/runtime/**', 'infra/oci/k3s/**', scripts/oci_arm64_smoke.sh, scripts/oci_existing_a1_deploy.sh, scripts/oci_runtime_bundle.py, scripts/oci_runtime_manifest.py, scripts/oci_vault_compare.py, scripts/oci_staging_cors_contract.py, scripts/oci_readiness_scope.py, scripts/oci_service_contracts.py, 'scripts/oci_k3s_*', .github/workflows/oci-readiness.yml, .github/workflows/oci-staging-service.yml]
permissions: {contents: read}
concurrency:
  group: oci-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs: {arm64: '${{ steps.scope.outputs.arm64 }}'}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - id: scope
        env: {BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
        run: python3 -S scripts/oci_readiness_scope.py >> "$GITHUB_OUTPUT"
  staging-cors-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -S scripts/oci_staging_cors_contract.py
          python3 -S scripts/oci_service_contracts.py --self-test
          python3 -S scripts/oci_runtime_manifest.py --self-test
          python3 -S scripts/oci_vault_compare.py --self-test
          python3 scripts/oci_k3s_readiness_contract.py
          python3 scripts/oci_runtime_bundle.py
          bash -n scripts/oci_existing_a1_deploy.sh
  backend-arm64:
    needs: classify
    if: needs.classify.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with: {platforms: arm64}
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/oci_arm64_smoke.sh
  terraform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env: {TF_IN_AUTOMATION: 'true', TF_INPUT: 'false'}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: 1.16.0, terraform_wrapper: false}
      - run: make -C infra/oci static
      - run: make -C infra/oci secret-guard
      - run: make -C infra/oci floci
