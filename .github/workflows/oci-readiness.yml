name: OCI readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-python/Dockerfile'
      - 'backend-python/requirements*.txt'
      - 'infra/oci/runtime/**'
      - 'scripts/oci_arm64_smoke.sh'
      - 'scripts/oci_existing_a1_deploy.sh'
      - 'scripts/oci_staging_cors_contract.py'
      - '.github/workflows/oci-readiness.yml'

permissions:
  contents: read

concurrency:
  group: oci-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify OCI readiness surface
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      arm64: ${{ steps.scope.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo arm64=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(python3 -S scripts/pr_merge_diff.py --base "$BASE_SHA" --merge "$GITHUB_SHA")"
          if grep -Eq '^(backend-python/Dockerfile|backend-python/requirements[^/]*\.txt|scripts/oci_arm64_smoke\.sh|\.github/workflows/oci-readiness\.yml)$' <<<"$files"; then
            echo arm64=true >> "$GITHUB_OUTPUT"
          else
            echo arm64=false >> "$GITHUB_OUTPUT"
          fi

  staging-cors-contract:
    name: Staging · CORS deploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -S scripts/oci_staging_cors_contract.py
      - run: bash -n scripts/oci_existing_a1_deploy.sh

  backend-arm64:
    name: Backend · linux/arm64
    needs: classify
    if: needs.classify.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/oci_arm64_smoke.sh

  terraform:
    name: Terraform · contracts + Floci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: make -C infra/oci static
      - name: Secret-surface guard
        run: make -C infra/oci secret-guard
      - run: make -C infra/oci floci
