name: OCI readiness

# OCI remains a future migration target, not part of the active Render delivery
# path. Keep the readiness check available on demand without charging normal PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-arm64:
    name: Backend · linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and execute ARM64 backend
        run: bash scripts/oci_arm64_smoke.sh

  terraform:
    name: Terraform · fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/oci
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Secret-surface guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(MONGO_URL|JWT_SECRET|cloudflare_tunnel_token|private_key[[:space:]]*=)' ./*.tf; then
            echo 'ERROR: production secret material must not be modeled as Terraform input/state.' >&2
            exit 1
          fi
          echo 'OCI Terraform secret-surface guard OK'
