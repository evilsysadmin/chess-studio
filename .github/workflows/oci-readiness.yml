name: OCI readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-python/Dockerfile'
      - 'backend-python/requirements*.txt'
      - 'scripts/oci_*'
      - 'infra/oci/**'
      - '.github/workflows/oci-readiness.yml'
      - '.github/workflows/oci-staging-lab.yml'
      - '.github/workflows/oci-staging-deploy.yml'

permissions:
  contents: read

concurrency:
  group: oci-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Classify OCI surface
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arm64: ${{ steps.scope.outputs.arm64 }}
      terraform: ${{ steps.scope.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -S scripts/oci_readiness_scope.py --self-test
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -S scripts/oci_readiness_scope.py

  backend-arm64:
    name: Backend · linux/arm64
    needs: scope
    if: needs.scope.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/oci_arm64_smoke.sh

  terraform:
    name: Terraform · contracts + Floci
    needs: scope
    if: needs.scope.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: make -C infra/oci static
      - name: Secret-surface guard
        run: make -C infra/oci secret-guard
      - run: make -C infra/oci floci
