name: PR · auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for required checks to be published
        shell: bash
        run: |
          set -euo pipefail

          # pull_request_target can start before GitHub has attached the first
          # protected check-run to the fresh PR head. In that race,
          # `gh pr checks --required --watch` exits immediately with
          # "no required checks reported" instead of waiting. Bootstrap the
          # watcher only after at least one required check is visible.
          required_count=0
          for attempt in {1..120}; do
            current_head="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
            [[ "$current_head" == "$PR_HEAD_SHA" ]] || {
              echo "::error::La PR cambió de head mientras esperaba checks: $PR_HEAD_SHA -> $current_head"
              exit 1
            }

            required_json="$(gh pr checks "$PR_URL" --required --json name 2>/dev/null || true)"
            required_count="$(jq 'length' <<<"${required_json:-[]}" 2>/dev/null || echo 0)"
            if [[ "$required_count" =~ ^[0-9]+$ ]] && (( required_count > 0 )); then
              echo "GitHub ya publica $required_count required check(s) para $PR_HEAD_SHA."
              break
            fi

            echo "Aún no hay required checks publicados para $PR_HEAD_SHA (intento $attempt/120)."
            sleep 5
          done

          [[ "$required_count" =~ ^[0-9]+$ ]] && (( required_count > 0 )) || {
            echo "::error::GitHub no publicó required checks para $PR_HEAD_SHA en 10 minutos"
            exit 1
          }

      - name: Wait for protected required checks
        shell: bash
        run: |
          set -euo pipefail
          # Once the protected checks exist, gh can safely watch them to a real
          # terminal state. A synchronize event cancels this watcher and starts
          # a fresh one for the new PR head.
          gh pr checks "$PR_URL" --required --watch --interval 10

      - name: Squash merge approved head
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --squash --match-head-commit "$PR_HEAD_SHA"

          merge_sha="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // ""')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::No pude resolver el merge SHA de $PR_URL"
            exit 1
          }

          echo "PR mergeada en $merge_sha. Delivery · main handoff es el único propietario de reactivar Quality en main cuando GITHUB_TOKEN suprima el push."
