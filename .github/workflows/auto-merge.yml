name: PR · auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for protected required checks
        shell: bash
        run: |
          set -euo pipefail
          # Keep the merge in the same workflow that observes the protected
          # checks. A synchronize event cancels this watcher and starts a fresh
          # one for the new PR head.
          gh pr checks "$PR_URL" --required --watch --interval 10

      - name: Squash merge approved head
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --squash --match-head-commit "$PR_HEAD_SHA"

          merge_sha="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // ""')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::No pude resolver el merge SHA de $PR_URL"
            exit 1
          }

          echo "PR mergeada en $merge_sha. Delivery · main handoff es el único propietario de reactivar Quality en main cuando GITHUB_TOKEN suprima el push."
