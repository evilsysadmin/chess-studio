name: Pawn Slug · Godot strict Matthias v9

on:
  pull_request:
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v9.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas.py'
      - 'games/pawn-slug-godot/scripts/matthias_art.gd'
      - '.github/workflows/pawn-slug-godot-strict-v9.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v9.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas.py'
      - 'games/pawn-slug-godot/scripts/matthias_art.gd'
      - '.github/workflows/pawn-slug-godot-strict-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-v9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-strict-v9:
    name: Build + gate strict-v9 · ${{ matrix.weapon }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        weapon: [pistol, machinegun, shotgun, panzerfaust]

    steps:
      - uses: actions/checkout@v7

      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Strict tool sanity
        run: |
          set -euo pipefail
          python3 scripts/art/pack_pawn_slug_godot_strict_v9.py --self-test
          python3 -m py_compile scripts/art/validate_pawn_slug_godot_atlas.py

      - name: Resolve uploaded v9 source
        id: source
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          root='https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/releases/f9134382bb1adb60/pawn_slug_godot_atlases_v2'
          echo "url=$root/matthias_${WEAPON}_strict_v9.png" >> "$GITHUB_OUTPUT"

      - name: Download uploaded v9 source
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v9"
          mkdir -p "$ROOT"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 1 \
            "$SOURCE_URL" \
            --output "$ROOT/matthias_${WEAPON}_strict_v9.png"

      - name: Pack strict Godot v9
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v9"
          python3 scripts/art/pack_pawn_slug_godot_strict_v9.py \
            --source "$ROOT/matthias_${WEAPON}_strict_v9.png" \
            --output "$ROOT/matthias_${WEAPON}_godot_strict_6x18_416_v9.png" \
            --weapon "$WEAPON"

      - name: Godot strict contract gate + review artifacts
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v9"
          python3 scripts/art/validate_pawn_slug_godot_atlas.py \
            --atlas "$ROOT/matthias_${WEAPON}_godot_strict_6x18_416_v9.png" \
            --weapon "$WEAPON" \
            --runtime games/pawn-slug-godot/scripts/matthias_art.gd \
            --manifest "$ROOT/matthias_${WEAPON}_strict_v9_manifest.json" \
            --contact-sheet "$ROOT/matthias_${WEAPON}_strict_v9_contact_sheet.png" \
            --strips-dir "$ROOT/matthias_${WEAPON}_strict_v9_strips"

      - name: Publish immutable strict-v9 to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ATLAS="/tmp/pawn-slug-godot-strict-v9/matthias_${WEAPON}_godot_strict_6x18_416_v9.png"
          python3 -S scripts/r2_asset_publish.py publish \
            "$ATLAS" \
            --logical-id "pawnSlug.godot.matthias.${WEAPON}.strictV9" \
            --prefix "pawn-slug-godot/matthias/strict-v9/${WEAPON}" \
            | tee "/tmp/pawn-slug-godot-strict-v9-${WEAPON}-publish.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-godot-strict-v9-${{ matrix.weapon }}-${{ github.event.pull_request.number || github.run_number }}
          path: |
            /tmp/pawn-slug-godot-strict-v9/matthias_${{ matrix.weapon }}_godot_strict_6x18_416_v9.png
            /tmp/pawn-slug-godot-strict-v9/matthias_${{ matrix.weapon }}_strict_v9_manifest.json
            /tmp/pawn-slug-godot-strict-v9/matthias_${{ matrix.weapon }}_strict_v9_contact_sheet.png
            /tmp/pawn-slug-godot-strict-v9/matthias_${{ matrix.weapon }}_strict_v9_strips/*.png
            /tmp/pawn-slug-godot-strict-v9-${{ matrix.weapon }}-publish.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
