name: Pawn Slug · enemy variant v2 art

on:
  pull_request:
    paths:
      - games/pawn-slug-godot/scripts/enemy_visual.gd
      - scripts/art/derive_pawn_slug_enemy_commando_v2.py
      - scripts/art/test_pawn_slug_enemy_commando_v2.py
      - scripts/art/derive_pawn_slug_enemy_grenadier_v2.py
      - scripts/art/test_pawn_slug_enemy_grenadier_v2.py
      - .github/workflows/pawn-slug-enemy-commando-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'
      - name: Test deterministic Commando derivation
        run: python3 scripts/art/test_pawn_slug_enemy_commando_v2.py
      - name: Test deterministic Grenadier derivation
        run: python3 scripts/art/test_pawn_slug_enemy_grenadier_v2.py
      - name: Build Commando review artifact
        run: |
          python3 scripts/art/derive_pawn_slug_enemy_commando_v2.py \
            --gdscript games/pawn-slug-godot/scripts/enemy_visual.gd \
            --output-dir /tmp/pawn-slug-enemy-variant-v2/commando
      - name: Build Grenadier review artifact
        run: |
          python3 scripts/art/derive_pawn_slug_enemy_grenadier_v2.py \
            --gdscript games/pawn-slug-godot/scripts/enemy_visual.gd \
            --output-dir /tmp/pawn-slug-enemy-variant-v2/grenadier
      - name: Upload enemy variant v2 PNG reviews
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-enemy-variant-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pawn-slug-enemy-variant-v2/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
