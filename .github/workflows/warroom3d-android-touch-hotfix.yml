name: War Room Android touch hotfix
on:
  push:
    branches:
      - fix/warroom3d-android-touch-targets
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/warroom3d-android-touch-targets
          fetch-depth: 0
      - name: Apply Android touch patch
        run: |
          python scripts/patch_board3d_android_touch.py
          rm -f scripts/patch_board3d_android_touch.py
          rm -f .github/workflows/warroom3d-android-touch-hotfix.yml
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix War Room 3D Android piece targeting"
          git push origin HEAD:fix/warroom3d-android-touch-targets
