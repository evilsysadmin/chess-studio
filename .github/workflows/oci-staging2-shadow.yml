name: OCI staging2 · shadow backend

on:
  workflow_run:
    workflows:
      - Staging · deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-staging-mutations
  cancel-in-progress: false

jobs:
  shadow:
    name: OCI staging2 · shadow backend
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: staging
    env:
      SHADOW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
    steps:
      - name: Admit only the current main SHA
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHADOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid staging2 SHA: $SHADOW_SHA"; exit 1; }
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve current main SHA"; exit 1; }
          if [[ "$SHADOW_SHA" != "$current_main" ]]; then
            echo 'admitted=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=staging2 superseded::$SHADOW_SHA is stale; current main is $current_main. No OCI mutation."
            exit 0
          fi
          echo 'admitted=true' >> "$GITHUB_OUTPUT"

      - name: Checkout admitted staging generation
        if: steps.admission.outputs.admitted == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHADOW_SHA }}
          fetch-depth: 1

      - name: Restore cached OCI SDK toolchain
        if: steps.admission.outputs.admitted == 'true'
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'

      - name: Validate shadow deployment contracts
        if: steps.admission.outputs.admitted == 'true'
        run: |
          python3 -S scripts/oci_k3s_staging2.py --self-test
          python3 -S scripts/verify_backend_staging.py --self-test
          python3 -S scripts/oci_staging2_shadow_contract.py

      - name: Deploy exact backend SHA into isolated K3s shadow
        if: steps.admission.outputs.admitted == 'true'
        run: python3 scripts/oci_k3s_staging2.py deploy --repo-ref "$SHADOW_SHA"

      - name: Read isolated shadow status
        if: always() && steps.admission.outputs.admitted == 'true'
        run: python3 scripts/oci_k3s_staging2.py status

      - name: Re-prove canonical Compose staging is unchanged
        if: always() && steps.admission.outputs.admitted == 'true'
        run: >-
          python3 scripts/verify_backend_staging.py
          --api-url "$STAGING_API_URL"
          --sha "$SHADOW_SHA"
          --attempts 20
          --interval 2
