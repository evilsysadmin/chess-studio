name: Temp · regenerate Chronicles contracts 5087
on:
  push:
    branches:
      - track-rescue/chronicles-authored-hazards-v2
    paths:
      - .github/workflows/tmp-chronicles-contracts-5087.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: track-rescue/chronicles-authored-hazards-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend-python/requirements.txt
      - name: Regenerate Chronicles contracts
        run: python scripts/chronicles_contracts.py
      - name: Commit generated contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-go/internal/chronicles/testdata/python_chronicles_area_corpus.json
          git add backend-go/internal/gamesapi/testdata/python_chronicles_runs_corpus.json
          git add frontend/src/chronicles/maps backend-go/internal/chronicles/content/maps
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(chronicles): regenerate parity corpora"
          git push origin HEAD:track-rescue/chronicles-authored-hazards-v2
