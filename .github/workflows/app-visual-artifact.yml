name: App · visual artifact
on:
  pull_request:
    paths:
      - frontend/src/**/*.jsx
      - frontend/src/**/*.css
      - frontend/src/components/**
      - frontend/src/assets/**
      - frontend/src/chesscom*.js
      - frontend/src/pawn*.js
      - '!frontend/src/**/*.test.*'
      - '!frontend/src/components/*Admin*'
      - '!frontend/src/components/Observability*'
      - frontend/public/**
      - '!frontend/public/audio/**'
      - e2e/*visual*.spec.js
      # The lifecycle soak is a real WebGL resource gate despite its nonvisual name.
      - e2e/war-room-variant-lifecycle-soak.spec.js
      - e2e/browser-*-health.spec.js
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - uses: ./.github/actions/app-visual-pipeline
        with: {mode: canonical}

  # Capture the exact PR-base runtime in a separate runner. This is opt-in for
  # Babylon dependency bumps, not a permanent second capture for all visual PRs.
  babylon_baseline:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'track-chesscom') &&
      contains(github.event.pull_request.title, 'babylonjs')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR base for A/B
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Build baseline with its pinned Babylon version
        uses: ./.github/actions/setup-browser-e2e
        env:
          VITE_WAR_ROOM_VARIANTS_ENABLE: 'true'
          VITE_APP_VISUAL_CAPTURE: 'true'
        with:
          browser-scope: chromium
          build-frontend: 'true'
      - name: Capture CHESSCOM baseline desktop and mobile
        working-directory: e2e
        env:
          APP_VISUAL_ARTIFACT: '1'
        run: ./node_modules/.bin/playwright test chesscom-visual-artifact.spec.js --workers=1 --retries=0
      - name: Record exact baseline provenance
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
          const babylonVersion = pkg.dependencies?.babylonjs || pkg.devDependencies?.babylonjs;
          if (!babylonVersion) throw new Error('Baseline has no pinned Babylon version');
          const dir = '.artifacts/chesscom-visual';
          for (const name of ['chesscom-desktop-1600x900.png', 'chesscom-mobile-390x844.png']) {
            if (!fs.statSync(`${dir}/${name}`).size) throw new Error(`Missing baseline PNG: ${name}`);
          }
          fs.writeFileSync(`${dir}/baseline-provenance.json`, JSON.stringify({
            baseSha: process.env.BASELINE_SHA,
            declaredBabylonVersion: babylonVersion,
            source: 'exact pull_request.base.sha',
            captureSpec: 'e2e/chesscom-visual-artifact.spec.js',
            viewports: ['1600x900', '390x844']
          }, null, 2) + '\n');
          NODE
      - name: Upload baseline PNGs for human A/B review
        uses: actions/upload-artifact@v7
        with:
          name: chesscom-baseline-${{ github.event.pull_request.number }}
          path: .artifacts/chesscom-visual/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
