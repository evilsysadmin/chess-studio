name: App · visual artifact

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'e2e/app-visual-artifact.spec.js'
      - 'e2e/war-room-visual-artifact.spec.js'
      - 'e2e/war-room-hans-visual-artifact.spec.js'
      - 'e2e/browser-runtime-health.spec.js'
      - 'e2e/browser-storage-health.spec.js'
      - 'scripts/war_room_visual_freeze_check.mjs'
      - '.github/workflows/app-visual-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: App · visual capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build frontend for visual capture
        run: make frontend-build

      - name: Restore Chromium runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Capture canonical views + browser health
        working-directory: e2e
        run: ./node_modules/.bin/playwright test app-visual-artifact.spec.js war-room-visual-artifact.spec.js war-room-hans-visual-artifact.spec.js browser-runtime-health.spec.js browser-storage-health.spec.js --workers=1 --retries=0

      - name: Enforce War Room visual freeze
        run: node scripts/war_room_visual_freeze_check.mjs

      - name: Summarize visual health
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = '.artifacts/app-visual/visual-health.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const lines = ['## App · visual health'];
          if (!fs.existsSync(reportPath)) {
            lines.push('', '_No se generó `visual-health.json`; revisa el paso de captura._');
          } else {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            lines.push(
              '',
              '| Captura | Overflow X | Recortados | Targets <44 px | Reduced motion |',
              '| --- | ---: | ---: | ---: | --- |',
            );
            for (const capture of report.captures || []) {
              lines.push(`| ${capture.label} | ${capture.horizontalOverflow ? 'sí' : 'no'} | ${capture.clippedInteractiveCount ?? '—'} | ${capture.smallTouchTargetCount ?? '—'} | ${capture.reducedMotion ? 'sí' : 'no'} |`);
            }
            const mobile = (report.captures || []).filter((capture) => capture.viewport?.width <= 600);
            const worst = mobile.reduce((current, capture) => (
              !current || (capture.smallTouchTargetCount || 0) > (current.smallTouchTargetCount || 0) ? capture : current
            ), null);
            if (worst?.smallTouchTargets?.length) {
              lines.push('', `**Peores targets en ${worst.label}:**`);
              for (const target of worst.smallTouchTargets.slice(0, 6)) {
                const label = target.text || target.tag || 'sin etiqueta';
                lines.push(`- ${label}: ${target.width}×${target.height}px`);
              }
            }
          }

          const warRoomProfiles = [
            ['Android portrait 390×844', 'war-room-android-390x844'],
            ['Android landscape 844×390', 'war-room-android-landscape-844x390'],
            ['Desktop 1440×900', 'war-room-desktop-1440x900'],
          ];
          lines.push(
            '',
            '### War Room · canonical views',
            '',
            '| Captura | Overflow X | Escena/ancho | Escena visible/alto | Puntero | Artefacto |',
            '| --- | ---: | ---: | ---: | --- | --- |',
          );
          for (const [label, slug] of warRoomProfiles) {
            const path = `.artifacts/app-visual/${slug}-health.json`;
            if (!fs.existsSync(path)) {
              lines.push(`| ${label} | — | — | — | no generado | \`${slug}.png\` |`);
              continue;
            }
            const { capture = {} } = JSON.parse(fs.readFileSync(path, 'utf8'));
            const sceneWidth = capture.boardWidthFill != null ? `${Math.round(capture.boardWidthFill * 100)}%` : '—';
            const sceneHeight = capture.boardViewportFill != null ? `${Math.round(capture.boardViewportFill * 100)}%` : '—';
            const pointer = capture.coarsePointer ? 'coarse' : 'fine';
            lines.push(`| ${label} | ${capture.horizontalOverflowPx ?? '—'} px | ${sceneWidth} | ${sceneHeight} | ${pointer} | \`${slug}.png\` |`);
          }

          const hansPath = '.artifacts/app-visual/war-room-hans-desktop-1440x900-health.json';
          if (fs.existsSync(hansPath)) {
            const hans = JSON.parse(fs.readFileSync(hansPath, 'utf8'));
            lines.push(
              '',
              '### Hans · visual canary',
              '',
              `Estado: **${hans.screen || '—'}** · NDC ${Number.isFinite(hans.ndcX) ? hans.ndcX.toFixed(3) : '—'}, ${Number.isFinite(hans.ndcY) ? hans.ndcY.toFixed(3) : '—'} · \`war-room-hans-desktop-1440x900.png\``,
            );
          }

          const portraitPath = '.artifacts/app-visual/war-room-android-390x844-health.json';
          if (fs.existsSync(portraitPath)) {
            const { capture = {} } = JSON.parse(fs.readFileSync(portraitPath, 'utf8'));
            const quick = capture.quickActions || {};
            lines.push(
              '',
              `Portrait · HUD Matthias ${capture.hud?.height ?? '—'} px · `
                + `Focus ${quick.focus ? `${quick.focus.width}×${quick.focus.height}px` : '—'} · `
                + `Rendirse ${quick.abandon ? `${quick.abandon.width}×${quick.abandon.height}px` : '—'} · `
                + `Menú ${quick.overflow ? `${quick.overflow.width}×${quick.overflow.height}px` : '—'}`,
            );
          }
          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`);
          NODE

      - name: Upload app visual artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-${{ github.event.pull_request.number || github.run_id }}
          path: .artifacts/app-visual/
          if-no-files-found: warn
          retention-days: 7
