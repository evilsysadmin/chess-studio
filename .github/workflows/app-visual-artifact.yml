name: App · visual artifact

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'e2e/*visual*.spec.js'
      - 'e2e/browser-*-health.spec.js'
      - 'scripts/app_visual_*'
      - 'scripts/war_room_visual_freeze_check.mjs'
      - '.github/actions/app-visual-pipeline/**'
      - '.github/workflows/app-visual-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: App visual · scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_hans: ${{ steps.scope.outputs.run_hans }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select expensive Hans routine capture
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'run_hans=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail closed if GitHub cannot give us a trustworthy PR base: a rare
          # harness problem is preferable to silently losing the diagnostic.
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'run_hans=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_hans=false
          while IFS= read -r path; do
            lower="${path,,}"
            case "$lower" in
              *hans*|frontend/src/components/board3d*|frontend/src/components/warroom3d*|frontend/src/components/gameboardview*|scripts/app_visual_*|.github/actions/app-visual-pipeline/*|.github/workflows/app-visual-artifact.yml)
                run_hans=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "run_hans=$run_hans" >> "$GITHUB_OUTPUT"
          if [[ "$run_hans" == true ]]; then
            echo 'Hans routine capture: required by this diff.'
          else
            echo 'Hans routine capture: skipped; this diff does not touch Hans/War Room runtime surfaces.'
          fi

  canonical:
    name: App · visual capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: canonical

  hans:
    name: Hans · routine video capture
    needs: scope
    if: needs.scope.outputs.run_hans == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: hans
