name: App · visual artifact

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'e2e/app-visual-artifact.spec.js'
      - 'e2e/home-3d-focus-visual.spec.js'
      - 'e2e/war-room-visual-artifact.spec.js'
      - 'e2e/war-room-hans-visual-artifact.spec.js'
      - 'e2e/browser-runtime-health.spec.js'
      - 'e2e/browser-storage-health.spec.js'
      - 'scripts/app_visual_summary.mjs'
      - 'scripts/war_room_visual_freeze_check.mjs'
      - '.github/workflows/app-visual-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: App · visual capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build frontend for visual capture
        run: make frontend-build

      - name: Restore Chromium runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Capture canonical views + browser health
        working-directory: e2e
        run: ./node_modules/.bin/playwright test app-visual-artifact.spec.js home-3d-focus-visual.spec.js war-room-visual-artifact.spec.js war-room-hans-visual-artifact.spec.js browser-runtime-health.spec.js browser-storage-health.spec.js --workers=1 --retries=0

      - name: Enforce War Room visual freeze
        run: node scripts/war_room_visual_freeze_check.mjs

      - name: Validate visual summary reporter
        if: always()
        run: node scripts/app_visual_summary.mjs --self-test

      - name: Summarize visual health
        if: always()
        run: node scripts/app_visual_summary.mjs

      - name: Upload app visual artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-${{ github.event.pull_request.number || github.run_id }}
          path: .artifacts/app-visual/
          if-no-files-found: warn
          retention-days: 7
