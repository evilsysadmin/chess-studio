name: App · visual artifact
on:
  push:
    branches:
      - main
    paths:
      - frontend/src/**/*.jsx
      - frontend/src/**/*.css
      - frontend/src/components/**
      - frontend/src/assets/**
      - frontend/src/chesscom*.js
      - frontend/src/chronicles*.js
      - frontend/src/pawn*.js
      - '!frontend/src/**/*.test.js'
      - '!frontend/src/**/*.test.jsx'
      - frontend/public/**
      - '!frontend/public/audio/**'
      - e2e/*visual*.spec.js
      - e2e/browser-*-health.spec.js
      - scripts/app_visual_*
      - scripts/war_room_visual_freeze_check.mjs
      - .github/actions/app-visual-pipeline/**
      - .github/workflows/app-visual-artifact.yml
  workflow_dispatch:
concurrency:
  group: app-visual-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: canonical
