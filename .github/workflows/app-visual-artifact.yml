name: App · visual artifact

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'e2e/*visual*.spec.js'
      - 'e2e/browser-*-health.spec.js'
      - 'scripts/app_visual_*'
      - 'scripts/war_room_visual_freeze_check.mjs'
      - '.github/actions/app-visual-pipeline/**'
      - '.github/workflows/app-visual-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical:
    name: App · visual capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: canonical

  hans:
    name: Hans · routine video capture
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: hans
