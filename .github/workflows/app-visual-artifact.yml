name: App · visual artifact
on:
  push:
    branches:
      - main
    paths:
      - frontend/src/**/*.jsx
      - frontend/src/**/*.css
      - frontend/src/components/**
      - frontend/src/assets/**
      - frontend/src/chesscom*.js
      - frontend/src/chronicles*.js
      - frontend/src/pawn*.js
      - '!frontend/src/**/*.test.js'
      - '!frontend/src/**/*.test.jsx'
      - frontend/public/**
      # Public audio and deployment/PWA metadata cannot alter any canonical app
      # frame. Keep them out at the trigger boundary so a music/release-only merge
      # does not even allocate the expensive visual/WebGL runner.
      - '!frontend/public/audio/**'
      - '!frontend/public/404.html'
      - '!frontend/public/CNAME'
      - '!frontend/public/_headers'
      - '!frontend/public/apple-touch-icon.png'
      - '!frontend/public/favicon-32.png'
      - '!frontend/public/favicon.svg'
      - '!frontend/public/manifest.webmanifest'
      - '!frontend/public/release.json'
      - '!frontend/public/sw.js'
      - e2e/*visual*.spec.js
      - e2e/browser-*-health.spec.js
      - scripts/app_visual_*
      - scripts/war_room_visual_freeze_check.mjs
      - .github/actions/app-visual-pipeline/**
      - .github/workflows/app-visual-artifact.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: canonical
