name: App · visual artifact
on:
  pull_request:
    paths:
      - frontend/src/**/*.jsx
      - frontend/src/**/*.css
      - frontend/src/components/**
      - frontend/src/assets/**
      - frontend/src/chesscom*.js
      - frontend/src/chronicles*.js
      - '!frontend/src/**/*.test.js'
      - '!frontend/src/**/*.test.jsx'
      - frontend/public/**
      - e2e/*visual*.spec.js
      - e2e/chesscom*.spec.js
      - e2e/browser-*-health.spec.js
      - scripts/app_visual_*
      - scripts/war_room_visual_freeze_check.mjs
      - .github/actions/app-visual-pipeline/**
      - .github/workflows/app-visual-artifact.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: ./.github/actions/app-visual-pipeline
        with:
          mode: canonical
