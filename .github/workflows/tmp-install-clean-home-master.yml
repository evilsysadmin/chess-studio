name: Temporary · install clean Home master

on:
  push:
    branches:
      - fix/home-clean-master-final

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-clean-master-final
          fetch-depth: 1
      - name: Reconstruct and verify clean Home master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='frontend/src/assets/home-canonical/great-hall-dungeon.webp'
          tmp="${target}.tmp"
          : > "$tmp"
          blobs=(
            98d6f547948a40a33efe1ed511dc7592e8459581
            228e3eff3196ab5b7e01d5f2c10894216dde69ca
            a7079e8dca50060d8c90bc9fc74bf269f45014db
            16918f054939cdd968ab5bd612c8f3c1724f46a5
            c444a8cc31e40e6a013fc6b1574bf64135ef50fd
            1b777a4b5dfb9617bad1b3b628fe06eebac75941
          )
          for sha in "${blobs[@]}"; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -er '.content' \
              | tr -d '\n' \
              | base64 -d >> "$tmp"
          done
          bytes="$(wc -c < "$tmp" | tr -d ' ')"
          sha="$(git hash-object "$tmp")"
          test "$bytes" = '72174'
          test "$sha" = '0d2a088581ab29f3a44eb7d19b1521f49bdb9f0d'
          mv "$tmp" "$target"
          rm .github/workflows/tmp-install-clean-home-master.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$target" .github/workflows/tmp-install-clean-home-master.yml
          git diff --cached --stat
          git commit -m 'fix(home): install clean local hall master'
          git push origin HEAD:fix/home-clean-master-final
