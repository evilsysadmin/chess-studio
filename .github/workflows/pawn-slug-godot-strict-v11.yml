name: Pawn Slug Â· Godot strict Matthias v11

on:
  pull_request:
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v11.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v11.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v11_atlas_smoke.gd'
      - '.github/workflows/pawn-slug-godot-strict-v11.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v11.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v11.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v11_atlas_smoke.gd'
      - '.github/workflows/pawn-slug-godot-strict-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-v11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'

jobs:
  build-strict-v11:
    name: Build + gate strict-v11 Â· ${{ matrix.weapon }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        weapon: [pistol, machinegun, shotgun, panzerfaust]

    steps:
      - uses: actions/checkout@v7

      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Strict-v11 tool sanity
        run: |
          set -euo pipefail
          python3 scripts/art/pack_pawn_slug_godot_strict_v11.py --self-test
          python3 -m py_compile \
            scripts/art/pack_pawn_slug_godot_strict_v11.py \
            scripts/art/validate_pawn_slug_godot_atlas_v11.py

      - name: Resolve current coherent strict-v9 runtime atlas
        id: source
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          case "$WEAPON" in
            pistol) HASH='73da3b359ce6c33e' ;;
            machinegun) HASH='1b56615d3306470a' ;;
            shotgun) HASH='395c486f4d42fb84' ;;
            panzerfaust) HASH='ae9884d16a05ae6a' ;;
            *) exit 2 ;;
          esac
          echo "url=https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v9/$WEAPON/matthias_${WEAPON}_godot_strict_6x18_416_v9-${HASH}.png" >> "$GITHUB_OUTPUT"

      - name: Download strict-v9 baseline
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v11/$WEAPON"
          mkdir -p "$ROOT"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
            "$SOURCE_URL" --output "$ROOT/v9.png"

      - name: Pack strict-v11 8x18 bank
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v11/$WEAPON"
          python3 scripts/art/pack_pawn_slug_godot_strict_v11.py \
            --source "$ROOT/v9.png" \
            --output "$ROOT/matthias_${WEAPON}_godot_strict_8x18_416_v11.png" \
            --manifest "$ROOT/matthias_${WEAPON}_strict_v11_manifest.json" \
            --weapon "$WEAPON"

      - name: Gate geometry, proportions and aim semantics
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v11/$WEAPON"
          python3 scripts/art/validate_pawn_slug_godot_atlas_v11.py \
            --atlas "$ROOT/matthias_${WEAPON}_godot_strict_8x18_416_v11.png" \
            --manifest "$ROOT/matthias_${WEAPON}_strict_v11_manifest.json" \
            --baseline "$ROOT/v9.png" \
            --report "$ROOT/matthias_${WEAPON}_strict_v11_health.json"

      - name: Build v9 â†” v11 visual review PNG
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v11/$WEAPON"
          python3 - "$ROOT" "$WEAPON" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path(sys.argv[1]); weapon=sys.argv[2]
          old=Image.open(root/'v9.png').convert('RGBA')
          new=Image.open(root/f'matthias_{weapon}_godot_strict_8x18_416_v11.png').convert('RGBA')
          data=json.loads((root/f'matthias_{weapon}_strict_v11_manifest.json').read_text())
