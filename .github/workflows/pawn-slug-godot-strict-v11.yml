name: Pawn Slug · Godot strict Matthias v11

on:
  pull_request:
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v11.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v11.py'
      - 'scripts/art/build_pawn_slug_v11_review.py'
      - 'games/pawn-slug-godot/scripts/matthias_art.gd'
      - 'games/pawn-slug-godot/tests/matthias_strict_v11_atlas_smoke.gd'
      - '.github/workflows/pawn-slug-godot-strict-v11.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v11.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v11.py'
      - 'scripts/art/build_pawn_slug_v11_review.py'
      - 'games/pawn-slug-godot/scripts/matthias_art.gd'
      - 'games/pawn-slug-godot/tests/matthias_strict_v11_atlas_smoke.gd'
      - '.github/workflows/pawn-slug-godot-strict-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-v11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'

jobs:
  build-strict-v11:
    # Authoritative Matthias art path for Pawn Slug Godot.
    # The source sheets are immutable AI-authored raster assets in R2; Blender
    # is intentionally not part of this pipeline.
    name: Build + gate strict-v11 · ${{ matrix.weapon }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        weapon: [pistol, machinegun, shotgun, panzerfaust]

    steps:
      - uses: actions/checkout@v7

      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Strict v11 tool sanity
        run: |
          set -euo pipefail
          python3 scripts/art/pack_pawn_slug_godot_strict_v11.py --self-test
          python3 -m py_compile \
            scripts/art/pack_pawn_slug_godot_strict_v11.py \
            scripts/art/validate_pawn_slug_godot_atlas_v11.py \
            scripts/art/build_pawn_slug_v11_review.py

      - name: Restore pinned Godot editor for runtime smoke
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: pawn-slug-strict-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}

      - name: Install pinned Godot editor for runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version

      - name: Resolve current strict-v9 runtime atlas
        id: source
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          case "$WEAPON" in
            pistol) HASH='73da3b359ce6c33e' ;;
            machinegun) HASH='1b56615d3306470a' ;;
            shotgun) HASH='395c486f4d42fb84' ;;
            panzerfaust) HASH='ae9884d16a05ae6a' ;;
            *) exit 2 ;;
          esac
          echo "url=https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v9/$WEAPON/matthias_${WEAPON}_godot_strict_6x18_416_v9-${HASH}.png" >> "$GITHUB_OUTPUT"

      - name: Download strict-v9 baseline
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v11"
          mkdir -p "$ROOT"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
            "$SOURCE_URL" --output "$ROOT/matthias_${WEAPON}_strict_v9_baseline.png"

      - name: Pack strict Godot v11
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v11"
          python3 scripts/art/pack_pawn_slug_godot_strict_v11.py \
            --source "$ROOT/matthias_${WEAPON}_strict_v9_baseline.png" \
            --output "$ROOT/matthias_${WEAPON}_godot_strict_8x18_416_v11.png" \
            --manifest "$ROOT/matthias_${WEAPON}_strict_v11_manifest.json" \
            --weapon "$WEAPON"

      - name: Gate geometry and build review PNG
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v11"
          python3 scripts/art/validate_pawn_slug_godot_atlas_v11.py \
            --atlas "$ROOT/matthias_${WEAPON}_godot_strict_8x18_416_v11.png" \
            --manifest "$ROOT/matthias_${WEAPON}_strict_v11_manifest.json" \
            --baseline "$ROOT/matthias_${WEAPON}_strict_v9_baseline.png" \
            --report "$ROOT/matthias_${WEAPON}_strict_v11_health.json"
          python3 scripts/art/build_pawn_slug_v11_review.py \
            --baseline "$ROOT/matthias_${WEAPON}_strict_v9_baseline.png" \
            --atlas "$ROOT/matthias_${WEAPON}_godot_strict_8x18_416_v11.png" \
            --manifest "$ROOT/matthias_${WEAPON}_strict_v11_manifest.json" \
            --output "$ROOT/matthias_${WEAPON}_strict_v11_review.png"

      - name: Consume generated atlas in real Godot SpriteFrames
        env:
          WEAPON: ${{ matrix.weapon }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/pawn-slug-godot-strict-v11"
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          "$godot" --headless --path games/pawn-slug-godot \
            --script res://tests/matthias_strict_v11_atlas_smoke.gd -- \
            "$ROOT/matthias_${WEAPON}_godot_strict_8x18_416_v11.png" \
            "$ROOT/matthias_${WEAPON}_strict_v11_manifest.json"

      - name: Publish immutable strict-v11 to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          ATLAS="/tmp/pawn-slug-godot-strict-v11/matthias_${WEAPON}_godot_strict_8x18_416_v11.png"
          python3 -S scripts/r2_asset_publish.py publish \
            "$ATLAS" \
            --logical-id "pawnSlug.godot.matthias.${WEAPON}.strictV11" \
            --prefix "pawn-slug-godot/matthias/strict-v11/${WEAPON}" \
            | tee "/tmp/pawn-slug-godot-strict-v11-${WEAPON}-publish.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-godot-strict-v11-${{ matrix.weapon }}-${{ github.event.pull_request.number || github.run_number }}
          path: |
            /tmp/pawn-slug-godot-strict-v11/matthias_${{ matrix.weapon }}_godot_strict_8x18_416_v11.png
            /tmp/pawn-slug-godot-strict-v11/matthias_${{ matrix.weapon }}_strict_v11_manifest.json
            /tmp/pawn-slug-godot-strict-v11/matthias_${{ matrix.weapon }}_strict_v11_review.png
            /tmp/pawn-slug-godot-strict-v11/matthias_${{ matrix.weapon }}_strict_v11_health.json
            /tmp/pawn-slug-godot-strict-v11-${{ matrix.weapon }}-publish.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
