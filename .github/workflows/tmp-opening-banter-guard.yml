          new = 'game_opening_banter: "Abre esta partida con una pulla de Matthias en una o dos frases muy cortas y sólo en español de España. Si citas nivel o dificultad, copia literalmente HECHOS.game.difficulty; no introduzcas ningún número ausente de HECHOS y no mezcles alfabetos. Prioriza un único hecho relevante del historial si HECHOS lo demuestra; si la muestra es pobre, usa sólo dificultad, color o modo actuales. Nada de consejo, informe, resumen ni historial inventado.",'
