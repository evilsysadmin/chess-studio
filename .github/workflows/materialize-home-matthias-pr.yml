name: TEMP · Materialize Home Matthias PR art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_home_matthias.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/blender/home_matthias_animations.py'
      - '.github/workflows/materialize-home-matthias-pr.yml'

permissions:
  contents: write

concurrency:
  group: temp-materialize-home-matthias-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: ./.github/actions/setup-blender-canonical
      - name: Rebuild canonical runtime files from PR source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          blender --background \
            --python scripts/blender/build_home_matthias.py \
            -- \
            --blend frontend/art-source/matthias-home-canonical.blend \
            --glb frontend/public/models/matthias-home-canonical.glb \
            --preview /tmp/matthias-home-canonical.png
          test -s frontend/art-source/matthias-home-canonical.blend
          test -s frontend/public/models/matthias-home-canonical.glb
          test -s /tmp/matthias-home-canonical.png
      - name: Commit exact generated Blender artifacts
        run: |
          set -euo pipefail
          git add frontend/art-source/matthias-home-canonical.blend \
            frontend/public/models/matthias-home-canonical.glb
          if git diff --cached --quiet; then
            echo 'Canonical binaries already match source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art: materialize classic Home Matthias Blender runtime'
          git push origin HEAD:${GITHUB_HEAD_REF}
