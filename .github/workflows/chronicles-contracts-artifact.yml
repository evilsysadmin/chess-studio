name: Chronicles · temporary parity fixtures
on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-contracts-artifact.yml'
      - 'backend-python/chronicles*'
      - 'backend-go/internal/chronicles/**'
      - 'scripts/chronicles*'
permissions:
  contents: write
jobs:
  generate:
    name: Generate Python-authoritative contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event.pull_request.number == 5168 && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/chronicles-dungeon-levels
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/cache-python-venv
      - name: Generate and deterministically verify contracts
        run: |
          .venv/bin/python scripts/chronicles_contracts.py
          .venv/bin/python scripts/chronicles_contracts.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: chronicles-regenerated-python-corpora
          if-no-files-found: error
          path: |
            backend-go/internal/chronicles/testdata/python_chronicles_area_corpus.json
            backend-go/internal/gamesapi/testdata/python_chronicles_runs_corpus.json
          retention-days: 1
      - name: Commit only deterministic regenerated contract fixtures to this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend-go/internal/chronicles/testdata/python_chronicles_area_corpus.json backend-go/internal/gamesapi/testdata/python_chronicles_runs_corpus.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(chronicles): refresh Python-authoritative parity corpora'
            git push origin HEAD:refs/heads/feat/chronicles-dungeon-levels
          fi
