name: Quality · CI gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cada PR sólo necesita validar el head más reciente. La admisión de un SHA ya
# mergeado en main vive separada en Main · admission para no repetir este gate.
concurrency:
  group: chess-studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight · scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_frontend: ${{ steps.quality_paths.outputs.run_frontend }}
      run_backend: ${{ steps.quality_paths.outputs.run_backend }}
      run_e2e: ${{ steps.quality_paths.outputs.run_e2e }}
      run_security: ${{ steps.quality_paths.outputs.run_security }}
      run_pawn_slug_e2e: ${{ steps.quality_paths.outputs.run_pawn_slug_e2e }}
      run_chesscom_e2e: ${{ steps.quality_paths.outputs.run_chesscom_e2e }}
      run_trailblazer_e2e: ${{ steps.quality_paths.outputs.run_trailblazer_e2e }}
      run_matthias_home_e2e: ${{ steps.quality_paths.outputs.run_matthias_home_e2e }}
      browser_matrix: ${{ steps.browser_scope.outputs.matrix }}
      browser_has_cases: ${{ steps.browser_scope.outputs.has_cases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Capture immutable PR quality provenance
        if: github.event_name == 'pull_request'
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 -S scripts/quality_provenance.py

      - name: Upload immutable PR quality provenance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quality-provenance
          path: .ci/quality-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Classify quality-test surface
        id: quality_paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            python3 -S scripts/quality_scope.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Diff base no fiable; activando Quality completo.'
            python3 -S scripts/quality_scope.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"
          printf '%s\n' "$files" | python3 -S scripts/quality_scope.py >> "$GITHUB_OUTPUT"

      - name: Classify required specialized browser surface
        id: browser_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            python3 -S scripts/browser_quality_scope.py --all \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Diff browser no fiable; activando matriz especializada completa.'
            python3 -S scripts/browser_quality_scope.py --all \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"
          printf '%s\n' "$files" | python3 -S scripts/browser_quality_scope.py \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Preflight · contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static preflight + CI wiring
        shell: bash
        run: |
          set -euo pipefail
          make static-preflight
          python3 -S scripts/quality_scope.py --self-test
          python3 -S scripts/browser_quality_scope.py --self-test
          python3 -S scripts/quality_provenance.py --self-test
          python3 -S scripts/security_scope.py --self-test

      - name: Staging preview isolation contract
        run: python3 scripts/staging_preview_contract.py

  frontend:
    name: Tests · Frontend
    needs: preflight
    if: needs.preflight.outputs.run_frontend == 'true' || needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Frontend tests
        if: needs.preflight.outputs.run_frontend == 'true'
        run: make test-frontend

      # Los smokes experimentales siguen viviendo en este runner y necesitan un
      # dist local. El frontend genérico/core no recompila aquí: consume el único
      # build compartido que genera e2e_build para Playwright.
      - name: Frontend build · targeted browser smoke only
        if: needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true'
        run: make frontend-build

      - name: Bundle size report · targeted-only path
        if: (needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true') && needs.preflight.outputs.run_e2e != 'true' && needs.preflight.outputs.browser_has_cases != 'true'
        run: node scripts/bundle_size_report.mjs

      - name: Prepare security report
        if: needs.preflight.outputs.run_security == 'true'
        run: mkdir -p .security

      - name: Node dependency audit
        if: needs.preflight.outputs.run_security == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > ../.security/npm-audit.json
          rc=$?
          set -e
          if [ ! -s ../.security/npm-audit.json ]; then
            printf '%s\n' '{"error":{"code":"AUDIT_UNAVAILABLE","summary":"npm audit no produjo informe","detail":"endpoint remoto o red no disponibles"}}' > ../.security/npm-audit.json
          fi
          python3 ../scripts/npm_audit_gate.py ../.security/npm-audit.json

      - name: Restore targeted experiment browser runtime
        if: needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true'
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Pawn Slug browser smoke
        if: needs.preflight.outputs.run_pawn_slug_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test pawn-slug.spec.js --workers=1 --retries=0

      - name: Chesscom browser smoke
        if: needs.preflight.outputs.run_chesscom_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test chesscom.spec.js --workers=1 --retries=0

      - name: Pawn Trailblazer browser smoke
        if: needs.preflight.outputs.run_trailblazer_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test pawn-trailblazer.spec.js --workers=1 --retries=0

      - name: Matthias Home browser smoke
        if: needs.preflight.outputs.run_matthias_home_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test matthias-home-priority.spec.js --workers=1 --retries=0

      - name: Upload targeted browser diagnostics on failure
        if: failure() && (needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: targeted-playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Tests · Backend
    needs: preflight
    if: needs.preflight.outputs.run_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt

      - name: Restore exact backend virtualenv
        uses: ./.github/actions/cache-python-venv

      - name: Backend smoke · engine + AI
        run: make test-backend-smoke

      - name: Backend integration/API
        run: make test-backend-integration

      - name: Python dependency consistency
        run: make backend-check

      - name: Prepare security report
        if: needs.preflight.outputs.run_security == 'true'
        run: mkdir -p .security

      - name: Python advisory inventory (informative)
        if: needs.preflight.outputs.run_security == 'true'
        continue-on-error: true
        run: make security-be

  security:
    name: Security · Trivy + Docker
    needs: preflight
    if: needs.preflight.outputs.run_security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect Docker/dependency/security changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 -S scripts/security_scope.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python3 -S scripts/security_scope.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"
          printf '%s\n' "$files" | python3 -S scripts/security_scope.py --github-output "$GITHUB_OUTPUT"

      - name: Security gate skipped · no sensitive surface changed
        if: steps.changes.outputs.run_security != 'true'
        run: |
          echo "Trivy/Docker omitidos: este cambio no toca dependencias, imágenes, compose ni infraestructura sensible."

      - name: Resolve Trivy cache epoch
        if: steps.changes.outputs.run_security == 'true'
        id: trivy_epoch
        shell: bash
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        if: steps.changes.outputs.run_security == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .tools/trivy
            .trivy-cache
          key: trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-${{ steps.trivy_epoch.outputs.day }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-

      - name: Trivy filesystem
        if: steps.changes.outputs.run_security == 'true'
        env:
          TRIVY_DB_TTL_MINUTES: '1440'
        run: make security-trivy

      - name: Set up Docker Buildx cache backend
        if: steps.changes.outputs.run_security == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Docker image security
        if: steps.changes.outputs.run_security == 'true'
        env:
          TRIVY_DB_TTL_MINUTES: '1440'
        run: make security-images

      - name: Real stack smoke · Docker Compose
        if: steps.changes.outputs.run_security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose down -v || true; }
          trap cleanup EXIT
          docker compose up -d --build
          python3 scripts/compose_smoke.py

  e2e_build:
    name: Build browser artifact once
    needs: preflight
    if: needs.preflight.outputs.run_e2e == 'true' || needs.preflight.outputs.browser_has_cases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build frontend once for all required browser gates
        working-directory: frontend
        run: npm run build

      - name: Bundle size report from shared build
        run: node scripts/bundle_size_report.mjs

      - name: Upload immutable browser frontend
        uses: actions/upload-artifact@v7
        with:
          name: quality-browser-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  e2e_lanes:
    name: Tests · Playwright · ${{ matrix.lane }}
    needs: [preflight, e2e_build]
    if: needs.preflight.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane:
          - regression
          - learning-golden
          - learning-observation
          - smoke
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore critical browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Download shared browser frontend
        uses: actions/download-artifact@v6
        with:
          name: quality-browser-frontend-${{ github.sha }}
          path: frontend/dist

      - name: Critical browser lane
        working-directory: e2e
        run: bash ./run-critical-lane.sh "${{ matrix.lane }}"

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.lane }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e_specialized:
    name: Browser required · ${{ matrix.label }}
    needs: [preflight, e2e_build]
    if: needs.preflight.outputs.browser_has_cases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore specialized browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Download shared browser frontend
        uses: actions/download-artifact@v6
        with:
          name: quality-browser-frontend-${{ github.sha }}
          path: frontend/dist

      - name: Run ${{ matrix.label }}
        working-directory: e2e
        run: ${{ matrix.command }}

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: required-browser-e2e-${{ matrix.id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Tests · Playwright
    needs: [preflight, e2e_lanes, e2e_specialized]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate all required browser lanes
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          RUN_E2E: ${{ needs.preflight.outputs.run_e2e }}
          CORE_LANES_RESULT: ${{ needs.e2e_lanes.result }}
          RUN_SPECIALIZED: ${{ needs.preflight.outputs.browser_has_cases }}
          SPECIALIZED_RESULT: ${{ needs.e2e_specialized.result }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != 'success' ]]; then
            echo "::error::Preflight no terminó con éxito: $PREFLIGHT_RESULT"
            exit 1
          fi
          if [[ "$RUN_E2E" == 'true' && "$CORE_LANES_RESULT" != 'success' ]]; then
            echo "::error::Alguna lane crítica de Playwright falló: $CORE_LANES_RESULT"
            exit 1
          fi
          if [[ "$RUN_SPECIALIZED" == 'true' && "$SPECIALIZED_RESULT" != 'success' ]]; then
            echo "::error::Alguna lane especializada requerida falló: $SPECIALIZED_RESULT"
            exit 1
          fi
          if [[ "$RUN_E2E" != 'true' && "$RUN_SPECIALIZED" != 'true' ]]; then
            echo 'Playwright omitido: esta superficie no requiere navegador crítico ni especializado.'
            exit 0
          fi
          echo "Playwright requerido OK · core=$RUN_E2E/$CORE_LANES_RESULT · especializado=$RUN_SPECIALIZED/$SPECIALIZED_RESULT"