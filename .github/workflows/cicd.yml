name: Chess Studio CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PRs sólo necesitan validar el head más reciente. En main no cancelamos porque
# Staging · deploy consume el SHA aprobado por este workflow y rechaza commits
# obsoletos por su cuenta.
concurrency:
  group: chess-studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight · contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend_changed: ${{ steps.scope.outputs.frontend_changed }}
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
      e2e_changed: ${{ steps.scope.outputs.e2e_changed }}
      frontend_deps_changed: ${{ steps.scope.outputs.frontend_deps_changed }}
      backend_deps_changed: ${{ steps.scope.outputs.backend_deps_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static preflight + CI wiring
        run: make static-preflight

      - name: Classify changed surfaces
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          all_true() {
            {
              echo 'frontend_changed=true'
              echo 'backend_changed=true'
              echo 'e2e_changed=true'
              echo 'frontend_deps_changed=true'
              echo 'backend_deps_changed=true'
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            all_true
            exit 0
          fi

          # Ante una base dudosa no optimizamos: ejecutar todo es más barato que
          # obtener un falso verde por un diff incompleto.
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            all_true
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"

          frontend=false
          backend=false
          e2e=false
          frontend_deps=false
          backend_deps=false
          unknown=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              frontend/package.json|frontend/package-lock.json)
                frontend=true
                e2e=true
                frontend_deps=true
                ;;
              frontend/*)
                frontend=true
                e2e=true
                ;;
              e2e/*)
                e2e=true
                ;;
              backend-python/requirements*.txt)
                backend=true
                backend_deps=true
                ;;
              backend-python/*)
                backend=true
                ;;
              scripts/bundle_size_report.mjs|scripts/npm_audit_gate.py)
                frontend=true
                ;;
              scripts/check_python.py|scripts/pip_audit_gate.py)
                backend=true
                ;;
              Makefile|Dockerfile.test|docker-compose.yml|docker-compose.yaml|compose.yml|compose.yaml|.github/workflows/cicd.yml)
                frontend=true
                backend=true
                e2e=true
                frontend_deps=true
                backend_deps=true
                ;;
              README.md|docs/*|.github/workflows/*|infra/*|render.yaml|scripts/render_*|scripts/cloudflare_*|scripts/synthetic_health_check.py)
                # Superficies operativas/documentales: las valida preflight y,
                # cuando toca, el gate Security o su workflow especializado.
                ;;
              *)
                echo "Ruta no clasificada de forma segura: $file"
                unknown=true
                ;;
            esac
          done <<< "$files"

          if [[ "$unknown" == true ]]; then
            all_true
            exit 0
          fi

          {
            echo "frontend_changed=$frontend"
            echo "backend_changed=$backend"
            echo "e2e_changed=$e2e"
            echo "frontend_deps_changed=$frontend_deps"
            echo "backend_deps_changed=$backend_deps"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### CI scope'
            echo
            echo "- Frontend: \`$frontend\`"
            echo "- Backend: \`$backend\`"
            echo "- Browser: \`$e2e\`"
            echo "- Frontend deps audit: \`$frontend_deps\`"
            echo "- Backend deps audit: \`$backend_deps\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Tests · Frontend
    needs: preflight
    if: needs.preflight.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Frontend tests
        run: make test-frontend

      - name: Frontend build
        run: make frontend-build

      # `make bundle-report` volvería a ejecutar frontend-build. En CI el dist
      # acaba de generarse en el paso anterior, así que consumimos ese artefacto
      # directamente y evitamos una segunda compilación idéntica.
      - name: Bundle size report
        run: node scripts/bundle_size_report.mjs

      - name: Prepare security report
        if: needs.preflight.outputs.frontend_deps_changed == 'true'
        run: mkdir -p .security

      - name: Node dependency audit
        if: needs.preflight.outputs.frontend_deps_changed == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > ../.security/npm-audit.json
          rc=$?
          set -e
          if [ ! -s ../.security/npm-audit.json ]; then
            printf '%s\n' '{"error":{"code":"AUDIT_UNAVAILABLE","summary":"npm audit no produjo informe","detail":"endpoint remoto o red no disponibles"}}' > ../.security/npm-audit.json
          fi
          python3 ../scripts/npm_audit_gate.py ../.security/npm-audit.json

  backend:
    name: Tests · Backend
    needs: preflight
    if: needs.preflight.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt

      - name: Install backend dependencies
        run: make backend-install

      - name: Backend smoke · engine + AI
        run: make test-backend-smoke

      - name: Backend integration/API
        run: make test-backend-integration

      - name: Python dependency consistency
        run: make backend-check

      - name: Prepare security report
        if: needs.preflight.outputs.backend_deps_changed == 'true'
        run: mkdir -p .security

      - name: Python dependency audit
        if: needs.preflight.outputs.backend_deps_changed == 'true'
        run: make security-be

  security:
    name: Security · Trivy + Docker
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Docker/dependency/security changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Un before nulo/inválido no es permiso para saltarse seguridad:
          # ante la duda ejecutamos el gate pesado.
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run_security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"

          security_pattern='(^|/)(Dockerfile[^/]*|docker-compose[^/]*\.ya?ml|\.dockerignore)$|^compose\.ya?ml$|^frontend/package(-lock)?\.json$|^backend-python/requirements[^/]*\.txt$|^Makefile$|^\.trivy(ignore|\.ya?ml)?$|^scripts/(npm_audit_gate\.py|pip_audit_gate\.py|compose_smoke\.py|security[^/]*)$|^\.github/workflows/cicd\.yml$|^(infra|deploy)/|^render\.ya?ml$'
          if grep -Eq "$security_pattern" <<< "$files"; then
            echo "run_security=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_security=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Security gate skipped · no sensitive surface changed
        if: steps.changes.outputs.run_security != 'true'
        run: |
          echo "Trivy/Docker omitidos: este cambio no toca dependencias, imágenes, compose ni infraestructura sensible."

      - name: Cache Trivy DB
        if: steps.changes.outputs.run_security == 'true'
        uses: actions/cache@v6
        with:
          path: .trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy filesystem
        if: steps.changes.outputs.run_security == 'true'
        run: make security-trivy

      - name: Docker image security
        if: steps.changes.outputs.run_security == 'true'
        run: make security-images

      - name: Real stack smoke · Docker Compose
        if: steps.changes.outputs.run_security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose down -v || true; }
          trap cleanup EXIT
          docker compose up -d --build
          python3 scripts/compose_smoke.py

  e2e:
    name: Tests · Playwright
    needs: preflight
    if: needs.preflight.outputs.e2e_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Critical browser smoke
        run: make e2e-critical

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
