name: Quality · CI gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cada PR sólo necesita validar el head más reciente. La admisión de un SHA ya
# mergeado en main vive separada en Main · admission para no repetir este gate.
concurrency:
  group: chess-studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight · contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_frontend: ${{ steps.quality_paths.outputs.run_frontend }}
      run_backend: ${{ steps.quality_paths.outputs.run_backend }}
      run_e2e: ${{ steps.quality_paths.outputs.run_e2e }}
      run_security: ${{ steps.quality_paths.outputs.run_security }}
      run_pawn_slug_e2e: ${{ steps.quality_paths.outputs.run_pawn_slug_e2e }}
      run_chesscom_e2e: ${{ steps.quality_paths.outputs.run_chesscom_e2e }}
      run_trailblazer_e2e: ${{ steps.quality_paths.outputs.run_trailblazer_e2e }}
      run_matthias_home_e2e: ${{ steps.quality_paths.outputs.run_matthias_home_e2e }}
      browser_matrix: ${{ steps.browser_scope.outputs.matrix }}
      browser_has_cases: ${{ steps.browser_scope.outputs.has_cases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Capture immutable PR quality provenance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tested_merge_sha="$(git rev-parse HEAD)"
          [[ "$tested_merge_sha" == "$EVENT_SHA" ]] || {
            echo "::error::Checkout mutable: HEAD=$tested_merge_sha pero github.sha=$EVENT_SHA"
            exit 1
          }

          read -r base_sha head_sha extra <<< "$(git show -s --format='%P' HEAD)"
          [[ -n "$base_sha" && -n "$head_sha" && -z "${extra:-}" ]] || {
            echo '::error::El SHA probado por un PR debe ser un merge sintético de exactamente dos padres.'
            exit 1
          }
          [[ "$head_sha" == "$PR_HEAD_SHA" ]] || {
            echo "::error::El segundo padre probado $head_sha no coincide con el head del PR $PR_HEAD_SHA"
            exit 1
          }

          mkdir -p .ci
          python3 - "$PR_NUMBER" "$tested_merge_sha" "$base_sha" "$head_sha" "$RUN_ID" "$RUN_ATTEMPT" <<'PY'
          import json, pathlib, sys
          pr_number, tested, base, head, run_id, attempt = sys.argv[1:]
          payload = {
              'schema': 1,
              'pr_number': int(pr_number),
              'tested_merge_sha': tested.lower(),
              'base_sha': base.lower(),
              'head_sha': head.lower(),
              'run_id': int(run_id),
              'run_attempt': int(attempt),
          }
          pathlib.Path('.ci/quality-provenance.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(
              f"Quality receipt · PR #{payload['pr_number']} · merge {tested[:12]} · "
              f"base {base[:12]} · head {head[:12]}"
          )
          PY

      - name: Upload immutable PR quality provenance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quality-provenance
          path: .ci/quality-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Static preflight + CI wiring
        shell: bash
        run: |
          set -euo pipefail
          make static-preflight
          python3 -S scripts/quality_scope.py --self-test

      - name: Staging preview isolation contract
        run: python3 scripts/staging_preview_contract.py

      - name: Classify quality-test surface
        id: quality_paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            python3 -S scripts/quality_scope.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Diff base no fiable; activando Quality completo.'
            python3 -S scripts/quality_scope.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"
          printf '%s\n' "$files" | python3 -S scripts/quality_scope.py >> "$GITHUB_OUTPUT"

      - name: Classify required specialized browser surface
        id: browser_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          full_logic=false
          visual=false
          focus=false
          matthias=false

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            full_logic=true
            visual=true
            focus=true
            matthias=true
          elif [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Diff browser no fiable; activando matriz especializada completa.'
            full_logic=true
            visual=true
            focus=true
            matthias=true
          else
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                frontend/src/components/WarRoomCastleArchitecture.js|frontend/src/components/WarRoomPremiumPaintings.js|frontend/src/components/WarRoomArchitectural*.js|frontend/src/components/WarRoomPracticalLighting.js|frontend/src/components/WarRoomPremiumFinishPass.js|frontend/src/components/WarRoomTeutonicDecor.js|frontend/src/components/PremiumWarRoomScene.js|frontend/src/components/WarRoom3DAnimation.js|frontend/src/components/Board3D*.css|frontend/src/components/WarRoom3D*.css|e2e/war-room-desktop-scale.spec.js)
                  visual=true
                  ;;
                frontend/src/styles/19-game-focus.css|e2e/android-game-focus.spec.js)
                  visual=true
                  focus=true
                  ;;
                frontend/src/components/Board3D.jsx|frontend/src/components/Board3D*.js|frontend/src/components/WarRoom3D*.js|frontend/src/components/GameBoardView.jsx|frontend/src/components/GameCommandDeck.jsx|frontend/src/components/GamePlayerRail.jsx|frontend/src/components/GameSideColumn.jsx|frontend/src/components/GameStatusStrips.jsx|frontend/src/components/GameWarRoomCommandColumn.jsx|frontend/src/components/useGameBoardRenderer.js|frontend/src/components/useGameMobileFocus.js|frontend/src/components/useMatthiasBoardReactions.js|frontend/src/warRoomPointerCapture.js|frontend/src/warRoomPointerCapture.test.js|frontend/src/main.jsx|e2e/three-d-war-room.spec.js|e2e/three-d-war-room-android-touch.spec.js|e2e/three-d-war-room-special-states.spec.js|e2e/three-d-special-surfaces.spec.js|e2e/helpers.js)
                  full_logic=true
                  visual=true
                  focus=true
                  ;;
              esac

              case "$file" in
                frontend/src/components/Matthias*.jsx|frontend/src/components/Matthias*.js|frontend/src/components/Matthias*.css|frontend/src/components/matthias*.jsx|frontend/src/components/matthias*.js|frontend/src/components/matthias*.css|frontend/src/components/InsightsMatthiasMotion.jsx|frontend/src/matthias*.js|frontend/src/assets/matthias-*/*|e2e/matthias-home-visual-critical.spec.js|e2e/matthias-war-room-android-motion.spec.js|e2e/insights-matthias-motion.spec.js)
                  matthias=true
                  ;;
              esac

              case "$file" in
                .github/actions/setup-browser-e2e/action.yml|.github/actions/cache-node-modules/action.yml)
                  full_logic=true
                  visual=true
                  focus=true
                  matthias=true
                  ;;
                .github/workflows/cicd.yml)
                  # Probar el plumbing nuevo sin despertar las 13 escenas WebGL
                  # sólo porque cambia el propio YAML de Quality.
                  visual=true
                  ;;
              esac
            done <<< "$files"
          fi

          matrix="$(python3 - "$full_logic" "$visual" "$focus" "$matthias" <<'PY'
          import json, sys
          full_logic, visual, focus, matthias = [value == 'true' for value in sys.argv[1:]]
          cases = []
          if full_logic:
              cases.extend([
                  {'id': 'android-selection', 'label': 'War Room · Android selection', 'command': './node_modules/.bin/playwright test three-d-war-room-android-touch.spec.js --workers=1 --retries=0'},
                  {'id': 'desktop-input', 'label': 'War Room · desktop input', 'command': './node_modules/.bin/playwright test three-d-war-room.spec.js --grep "War Room · desktop input mantiene cámara fija y juega e2→e4" --workers=1 --retries=0 --timeout=75000'},
                  {'id': 'special-surfaces', 'label': '3D parity · special surfaces', 'command': './node_modules/.bin/playwright test three-d-special-surfaces.spec.js --workers=1 --retries=0 --timeout=90000'},
              ])
              for shard in range(1, 6):
                  cases.append({
                      'id': f'special-state-{shard}',
                      'label': f'War Room · special-state {shard}/5',
                      'command': f'./node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard={shard}/5',
                  })
          if visual:
              cases.append({
                  'id': 'desktop-scale',
                  'label': 'War Room · desktop board scale',
                  'command': './node_modules/.bin/playwright test war-room-desktop-scale.spec.js --workers=1 --retries=0 --timeout=75000',
              })
          if focus:
              cases.append({
                  'id': 'android-focus',
                  'label': 'War Room · Android Focus',
                  'command': './node_modules/.bin/playwright test android-game-focus.spec.js --workers=1 --retries=0 --timeout=30000',
              })
          if matthias:
              cases.extend([
                  {'id': 'matthias-home-motion', 'label': 'Matthias · Home motion', 'command': './node_modules/.bin/playwright test matthias-home-visual-critical.spec.js --workers=1 --retries=0 --timeout=75000'},
                  {'id': 'matthias-war-room', 'label': 'Matthias · War Room Android', 'command': './node_modules/.bin/playwright test matthias-war-room-android-motion.spec.js --workers=1 --retries=0'},
                  {'id': 'matthias-insights', 'label': 'Matthias · Así juegas motion', 'command': './node_modules/.bin/playwright test insights-matthias-motion.spec.js --workers=1 --retries=0'},
              ])
          print(json.dumps({'include': cases}, separators=(',', ':')))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo 'has_cases=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_cases=true' >> "$GITHUB_OUTPUT"
          fi

          {
            echo '### Required specialized browser scope'
            echo
            echo "- War Room rules/input parity: \`$full_logic\`"
            echo "- War Room mount/scale: \`$visual\`"
            echo "- Android Focus: \`$focus\`"
            echo "- Matthias motion/paint: \`$matthias\`"
            echo '- Estas lanes forman parte del check requerido Tests · Playwright.'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Tests · Frontend
    needs: preflight
    if: needs.preflight.outputs.run_frontend == 'true' || needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Frontend tests
        if: needs.preflight.outputs.run_frontend == 'true'
        run: make test-frontend

      # Los smokes experimentales siguen viviendo en este runner y necesitan un
      # dist local. El frontend genérico/core no recompila aquí: consume el único
      # build compartido que genera e2e_build para Playwright.
      - name: Frontend build · targeted browser smoke only
        if: needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true'
        run: make frontend-build

      - name: Bundle size report · targeted-only path
        if: (needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true') && needs.preflight.outputs.run_e2e != 'true' && needs.preflight.outputs.browser_has_cases != 'true'
        run: node scripts/bundle_size_report.mjs

      - name: Prepare security report
        if: needs.preflight.outputs.run_security == 'true'
        run: mkdir -p .security

      - name: Node dependency audit
        if: needs.preflight.outputs.run_security == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > ../.security/npm-audit.json
          rc=$?
          set -e
          if [ ! -s ../.security/npm-audit.json ]; then
            printf '%s\n' '{"error":{"code":"AUDIT_UNAVAILABLE","summary":"npm audit no produjo informe","detail":"endpoint remoto o red no disponibles"}}' > ../.security/npm-audit.json
          fi
          python3 ../scripts/npm_audit_gate.py ../.security/npm-audit.json

      - name: Restore targeted experiment browser runtime
        if: needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true'
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Pawn Slug browser smoke
        if: needs.preflight.outputs.run_pawn_slug_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test pawn-slug.spec.js --workers=1 --retries=0

      - name: Chesscom browser smoke
        if: needs.preflight.outputs.run_chesscom_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test chesscom.spec.js --workers=1 --retries=0

      - name: Pawn Trailblazer browser smoke
        if: needs.preflight.outputs.run_trailblazer_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test pawn-trailblazer.spec.js --workers=1 --retries=0

      - name: Matthias Home browser smoke
        if: needs.preflight.outputs.run_matthias_home_e2e == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright test matthias-home-priority.spec.js --workers=1 --retries=0

      - name: Upload targeted browser diagnostics on failure
        if: failure() && (needs.preflight.outputs.run_pawn_slug_e2e == 'true' || needs.preflight.outputs.run_chesscom_e2e == 'true' || needs.preflight.outputs.run_trailblazer_e2e == 'true' || needs.preflight.outputs.run_matthias_home_e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: targeted-playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Tests · Backend
    needs: preflight
    if: needs.preflight.outputs.run_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt

      - name: Restore exact backend virtualenv
        uses: ./.github/actions/cache-python-venv

      - name: Backend smoke · engine + AI
        run: make test-backend-smoke

      - name: Backend integration/API
        run: make test-backend-integration

      - name: Python dependency consistency
        run: make backend-check

      - name: Prepare security report
        if: needs.preflight.outputs.run_security == 'true'
        run: mkdir -p .security

      - name: Python advisory inventory (informative)
        if: needs.preflight.outputs.run_security == 'true'
        continue-on-error: true
        run: make security-be

  security:
    name: Security · Trivy + Docker
    needs: preflight
    if: needs.preflight.outputs.run_security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect Docker/dependency/security changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run_security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"

          security_pattern='(^|/)(Dockerfile[^/]*|docker-compose[^/]*\.ya?ml|\.dockerignore)$|^compose\.ya?ml$|^frontend/package(-lock)?\.json$|^backend-python/requirements[^/]*\.txt$|^Makefile$|^\.trivy(ignore|\.ya?ml)?$|^scripts/(npm_audit_gate\.py|pip_audit_report\.py|compose_smoke\.py|security[^/]*|trivy_[^/]*|install_trivy\.sh)$|^\.github/workflows/cicd\.yml$|^\.github/actions/cache-python-venv/action\.yml$|^(infra|deploy)/|^render\.ya?ml$'
          if grep -Eq "$security_pattern" <<< "$files"; then
            echo "run_security=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_security=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Security gate skipped · no sensitive surface changed
        if: steps.changes.outputs.run_security != 'true'
        run: |
          echo "Trivy/Docker omitidos: este cambio no toca dependencias, imágenes, compose ni infraestructura sensible."

      - name: Resolve Trivy cache epoch
        if: steps.changes.outputs.run_security == 'true'
        id: trivy_epoch
        shell: bash
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        if: steps.changes.outputs.run_security == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .tools/trivy
            .trivy-cache
          key: trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-${{ steps.trivy_epoch.outputs.day }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-

      - name: Trivy filesystem
        if: steps.changes.outputs.run_security == 'true'
        env:
          TRIVY_DB_TTL_MINUTES: '1440'
        run: make security-trivy

      - name: Set up Docker Buildx cache backend
        if: steps.changes.outputs.run_security == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Docker image security
        if: steps.changes.outputs.run_security == 'true'
        env:
          TRIVY_DB_TTL_MINUTES: '1440'
        run: make security-images

      - name: Real stack smoke · Docker Compose
        if: steps.changes.outputs.run_security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose down -v || true; }
          trap cleanup EXIT
          docker compose up -d --build
          python3 scripts/compose_smoke.py

  e2e_build:
    name: Build browser artifact once
    needs: preflight
    if: needs.preflight.outputs.run_e2e == 'true' || needs.preflight.outputs.browser_has_cases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build frontend once for all required browser gates
        working-directory: frontend
        run: npm run build

      - name: Bundle size report from shared build
        run: node scripts/bundle_size_report.mjs

      - name: Upload immutable browser frontend
        uses: actions/upload-artifact@v7
        with:
          name: quality-browser-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  e2e_lanes:
    name: Tests · Playwright · ${{ matrix.lane }}
    needs: [preflight, e2e_build]
    if: needs.preflight.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane:
          - regression
          - smoke
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore critical browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Download shared browser frontend
        uses: actions/download-artifact@v6
        with:
          name: quality-browser-frontend-${{ github.sha }}
          path: frontend/dist

      - name: Critical browser lane
        working-directory: e2e
        shell: bash
        env:
          CRITICAL_E2E_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$CRITICAL_E2E_LANE" in
            regression)
              ./node_modules/.bin/playwright test regression-journeys.spec.js \
                --grep "sesión · dos contextos de navegador|deploy · una release nueva no fuerza reload|admin · presencia distingue|Matthias · saluda una vez tras login y no repite el saludo con F5|Home · el avatar residente de Matthias abre Así juegas|Matthias · el briefing persistente aparece antes de una partida rápida|Matthias · banco de personalidad Admin usa sólo datos sintéticos|Escuela de Matthias · el primer movimiento se aprende hands-on y persiste tras F5|Escuela de Matthias · el examen básico bloquea la promoción hasta aprobar" \
                --workers=1 --retries=0 --timeout=75000
              ./node_modules/.bin/playwright test mobile-final-interactions.spec.js --workers=1 --retries=0
              ;;
            smoke)
              ./node_modules/.bin/playwright test smoke.spec.js \
                --grep "login → menú|Partida rápida · una partida activa|Torneo · una partida activa|Partida rápida · un 503 al restaurar|Combat Chess · Campaña permite jugar con defaults|Combat Chess · salir al menú conserva campaña" \
                --workers=1 --retries=0
              ;;
            *)
              echo "::error::Lane Playwright desconocida: $CRITICAL_E2E_LANE"
              exit 2
              ;;
          esac

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.lane }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e_specialized:
    name: Browser required · ${{ matrix.label }}
    needs: [preflight, e2e_build]
    if: needs.preflight.outputs.browser_has_cases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore specialized browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Download shared browser frontend
        uses: actions/download-artifact@v6
        with:
          name: quality-browser-frontend-${{ github.sha }}
          path: frontend/dist

      - name: Run ${{ matrix.label }}
        working-directory: e2e
        run: ${{ matrix.command }}

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: required-browser-e2e-${{ matrix.id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Tests · Playwright
    needs: [preflight, e2e_lanes, e2e_specialized]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate all required browser lanes
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          RUN_E2E: ${{ needs.preflight.outputs.run_e2e }}
          CORE_LANES_RESULT: ${{ needs.e2e_lanes.result }}
          RUN_SPECIALIZED: ${{ needs.preflight.outputs.browser_has_cases }}
          SPECIALIZED_RESULT: ${{ needs.e2e_specialized.result }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != 'success' ]]; then
            echo "::error::Preflight no terminó con éxito: $PREFLIGHT_RESULT"
            exit 1
          fi
          if [[ "$RUN_E2E" == 'true' && "$CORE_LANES_RESULT" != 'success' ]]; then
            echo "::error::Alguna lane crítica de Playwright falló: $CORE_LANES_RESULT"
            exit 1
          fi
          if [[ "$RUN_SPECIALIZED" == 'true' && "$SPECIALIZED_RESULT" != 'success' ]]; then
            echo "::error::Alguna lane especializada requerida falló: $SPECIALIZED_RESULT"
            exit 1
          fi
          if [[ "$RUN_E2E" != 'true' && "$RUN_SPECIALIZED" != 'true' ]]; then
            echo 'Playwright omitido: esta superficie no requiere navegador crítico ni especializado.'
            exit 0
          fi
          echo "Playwright requerido OK · core=$RUN_E2E/$CORE_LANES_RESULT · especializado=$RUN_SPECIALIZED/$SPECIALIZED_RESULT"
