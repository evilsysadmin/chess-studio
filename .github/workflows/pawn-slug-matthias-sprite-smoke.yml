name: Pawn Slug · sprite smoke

on:
  pull_request:
    paths:
      - games/pawn-slug-godot/scripts/matthias_art.gd
      - games/pawn-slug-godot/scripts/enemy_visual.gd
      - games/pawn-slug-godot/art/enemies-v2-worksheet.json
      - scripts/art/export_matthias_sprite_smoke.py
      - scripts/art/validate_matthias_sprite_continuity.py
      - scripts/art/repair_matthias_machinegun_continuity.py
      - scripts/art/repair_matthias_machinegun_hurt_alpha_v3.py
      - scripts/art/sprite_forge.py
      - scripts/art/test_sprite_forge.py
      - scripts/art/export_enemy_sprite_smoke.py
      - scripts/art/png_contract.py
      - scripts/pawn_slug_sprite_smoke_scope.py
      - scripts/pr_merge_diff.py
      - scripts/art/pack_pawn_slug_enemy_v2.py
      - scripts/art/validate_pawn_slug_enemy_v2.py
      - scripts/art/test_pawn_slug_enemy_v2.py
      - scripts/art/derive_pawn_slug_enemy_queen_v2.py
      - scripts/art/test_pawn_slug_enemy_queen_v2.py
      - scripts/art/derive_pawn_slug_enemy_scout_v2.py
      - scripts/art/test_pawn_slug_enemy_scout_v2.py
      - .github/workflows/pawn-slug-matthias-sprite-smoke.yml
  push:
    branches: [main]
    paths:
      - scripts/art/repair_matthias_machinegun_continuity.py
      - scripts/art/repair_matthias_machinegun_hurt_alpha_v3.py
      - scripts/art/sprite_forge.py
      - scripts/art/test_sprite_forge.py
      - .github/workflows/pawn-slug-matthias-sprite-smoke.yml
  workflow_run:
    workflows:
      - Deploy to staging
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-sprite-smoke-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export Pawn Slug runtime sprite PNGs
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          # PRs use GitHub's synthetic merge so the classifier sees the complete
          # contribution against the tested base. Staging keeps the deployed SHA.
          ref: ${{ github.event_name == 'workflow_run' && env.DEPLOY_SHA || github.sha }}
          fetch-depth: 2

      - name: Resolve sprite smoke scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/pawn_slug_sprite_smoke_scope.py --self-test
          python3 -S scripts/pr_merge_diff.py --self-test

          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            python3 -S scripts/pawn_slug_sprite_smoke_scope.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            if ! files="$(python3 -S scripts/pr_merge_diff.py --base "$BASE_SHA" --merge "$MERGE_SHA")"; then
              echo '::warning::PR merge diff unavailable; sprite smoke fails closed to Matthias + enemies.'
              python3 -S scripts/pawn_slug_sprite_smoke_scope.py --all --github-output "$GITHUB_OUTPUT"
              exit 0
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            files="$(git diff --name-only HEAD^ HEAD)"
          else
            echo '::warning::No parent commit available; sprite smoke fails closed to Matthias + enemies.'
            python3 -S scripts/pawn_slug_sprite_smoke_scope.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Sprite smoke changed files:\n%s\n' "$files"
          printf '%s\n' "$files" | python3 -S scripts/pawn_slug_sprite_smoke_scope.py --github-output "$GITHUB_OUTPUT"

      - name: Install Pillow
        if: steps.scope.outputs.matthias == 'true' || steps.scope.outputs.enemy == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Validate enemy worksheet intake contract
        if: steps.scope.outputs.enemy == 'true'
        run: |
          set -euo pipefail
          python3 scripts/art/test_pawn_slug_enemy_v2.py

      - name: Test Queen v2 2D derivation
        if: steps.scope.outputs.enemy == 'true'
        run: python3 scripts/art/test_pawn_slug_enemy_queen_v2.py

      - name: Test Scout v2 2D derivation
        if: steps.scope.outputs.enemy == 'true'
        run: python3 scripts/art/test_pawn_slug_enemy_scout_v2.py

      - name: Export Matthias runtime sprites
        if: steps.scope.outputs.matthias == 'true'
        run: |
          set -euo pipefail
          python3 scripts/art/export_matthias_sprite_smoke.py \
            --gdscript games/pawn-slug-godot/scripts/matthias_art.gd \
            --output-dir /tmp/pawn-slug-sprite-smoke/matthias

      - name: Validate Matthias canonical continuity
        if: steps.scope.outputs.matthias == 'true'
        run: |
          set -euo pipefail
          python3 scripts/art/validate_matthias_sprite_continuity.py --self-test
          python3 scripts/art/validate_matthias_sprite_continuity.py \
            --gdscript games/pawn-slug-godot/scripts/matthias_art.gd \
            --sprite-smoke-dir /tmp/pawn-slug-sprite-smoke/matthias \
            --output /tmp/pawn-slug-sprite-smoke/matthias/continuity-health.json

      - name: Audit Matthias batch parity with Sprite Forge
        if: steps.scope.outputs.matthias == 'true'
        run: |
          set -euo pipefail
          LAB=/tmp/pawn-slug-sprite-smoke/matthias/sprite-lab
          mkdir -p "$LAB"
          python3 scripts/art/sprite_forge.py audit-batch \
            /tmp/pawn-slug-sprite-smoke/matthias \
            "$LAB/batch-audit.json" \
            --actor matthias \
            --weapons pistol,machinegun,shotgun,panzerfaust \
            --canon-weapons pistol,machinegun \
            --parity-actions jump,fall \
            --columns 8 \
            --pass-scale-delta 0.04 \
            --max-auto-scale-delta 0.12

          python3 - "$LAB/batch-audit.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print("### Matthias reload/die temporal audit")
          print("| Action | Weapon | Status | Height step | Foot step | Centroid step |")
          print("|---|---|---:|---:|---:|---:|")
          for action in ("reload", "die"):
              action_data = data.get("temporal", {}).get(action, {})
              for weapon, item in action_data.get("weapons", {}).items():
                  print(
                      f"| {action} | {weapon} | {item['status']} | "
                      f"{item['maxHeightStepRatio']:.3f} | "
                      f"{item['maxFootStepRatio']:.3f} | "
                      f"{item['maxCentroidStepRatio']:.3f} |"
                  )
                  if item["status"] == "review":
                      print(
                          f"Review {action}/{weapon}: "
                          f"reasons={','.join(item['reasons'])}; "
                          f"heightPair={item['maxHeightStepPair']}; "
                          f"footPair={item['maxFootStepPair']}; "
                          f"centroidPair={item['maxCentroidStepPair']}"
                      )
          PY

      - name: Build Matthias SMG hurt alpha v2 candidate
        if: steps.scope.outputs.matthias == 'true'
        run: |
          set -euo pipefail
          LAB=/tmp/pawn-slug-sprite-smoke/matthias/sprite-lab
          mkdir -p "$LAB"
          python3 scripts/art/sprite_forge.py repair-machinegun-hurt-alpha \
            /tmp/pawn-slug-sprite-smoke/matthias \
            "$LAB" \
            --actor matthias \
            --columns 8 \
            --cell-size 416 \
            --min-coverage 0.985

      - name: Sanitize Matthias SMG hurt alpha v3 candidate
        if: steps.scope.outputs.matthias == 'true'
        run: |
          set -euo pipefail
          LAB=/tmp/pawn-slug-sprite-smoke/matthias/sprite-lab
          python3 scripts/art/repair_matthias_machinegun_hurt_alpha_v3.py --self-test
          python3 scripts/art/repair_matthias_machinegun_hurt_alpha_v3.py \
            /tmp/pawn-slug-sprite-smoke/matthias \
            "$LAB/machinegun-hurt-alpha-v2.png" \
            "$LAB" \
            --columns 8 \
            --cell-size 416 \
            --min-coverage 0.985 \
            --max-detached-area 128

      - name: Publish Matthias SMG hurt alpha v3 to R2
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.scope.outputs.matthias == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LAB=/tmp/pawn-slug-sprite-smoke/matthias/sprite-lab
          python3 -S scripts/r2_asset_publish.py publish \
            "$LAB/machinegun-hurt-alpha-v3.png" \
            --logical-id pawnSlug.godot.matthias.machinegun.hurtAlphaV3 \
            --prefix pawn-slug-godot/matthias/hurt-alpha-v3/machinegun/full \
            --manifest "$LAB/machinegun-hurt-alpha-v3-r2-manifest.json"
          cat "$LAB/machinegun-hurt-alpha-v3-r2-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published Matthias SMG hurt alpha v3
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.scope.outputs.matthias == 'true'
        run: |
          set -euo pipefail
          LAB=/tmp/pawn-slug-sprite-smoke/matthias/sprite-lab
          readarray -t asset < <(python3 - "$LAB/machinegun-hurt-alpha-v3-r2-manifest.json" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          item = data["assets"]["pawnSlug.godot.matthias.machinegun.hurtAlphaV3"]
          print(item["url"])
          print(item["sha256"])
          PY
          )
          curl --fail --silent --show-error --location --max-time 20 \
            "${asset[0]}" -o "$LAB/published-machinegun-hurt-alpha-v3.png"
          actual="$(sha256sum "$LAB/published-machinegun-hurt-alpha-v3.png" | awk '{print $1}')"
          test "$actual" = "${asset[1]}"
          echo "Published Matthias SMG hurt alpha v3 verified: ${asset[0]}"

      - name: Export enemy runtime sprites
        if: steps.scope.outputs.enemy == 'true'
        run: |
          set -euo pipefail
          python3 scripts/art/export_enemy_sprite_smoke.py \
            --gdscript games/pawn-slug-godot/scripts/enemy_visual.gd \
            --output-dir /tmp/pawn-slug-sprite-smoke/enemies

      - name: Build Queen v2 candidate review
        if: steps.scope.outputs.enemy == 'true'
        run: |
          python3 scripts/art/derive_pawn_slug_enemy_queen_v2.py \
            --gdscript games/pawn-slug-godot/scripts/enemy_visual.gd \
            --output-dir /tmp/pawn-slug-sprite-smoke/enemies/queen-v2

      - name: Build Scout v2 candidate review
        if: steps.scope.outputs.enemy == 'true'
        run: |
          python3 scripts/art/derive_pawn_slug_enemy_scout_v2.py \
            --gdscript games/pawn-slug-godot/scripts/enemy_visual.gd \
            --output-dir /tmp/pawn-slug-sprite-smoke/enemies/scout-v2

      - name: Sprite smoke skipped · unrelated staging/PR surface
        if: steps.scope.outputs.matthias != 'true' && steps.scope.outputs.enemy != 'true'
        run: echo 'No Matthias/enemy sprite owner changed; expensive sprite export skipped.'

      - name: Upload Pawn Slug sprite smoke evidence
        if: always() && (steps.scope.outputs.matthias == 'true' || steps.scope.outputs.enemy == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-sprite-smoke-${{ env.DEPLOY_SHA }}
          path: /tmp/pawn-slug-sprite-smoke/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
