name: Refresh frontend lockfile (temporary)

on:
  push:
    branches:
      - refactor/remove-phaser-three-trailblazer

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile from package.json
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile when needed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "chess-studio-ci"
          git config user.email "chess-studio-ci@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Regenerate frontend lockfile without Phaser"
          git push origin HEAD:${GITHUB_REF_NAME}
