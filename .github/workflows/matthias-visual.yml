name: Matthias visual gate

on:
  pull_request:
    paths:
      - 'frontend/src/components/Matthias*.jsx'
      - 'frontend/src/components/Matthias*.css'
      - 'frontend/src/components/InsightsMatthiasMotion.jsx'
      - 'frontend/src/matthias*.js'
      - 'frontend/src/assets/matthias-*/**'
      - 'e2e/matthias-home-visual-critical.spec.js'
      - 'e2e/matthias-read-book-regression.spec.js'
      - '.github/workflows/matthias-visual.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/components/Matthias*.jsx'
      - 'frontend/src/components/Matthias*.css'
      - 'frontend/src/components/InsightsMatthiasMotion.jsx'
      - 'frontend/src/matthias*.js'
      - 'frontend/src/assets/matthias-*/**'
      - 'e2e/matthias-home-visual-critical.spec.js'
      - 'e2e/matthias-read-book-regression.spec.js'
      - '.github/workflows/matthias-visual.yml'

permissions:
  contents: read

concurrency:
  group: matthias-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-motion:
    name: Matthias · browser motion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install frontend + E2E dependencies
        run: |
          cd frontend && npm ci
          cd ../e2e && npm ci
          ./node_modules/.bin/playwright install chromium
      - name: Build production frontend
        run: cd frontend && npm run build
      - name: Verify Matthias paint and motion in Chromium
        run: cd e2e && ./node_modules/.bin/playwright test matthias-home-visual-critical.spec.js matthias-read-book-regression.spec.js --workers=4 --retries=0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: matthias-visual-diagnostics
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 5
