name: Temporary practice and reactor patch

on:
  push:
    branches:
      - feat/practice-adaptive-reactor-gambit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/practice-adaptive-reactor-gambit

      - name: Apply focused source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_object(path, key, replacement):
              p = Path(path)
              text = p.read_text()
              marker = f'  {key}: {{'
              start = text.index(marker)
              brace_start = text.index('{', start)
              depth = 0
              end = None
              for i in range(brace_start, len(text)):
                  ch = text[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          if end < len(text) and text[end] == ',':
                              end += 1
                          break
              if end is None:
                  raise SystemExit(f'{path}: could not find end of {key}')
              p.write_text(text[:start] + replacement + text[end:])

          menu = 'frontend/src/components/Menu.jsx'
          replace_once(menu,
              "import QuickMatchModal from './QuickMatchModal.jsx';\n",
              "import QuickMatchModal from './QuickMatchModal.jsx';\nimport PracticeMatchModal from './PracticeMatchModal.jsx';\n")
          replace_once(menu,
              "  const [showQuickMatch, setShowQuickMatch] = useState(false);\n  const [showMirrorMode, setShowMirrorMode] = useState(false);",
              "  const [showQuickMatch, setShowQuickMatch] = useState(false);\n  const [showPracticeMatch, setShowPracticeMatch] = useState(false);\n  const [showMirrorMode, setShowMirrorMode] = useState(false);")
          replace_once(menu,
              "  const matthiasIntroBlocked = suppressHomeNudge || hasSavedGame || showQuickMatch || showMirrorMode || Boolean(footerPanel) || Boolean(error);",
              "  const matthiasIntroBlocked = suppressHomeNudge || hasSavedGame || showQuickMatch || showPracticeMatch || showMirrorMode || Boolean(footerPanel) || Boolean(error);")
          replace_once(menu,
              "  const matthiasCornerBlocked = suppressHomeNudge || showQuickMatch || showMirrorMode || Boolean(footerPanel) || Boolean(error);",
              "  const matthiasCornerBlocked = suppressHomeNudge || showQuickMatch || showPracticeMatch || showMirrorMode || Boolean(footerPanel) || Boolean(error);")
          replace_once(menu,
              "      {error && !showQuickMatch && !showMirrorMode && <div className=\"home-error-banner\" role=\"alert\"><b>No se pudo completar la acción.</b><span>{error}</span></div>}",
              "      {error && !showQuickMatch && !showPracticeMatch && !showMirrorMode && <div className=\"home-error-banner\" role=\"alert\"><b>No se pudo completar la acción.</b><span>{error}</span></div>}")
          replace_once(menu,
              "            if (nextAction.id === 'practice') onNewGame(difficulty, color, { learning: true, timeControlId });",
              "            if (nextAction.id === 'practice') setShowPracticeMatch(true);")
          replace_once(menu,
              "            <TutorialModeCard tutorialId=\"practice\" className=\"menu-card accent-success home-mode-card home-tool-card\" disabled={loading} onClick={() => onNewGame(difficulty, color, { learning: true, timeControlId })}>",
              "            <TutorialModeCard tutorialId=\"practice\" className=\"menu-card accent-success home-mode-card home-tool-card\" disabled={loading} onClick={() => setShowPracticeMatch(true)}>")

          practice_modal = r'''import { useState } from 'react';
          import { difficultyLabel } from '../difficulty.js';
          import { difficultyForPracticeRating } from '../practiceDifficulty.js';
          import ColorSelector from './ColorSelector.jsx';
          import { TIME_CONTROLS } from '../clock.js';
          import { useEscapeToClose } from '../useEscapeToClose.js';

          function colorLabel(color) {
            if (color === 'w' || color === 'white') return 'Blancas';
            if (color === 'b' || color === 'black') return 'Negras';
            return 'Aleatorio';
          }

          export default function PracticeMatchModal({
            color,
            setColor,
            timeControlId,
            setTimeControlId,
            loading,
            error = null,
            rating,
            onStart,
            onClose,
          }) {
            useEscapeToClose(onClose);
            const adaptiveLevel = difficultyForPracticeRating(rating?.rating ?? 400, null, rating?.games ?? 0);
            const [autoDifficulty, setAutoDifficulty] = useState(true);
            const [difficulty, setDifficulty] = useState(adaptiveLevel);
            const selectedDifficulty = autoDifficulty ? adaptiveLevel : difficulty;
            const timeControl = TIME_CONTROLS.find((tc) => tc.id === timeControlId) || TIME_CONTROLS[0];

            return (
              <div className="modal-backdrop" onClick={onClose}>
                <div className="army-card friendly-modal" role="dialog" aria-modal="true" aria-label="Configurar partida de práctica" onClick={(event) => event.stopPropagation()} style={{ maxWidth: 460 }}>
                  <button className="piece-info-close" onClick={onClose} aria-label="Cerrar">×</button>
                  <span className="eyebrow">Partida de práctica</span>
                  <h3>Entrena sin jugarte el rating</h3>
                  <p className="hint-text friendly-lead">Pistas gratuitas, cero premio y cero penalización ELO. Aquí vienes a probar cosas sin que Matthias cobre peaje estadístico.</p>

                  <button type="button" className={`adaptive-difficulty-choice ${autoDifficulty ? 'active' : ''}`} aria-pressed={autoDifficulty} onClick={() => setAutoDifficulty(!autoDifficulty)}>
                    <span aria-hidden="true">◎</span>
                    <span><b>Adaptativo suave</b><small>Parte de tu nivel y baja un pequeño escalón para favorecer práctica útil · nivel {adaptiveLevel} · {difficultyLabel(adaptiveLevel)}</small></span>
                    <i>{autoDifficulty ? 'Activo' : 'Usar'}</i>
                  </button>

                  <div className={`difficulty-slider-row friendly-difficulty-main ${autoDifficulty ? 'is-disabled' : ''}`}>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={selectedDifficulty}
                      disabled={autoDifficulty}
                      onChange={(event) => setDifficulty(Number(event.target.value))}
                      aria-label="Nivel de dificultad de práctica"
                      className="difficulty-slider"
                    />
                    <div className="difficulty-readout">
                      <span className="difficulty-number">{selectedDifficulty}</span>
                      <span className="difficulty-word">{autoDifficulty ? 'Adaptativo suave' : difficultyLabel(difficulty)}</span>
                    </div>
                  </div>

                  {autoDifficulty && <button type="button" className="text-action adaptive-manual-link" onClick={() => setAutoDifficulty(false)}>Elegir nivel manualmente</button>}

                  {error && <p className="quick-match-error" role="alert">{error}</p>}

                  <button
                    type="button"
                    className="primary-btn friendly-main-cta"
                    disabled={loading}
                    onClick={() => onStart({ difficulty: selectedDifficulty, adaptiveDifficulty: autoDifficulty })}
                  >
                    {loading ? 'Creando práctica…' : 'Empezar práctica'}
                  </button>

                  <details className="friendly-disclosure quick-match-settings">
                    <summary>Ajustes · {colorLabel(color)} · {timeControl?.label || 'Sin reloj'}</summary>
                    <div className="friendly-disclosure-body">
                      <div className="quick-match-secondary-row">
                        <ColorSelector value={color} onChange={setColor} />
                        <select
                          value={timeControlId}
                          onChange={(event) => setTimeControlId(event.target.value)}
                          className="time-control-select quick-match-clock-select"
                          aria-label="Ritmo de reloj de práctica"
                        >
                          {TIME_CONTROLS.map((tc) => <option key={tc.id} value={tc.id}>{tc.label}</option>)}
                        </select>
                      </div>
                    </div>
                  </details>
                </div>
              </div>
            );
          }
          '''
          Path('frontend/src/components/PracticeMatchModal.jsx').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in practice_modal.splitlines()) + '\n')

          practice_helper = r'''import { difficultyForRating } from './playerRating.js';

          // Práctica usa exactamente la misma señal adaptativa que una partida rápida,
          // pero baja un escalón pequeño. Es un ajuste PRE-partida: nunca cambia la
          // fuerza de Matthias a mitad del tablero y nunca participa en el rating.
          export const PRACTICE_ADAPTIVE_RELIEF = 6;

          export function difficultyForPracticeRating(rating, activity = null, games = null) {
            return Math.max(0, difficultyForRating(rating, activity, games) - PRACTICE_ADAPTIVE_RELIEF);
          }
          '''
          Path('frontend/src/practiceDifficulty.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in practice_helper.splitlines()) + '\n')

          marker = "      {showMirrorMode && ("
          practice_render = r'''      {showPracticeMatch && (
                <PracticeMatchModal
                  color={color}
                  setColor={setColor}
                  timeControlId={timeControlId}
                  setTimeControlId={setTimeControlId}
                  loading={loading}
                  error={error}
                  rating={rating}
                  onStart={async ({ difficulty: practiceDifficulty, adaptiveDifficulty }) => {
                    const started = await onNewGame(practiceDifficulty, color, { learning: true, timeControlId, adaptiveDifficulty });
                    if (started) setShowPracticeMatch(false);
                  }}
                  onClose={() => setShowPracticeMatch(false)}
                />
              )}
          '''
          practice_render = '\n'.join(line[6:] if line.startswith('      ') else line for line in practice_render.splitlines()) + '\n'
          replace_once(menu, marker, practice_render + marker)

          reactor_block = r'''  reactorGambit: {
            id:'reactorGambit', genre:'Energía', engine:'structured', label:'Synth metal · gambito del reactor',
            description:'Synth metal melódico y nocturno: riff de guitarra, sintetizador de respuesta y una subida clara hacia estribillo, breakdown y reprise final.',
            stepMs:120, stepsPerSection:64, longFormMs:360000, leadInstrument:'guitar2', counterInstrument:'synth', chordInstrument:'pad', bassInstrument:'synthbass',
            sections:[
              {
                // Arranque contenido: el reactor despierta, pero todavía no pisa al oyente con botas industriales.
                lead:{0:52,8:55,16:59,24:57,32:52,40:55,48:60,56:59},
                counter:{12:64,28:67,44:69,60:67},
                chords:{0:[40,47,52],16:[43,50,55],32:[45,52,57],48:[40,47,52]},
                bass:{0:28,4:28,8:31,12:28,16:31,20:31,24:33,28:31,32:33,36:33,40:35,44:33,48:28,52:35,56:31,60:28},
                drums:{0:'K',8:'S',16:'K',24:'S',32:'K',40:'S',48:'K',56:'S'},
              },
              {
                // Riff principal sincopado, con huecos suficientes para que el synth conteste en vez de chillar encima.
                lead:{0:52,3:52,6:55,10:59,14:57,16:52,19:55,22:60,26:59,30:55,32:50,35:52,38:55,42:59,46:57,48:52,51:55,54:62,58:60,62:59},
                counter:{7:67,15:64,23:69,31:67,39:64,47:71,55:69,63:67},
                chords:{0:[40,47,52],16:[38,45,50],32:[43,50,55],48:[40,47,52]},
                bass:{0:28,2:28,6:31,8:28,12:35,16:26,20:33,24:31,28:26,32:31,36:38,40:35,44:31,48:28,52:35,56:40,60:35},
                drums:{0:'K',4:'H',8:'S',12:'K',16:'K',20:'H',24:'S',28:'K',32:'K',36:'H',40:'S',44:'K',48:'K',52:'H',56:'S',60:'K'},
              },
              {
                // Estribillo: la melodía sube de registro y por fin abre el techo sin convertirse en una ametralladora de notas.
                lead:{0:64,4:67,8:71,12:69,16:67,20:64,24:62,28:64,32:67,36:71,40:74,44:72,48:71,52:67,56:64,60:62},
                counter:{2:76,10:74,18:79,26:76,34:81,42:79,50:76,58:74},
                chords:{0:[45,52,57],16:[43,50,55],32:[47,54,59],48:[40,47,52]},
                bass:{0:33,4:40,8:33,12:40,16:31,20:38,24:31,28:38,32:35,36:42,40:35,44:42,48:28,52:35,56:40,60:35},
                drums:{0:'K',4:'H',8:'S',10:'K',12:'H',16:'K',20:'H',24:'S',28:'K',32:'K',36:'H',40:'S',42:'K',44:'H',48:'K',52:'H',56:'S',60:'K'},
              },
              {
                // Breakdown: baja el riff, deja respirar al pad y prepara la última subida con tensión en vez de simple volumen.
                lead:{0:52,8:50,16:47,24:50,32:52,40:55,48:57,56:59},
                counter:{6:64,14:62,22:59,30:62,38:64,46:67,54:69,62:71},
                chords:{0:[40,47,52],16:[38,45,50],32:[35,42,47],48:[43,50,55]},
                bass:{0:28,8:26,16:23,24:26,32:28,40:31,48:33,56:35},
                drums:{0:'K',8:'S',16:'K',24:'S',32:'K',40:'S',48:'K',56:'S'},
              },
              {
                // Reprise final: vuelve el riff y lo cruza con la melodía del estribillo para que la pieza cierre con identidad propia.
                lead:{0:52,3:55,6:59,10:64,14:62,16:55,19:59,22:67,26:64,30:62,32:57,35:60,38:64,42:69,46:67,48:59,51:62,54:71,58:69,62:64},
                counter:{4:76,12:79,20:81,28:79,36:83,44:81,52:79,60:76},
                chords:{0:[40,47,52],16:[43,50,55],32:[45,52,57],48:[47,54,59]},
                bass:{0:28,4:35,8:31,12:35,16:31,20:38,24:35,28:38,32:33,36:40,40:36,44:40,48:35,52:42,56:40,60:35},
                drums:{0:'K',4:'H',8:'S',12:'K',16:'K',20:'H',24:'S',28:'K',32:'K',36:'H',40:'S',44:'K',48:'K',52:'H',56:'S',60:'K'},
              },
            ],
          },'''
          reactor_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in reactor_block.splitlines())
          replace_object('frontend/src/ambientCatalog.js', 'reactorGambit', reactor_block)

          ambient_profiles = r'''import { structuredFeel as legacyStructuredFeel } from './ambientProfilesLegacy.js';

          const GRANADA_THEME_IDS = new Set(['granadaPatio', 'granadaCopperRain0232']);

          const GRANADA_MELODIC_PROFILE = Object.freeze({
            family: 'granada-guitar-qanun-chamber',
            harmonyPath: Object.freeze([0, 0, 5, 3, 0, -2, 0, 0]),
            swing: 0.025,
            warmth: 1.04,
            releaseScale: 1.16,
            space: 0.22,
            delayMs: 225,
            chordHoldSteps: 20,
            bassHoldSteps: 4,
            layers: Object.freeze({ lead: true, counter: true, chords: true, bass: true, drums: false, signature: true }),
            mix: Object.freeze({ lead: 0.62, counter: 0.34, bass: 0.42, chord: 0.38 }),
            signature: Object.freeze({
              instrument: 'guitar2',
              sections: Object.freeze([0, 2]),
              everyCycles: 2,
              repeatPeriod: 96,
              durationSteps: 4.2,
              volume: 0.28,
              motif: Object.freeze({ 6: 64, 30: 68, 54: 63, 78: 61 }),
            }),
          });

          const REACTOR_GAMBIT_PROFILE = Object.freeze({
            family: 'synth-metal-reactor-melodic-drive',
            preserveSectionOrder: true,
            harmonyPath: Object.freeze([0, 0, 3, -2, 5]),
            swing: 0.015,
            warmth: 0.62,
            releaseScale: 0.92,
            space: 0.11,
            delayMs: 108,
            leadInstrument: 'guitar2',
            counterInstrument: 'synth',
            chordInstrument: 'pad',
            bassInstrument: 'synthbass',
            chordHoldSteps: 10,
            bassHoldSteps: 2,
            layers: Object.freeze({ lead: true, counter: true, chords: true, bass: true, drums: true, signature: true }),
            mix: Object.freeze({ lead: 0.72, counter: 0.46, bass: 1.02, chord: 0.36 }),
            percussion: Object.freeze({
              period: 16,
              kit: 'legacy',
              punch: 1.26,
              pattern: Object.freeze({ 0:'K', 3:'H', 4:'K', 8:'S', 10:'H', 12:'K', 14:'H' }),
            }),
            signature: Object.freeze({
              instrument: 'synth',
              sections: Object.freeze([1, 2, 4]),
              everyCycles: 2,
              repeatPeriod: 64,
              durationSteps: 3.2,
              volume: 0.24,
              motif: Object.freeze({ 7: 76, 23: 79, 39: 83, 55: 79 }),
            }),
          });

          // Facade deliberadamente pequeño: conserva las identidades legacy y
          // permite profundizar temas concretos sin volver a engordar el motor WebAudio.
          export function structuredFeel(theme) {
            const legacy = legacyStructuredFeel(theme);
            if (!legacy) return legacy;
            if (theme?.id === 'reactorGambit') return Object.freeze({ ...legacy, ...REACTOR_GAMBIT_PROFILE });
            if (!GRANADA_THEME_IDS.has(theme?.id)) return legacy;
            return Object.freeze({
              ...legacy,
              ...GRANADA_MELODIC_PROFILE,
              leadInstrument: 'nylonGuitar',
              counterInstrument: 'qanun',
              drumMode: 'none',
              percussion: Object.freeze({ period: 32, kit: 'none', punch: 0, pattern: Object.freeze({}) }),
            });
          }
          '''
          Path('frontend/src/ambientProfiles.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in ambient_profiles.splitlines()) + '\n')

          replace_once('scripts/audio_catalog_check.mjs',
              "assert(getAmbientThemeSoundProfile('reactorGambit').estimatedBpm >= 105 && getAmbientThemeSoundProfile('reactorGambit').estimatedBpm <= 115, 'Gambito del reactor debe ser medio tiempo pesado');",
              "assert(getAmbientThemeSoundProfile('reactorGambit').estimatedBpm >= 123 && getAmbientThemeSoundProfile('reactorGambit').estimatedBpm <= 127, 'Gambito del reactor debe rondar 125 BPM con empuje melódico');")

          practice_test = r'''import { describe, expect, it } from 'vitest';
          import { difficultyForRating } from './playerRating.js';
          import { difficultyForPracticeRating, PRACTICE_ADAPTIVE_RELIEF } from './practiceDifficulty.js';

          describe('practice adaptive difficulty', () => {
            it('uses the normal adaptive signal but one small step lower', () => {
              const normal = difficultyForRating(1100, [], 12);
              expect(difficultyForPracticeRating(1100, [], 12)).toBe(Math.max(0, normal - PRACTICE_ADAPTIVE_RELIEF));
              expect(PRACTICE_ADAPTIVE_RELIEF).toBe(6);
            });

            it('never underflows below the easiest CPU level', () => {
              expect(difficultyForPracticeRating(200, [], 12)).toBe(0);
            });
          });
          '''
          Path('frontend/src/practiceDifficulty.test.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in practice_test.splitlines()) + '\n')

          reactor_test = r'''import { describe, expect, it } from 'vitest';
          import { AMBIENT_THEMES } from './ambientCatalog.js';
          import { structuredFeel } from './ambientProfiles.js';

          describe('Synth metal · gambito del reactor', () => {
            it('keeps the published identity while using the new melodic composition', () => {
              const theme = AMBIENT_THEMES.reactorGambit;
              const feel = structuredFeel(theme);
              expect(theme.label).toBe('Synth metal · gambito del reactor');
              expect(theme.stepMs).toBe(120);
              expect(theme.sections).toHaveLength(5);
              expect(theme.description).toContain('melódico');
              expect(feel.family).toBe('synth-metal-reactor-melodic-drive');
              expect(feel.percussion.kit).toBe('legacy');
              expect(feel.percussion.punch).toBeLessThan(1.4);
              expect(feel.layers.signature).toBe(true);
              expect(feel.signature.instrument).toBe('synth');
            });
          });
          '''
          Path('frontend/src/reactorGambit.test.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in reactor_test.splitlines()) + '\n')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused tests and audio gate
        working-directory: frontend
        run: |
          npx vitest run src/practiceDifficulty.test.js src/reactorGambit.test.js src/ambientProfiles.test.js
          node ../scripts/audio_catalog_check.mjs
          npm run build

      - name: Commit focused changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-practice-audio-edit.yml
          git config user.name "Chess Studio patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add adaptive practice setup and recompose reactor gambit [practice-audio-applied]"
          git push origin HEAD:feat/practice-adaptive-reactor-gambit
