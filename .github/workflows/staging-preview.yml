name: Staging · preview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qué hacer con el frontend de staging'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - restore-main
      ref:
        description: 'Rama, tag o SHA a previsualizar (sólo se usa en modo preview)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: chess-studio-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Frontend staging · ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      MODE: ${{ inputs.mode }}
      SOURCE_REF: ${{ inputs.ref }}
      TARGET_REF: ${{ inputs.mode == 'restore-main' && 'main' || inputs.ref }}
      ORCHESTRATOR_REF: ${{ github.ref }}
      PAGES_PROJECT: chess-studio-staging
      STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate preview request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORCHESTRATOR_REF" == 'refs/heads/main' ]] || { echo '::error::Staging · preview sólo puede ejecutarse desde el workflow de main.'; exit 1; }
          [[ "$MODE" == 'preview' || "$MODE" == 'restore-main' ]] || { echo "::error::Modo no permitido: $MODE"; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::Falta CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::Falta CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          if [[ "$MODE" == 'preview' ]]; then
            [[ -n "${SOURCE_REF:-}" ]] || { echo '::error::Falta el ref a previsualizar'; exit 1; }
            case "$SOURCE_REF" in
              main|refs/heads/main|origin/main)
                echo '::error::main no es un preview; usa el modo restore-main.'
                exit 1
                ;;
            esac
          fi

      - name: Checkout preview orchestrator
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify preview cannot enter production chain
        run: python3 scripts/staging_preview_contract.py

      - name: Checkout target frontend source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          path: preview-source
          fetch-depth: 0

      - name: Resolve immutable target SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git -C preview-source rev-parse HEAD)"
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA resuelto inválido: $deploy_sha"; exit 1; }
          if [[ "$MODE" == 'preview' && "$deploy_sha" == "$current_main" ]]; then
            echo '::error::El ref de preview resuelve al SHA actual de main; usa restore-main.'
            exit 1
          fi
          if [[ "$MODE" == 'restore-main' && "$deploy_sha" != "$current_main" ]]; then
            echo "::error::restore-main resolvió $deploy_sha, pero main actual es $current_main"
            exit 1
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${deploy_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Verify canonical staging Pages project
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pages-project.json"
          status="$(curl --fail-with-body --silent --show-error \
            --output "$body" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")"
          [[ "$status" == 200 ]] || { cat "$body" >&2; exit 1; }
          python3 - "$body" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          production_branch = str((payload.get('result') or {}).get('production_branch') or '')
          if production_branch != 'main':
              raise SystemExit(f'Pages production_branch inesperada: {production_branch!r}; se esperaba main')
          PY

      - name: Static preflight of target source
        working-directory: preview-source
        run: make static-preflight

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-source/frontend/package-lock.json

      - name: Restore exact target frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: preview-source/frontend
          lockfile: preview-source/frontend/package-lock.json
          node-version: '22'

      - name: Restore cached Wrangler toolchain
        uses: ./.github/actions/setup-wrangler
        with:
          version: '4.127.1'
          node-version: '22'

      - name: Build target against staging API
        working-directory: preview-source/frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_PUBLIC_BASE: /
          VITE_BUILD_SHA: ${{ steps.source.outputs.deploy_sha }}
          VITE_GRAFANA_CLOUD_URL: ${{ vars.VITE_GRAFANA_CLOUD_URL }}
        run: npm run build

      - name: Deploy target to canonical staging frontend
        working-directory: preview-source/frontend
        shell: bash
        run: |
          set -euo pipefail
          wrangler pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "${{ steps.source.outputs.deploy_sha }}" \
            --commit-dirty=false

      - name: Verify canonical staging serves target SHA
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha='${{ steps.source.outputs.deploy_sha }}'
          body="$RUNNER_TEMP/staging-preview-release.json"
          ok=false
          for attempt in {1..30}; do
            status="$(curl --silent --show-error \
              --connect-timeout 5 --max-time 12 \
              --output "$body" --write-out '%{http_code}' \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "$STAGING_URL/release.json?sha=$deploy_sha" || true)"
            if [[ "$status" == 200 ]] && python3 - "$body" "$deploy_sha" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          raise SystemExit(0 if str(payload.get('build') or '').lower() == sys.argv[2].lower() else 1)
          PY
            then
              ok=true
              break
            fi
            sleep 2
          done
          [[ "$ok" == true ]] || { echo '::error::Staging no sirve el SHA solicitado'; cat "$body" 2>/dev/null || true; exit 1; }

      - name: Preview summary
        shell: bash
        run: |
          {
            echo '### Chess Studio · frontend staging actualizado'
            echo
            echo "- Modo: \`$MODE\`"
            if [[ "$MODE" == 'preview' ]]; then
              echo "- Ref solicitado: \`$SOURCE_REF\`"
            else
              echo '- Ref restaurado: `main`'
            fi
            echo "- SHA: \`${{ steps.source.outputs.deploy_sha }}\`"
            echo "- Frontend: $STAGING_URL"
            echo "- API: \`$STAGING_API_URL\` (backend canónico de staging)"
            echo
            echo '**No acreditado:** este workflow no dispara `Staging · AI Worker` ni `Production · promote`.'
          } >> "$GITHUB_STEP_SUMMARY"
