name: Build · Chess Football Godot Web

on:
  pull_request:
    paths:
      - games/chess-football-godot/**
      - scripts/art/chess_football_sprite_forge.py
      - scripts/art/sprite_forge.py
      - scripts/art/sprite_forge_contract_v2.schema.json
      - scripts/art/contracts/chess_football_players_v1.json
      - scripts/pawn_slug_godot_bundle.py
      - .github/workflows/chess-football-godot-poc.yml
  push:
    branches: [main]
    paths:
      - games/chess-football-godot/**
      - scripts/art/chess_football_sprite_forge.py
      - scripts/art/sprite_forge.py
      - scripts/art/sprite_forge_contract_v2.schema.json
      - scripts/art/contracts/chess_football_players_v1.json
      - scripts/pawn_slug_godot_bundle.py
      - .github/workflows/chess-football-godot-poc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-football-godot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
  GODOT_TEMPLATES_SHA256: 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: chess-football-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - name: Verify deterministic player art
        run: python3 -S scripts/art/chess_football_sprite_forge.py verify --assets-dir games/chess-football-godot/assets/players
      - name: Verify approved canonical run atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 -S - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("games/chess-football-godot/assets/players/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          canonical = manifest["canonical_run"]
          root = manifest_path.parent
          encoded = "".join(
              (root / part).read_text(encoding="utf-8").strip()
              for part in canonical["encoded_parts"]
          )
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = canonical["sha256"]
          if digest != expected:
              raise SystemExit(f"canonical run sha mismatch: {digest} != {expected}")
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("canonical run payload is not PNG")
          print("canonical run atlas: OK", digest)
          # The approved four-direction atlas is not generated by the vector forge.
          # Its immutable encoded copy must round-trip to the reviewable PNG.
          from struct import unpack
          directional = manifest["directional_run"]
          encoded = "".join(
              (root / part).read_text(encoding="utf-8").strip()
              for part in directional["encoded_parts"]
          )
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          if digest != directional["sha256"]:
              raise SystemExit("directional run hash mismatch")
          if payload != (root / "run_directions_v1/directional_run_v1.png").read_bytes():
              raise SystemExit("directional run export differs from approved PNG")
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("directional run payload is not PNG")
          width, height = unpack(">II", payload[16:24])
          expected_size = (directional["cell"]["width"] * directional["frames"],
                           directional["cell"]["height"] * len(directional["views"]))
          if (width, height) != expected_size:
              raise SystemExit(f"directional run dimensions: {(width, height)} != {expected_size}")
          if (width, height) != (1024, 576):
              raise SystemExit("directional run is not a 4x8 sheet")
          print("directional run atlas: OK", digest)
          PY
      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-parse.log"
          set +e
          "$godot" --headless --path games/chess-football-godot --editor --quit 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Chess Football Godot POC contains load/parse errors.'
            exit 1
          fi
      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-smoke.log"
          set +e
          timeout 20s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/match_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Chess Football runtime smoke failed.'
            exit 1
          fi
          grep -q 'chess-football godot smoke: OK' "$log"
      - name: Canonical 3D roster parity smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-roster-parity-smoke.log"
          set +e
          timeout 30s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/canonical_roster_parity_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Football 3D canonical roster parity failed.'
            exit 1
          fi
          grep -q 'chess-football canonical roster parity smoke: OK' "$log"
      - name: Mobile touch smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-mobile-touch-smoke.log"
          set +e
          timeout 20s "$godot" --headless --quit-after 180 --path games/chess-football-godot --script res://tests/mobile_controls_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Chess Football mobile touch smoke failed.'
            exit 1
          fi
          grep -q 'chess-football mobile touch smoke: OK' "$log"
      - name: Capture visual review
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-visual.log"
          # Production/runtime is fullscreen. Review capture is deliberately
          # pinned windowed at 1280x720 so Xvfb screen defaults cannot change
          # framing or make PNG evidence nondeterministic.
          timeout 60s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/visual_capture.gd | tee "$log"
          kickoff="$(sed -n 's/^VISUAL_CAPTURE_KICKOFF=//p' "$log" | tail -1)"
          kickoff_touch="$(sed -n 's/^VISUAL_CAPTURE_KICKOFF_TOUCH=//p' "$log" | tail -1)"
          directional_runs="$(sed -n 's/^VISUAL_CAPTURE_DIRECTIONAL_RUNS=//p' "$log" | tail -1)"
          directional_scale_grid="$(sed -n 's/^VISUAL_CAPTURE_DIRECTIONAL_SCALE_GRID=//p' "$log" | tail -1)"
          canonical_actions="$(sed -n 's/^VISUAL_CAPTURE_CANONICAL_ACTIONS=//p' "$log" | tail -1)"
          dribble="$(sed -n 's/^VISUAL_CAPTURE_DRIBBLE=//p' "$log" | tail -1)"
          pass_charge="$(sed -n 's/^VISUAL_CAPTURE_PASS_CHARGE=//p' "$log" | tail -1)"
          broadcast="$(sed -n 's/^VISUAL_CAPTURE_BROADCAST=//p' "$log" | tail -1)"
          airborne="$(sed -n 's/^VISUAL_CAPTURE_AIRBORNE=//p' "$log" | tail -1)"
          drive="$(sed -n 's/^VISUAL_CAPTURE_DRIVE=//p' "$log" | tail -1)"
          blast="$(sed -n 's/^VISUAL_CAPTURE_BLAST=//p' "$log" | tail -1)"
          post="$(sed -n 's/^VISUAL_CAPTURE_POST=//p' "$log" | tail -1)"
          crossbar="$(sed -n 's/^VISUAL_CAPTURE_CROSSBAR=//p' "$log" | tail -1)"
          keeper_save="$(sed -n 's/^VISUAL_CAPTURE_KEEPER_SAVE=//p' "$log" | tail -1)"
          tactical="$(sed -n 's/^VISUAL_CAPTURE_TACTICAL=//p' "$log" | tail -1)"
          contact="$(sed -n 's/^VISUAL_CAPTURE_CONTACT=//p' "$log" | tail -1)"
          slide_tackle="$(sed -n 's/^VISUAL_CAPTURE_SLIDE_TACKLE=//p' "$log" | tail -1)"
          penalty="$(sed -n 's/^VISUAL_CAPTURE_PENALTY=//p' "$log" | tail -1)"
          penalty_aim="$(sed -n 's/^VISUAL_CAPTURE_PENALTY_AIM=//p' "$log" | tail -1)"
          goal="$(sed -n 's/^VISUAL_CAPTURE_GOAL=//p' "$log" | tail -1)"
          restart="$(sed -n 's/^VISUAL_CAPTURE_RESTART=//p' "$log" | tail -1)"
          throw_in="$(sed -n 's/^VISUAL_CAPTURE_THROW_IN=//p' "$log" | tail -1)"
          corner="$(sed -n 's/^VISUAL_CAPTURE_CORNER=//p' "$log" | tail -1)"
          menu="$(sed -n 's/^VISUAL_CAPTURE_MENU=//p' "$log" | tail -1)"
          atlas_fc="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_FC_MATTHIAS=//p' "$log" | tail -1)"
          atlas_rival="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_REAL_ENROQUE=//p' "$log" | tail -1)"
          atlas_fc_v2="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_FC_MATTHIAS_V2=//p' "$log" | tail -1)"
          atlas_fc_v3="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_FC_MATTHIAS_V3=//p' "$log" | tail -1)"
          atlas_fc_v4="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_FC_MATTHIAS_V4=//p' "$log" | tail -1)"
          atlas_rival_v2="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_REAL_ENROQUE_V2=//p' "$log" | tail -1)"
          atlas_rival_v3="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_REAL_ENROQUE_V3=//p' "$log" | tail -1)"
          atlas_rival_v4="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_REAL_ENROQUE_V4=//p' "$log" | tail -1)"
          atlas_fc_keeper="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_FC_MATTHIAS_KEEPER=//p' "$log" | tail -1)"
          atlas_rival_keeper="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_REAL_ENROQUE_KEEPER=//p' "$log" | tail -1)"
          atlas_directional="$(sed -n 's/^VISUAL_CAPTURE_ATLAS_DIRECTIONAL_RUN=//p' "$log" | tail -1)"
          test -n "$kickoff" && test -s "$kickoff"
          test -n "$kickoff_touch" && test -s "$kickoff_touch"
          test -n "$directional_runs" && test -s "$directional_runs"
          test -n "$directional_scale_grid" && test -s "$directional_scale_grid"
          test -n "$canonical_actions" && test -s "$canonical_actions"
          test -n "$dribble" && test -s "$dribble"
          test -n "$pass_charge" && test -s "$pass_charge"
          test -n "$broadcast" && test -s "$broadcast"
          test -n "$airborne" && test -s "$airborne"
          test -n "$drive" && test -s "$drive"
          test -n "$blast" && test -s "$blast"
          test -n "$post" && test -s "$post"
          test -n "$crossbar" && test -s "$crossbar"
          test -n "$keeper_save" && test -s "$keeper_save"
          test -n "$tactical" && test -s "$tactical"
          test -n "$contact" && test -s "$contact"
          test -n "$slide_tackle" && test -s "$slide_tackle"
          test -n "$penalty" && test -s "$penalty"
          test -n "$penalty_aim" && test -s "$penalty_aim"
          test -n "$goal" && test -s "$goal"
          test -n "$restart" && test -s "$restart"
          test -n "$throw_in" && test -s "$throw_in"
          test -n "$corner" && test -s "$corner"
          test -n "$menu" && test -s "$menu"
          test -n "$atlas_fc" && test -s "$atlas_fc"
          test -n "$atlas_rival" && test -s "$atlas_rival"
          test -n "$atlas_fc_v2" && test -s "$atlas_fc_v2"
          test -n "$atlas_fc_v3" && test -s "$atlas_fc_v3"
          test -n "$atlas_fc_v4" && test -s "$atlas_fc_v4"
          test -n "$atlas_rival_v2" && test -s "$atlas_rival_v2"
          test -n "$atlas_rival_v3" && test -s "$atlas_rival_v3"
          test -n "$atlas_rival_v4" && test -s "$atlas_rival_v4"
          test -n "$atlas_fc_keeper" && test -s "$atlas_fc_keeper"
          test -n "$atlas_rival_keeper" && test -s "$atlas_rival_keeper"
          test -n "$atlas_directional" && test -s "$atlas_directional"
          mkdir -p "$RUNNER_TEMP/chess-football-review"
          cp "$kickoff" "$RUNNER_TEMP/chess-football-review/kickoff.png"
          cp "$kickoff_touch" "$RUNNER_TEMP/chess-football-review/kickoff-touch.png"
          cp "$directional_runs" "$RUNNER_TEMP/chess-football-review/directional-runs.png"
          cp "$directional_scale_grid" "$RUNNER_TEMP/chess-football-review/directional-scale-grid.png"
          cp "$canonical_actions" "$RUNNER_TEMP/chess-football-review/canonical-actions.png"
          cp "$dribble" "$RUNNER_TEMP/chess-football-review/dribble.png"
          cp "$pass_charge" "$RUNNER_TEMP/chess-football-review/pass-charge.png"
          cp "$broadcast" "$RUNNER_TEMP/chess-football-review/broadcast.png"
          cp "$airborne" "$RUNNER_TEMP/chess-football-review/airborne.png"
          cp "$drive" "$RUNNER_TEMP/chess-football-review/drive.png"
          cp "$blast" "$RUNNER_TEMP/chess-football-review/blast.png"
          cp "$post" "$RUNNER_TEMP/chess-football-review/post.png"
          cp "$crossbar" "$RUNNER_TEMP/chess-football-review/crossbar.png"
          cp "$keeper_save" "$RUNNER_TEMP/chess-football-review/keeper-save.png"
          cp "$tactical" "$RUNNER_TEMP/chess-football-review/tactical.png"
          cp "$contact" "$RUNNER_TEMP/chess-football-review/contact.png"
          cp "$slide_tackle" "$RUNNER_TEMP/chess-football-review/slide-tackle.png"
          cp "$penalty" "$RUNNER_TEMP/chess-football-review/penalty.png"
          cp "$penalty_aim" "$RUNNER_TEMP/chess-football-review/penalty-aim.png"
          cp "$goal" "$RUNNER_TEMP/chess-football-review/goal.png"
          cp "$restart" "$RUNNER_TEMP/chess-football-review/restart.png"
          cp "$throw_in" "$RUNNER_TEMP/chess-football-review/throw-in.png"
          cp "$corner" "$RUNNER_TEMP/chess-football-review/corner.png"
          cp "$menu" "$RUNNER_TEMP/chess-football-review/menu.png"
          cp "$atlas_fc" "$RUNNER_TEMP/chess-football-review/atlas-fc-matthias.png"
          cp "$atlas_rival" "$RUNNER_TEMP/chess-football-review/atlas-real-enroque.png"
          cp "$atlas_fc_v2" "$RUNNER_TEMP/chess-football-review/atlas-fc-matthias-v2.png"
          cp "$atlas_fc_v3" "$RUNNER_TEMP/chess-football-review/atlas-fc-matthias-v3.png"
          cp "$atlas_fc_v4" "$RUNNER_TEMP/chess-football-review/atlas-fc-matthias-v4.png"
          cp "$atlas_rival_v2" "$RUNNER_TEMP/chess-football-review/atlas-real-enroque-v2.png"
          cp "$atlas_rival_v3" "$RUNNER_TEMP/chess-football-review/atlas-real-enroque-v3.png"
          cp "$atlas_rival_v4" "$RUNNER_TEMP/chess-football-review/atlas-real-enroque-v4.png"
          cp "$atlas_fc_keeper" "$RUNNER_TEMP/chess-football-review/atlas-fc-matthias-keeper.png"
          cp "$atlas_rival_keeper" "$RUNNER_TEMP/chess-football-review/atlas-real-enroque-keeper.png"
          cp "$atlas_directional" "$RUNNER_TEMP/chess-football-review/atlas-directional-run.png"
      - name: Upload visual review
        uses: actions/upload-artifact@v7
        with:
          name: chess-football-visual-review
          path: ${{ runner.temp }}/chess-football-review/
          if-no-files-found: error
          retention-days: 7
      - name: Web export contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'platform="Web"' games/chess-football-godot/export_presets.cfg
          grep -Fq 'assets/players/run_canon/*.b64' games/chess-football-godot/export_presets.cfg
          grep -Fq 'assets/players/run_directions_v1/*.b64' games/chess-football-godot/export_presets.cfg
          grep -q 'variant/thread_support=false' games/chess-football-godot/export_presets.cfg
          grep -q 'renderer/rendering_method="gl_compatibility"' games/chess-football-godot/project.godot
          grep -q '^window/size/mode=3$' games/chess-football-godot/project.godot
          grep -q '^boot_splash/show_image=false$' games/chess-football-godot/project.godot
      - name: Bundle publisher self-test
        run: python3 -S scripts/pawn_slug_godot_bundle.py self-test


  web_runtime:
    name: Real Chromium · Godot Web boot
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache pinned Godot Web exporter
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: chess-football-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v1
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
      - name: Install pinned Godot Web templates
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          if [[ ! -f "$dir/web_nothreads_release.zip" || ! -f "$dir/web_nothreads_debug.zip" ]]; then
            archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            mkdir -p "$dir" "$unpack"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$archive"
            echo "$GODOT_TEMPLATES_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$dir/web_nothreads_debug.zip"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$dir/web_nothreads_release.zip"
          fi
      - name: Export actual Godot Web build before publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/chess-football-godot/build/web
          cd games/chess-football-godot
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --editor --quit
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html
      - name: Restore exact browser runtime from shared CI action
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'
      - name: Boot real WebAssembly in Chromium
        run: node e2e/football-godot-real-web.mjs
      - name: Upload real Web browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chess-football-real-web
          path: .artifacts/football-web/
          if-no-files-found: warn
          retention-days: 7

  build_publish:
    name: Export + publish · Chess Football Godot Web
    if: github.event_name != 'pull_request'
    needs: [validate, web_runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache pinned Godot editor and Web templates
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: chess-football-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v1
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - name: Verify deterministic player art
        run: python3 -S scripts/art/chess_football_sprite_forge.py verify --assets-dir games/chess-football-godot/assets/players
      - name: Install pinned Godot Web export templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          debug_template="$template_dir/web_nothreads_debug.zip"
          release_template="$template_dir/web_nothreads_release.zip"
          if [[ ! -f "$debug_template" || ! -f "$release_template" ]]; then
            archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            rm -rf "$unpack"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
              -o "$archive"
            echo "$GODOT_TEMPLATES_SHA256  $archive" | sha256sum -c -
            mkdir -p "$template_dir" "$unpack"
            unzip -q "$archive" templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$debug_template"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$release_template"
          fi
      - name: Export Godot Web release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf games/chess-football-godot/build/web
          mkdir -p games/chess-football-godot/build/web
          pushd games/chess-football-godot >/dev/null
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html
          popd >/dev/null
          python3 -S scripts/pawn_slug_godot_bundle.py check \
            --build-dir games/chess-football-godot/build/web \
            --prefix chess-football-godot
      - name: Publish immutable R2 release + atomic pointer
        run: |
          python3 -S scripts/pawn_slug_godot_bundle.py publish \
            --build-dir games/chess-football-godot/build/web \
            --prefix chess-football-godot
      - name: Public R2 smoke
        shell: bash
        run: |
          set -euo pipefail
          pointer='https://assets.chess-studio.shadowops.dpdns.org/chess-football-godot/current.json'
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$pointer?sha=$GITHUB_SHA&attempt=$attempt" -o "$RUNNER_TEMP/chess-football-current.json"; then
              break
            fi
            sleep 2
          done
          index_url="$(python3 -S scripts/pawn_slug_godot_bundle.py verify-pointer \
            "$RUNNER_TEMP/chess-football-current.json" \
            --prefix chess-football-godot \
            --expected-source-sha "$GITHUB_SHA")"
          curl -fsS --retry 3 "$index_url" -o "$RUNNER_TEMP/chess-football-index.html"
          test -s "$RUNNER_TEMP/chess-football-index.html"
          echo "Chess Football Godot Web published: $index_url" >> "$GITHUB_STEP_SUMMARY"
