name: Football · external staging portal
on:
  pull_request:
  push:
    branches: [main]
    paths: ['frontend/src/labFootballLink*', 'frontend/src/components/LabScreen*', 'e2e/experiments-visual-artifact.spec.js', '.github/workflows/chess-football-godot-poc.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: football-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Football · required visual gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE" ]]; then
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BASE"
          else
            BASE=HEAD^
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eqi 'football|LabScreen|labLaunchIntent|experiments-visual-artifact'; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-browser-e2e
        with: {browser-scope: chromium, build-frontend: 'true'}
      - name: Verify dedicated source, deployed release and retired inline owner
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          test ! -d games/chess-football-godot
          test ! -e frontend/src/components/ChessFootballEntry.jsx
          test ! -e frontend/src/footballManagerCareer.js
          curl -fLsS https://staging.football.shadowops.dpdns.org/release.json -o /tmp/football-release.json
          python3 - <<'PY'
          import json,os,re,urllib.request
          r=json.load(open('/tmp/football-release.json'))
          assert r['application']=='football-of-matthias' and r['environment']=='staging'
          assert re.fullmatch('[a-f0-9]{40}',r['source_sha'])
          request=urllib.request.Request('https://api.github.com/repos/evilsysadmin/football-of-matthias/commits/'+r['source_sha'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          source=json.load(urllib.request.urlopen(request,timeout=20))
          assert source['sha']==r['source_sha']
          assert r['runtime']['sourceSha']==r['source_sha']
          print('FOOTBALL_DEDICATED_RELEASE_VERIFIED source_sha='+r['source_sha'])
          PY
      - name: Capture real desktop and mobile external portal
        if: steps.scope.outputs.affected == 'true'
        working-directory: e2e
        env:
          APP_VISUAL_EXPERIMENTS_SCOPE: football
        run: ./node_modules/.bin/playwright test experiments-visual-artifact.spec.js --project=chromium --workers=1
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.affected == 'true'
        with:
          name: football-external-portal-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/app-visual/football-portal-*.png
          if-no-files-found: error
          retention-days: 7
