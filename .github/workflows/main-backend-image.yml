name: Main · backend image

on:
  workflow_run:
    workflows:
      - Main · admission
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# Backend image publication no longer extends the admission critical path.
# A cheap x86 classifier drops unequivocal non-runtime merges before any ARM,
# Buildx or GHCR work. Runtime generations keep exact-SHA image publication.
# One run is tied to one admitted SHA; immutable images may coexist safely.
concurrency:
  group: chess-studio-main-backend-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  classify:
    name: Backend · classify admitted deploy surface
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      deploy_required: ${{ steps.scope.outputs.deploy_required }}
      deploy_reason: ${{ steps.scope.outputs.deploy_reason }}
      parent_sha: ${{ steps.image_scope.outputs.parent_sha }}
      backend_tree: ${{ steps.image_scope.outputs.backend_tree }}
      pvp_tree: ${{ steps.image_scope.outputs.pvp_tree }}
      backend_needs_build: ${{ steps.image_scope.outputs.backend_needs_build }}
      pvp_needs_build: ${{ steps.image_scope.outputs.pvp_needs_build }}
    steps:
      - name: Validate admitted SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA inválido: $DEPLOY_SHA"; exit 1; }

      - name: Checkout deploy classifier
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2
          sparse-checkout: |
            scripts

      - name: Classify runtime deploy surface
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/staging_deploy_scope.py --sha "$DEPLOY_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Classify backend image inputs
        id: image_scope
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse "${DEPLOY_SHA}^" 2>/dev/null || true)"
          backend_tree="$(git rev-parse "${DEPLOY_SHA}:backend-python" 2>/dev/null || true)"
          pvp_tree="$(git rev-parse "${DEPLOY_SHA}:backend-go" 2>/dev/null || true)"
          backend_needs_build=true
          pvp_needs_build=true
          if [[ "$parent" =~ ^[0-9a-f]{40}$ ]]; then
            git diff --quiet "$parent" "$DEPLOY_SHA" -- backend-python && backend_needs_build=false || true
            git diff --quiet "$parent" "$DEPLOY_SHA" -- backend-go && pvp_needs_build=false || true
          fi
          [[ "$backend_tree" =~ ^[0-9a-f]{40}$ ]] || backend_needs_build=true
          [[ "$pvp_tree" =~ ^[0-9a-f]{40}$ ]] || pvp_needs_build=true
          echo "parent_sha=$parent" >> "$GITHUB_OUTPUT"
          echo "backend_tree=$backend_tree" >> "$GITHUB_OUTPUT"
          echo "pvp_tree=$pvp_tree" >> "$GITHUB_OUTPUT"
          echo "backend_needs_build=$backend_needs_build" >> "$GITHUB_OUTPUT"
          echo "pvp_needs_build=$pvp_needs_build" >> "$GITHUB_OUTPUT"
          echo "Backend image tree: $backend_tree · changed: $backend_needs_build"
          echo "PvP Go image tree: $pvp_tree · changed: $pvp_needs_build"

  publish:
    name: Backend · publish exact-SHA images
    needs: classify
    if: needs.classify.outputs.deploy_required == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ (needs.classify.outputs.backend_needs_build == 'true' || needs.classify.outputs.pvp_needs_build == 'true') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PARENT_SHA: ${{ needs.classify.outputs.parent_sha }}
      BACKEND_TREE: ${{ needs.classify.outputs.backend_tree }}
      PVP_TREE: ${{ needs.classify.outputs.pvp_tree }}
      BACKEND_NEEDS_BUILD: ${{ needs.classify.outputs.backend_needs_build }}
      PVP_NEEDS_BUILD: ${{ needs.classify.outputs.pvp_needs_build }}

    steps:
      - name: Validate admitted SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA inválido: $DEPLOY_SHA"; exit 1; }
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Parent SHA inválido: $PARENT_SHA"; exit 1; }
          [[ "$BACKEND_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Backend tree inválido: $BACKEND_TREE"; exit 1; }
          [[ "$PVP_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Go tree inválido: $PVP_TREE"; exit 1; }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse backend image by content tree when backend is unchanged
        id: reuse
        if: env.BACKEND_NEEDS_BUILD == 'false'
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tree_source="ghcr.io/${owner}/chess-studio-backend:tree-${BACKEND_TREE}"
          parent_source="ghcr.io/${owner}/chess-studio-backend:oci-${PARENT_SHA}"
          target="ghcr.io/${owner}/chess-studio-backend:oci-${DEPLOY_SHA}"
          source=""
          if docker buildx imagetools inspect "$tree_source" >/dev/null 2>&1; then
            source="$tree_source"
          else
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "$parent_source" >/dev/null 2>&1; then
                docker buildx imagetools create --tag "$tree_source" "$parent_source"
                source="$tree_source"
                break
              fi
              [[ "$attempt" == 6 ]] || sleep 5
            done
          fi
          if [[ -n "$source" ]]; then
            docker buildx imagetools create --tag "$target" "$source"
            echo 'hit=true' >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend image fast-path::Reused tree ${BACKEND_TREE} for ${DEPLOY_SHA}; no build required."
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=Backend image fallback::No reusable tree/parent image found; building ${DEPLOY_SHA}."
          fi

      - name: Reuse Go API image by content tree when Go edge is unchanged
        id: reuse_pvp
        if: env.PVP_NEEDS_BUILD == 'false'
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tree_source="ghcr.io/${owner}/chess-studio-backend-go:tree-${PVP_TREE}"
          parent_source="ghcr.io/${owner}/chess-studio-backend-go:oci-${PARENT_SHA}"
          legacy_target="ghcr.io/${owner}/chess-studio-pvp:oci-${DEPLOY_SHA}"
          canonical_target="ghcr.io/${owner}/chess-studio-backend-go:oci-${DEPLOY_SHA}"
          source=""
          if docker buildx imagetools inspect "$tree_source" >/dev/null 2>&1; then
            source="$tree_source"
          else
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "$parent_source" >/dev/null 2>&1; then
                docker buildx imagetools create --tag "$tree_source" "$parent_source"
                source="$tree_source"
                break
              fi
              [[ "$attempt" == 6 ]] || sleep 5
            done
          fi
          if [[ -n "$source" ]]; then
            docker buildx imagetools create --tag "$legacy_target" "$source"
            docker buildx imagetools create --tag "$canonical_target" "$source"
            echo 'hit=true' >> "$GITHUB_OUTPUT"
            echo "::notice title=Go API image fast-path::Reused tree ${PVP_TREE} for ${DEPLOY_SHA}; no build required."
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=Go API image fallback::No reusable tree/parent image found; building ${DEPLOY_SHA}."
          fi

      - name: Checkout admitted main commit when a build is required
        if: >-
          env.BACKEND_NEEDS_BUILD == 'true' ||
          env.PVP_NEEDS_BUILD == 'true' ||
          steps.reuse.outputs.hit == 'false' ||
          steps.reuse_pvp.outputs.hit == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Enable arm64 emulation for x86 fallback builds
        if: >-
          runner.arch == 'X64' &&
          (steps.reuse.outputs.hit == 'false' || steps.reuse_pvp.outputs.hit == 'false')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx only when a build is required
        if: >-
          env.BACKEND_NEEDS_BUILD == 'true' ||
          env.PVP_NEEDS_BUILD == 'true' ||
          steps.reuse.outputs.hit == 'false' ||
          steps.reuse_pvp.outputs.hit == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish immutable backend image
        if: env.BACKEND_NEEDS_BUILD == 'true' || steps.reuse.outputs.hit == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./backend-python
          file: ./backend-python/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chess-studio-backend:oci-${{ env.DEPLOY_SHA }}
            ghcr.io/${{ github.repository_owner }}/chess-studio-backend:tree-${{ env.BACKEND_TREE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=oci-backend-arm64
          cache-to: type=gha,mode=max,scope=oci-backend-arm64

      - name: Build and publish immutable Go API image
        if: env.PVP_NEEDS_BUILD == 'true' || steps.reuse_pvp.outputs.hit == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./backend-go
          file: ./backend-go/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chess-studio-backend-go:oci-${{ env.DEPLOY_SHA }}
            ghcr.io/${{ github.repository_owner }}/chess-studio-backend-go:tree-${{ env.PVP_TREE }}
            ghcr.io/${{ github.repository_owner }}/chess-studio-pvp:oci-${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=oci-pvp-go-arm64
          cache-to: type=gha,mode=max,scope=oci-pvp-go-arm64

      - name: Verify reused runtime manifests without pulling layers
        if: >-
          env.BACKEND_NEEDS_BUILD == 'false' &&
          env.PVP_NEEDS_BUILD == 'false' &&
          steps.reuse.outputs.hit == 'true' &&
          steps.reuse_pvp.outputs.hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          backend="ghcr.io/${owner}/chess-studio-backend:oci-${DEPLOY_SHA}"
          go_api="ghcr.io/${owner}/chess-studio-backend-go:oci-${DEPLOY_SHA}"
          pvp="ghcr.io/${owner}/chess-studio-pvp:oci-${DEPLOY_SHA}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          backend_digest="$(docker buildx imagetools inspect "$backend" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          go_digest="$(docker buildx imagetools inspect "$go_api" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          pvp_digest="$(docker buildx imagetools inspect "$pvp" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          [[ "$backend_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Backend manifest público inválido"; exit 1; }
          [[ "$go_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Go manifest público inválido"; exit 1; }
          [[ "$go_digest" == "$pvp_digest" ]] || { echo "::error::Canonical and legacy Go image aliases diverged"; exit 1; }
          echo "::notice title=Backend image x86 fast-path::Exact-SHA manifests verified without ARM runner or layer pulls."

      - name: Verify newly built runtime images are publicly pullable
        if: >-
          env.BACKEND_NEEDS_BUILD == 'true' ||
          env.PVP_NEEDS_BUILD == 'true' ||
          steps.reuse.outputs.hit == 'false' ||
          steps.reuse_pvp.outputs.hit == 'false'
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          backend="ghcr.io/${owner}/chess-studio-backend:oci-${DEPLOY_SHA}"
          go_api="ghcr.io/${owner}/chess-studio-backend-go:oci-${DEPLOY_SHA}"
          pvp="ghcr.io/${owner}/chess-studio-pvp:oci-${DEPLOY_SHA}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$backend" "$go_api" "$pvp" >/dev/null 2>&1 || true
          docker pull --platform linux/arm64 "$backend"
          docker pull --platform linux/arm64 "$go_api"
          docker pull --platform linux/arm64 "$pvp"
          go_api_id="$(docker image inspect --format='{{.Id}}' "$go_api")"
          pvp_id="$(docker image inspect --format='{{.Id}}' "$pvp")"
          [[ "$go_api_id" == "$pvp_id" ]] || { echo "::error::Canonical and legacy Go image aliases diverged"; exit 1; }

      - name: Re-authenticate for approved signal
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep stale admitted images immutable but unsignaled
        id: signal_gate
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No pude resolver main HEAD"; exit 1; }
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend signal superseded::$DEPLOY_SHA queda immutable, pero main ya apunta a $current_main."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Promote immutable image to approved staging signal
        if: steps.signal_gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          source="ghcr.io/${owner}/chess-studio-backend:oci-${DEPLOY_SHA}"
          signal="ghcr.io/${owner}/chess-studio-backend:oci-staging-approved"
          docker buildx imagetools create --tag "$signal" "$source"
          source_digest="$(docker buildx imagetools inspect "$source" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          signal_digest="$(docker buildx imagetools inspect "$signal" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Digest immutable inválido"; exit 1; }
          [[ "$signal_digest" == "$source_digest" ]] || { echo "::error::La señal GHCR no apunta al digest aprobado"; exit 1; }
          echo "Approved backend signal: $DEPLOY_SHA -> $signal_digest"
