name: tmp-castle-life-wave-a

on:
  push:
    branches:
      - visual/castle-life-wave-a
    paths:
      - .github/workflows/_tmp_castle_life_wave_a.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/castle-life-wave-a
          fetch-depth: 0
      - name: Apply castle life wave A
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = r'''import './HomeCastleLife.css';

const MAX_OBJECTS = 3;
const RARE_SIGHTING_THRESHOLD = 0.025;

function asNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

export function buildHomeCastleLifeModel({
  hasSavedGame = false,
  combatProgress = {},
  tournamentLevel = 1,
  tournamentProgress = 0,
  today = {},
  rivalry = {},
  rareRoll = 1,
} = {}) {
  const objects = [];
  const credits = asNumber(combatProgress?.credits);
  const combatNext = asNumber(combatProgress?.nextProgress);
  const combatRank = String(combatProgress?.rank?.label || 'Recluta');
  const streak = asNumber(today?.streak);
  const dailySolved = asNumber(today?.dailySolvedCount);
  const humanWins = asNumber(rivalry?.record?.wins);

  if (hasSavedGame) {
    objects.push({
      id: 'saved-game',
      glyph: '♜',
      label: 'Tablero en pausa',
      detail: 'Hay una partida real esperando tu regreso.',
      tone: 'parchment',
    });
  }

  if (credits > 0 || combatNext > 0 || combatRank !== 'Recluta') {
    objects.push({
      id: 'combat-map',
      glyph: '⚔',
      label: 'Mapa de campaña',
      detail: `${combatRank} · ${credits} créditos operativos`,
      tone: 'ember',
    });
  }

  if (streak > 0 || dailySolved > 0) {
    objects.push({
      id: 'daily-seal',
      glyph: '✦',
      label: 'Sello del día',
      detail: dailySolved > 0 ? `${dailySolved}/3 desafíos resueltos · racha ${streak}` : `Racha activa · ${streak}`,
      tone: 'brass',
    });
  }

  if (asNumber(tournamentLevel) > 1 || asNumber(tournamentProgress) > 0) {
    objects.push({
      id: 'tournament-cup',
      glyph: '♛',
      label: 'Copa de torneo',
      detail: `Nivel ${asNumber(tournamentLevel)} · ${asNumber(tournamentProgress)} XP en curso`,
      tone: 'brass',
    });
  }

  if (humanWins > 0) {
    objects.push({
      id: 'rivalry-plaque',
      glyph: '♟',
      label: 'Placa de rivalidad',
      detail: `${humanWins} ${humanWins === 1 ? 'victoria' : 'victorias'} demostradas sobre Matthias`,
      tone: 'steel',
    });
  }

  if (objects.length === 0) {
    objects.push({
      id: 'quiet-desk',
      glyph: '·',
      label: 'Mesa despejada',
      detail: 'Nada urgente. El tablero sigue siendo el centro de la sala.',
      tone: 'quiet',
    });
  }

  const roll = Number(rareRoll);
  const rareSighting = Number.isFinite(roll) && roll >= 0 && roll < RARE_SIGHTING_THRESHOLD
    ? {
        id: 'armour-glance',
        label: 'Una armadura acaba de girar unos grados hacia el tablero. Probablemente nada.',
      }
    : null;

  return {
    objects: objects.slice(0, MAX_OBJECTS),
    rareSighting,
  };
}

export default function HomeCastleLife(props) {
  const model = buildHomeCastleLifeModel(props);
  return (
    <section
      className={`home-castle-life${model.rareSighting ? ' has-rare-sighting' : ''}`}
      aria-label="La estancia de Chess Studio"
      data-castle-life="real-state-v1"
    >
      <div className="home-castle-life__heading">
        <div>
          <span className="section-label">LA ESTANCIA</span>
          <strong>El castillo recuerda lo que de verdad ocurrió.</strong>
        </div>
        <small>Máximo tres señales. Cero inventario decorativo.</small>
      </div>
      <div className="home-castle-life__shelf">
        {model.objects.map((object) => (
          <article className={`home-castle-object tone-${object.tone}`} data-castle-object={object.id} key={object.id}>
            <span className="home-castle-object__glyph" aria-hidden="true">{object.glyph}</span>
            <span className="home-castle-object__copy">
              <strong>{object.label}</strong>
              <small>{object.detail}</small>
            </span>
          </article>
        ))}
      </div>
      {model.rareSighting && (
        <p className="home-castle-life__rare" data-rare-sighting={model.rareSighting.id}>
          <span aria-hidden="true">♜</span>{model.rareSighting.label}
        </p>
      )}
    </section>
  );
}
'''

          css = r'''/* Home · living castle wave A
 * A diegetic shelf driven only by already-known real state. */
.home-castle-life {
  position: relative;
  display: grid;
  gap: .62rem;
  margin: .15rem 0 .35rem;
  padding: .75rem .9rem .82rem;
  border-top: 1px solid color-mix(in srgb, var(--brass) 26%, rgba(255,255,255,.05));
  border-bottom: 1px solid rgba(255,255,255,.055);
  background:
    linear-gradient(90deg, rgba(74,46,28,.13), transparent 20%, transparent 80%, rgba(74,46,28,.08)),
    linear-gradient(180deg, rgba(255,255,255,.012), rgba(7,9,12,.18));
  box-shadow: inset 0 -10px 22px rgba(0,0,0,.12);
}

.home-castle-life::after {
  content: '';
  position: absolute;
  left: .8rem;
  right: .8rem;
  bottom: .45rem;
  height: 3px;
  pointer-events: none;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(113,75,45,.5) 8%, rgba(169,119,72,.25) 50%, rgba(113,75,45,.5) 92%, transparent);
  box-shadow: 0 4px 9px rgba(0,0,0,.3);
}

.home-castle-life__heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
}

.home-castle-life__heading > div {
  display: grid;
  gap: .16rem;
}

.home-castle-life__heading strong {
  color: color-mix(in srgb, var(--parchment) 94%, white 6%);
  font-size: .9rem;
  line-height: 1.3;
}

.home-castle-life__heading > small {
  max-width: 27rem;
  color: var(--home-text-dim, var(--parchment-dim));
  font-size: .68rem;
  text-align: right;
}

.home-castle-life__shelf {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .6rem;
  padding-bottom: .35rem;
}

.home-castle-object {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: .62rem;
  padding: .48rem .56rem;
  border-left: 2px solid rgba(255,255,255,.07);
  background: linear-gradient(90deg, rgba(255,255,255,.018), transparent 82%);
}

.home-castle-object.tone-brass { border-left-color: color-mix(in srgb, var(--brass) 68%, transparent); }
.home-castle-object.tone-ember { border-left-color: rgba(166,76,46,.7); }
.home-castle-object.tone-steel { border-left-color: rgba(126,139,150,.58); }
.home-castle-object.tone-parchment { border-left-color: rgba(205,187,145,.5); }

.home-castle-object__glyph {
  flex: 0 0 auto;
  width: 2rem;
  height: 2rem;
  display: grid;
  place-items: center;
  border: 1px solid color-mix(in srgb, var(--brass) 18%, rgba(255,255,255,.05));
  border-radius: 50%;
  color: color-mix(in srgb, var(--brass) 78%, var(--parchment));
  background: radial-gradient(circle at 45% 35%, rgba(255,255,255,.055), rgba(8,10,13,.88));
  box-shadow: inset 0 1px rgba(255,255,255,.04), 0 5px 14px rgba(0,0,0,.22);
  font-size: 1rem;
}

.home-castle-object__copy {
  min-width: 0;
  display: grid;
  gap: .12rem;
}

.home-castle-object__copy strong {
  color: var(--parchment);
  font-size: .76rem;
  line-height: 1.25;
}

.home-castle-object__copy small {
  overflow: hidden;
  color: var(--home-text-dim, var(--parchment-dim));
  font-size: .65rem;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-castle-life__rare {
  display: flex;
  align-items: center;
  gap: .42rem;
  margin: -.05rem 0 .05rem;
  color: color-mix(in srgb, var(--parchment-dim) 86%, var(--brass));
  font-size: .62rem;
  font-style: italic;
  opacity: .84;
}

.home-castle-life__rare span {
  display: inline-block;
  transform-origin: 50% 80%;
}

@media (prefers-reduced-motion: no-preference) {
  .home-castle-life.has-rare-sighting .home-castle-life__rare span {
    animation: castle-armour-glance 1.8s ease-in-out 1 both;
  }
}

@keyframes castle-armour-glance {
  0%, 18% { transform: rotate(0deg); }
  55% { transform: rotate(-7deg); }
  100% { transform: rotate(-3deg); }
}

@media (max-width: 760px) {
  .home-castle-life { padding-inline: .7rem; }
  .home-castle-life__heading { align-items: start; }
  .home-castle-life__heading > small { max-width: 12rem; }
  .home-castle-life__shelf { grid-template-columns: 1fr; gap: .22rem; }
  .home-castle-object { padding-block: .38rem; }
  .home-castle-object__copy small { white-space: normal; }
}

@media (max-width: 430px) {
  .home-castle-life__heading { display: grid; gap: .18rem; }
  .home-castle-life__heading > small { max-width: none; text-align: left; }
  .home-castle-object__copy strong { font-size: .75rem; }
  .home-castle-object__copy small { font-size: .64rem; }
}

@media (prefers-reduced-motion: reduce) {
  .home-castle-life__rare span { animation: none !important; transform: none !important; }
}

html[data-reduced-motion='true'] .home-castle-life__rare span {
  animation: none !important;
  transform: none !important;
}
'''

          test = r'''import { describe, expect, it } from 'vitest';
import { buildHomeCastleLifeModel } from './HomeCastleLife.jsx';

describe('HomeCastleLife', () => {
  it('no inventa logros cuando no existe evidencia', () => {
    const model = buildHomeCastleLifeModel({ rareRoll: 1 });
    expect(model.objects).toEqual([expect.objectContaining({ id: 'quiet-desk' })]);
    expect(model.rareSighting).toBeNull();
  });

  it('prioriza como máximo tres objetos derivados de estado real', () => {
    const model = buildHomeCastleLifeModel({
      hasSavedGame: true,
      combatProgress: { credits: 19, nextProgress: .4, rank: { label: 'Sargento' } },
      today: { streak: 4, dailySolvedCount: 2 },
      tournamentLevel: 3,
      tournamentProgress: 11,
      rivalry: { record: { wins: 7 } },
      rareRoll: 1,
    });
    expect(model.objects.map((entry) => entry.id)).toEqual(['saved-game', 'combat-map', 'daily-seal']);
    expect(model.objects[1].detail).toContain('19 créditos');
    expect(model.objects[2].detail).toContain('2/3');
  });

  it('la rare sighting es ambiental y no se mezcla con los objetos de progreso', () => {
    const model = buildHomeCastleLifeModel({ rivalry: { record: { wins: 2 } }, rareRoll: .01 });
    expect(model.objects).toEqual([expect.objectContaining({ id: 'rivalry-plaque' })]);
    expect(model.rareSighting).toEqual(expect.objectContaining({ id: 'armour-glance' }));
  });
});
'''

          Path('frontend/src/components/HomeCastleLife.jsx').write_text(component, encoding='utf-8')
          Path('frontend/src/components/HomeCastleLife.css').write_text(css, encoding='utf-8')
