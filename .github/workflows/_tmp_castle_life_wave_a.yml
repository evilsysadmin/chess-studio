          assert import_needle in menu
          menu = menu.replace(import_needle, import_needle + "import HomeCastleLife from './HomeCastleLife.jsx';\n", 1)

          ref_needle = "  const matthiasRollRef = useRef(Math.random());\n"
          assert ref_needle in menu
          menu = menu.replace(ref_needle, ref_needle + "  const castleLifeRollRef = useRef(Math.random());\n", 1)

          render_needle = "      {!showHomeGuide && !matthiasCornerBlocked && (\n        <MatthiasHomeVisit\n"
          assert render_needle in menu
          castle_render = "      <HomeCastleLife\n        hasSavedGame={hasSavedGame}\n        combatProgress={combatProgress}\n        tournamentLevel={tournamentLevel}\n        tournamentProgress={tournamentProgress}\n        today={today}\n        rivalry={rivalry}\n        rareRoll={castleLifeRollRef.current}\n      />\n\n"
          menu = menu.replace(render_needle, castle_render + render_needle, 1)
