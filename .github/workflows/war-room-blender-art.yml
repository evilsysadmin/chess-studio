name: War Room · Blender premium art

# Legacy v2 remains a selectable saved room, but must not consume PR/main
# renderer capacity on changes to the shared v3/v4 foundation. Rebuild v2
# explicitly when restoring/inspecting it. Runtime aliases require main.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publish v2 to staging (review) or runtime (explicit restoration)'
        type: choice
        options: [staging, runtime]
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: war-room-v2-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render premium War Room
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build editable scene + runtime shell + hero preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_EEVEE_PREMIUM: '1'
          BLENDER_PREVIEW_SAMPLES: '64'
        run: |
          set -euo pipefail
          mkdir -p /tmp/war-room-premium
          blender --background --python-exit-code 1 \
            --python scripts/blender/configure_eevee_premium.py \
            --python scripts/blender/build_war_room_premium.py -- \
            --blend /tmp/war-room-premium/war-room-premium.blend \
            --glb /tmp/war-room-premium/war-room-premium-shell.glb \
            --preview /tmp/war-room-premium/war-room-premium-preview.png \
            --manifest /tmp/war-room-premium/war-room-premium-manifest.json

      - name: Validate generated artifact envelope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct
          from PIL import Image

          root = Path('/tmp/war-room-premium')
          blend = root / 'war-room-premium.blend'
          glb = root / 'war-room-premium-shell.glb'
          preview = root / 'war-room-premium-preview.png'
          manifest = root / 'war-room-premium-manifest.json'
          assert blend.stat().st_size > 150_000, blend.stat().st_size
          assert glb.stat().st_size > 30_000, glb.stat().st_size

          raw = glb.read_bytes()
          assert raw[:4] == b'glTF'
          chunk_length, chunk_type = struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A
          gltf = json.loads(raw[20:20 + chunk_length].decode('utf-8').rstrip('\x00 \t\r\n'))
          extension = 'EXT_meshopt_compression'
          assert extension in gltf.get('extensionsUsed', []), gltf.get('extensionsUsed', [])
          compressed_views = sum(
              1 for row in gltf.get('bufferViews', [])
              if extension in row.get('extensions', {})
          )
          assert compressed_views >= 12, compressed_views
          runtime_meshes = len(gltf.get('meshes', []))
          assert 50 <= runtime_meshes <= 150, runtime_meshes
          print(
              f'War Room runtime GLB: {glb.stat().st_size / 1024:.1f} KiB · '
              f'Meshopt buffer views: {compressed_views} · '
              f'runtime meshes: {runtime_meshes}'
          )

          image = Image.open(preview).convert('RGB')
          assert image.size == (1600, 900), image.size
          assert max(channel[1] for channel in image.getextrema()) > 80
          data = json.loads(manifest.read_text())
          assert data['contract'] == 'war-room-premium-v1'
          assert data['board_anchor']['name'] == 'WR_ANCHOR_board_origin'
          assert len(data['objects']) >= 195, len(data['objects'])
          PY

      - name: Refuse runtime publication outside main
        if: inputs.channel == 'runtime'
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Legacy v2 runtime restoration requires main; use staging for review.'
            exit 1
          fi

      - name: Publish War Room v2 shell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 -S scripts/blender/publish_war_room_v2_staging.py \
            /tmp/war-room-premium/war-room-premium-shell.glb \
            --revision '${{ github.sha }}' \
            --channel '${{ inputs.channel }}'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: war-room-v2-manual-${{ github.run_number }}
          path: /tmp/war-room-premium/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
