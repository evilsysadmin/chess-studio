name: tmp-wire-honours-wave-b

on:
  push:
    branches:
      - visual/combat-honours-memorial-wave-b
    paths:
      - .github/workflows/_tmp_wire_honours_wave_b.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/combat-honours-memorial-wave-b
          fetch-depth: 0
      - name: Replace legacy memorial presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/ArmyScreen.jsx')
          text = path.read_text(encoding='utf-8')

          import_needle = "import MechanicTutorialHelp from './MechanicTutorialHelp.jsx';\n"
          assert import_needle in text
          text = text.replace(import_needle, import_needle + "import CombatHonoursRoom from './CombatHonoursRoom.jsx';\n", 1)

          start = text.index('function formatMemorialDate(value) {')
          end = text.index('function UnitRosterCard(', start)
          text = text[:start] + text[end:]

          old = '{showMemorial && <Memorial roster={roster} />}'
          assert old in text
          text = text.replace(old, '{showMemorial && <CombatHonoursRoom roster={roster} onOpenUnit={setSelectedKey} />}', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/_tmp_wire_honours_wave_b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ArmyScreen.jsx .github/workflows/_tmp_wire_honours_wave_b.yml
          git commit -m "Replace the flat Memorial with the Combat honours room"
          git push origin HEAD:visual/combat-honours-memorial-wave-b
