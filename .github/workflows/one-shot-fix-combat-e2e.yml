name: One-shot · recover Combat E2E sync fix

on:
  push:
    branches:
      - ci/simplify-native-auto-merge
    paths:
      - .github/workflows/one-shot-fix-combat-e2e.yml

permissions:
  contents: write

jobs:
  patch-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/simplify-native-auto-merge

      - name: Apply exact lost E2E synchronization fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/smoke.spec.js')
          text = path.read_text(encoding='utf-8')
          old = """  await buttonWithVisibleText(page, 'Combat Chess · Campaña').click();
            await expect(page.getByRole('complementary', { name: 'Registro de batalla y estado táctico' })).toBeVisible();"""
          new = """  // SPA transition: the click completes before an unrelated scheduled navigation.
            // Do not let Playwright's implicit navigation wait turn a successful re-entry into a false failure.
            await buttonWithVisibleText(page, 'Combat Chess · Campaña').click({ noWaitAfter: true });
            await expect(page.getByRole('complementary', { name: 'Registro de batalla y estado táctico' })).toBeVisible({ timeout: 20000 });"""
          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f'Expected exactly one Combat re-entry snippet, found {matches}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Retire one-shot workflow and commit only the surgical fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fix-combat-e2e.yml
          git diff --check
          git diff -- e2e/smoke.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/smoke.spec.js .github/workflows/one-shot-fix-combat-e2e.yml
          git commit -m 'E2E: recover Combat SPA re-entry synchronization fix'
          git push origin HEAD:ci/simplify-native-auto-merge
