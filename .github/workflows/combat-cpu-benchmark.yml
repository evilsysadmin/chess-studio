name: Combat CPU · structural benchmark
on:
  pull_request:
    paths:
      - 'frontend/bench/combatCpuBenchmark.mjs'
      - 'frontend/src/combatCpuBenchmark.test.js'
      - '.github/workflows/combat-cpu-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Structural A/B on fixed Actions runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Run reproducible Combat fallback structural A/B
        run: |
          node frontend/bench/combatCpuBenchmark.mjs --iterations 25 | tee combat-cpu-benchmark.json
      - name: Save raw benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: combat-cpu-benchmark-${{ github.sha }}
          path: combat-cpu-benchmark.json
          retention-days: 14
