name: Operations · staging capacity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production_capacity_probe.py'
      - 'scripts/capacity_telemetry_snapshot.py'
      - 'docs/operations/runtime-performance.md'
      - '.github/workflows/capacity-staging.yml'
  push:
    branches:
      - 'ops/capacity-*'
    paths:
      - 'scripts/production_capacity_probe.py'
      - 'scripts/capacity_telemetry_snapshot.py'
      - 'docs/operations/runtime-performance.md'
      - '.github/workflows/capacity-staging.yml'

permissions:
  contents: read

concurrency:
  group: chess-studio-staging-capacity
  cancel-in-progress: false

jobs:
  capacity:
    name: A1 + Mongo service curve
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'ops/capacity-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      CHESS_CAPACITY_BASE_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      GRAFANA_METRICS_DATASOURCE_UID: ${{ vars.GRAFANA_METRICS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-prom' }}

    steps:
      - uses: actions/checkout@v7

      - name: Static capacity contracts
        run: |
          python3 -S scripts/production_capacity_probe.py --self-test
          python3 -S scripts/capacity_telemetry_snapshot.py --self-test

      - name: Restore OCI SDK
        uses: ./.github/actions/setup-oci-sdk

      - name: Load staging invite from private OCI runtime
        run: python3 scripts/staging_smoke_env.py secrets --keys INVITE_CODE=CHESS_CAPACITY_INVITE_CODE

      - name: Wait for exact staging backend generation
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot current main when the measurement starts. A PR base SHA can
          # become permanently unreachable in staging after main advances.
          target_sha="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unable to resolve capacity target SHA"; exit 1; }
          echo "CAPACITY_TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if python3 scripts/staging_release_identity.py               --kind backend               --url https://api-staging.chess-studio.shadowops.dpdns.org/api/release               --sha "$target_sha"; then
              exit 0
            fi
            echo "::notice::staging has not converged to $target_sha yet (attempt $attempt/40)"
            sleep 15
          done
          echo "::error::staging did not converge to $target_sha before capacity test"
          exit 1

      - name: Baseline telemetry
        run: python3 scripts/capacity_telemetry_snapshot.py --label baseline | tee capacity-baseline.telemetry.jsonl

      - name: Engine curve · A1 executor
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/production_capacity_probe.py             --scenario engine             --ephemeral             --concurrency 1,2,4,8,16             --samples-per-level 8             --timeout 20             | tee capacity-engine.jsonl
          code=${PIPESTATUS[0]}
          set -e
          (( code <= 1 )) || exit "$code"
          sleep 15
          python3 scripts/capacity_telemetry_snapshot.py --label engine | tee capacity-engine.telemetry.jsonl

      - name: Cool down
        run: sleep 20

      - name: Real game-turn curve · difficulty 50
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/production_capacity_probe.py             --scenario game-turn             --game-difficulty 50             --ephemeral             --concurrency 1,2,4,8             --samples-per-level 8             --timeout 25             | tee capacity-game-turn.jsonl
          code=${PIPESTATUS[0]}
          set -e
          (( code <= 1 )) || exit "$code"
          sleep 15
          python3 scripts/capacity_telemetry_snapshot.py --label game-turn | tee capacity-game-turn.telemetry.jsonl

      - name: Cool down
        run: sleep 20

      - name: Mongo read curve
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/production_capacity_probe.py             --scenario mongo-read             --ephemeral             --concurrency 1,2,4,8,16             --samples-per-level 8             --timeout 12             | tee capacity-mongo-read.jsonl
          code=${PIPESTATUS[0]}
          set -e
          (( code <= 1 )) || exit "$code"
          sleep 15
          python3 scripts/capacity_telemetry_snapshot.py --label mongo-read | tee capacity-mongo-read.telemetry.jsonl

      - name: Cool down
        run: sleep 20

      - name: Mongo write curve
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/production_capacity_probe.py             --scenario mongo-write             --ephemeral             --concurrency 1,2,4,8             --samples-per-level 8             --timeout 12             | tee capacity-mongo-write.jsonl
          code=${PIPESTATUS[0]}
          set -e
          (( code <= 1 )) || exit "$code"
          sleep 15
          python3 scripts/capacity_telemetry_snapshot.py --label mongo-write | tee capacity-mongo-write.telemetry.jsonl

      - name: Cool down
        run: sleep 20

      - name: Mixed service curve
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/production_capacity_probe.py             --scenario mixed             --ephemeral             --concurrency 1,2,4,8             --samples-per-level 10             --timeout 20             | tee capacity-mixed.jsonl
          code=${PIPESTATUS[0]}
          set -e
          (( code <= 1 )) || exit "$code"
          sleep 15
          python3 scripts/capacity_telemetry_snapshot.py --label mixed | tee capacity-mixed.telemetry.jsonl

      - name: Build capacity summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import pathlib

          rows = []
          cleanup_failed = False
          missing = []
          for path in sorted(glob.glob("capacity-*.jsonl")):
              if ".telemetry." in path:
                  continue
              summary = None
              for raw in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if "capacity_summary" in payload:
                      summary = payload["capacity_summary"]
              if not summary:
                  missing.append(path)
                  continue
              cleanup_failed = cleanup_failed or summary.get("ephemeral_cleanup_ok") is False
              levels = summary.get("levels") or []
              last = levels[-1] if levels else {}
              rows.append({
                  "scenario": summary.get("scenario"),
                  "game_difficulty": summary.get("game_difficulty") if summary.get("scenario") == "game-turn" else None,
                  "max_concurrency": last.get("concurrency"),
                  "p95_ms": (last.get("latency_ms") or {}).get("p95"),
                  "ops_rps": last.get("throughput_ops_rps"),
                  "errors": last.get("errors"),
              })

          telemetry = {}
          for path in sorted(glob.glob("capacity-*.telemetry.jsonl")):
              for raw in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  snap = payload.get("capacity_telemetry")
                  if snap:
                      telemetry[snap["label"]] = snap

          summary_path = pathlib.Path("capacity-summary.json")
          summary_path.write_text(json.dumps({"curves": rows, "telemetry": telemetry}, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("### Staging capacity · A1 + Mongo\n\n")
              handle.write("| escenario | dificultad | concurrencia máx | p95 ms | ops/s | errores | CPU host % | RAM host % |\n")
              handle.write("| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n")
              for row in rows:
                  snap = telemetry.get(row["scenario"], {})
                  handle.write(
                      f"| {row['scenario']} | {row.get('game_difficulty') or ''} | {row['max_concurrency']} | "
                      f"{row['p95_ms']} | {row['ops_rps']} | {row['errors']} | "
                      f"{snap.get('host_cpu_percent')} | {snap.get('host_ram_percent')} |\n"
                  )
              handle.write("\nLos errores/429/timeouts a carga alta son datos de capacidad; un fallo de harness o cleanup sí invalida la ejecución.\n")

          if missing:
              raise SystemExit("missing capacity summaries: " + ", ".join(missing))
          if cleanup_failed:
              raise SystemExit("one or more ephemeral capacity identities failed cleanup")
          PY

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-capacity-${{ github.sha }}
          path: |
            capacity-*.jsonl
            capacity-summary.json
          if-no-files-found: error
          retention-days: 14
