name: Calibration · CPU strength empirical

on:
  push:
    branches:
      - calibration/cpu-strength-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install calibration dependencies
        run: |
          python -m pip install --disable-pip-version-check python-chess
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          if [ -x /usr/games/stockfish ]; then
            echo "STOCKFISH=/usr/games/stockfish" >> "$GITHUB_ENV"
          else
            echo "STOCKFISH=$(command -v stockfish)" >> "$GITHUB_ENV"
          fi

      - name: Benchmark representative CPU levels
        run: |
          mkdir -p calibration-results
          python scripts/cpu_strength_calibration.py             --engine "$STOCKFISH" --levels 45 --reference-elos 1320             --games 2 --move-time 0.03 --max-plies 200 --seed 9123             --output calibration-results/level-45-vs-1320.json
          python scripts/cpu_strength_calibration.py             --engine "$STOCKFISH" --levels 70 --reference-elos 1320             --games 2 --move-time 0.03 --max-plies 200 --seed 9123             --output calibration-results/level-70-vs-1320.json
          python scripts/cpu_strength_calibration.py             --engine "$STOCKFISH" --levels 90 --reference-elos 1500             --games 2 --move-time 0.03 --max-plies 200 --seed 9123             --output calibration-results/level-90-vs-1500.json
          python scripts/cpu_strength_calibration.py             --engine "$STOCKFISH" --levels 100 --reference-elos 1700             --games 2 --move-time 0.03 --max-plies 200 --seed 9123             --output calibration-results/level-100-vs-1700.json

      - name: Print calibration results
        if: always()
        run: |
          for file in calibration-results/*.json; do
            echo "===== $file ====="
            cat "$file"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-strength-calibration
          path: calibration-results/*.json
          if-no-files-found: warn
