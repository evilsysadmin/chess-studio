name: OCI staging · auto apply

on:
  push:
    branches: [main]
    paths:
      - 'infra/oci/staging/**'
      - 'infra/oci/bootstrap/**'
      - 'infra/oci/Makefile'
      - 'scripts/oci_auth_contract.py'
      - 'scripts/oci_bootstrap_recover.py'
      - 'scripts/oci_bootstrap_state.py'
      - 'scripts/oci_reserved_egress.py'
      - 'scripts/oci_staging_lifecycle.sh'
      - '.github/workflows/oci-staging-deploy.yml'

permissions:
  contents: read

concurrency:
  group: oci-staging-mutations
  cancel-in-progress: false

jobs:
  apply:
    name: OCI staging · apply main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      OCI_TFSTATE_BUCKET: ${{ vars.OCI_TFSTATE_BUCKET || 'chess-studio-tfstate' }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_IMAGE_OCID: ${{ vars.OCI_IMAGE_OCID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate OCI credential contract
        run: make -C infra/oci auth
      - name: Validate reserved egress reconciler
        run: python3 -S scripts/oci_reserved_egress.py --self-test
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Restore cached OCI SDK toolchain
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'
      - name: Apply OCI staging desired state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin main
            git checkout --detach FETCH_HEAD
            current_sha="$(git rev-parse HEAD)"
            log="${RUNNER_TEMP}/oci-staging-apply-${attempt}.log"

            set +e
            GITHUB_SHA="$current_sha" make -C infra/oci apply 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e

            if [[ "$rc" -eq 0 ]]; then
              exit 0
            fi
            if grep -Fq 'OCI staging lifecycle: FAIL · stale SHA:' "$log" && [[ "$attempt" -lt 3 ]]; then
              echo "main advanced during OCI plan; retrying from latest main"
              continue
            fi
            exit "$rc"
          done
      - name: Wait for OCI Run Command before egress cutover
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            log="${RUNNER_TEMP}/oci-agent-egress-${attempt}.log"
            set +e
            python3 scripts/oci_run_command.py diagnose >"$log" 2>&1
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              cat "$log"
              exit 0
            fi
            if grep -Fq 'Plugin Compute Instance Run Command not present for instance' "$log" && [[ "$attempt" -lt 60 ]]; then
              echo "OCI Run Command plugin not registered yet (attempt ${attempt}/60); retrying in 5s"
              sleep 5
              continue
            fi
            cat "$log"
            exit "$rc"
          done
      - name: Attach and verify existing reserved staging egress
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/oci_reserved_egress.py
