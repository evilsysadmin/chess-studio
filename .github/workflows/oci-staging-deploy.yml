name: OCI staging · infrastructure apply

on:
  workflow_dispatch:

permissions:
  contents: read

# Infrastructure mutation is intentionally manual. Normal staging releases are
# owned by staging-deploy.yml and must not race a Terraform apply/host recycle.
concurrency:
  group: oci-staging-mutations
  cancel-in-progress: false

jobs:
  apply:
    name: OCI staging · apply infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      OCI_TFSTATE_BUCKET: ${{ vars.OCI_TFSTATE_BUCKET || 'chess-studio-tfstate' }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate OCI credential contract
        run: make -C infra/oci auth

      - name: Validate reserved egress reconciler
        run: python3 -S scripts/oci_reserved_egress.py --self-test

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Restore cached OCI SDK toolchain
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'

      - name: Apply exact main infrastructure state
        run: make -C infra/oci apply

      # A newly-created/replaced A1 can take a few minutes to register the
      # Compute Instance Run Command plugin. This belongs to infrastructure
      # convergence, not to every application release.
      - name: Wait for OCI Run Command registration after infrastructure change
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            log="${RUNNER_TEMP}/oci-agent-registration-${attempt}.log"
            set +e
            python3 scripts/oci_run_command.py diagnose >"$log" 2>&1
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              cat "$log"
              exit 0
            fi
            if grep -Fq 'Plugin Compute Instance Run Command not present for instance' "$log" && [[ "$attempt" -lt 60 ]]; then
              echo "OCI Run Command plugin not registered yet (attempt ${attempt}/60); retrying in 5s"
              sleep 5
              continue
            fi
            cat "$log"
            exit "$rc"
          done

      - name: Attach and verify existing reserved staging egress
        run: python3 scripts/oci_reserved_egress.py
