name: Pawn Slug · pistol crouch candidate

on:
  pull_request:
    paths:
      - scripts/art/repair_matthias_pistol_crouch.py
      - .github/workflows/pawn-slug-pistol-crouch-candidate.yml
  push:
    branches: [main]
    paths:
      - scripts/art/repair_matthias_pistol_crouch.py
      - .github/workflows/pawn-slug-pistol-crouch-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-pistol-crouch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidate · Matthias pistol crouch continuity v1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OUT: /tmp/pawn-slug-pistol-crouch-continuity-v1
      PISTOL_URL: https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v21/pistol/v21-24640d861efc3087.png
      PISTOL_SHA256: 24640d861efc30873c2b858f14a61dfc1ac0879dfc87a1c3dcf8af4092b78db3

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Self-test pistol crouch repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/art/repair_matthias_pistol_crouch.py
          python3 scripts/art/repair_matthias_pistol_crouch.py --self-test

      - name: Build deterministic pistol crouch candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          curl -fL --retry 3 "$PISTOL_URL" -o "$OUT/pistol-current.png"
          echo "$PISTOL_SHA256  $OUT/pistol-current.png" | sha256sum -c -
          python3 scripts/art/repair_matthias_pistol_crouch.py \
            --source "$OUT/pistol-current.png" \
            --output "$OUT/pistol-crouch-continuity-v1.png" \
            --report "$OUT/repair-health.json" \
            --preview "$OUT/review.png"
          sha256sum "$OUT/pistol-crouch-continuity-v1.png" | tee "$OUT/sha256.txt"

      - name: Upload pistol crouch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-pistol-crouch-continuity-v1-${{ github.sha }}
          path: /tmp/pawn-slug-pistol-crouch-continuity-v1/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish pistol crouch continuity v1 to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/r2_asset_publish.py publish \
            "$OUT/pistol-crouch-continuity-v1.png" \
            --logical-id pawnSlug.godot.matthias.pistol.crouchContinuityV1 \
            --prefix pawn-slug-godot/matthias/crouch-continuity-v1/pistol/full \
            --manifest "$OUT/r2-manifest.json"
          cat "$OUT/r2-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published pistol crouch continuity v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          readarray -t asset < <(python3 - "$OUT/r2-manifest.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          item = data["assets"]["pawnSlug.godot.matthias.pistol.crouchContinuityV1"]
          print(item["url"])
          print(item["sha256"])
          PY
          )
          curl --fail --silent --show-error --location --max-time 20 "${asset[0]}" -o "$OUT/published.png"
          actual="$(sha256sum "$OUT/published.png" | awk '{print $1}')"
          test "$actual" = "${asset[1]}"
          echo "Published pistol crouch continuity v1 verified: ${asset[0]}"
