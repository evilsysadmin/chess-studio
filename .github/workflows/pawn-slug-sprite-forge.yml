name: Pawn Slug · Sprite Forge

on:
  pull_request:
    paths:
      - 'scripts/art/sprite_forge.py'
      - 'scripts/art/test_sprite_forge.py'
      - '.github/workflows/pawn-slug-sprite-forge.yml'
      - 'docs/pawnslug-sprites.md'
      - 'skills/godot-spritesheets/SKILL.md'
  push:
    branches: [main]
    paths:
      - 'scripts/art/sprite_forge.py'
      - 'scripts/art/test_sprite_forge.py'
      - '.github/workflows/pawn-slug-sprite-forge.yml'
      - 'docs/pawnslug-sprites.md'
      - 'skills/godot-spritesheets/SKILL.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-sprite-forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  raw-frame-contract:
    name: Raw frame fail-closed contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned image dependency
        run: python3 -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==12.3.0'

      - name: Compile + regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/art/sprite_forge.py scripts/art/test_sprite_forge.py
          python3 scripts/art/test_sprite_forge.py
