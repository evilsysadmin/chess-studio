name: Blender · toolchain cache

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-blender-canonical/**'
      - '.github/workflows/blender-toolchain-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-toolchain-cache
  cancel-in-progress: true

jobs:
  warm-cache:
    name: Warm Blender helper caches
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-blender-canonical
        with:
          extra-packages: webp
