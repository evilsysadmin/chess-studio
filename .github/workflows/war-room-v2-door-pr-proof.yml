name: War Room v2 · temporary door PR proof

# One-off review aid for the explicit v2 architectural repair. This workflow
# MUST be removed from the branch before merging. The historical v2 pipeline
# remains workflow_dispatch-only and no alias/public manifest is updated here.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/blender/build_war_room_premium.py'
      - '.github/workflows/war-room-v2-door-pr-proof.yml'

permissions:
  contents: read

jobs:
  v2-door-proof:
    if: github.head_ref == 'art/war-room-v2-single-hearth-hans-door'
    name: V2 · one-off Blender preview and GLB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build V2 from the exact PR revision (never publish)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_EEVEE_PREMIUM: '1'
          BLENDER_PREVIEW_SAMPLES: '64'
        run: |
          set -euo pipefail
          mkdir -p /tmp/war-room-v2-door-proof
          blender --background --python-exit-code 1 \
            --python scripts/blender/configure_eevee_premium.py \
            --python scripts/blender/build_war_room_premium.py -- \
            --blend /tmp/war-room-v2-door-proof/v2-door-review.blend \
            --glb /tmp/war-room-v2-door-proof/v2-door-review.glb \
            --preview /tmp/war-room-v2-door-proof/v2-door-review.png \
            --manifest /tmp/war-room-v2-door-proof/v2-door-review.json

      - name: Check one hearth, real door and 3D export nodes
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          from PIL import Image
          root = Path('/tmp/war-room-v2-door-proof')
          manifest = json.loads((root / 'v2-door-review.json').read_text())
          names = {o['name'] for o in manifest['objects']}
          assert 'WR_FIREPLACE_body' in names
          assert 'WR_CANON_campaign_cabinet_body' in names
          assert 'WR_HANS_door_leaf' in names
          assert not any(n.startswith('WR_CANON_right_fireplace_') for n in names)
          raw = (root / 'v2-door-review.glb').read_bytes()
          assert raw[:4] == b'glTF'
          size, typ = struct.unpack_from('<II', raw, 12)
          assert typ == 0x4E4F534A
          doc = json.loads(raw[20:20+size].decode('utf-8').rstrip('\\x00 \\t\\r\\n'))
          nodes = {node['name']: node for node in doc['nodes'] if 'name' in node}
          required = {
            'WR_HANS_door_leaf', 'WR_ANCHOR_hans_hearth', 'WR_ANCHOR_hans_door',
            'WR_ANCHOR_hans_basket', 'WR_ANCHOR_hans_tools',
            'WR_ANCHOR_hans_corridor_0', 'WR_ANCHOR_hans_corridor_1',
            'WR_ANCHOR_hans_corridor_2',
          }
          assert required <= set(nodes), sorted(required - set(nodes))
          assert nodes['WR_HANS_door_leaf']['extras']['war_room_hans_door_open_yaw'] == -1.45
          assert Image.open(root / 'v2-door-review.png').size == (1600, 900)
          print('V2 door exact-GLB review contract OK')
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: war-room-v2-door-proof-${{ github.event.pull_request.number }}
          path: /tmp/war-room-v2-door-proof/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
