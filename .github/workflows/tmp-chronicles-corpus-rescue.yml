name: TEMP · Chronicles corpus rescue

on:
  push:
    branches:
      - track-rescue/chronicles-manifest-parity-20261007

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt
      - name: Restore exact backend virtualenv
        uses: ./.github/actions/cache-python-venv
      - name: Regenerate Chronicles area parity corpus
        run: .venv/bin/python scripts/chronicles_area_parity_corpus.py
      - name: Upload generated corpus
        uses: actions/upload-artifact@v7
        with:
          name: chronicles-area-parity-corpus-${{ github.sha }}
          path: backend-go/internal/chronicles/testdata/python_chronicles_area_corpus.json
          if-no-files-found: error
          retention-days: 1
