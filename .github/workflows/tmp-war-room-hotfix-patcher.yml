name: Temporary War Room hotfix patcher

on:
  push:
    branches:
      - visual/war-room-fire-wall-hotfix
    paths:
      - .github/workflows/tmp-war-room-hotfix-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: visual/war-room-fire-wall-hotfix
          fetch-depth: 0
      - name: Patch sources
        run: python3 scripts/tmp_patch_war_room_hotfix.py
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Linux Pirate Ninja'
          git config user.email '12677236+evilsysadmin@users.noreply.github.com'
          git add frontend/src/components/Board3D.jsx frontend/src/components/WarRoomCastleArchitecture.js
          git diff --cached --check
          git commit -m 'Keep War Room fire alive and warm the castle walls'
          git push origin HEAD:visual/war-room-fire-wall-hotfix
