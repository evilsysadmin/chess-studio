name: Observability · Grafana live

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - "infra/oci/runtime/alloy.alloy"
      - "infra/grafana/dashboards/chess-studio-oci-host.json"
      - "scripts/grafana_live_check.py"
      - ".github/workflows/observability-live.yml"

permissions:
  contents: read

concurrency:
  group: chess-studio-observability-live
  cancel-in-progress: true

jobs:
  verify:
    name: OCI host + backend signals reach Grafana
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      GRAFANA_METRICS_DATASOURCE_UID: ${{ vars.GRAFANA_METRICS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-prom' }}
      GRAFANA_LOGS_DATASOURCE_UID: ${{ vars.GRAFANA_LOGS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-logs' }}
      GRAFANA_TRACES_DATASOURCE_UID: ${{ vars.GRAFANA_TRACES_DATASOURCE_UID || 'grafanacloud-humbletoucan355-traces' }}
      GRAFANA_LIVE_LOOKBACK: ${{ vars.GRAFANA_LIVE_LOOKBACK || '6h' }}
      GRAFANA_SLO_MAX_5XX_PERCENT: ${{ vars.GRAFANA_SLO_MAX_5XX_PERCENT || '5' }}
      GRAFANA_SLO_MAX_P95_MS: ${{ vars.GRAFANA_SLO_MAX_P95_MS || '3000' }}
      GRAFANA_SLO_MAX_HOST_RAM_PERCENT: ${{ vars.GRAFANA_SLO_MAX_HOST_RAM_PERCENT || '90' }}
      GRAFANA_SLO_MIN_REQUESTS_15M: ${{ vars.GRAFANA_SLO_MIN_REQUESTS_15M || '20' }}
    steps:
      - uses: actions/checkout@v7
      - name: Static self-test
        run: python3 -S scripts/grafana_live_check.py --self-test
      - name: Warm production + staging telemetry
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://api.chess-studio.shadowops.dpdns.org/api/ready" \
            "https://api-staging.chess-studio.shadowops.dpdns.org/api/ready"
          do
            curl --fail --silent --show-error --max-time 10 "$url" >/dev/null
          done
          sleep 12
      - name: Query Grafana from the read side
        run: python3 -S scripts/grafana_live_check.py
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Observability live'
            echo
            echo '- OCI host metrics: production + staging queried from Grafana'
            echo '- Backend metrics/logs/traces: production + staging queried from Grafana'
            echo '- Environment isolation: Tempo service/environment mismatches must stay empty'
            echo "- Guardrail 5xx: ≤ `${GRAFANA_SLO_MAX_5XX_PERCENT}%` over 15m when sample ≥ `${GRAFANA_SLO_MIN_REQUESTS_15M}`"
            echo "- Guardrail p95: ≤ `${GRAFANA_SLO_MAX_P95_MS}ms` over 15m when sample is sufficient"
            echo "- Guardrail OCI RAM: ≤ `${GRAFANA_SLO_MAX_HOST_RAM_PERCENT}%`"
            echo "- Lookback telemetry: `${GRAFANA_LIVE_LOOKBACK}`"
          } >> "$GITHUB_STEP_SUMMARY"
