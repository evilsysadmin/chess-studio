name: Observability · Grafana live

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  workflow_run:
    workflows: ["Deploy to staging"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: chess-studio-observability-live
  cancel-in-progress: true

jobs:
  verify:
    name: OCI host + backend signals reach Grafana
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      GRAFANA_METRICS_DATASOURCE_UID: ${{ vars.GRAFANA_METRICS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-prom' }}
      GRAFANA_LOGS_DATASOURCE_UID: ${{ vars.GRAFANA_LOGS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-logs' }}
      GRAFANA_TRACES_DATASOURCE_UID: ${{ vars.GRAFANA_TRACES_DATASOURCE_UID || 'grafanacloud-humbletoucan355-traces' }}
      GRAFANA_LIVE_LOOKBACK: ${{ vars.GRAFANA_LIVE_LOOKBACK || '6h' }}
      GRAFANA_SLO_MAX_5XX_PERCENT: ${{ vars.GRAFANA_SLO_MAX_5XX_PERCENT || '5' }}
      GRAFANA_SLO_MAX_P95_MS: ${{ vars.GRAFANA_SLO_MAX_P95_MS || '3000' }}
      GRAFANA_SLO_MAX_HOST_RAM_PERCENT: ${{ vars.GRAFANA_SLO_MAX_HOST_RAM_PERCENT || '90' }}
      GRAFANA_SLO_MIN_REQUESTS_15M: ${{ vars.GRAFANA_SLO_MIN_REQUESTS_15M || '20' }}
      EXPECTED_STAGING_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Static self-test
        run: python3 -S scripts/grafana_live_check.py --self-test
      - name: Confirm deploy generation is still live
        id: generation
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/staging-generation.json"
          status="$(curl --silent --show-error --connect-timeout 1 --max-time 5 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_API_URL/release?sha=$EXPECTED_STAGING_SHA" || true)"
          if [[ "$status" == 200 ]] && python3 - "$body" "$EXPECTED_STAGING_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          raise SystemExit(0 if str(payload.get('build') or '').lower() == sys.argv[2].lower() else 1)
          PY
          then
            echo 'live=true' >> "$GITHUB_OUTPUT"
          else
            echo 'live=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Observability deploy superseded::$EXPECTED_STAGING_SHA is not the live staging backend generation; Grafana live check skipped."
          fi
      - name: Warm production + staging telemetry
        if: github.event_name != 'workflow_run' || steps.generation.outputs.live == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://api.chess-studio.shadowops.dpdns.org/api/ready" \
            "https://api-staging.chess-studio.shadowops.dpdns.org/api/ready" \
            "https://api-staging.chess-studio.shadowops.dpdns.org/api/release"
          do
            curl --fail --silent --show-error --max-time 10 "$url" >/dev/null
          done
          sleep 12
      - name: Query Grafana from the read side
        if: github.event_name != 'workflow_run' || steps.generation.outputs.live == 'true'
        run: python3 -S scripts/grafana_live_check.py
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Observability live'
            echo
            echo '- OCI staging host metrics + scoped backend stdout logs: queried from Grafana'
            echo '- Alloy self-telemetry + deterministic filelog probe distinguish transport from backend capture failures'
            echo "- Deploy-triggered checks pin telemetry to: `${EXPECTED_STAGING_SHA:-scheduled/current}`"
            echo "- Superseded deploy trigger queried: `${{ steps.generation.outputs.live || 'n/a' }}`"
            echo '- Backend metrics/logs/traces: production + staging queried from Grafana'
            echo '- Environment isolation: Tempo service/environment mismatches must stay empty'
            echo "- Guardrail 5xx: ≤ `${GRAFANA_SLO_MAX_5XX_PERCENT}%` over 15m when sample ≥ `${GRAFANA_SLO_MIN_REQUESTS_15M}`"
            echo "- Guardrail p95: ≤ `${GRAFANA_SLO_MAX_P95_MS}ms` over 15m when sample is sufficient"
            echo "- Guardrail OCI RAM: ≤ `${GRAFANA_SLO_MAX_HOST_RAM_PERCENT}%`"
            echo "- Lookback telemetry: `${GRAFANA_LIVE_LOOKBACK}`"
          } >> "$GITHUB_STEP_SUMMARY"
