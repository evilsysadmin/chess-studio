name: Home Matthias · Blender canonical art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_home_matthias.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/blender/home_matthias_animations.py'
      - 'frontend/art-source/matthias-home-canonical.blend'
      - 'frontend/public/models/matthias-home-canonical.glb'
      - '.github/actions/setup-blender-canonical/**'
      - '.github/workflows/home-matthias-blender-art.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-matthias-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render canonical Home Matthias
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build editable blend + animated runtime GLB + preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_PREVIEW_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && '64' || '24' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-matthias-art
          blender --background \
            --python scripts/blender/build_home_matthias.py \
            -- \
            --blend /tmp/home-matthias-art/matthias-home-canonical.blend \
            --glb /tmp/home-matthias-art/matthias-home-canonical.glb \
            --preview /tmp/home-matthias-art/matthias-home-canonical.png

      - name: Validate classic identity + animation contract
        run: |
          set -euo pipefail
          test -s /tmp/home-matthias-art/matthias-home-canonical.blend
          test -s /tmp/home-matthias-art/matthias-home-canonical.glb
          test -s /tmp/home-matthias-art/matthias-home-canonical.png
          blender --background /tmp/home-matthias-art/matthias-home-canonical.blend --python-expr "import bpy; rig=bpy.data.objects['MatthiasRig']; required_actions={'Idle','Speak','Think','Read','Write','Dossier','Sip','Bite','Sleep'}; actions={a.name for a in bpy.data.actions}; assert required_actions <= actions, (required_actions-actions); assert rig.get('canonical_identity') == 'stern-no-moustache-pawn'; assert rig.get('canonical_reference') == 'classic-pawn-first-avatar'; objects={o.name for o in bpy.data.objects}; required_objects={'Classic lower pawn','Classic navy tunic','Classic cap crown','Head','RoutineBook','RoutineCup','RoutinePen'}; assert required_objects <= objects, (required_objects-objects); lowered={name.lower() for name in objects}; forbidden=('moustache','mustache','beard','epaulette','chest strap','sash','uniform chest','field cap crown'); offenders=sorted(name for name in lowered if any(token in name for token in forbidden)); assert not offenders, offenders; assert {'prop_book','prop_cup','prop_pen'} <= {b.name for b in rig.data.bones}; print('Home Matthias classic canonical contract OK')"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/home-matthias-art')
          blend = root / 'matthias-home-canonical.blend'
          glb = root / 'matthias-home-canonical.glb'
          preview = root / 'matthias-home-canonical.png'
          assert blend.stat().st_size > 100_000, blend.stat().st_size
          assert glb.stat().st_size > 50_000, glb.stat().st_size
          image = Image.open(preview).convert('RGB')
          assert image.size == (560, 700), image.size
          extrema = image.getextrema()
          assert max(channel[1] for channel in extrema) > 40, extrema
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-matthias-canonical-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/home-matthias-art/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
