name: Home Matthias · Blender canonical art

# Temporary closed-PR materializer. The PR is intentionally closed while this
# runs so the generated-binary commit cannot create approval-required PR runs.
on:
  push:
    branches:
      - 'fix/home-matthias-canonical-as-is'
    paths:
      - 'scripts/blender/build_home_matthias.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/blender/home_matthias_premium.py'
      - 'scripts/blender/home_matthias_animations.py'
      - 'scripts/blender/home_matthias_contract.py'
      - 'scripts/blender/validate_home_matthias_contract.py'
      - 'frontend/art-source/matthias-home-canonical-reference.webp'
      - 'frontend/art-source/matthias-home-canonical-reference.txt'
      - '.github/workflows/home-matthias-blender-art.yml'

permissions:
  contents: write

concurrency:
  group: home-matthias-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Materialize canonical Home Matthias
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build editable blend + animated runtime GLB + preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_PREVIEW_SAMPLES: '24'
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-matthias-art
          blender --background \
            --python scripts/blender/build_home_matthias.py \
            -- \
            --blend /tmp/home-matthias-art/matthias-home-canonical.blend \
            --glb /tmp/home-matthias-art/matthias-home-canonical.glb \
            --preview /tmp/home-matthias-art/matthias-home-canonical.png

      - name: Enforce canonical contract before publishing
        run: |
          set -euo pipefail
          test -s /tmp/home-matthias-art/matthias-home-canonical.blend
          test -s /tmp/home-matthias-art/matthias-home-canonical.glb
          test -s /tmp/home-matthias-art/matthias-home-canonical.png
          blender --background \
            /tmp/home-matthias-art/matthias-home-canonical.blend \
            --python scripts/blender/validate_home_matthias_contract.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          sys.path.insert(0, 'scripts/blender')
          from home_matthias_contract import CANONICAL_REFERENCE_FILE, CANONICAL_REFERENCE_SHA256
          reference = Path(CANONICAL_REFERENCE_FILE)
          assert hashlib.sha256(reference.read_bytes()).hexdigest() == CANONICAL_REFERENCE_SHA256
          PY

      - name: Commit validated canonical binaries to closed PR branch
        env:
          HEAD_REF: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${HEAD_REF}"
          actual_head="$(git rev-parse "origin/${HEAD_REF}")"
          test "${actual_head}" = "${EXPECTED_HEAD_SHA}"
          git checkout -B "${HEAD_REF}" "${EXPECTED_HEAD_SHA}"
          cp /tmp/home-matthias-art/matthias-home-canonical.blend frontend/art-source/matthias-home-canonical.blend
          cp /tmp/home-matthias-art/matthias-home-canonical.glb frontend/public/models/matthias-home-canonical.glb
          git add frontend/art-source/matthias-home-canonical.blend frontend/public/models/matthias-home-canonical.glb
          if git diff --cached --quiet; then
            echo 'Canonical binaries already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Home Matthias: materialize validated canonical binaries [matthias-art-materialized]'
          git push origin "HEAD:${HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-matthias-materialized-${{ github.run_number }}
          path: /tmp/home-matthias-art/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
