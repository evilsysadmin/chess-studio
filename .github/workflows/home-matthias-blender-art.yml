name: Home Matthias · Blender canonical art

# Path-scoped canonical-art lane: required Tests · Playwright waits for this workflow on matching PR sources.
on:
  pull_request:
    paths:
      - 'scripts/blender/build_home_matthias.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/blender/home_matthias_animations.py'
      - 'scripts/blender/home_matthias_contract.py'
      - 'scripts/blender/validate_home_matthias_contract.py'
      - 'frontend/art-source/matthias-home-canonical-reference.webp'
      - 'frontend/art-source/matthias-home-canonical-reference.txt'
      # Generated .blend/.glb outputs are intentionally omitted so materializing
      # canonical art cannot retrigger the expensive source render by itself.
      - '.github/workflows/home-matthias-blender-art.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-matthias-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render canonical Home Matthias
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Decide whether Blender must render
        id: canonical_scope
        shell: bash
        run: |
          set -euo pipefail
          render=true
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            current_message="$(git log -1 --pretty=%B HEAD)"
            unexpected="$(printf '%s\n' "${changed}" | grep -Ev '^(frontend/art-source/matthias-home-canonical\.blend|frontend/public/models/matthias-home-canonical\.glb)$' || true)"
            if [[ -n "${changed}" ]] && [[ -z "${unexpected}" ]] && grep -Fq '[matthias-art-materialized]' <<<"${current_message}"; then
              render=false
              echo 'Validated Matthias binaries are already materialized; skipping redundant Blender render.'
            fi
          fi
          echo "render=${render}" >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/setup-blender-canonical
        if: steps.canonical_scope.outputs.render == 'true'

      - name: Build editable blend + animated runtime GLB + preview
        if: steps.canonical_scope.outputs.render == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_PREVIEW_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && '64' || '24' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-matthias-art
          blender --background \
            --python scripts/blender/build_home_matthias.py \
            -- \
            --blend /tmp/home-matthias-art/matthias-home-canonical.blend \
            --glb /tmp/home-matthias-art/matthias-home-canonical.glb \
            --preview /tmp/home-matthias-art/matthias-home-canonical.png

      - name: Enforce hard pawn-first canonical contract
        if: steps.canonical_scope.outputs.render == 'true'
        run: |
          set -euo pipefail
          test -s /tmp/home-matthias-art/matthias-home-canonical.blend
          test -s /tmp/home-matthias-art/matthias-home-canonical.glb
          test -s /tmp/home-matthias-art/matthias-home-canonical.png
          blender --background \
            /tmp/home-matthias-art/matthias-home-canonical.blend \
            --python scripts/blender/validate_home_matthias_contract.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          sys.path.insert(0, 'scripts/blender')
          from home_matthias_contract import CANONICAL_REFERENCE_FILE, CANONICAL_REFERENCE_SHA256

          reference = Path(CANONICAL_REFERENCE_FILE)
          assert reference.is_file(), f'missing canonical reference: {reference}'
          digest = hashlib.sha256(reference.read_bytes()).hexdigest()
          assert digest == CANONICAL_REFERENCE_SHA256, (digest, CANONICAL_REFERENCE_SHA256)
          provenance = Path('frontend/art-source/matthias-home-canonical-reference.txt').read_text()
          assert CANONICAL_REFERENCE_SHA256 in provenance, 'canonical reference provenance/hash drifted'
          PY

      - name: Validate render artifact envelope
        if: steps.canonical_scope.outputs.render == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/home-matthias-art')
          blend = root / 'matthias-home-canonical.blend'
          glb = root / 'matthias-home-canonical.glb'
          preview = root / 'matthias-home-canonical.png'
          assert blend.stat().st_size > 100_000, blend.stat().st_size
          assert glb.stat().st_size > 50_000, glb.stat().st_size
          image = Image.open(preview).convert('RGB')
          assert image.size == (560, 700), image.size
          extrema = image.getextrema()
          assert max(channel[1] for channel in extrema) > 40, extrema
          PY

      - name: Materialize validated canonical art on PR branch
        if: >-
          steps.canonical_scope.outputs.render == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Do not publish a render made from a stale PR head. A newer synchronize
          # event owns the newer source and will render that revision instead.
          git fetch --no-tags origin "${HEAD_REF}"
          actual_head="$(git rev-parse "origin/${HEAD_REF}")"
          if [[ "${actual_head}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "PR head advanced during Blender render; skipping stale materialization."
            echo "expected=${EXPECTED_HEAD_SHA} actual=${actual_head}"
            exit 0
          fi

          git checkout -B "${HEAD_REF}" "${EXPECTED_HEAD_SHA}"
          cp /tmp/home-matthias-art/matthias-home-canonical.blend \
            frontend/art-source/matthias-home-canonical.blend
          cp /tmp/home-matthias-art/matthias-home-canonical.glb \
            frontend/public/models/matthias-home-canonical.glb
          git add \
            frontend/art-source/matthias-home-canonical.blend \
            frontend/public/models/matthias-home-canonical.glb

          if git diff --cached --quiet; then
            echo 'Validated canonical binaries are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Home Matthias: materialize validated canonical binaries [matthias-art-materialized]'
          git push origin "HEAD:${HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.canonical_scope.outputs.render == 'true'
        with:
          name: home-matthias-canonical-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/home-matthias-art/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
