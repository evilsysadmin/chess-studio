name: Chesscom · visual artifact

on:
  pull_request:
    paths:
      - 'frontend/src/chesscom*.js'
      - 'frontend/src/chesscom*.jsx'
      - 'frontend/src/components/Chesscom*'
      - 'frontend/src/assets/chesscom/**'
      - 'frontend/public/chesscom/**'
      - 'e2e/chesscom*.spec.js'
      - '.github/workflows/chesscom-visual-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chesscom-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: Chesscom · visual capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build frontend for visual capture
        run: make frontend-build

      - name: Restore Chromium runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Capture Chesscom desktop + mobile
        continue-on-error: true
        working-directory: e2e
        run: ./node_modules/.bin/playwright test chesscom-visual-artifact.spec.js --workers=1 --retries=0

      - name: Upload Chesscom visual artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chesscom-visual-${{ github.event.pull_request.number || github.run_id }}
          path: .artifacts/chesscom-visual/
          if-no-files-found: warn
          retention-days: 7
