name: Guitar V4 NAM IR

on:
  push:
    branches:
      - audio/guitar-v4-nam-ir-20260920

permissions:
  contents: read
  actions: read

jobs:
  reamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install neural audio toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg unzip python3-pip python3-tk
          python3 -m pip install --break-system-packages -q \
            --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --break-system-packages -q \
            neural-amp-modeler==0.12.0 soundfile scipy

      - name: Reuse approved Metal GTX V3 DI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p v4 /tmp/v3
          curl -fL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/evilsysadmin/chess-studio/actions/artifacts/10614075946/zip" \
            -o /tmp/v3.zip
          unzip -q /tmp/v3.zip -d /tmp/v3
          DI="$(find /tmp/v3 -type f -name 'metal-gtx-di-stereo.wav' -print -quit)"
          test -s "$DI"
          ffmpeg -hide_banner -loglevel error -y -i "$DI" \
            -af "pan=mono|c0=c0" -ar 44100 -c:a pcm_s24le v4/left-di.wav
          ffmpeg -hide_banner -loglevel error -y -i "$DI" \
            -af "pan=mono|c0=c1" -ar 44100 -c:a pcm_s24le v4/right-di.wav
          ffprobe -v error -show_entries stream=sample_rate,channels \
            -of default=noprint_wrappers=1 v4/left-di.wav

      - name: Download neural amp and real cabinet IR
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/pelennor2170/NAM_models/main/Phillipe%20P%20Bug1990-Lead-NoDrive-ESR0%2C004.nam' \
            -o v4/lead-amp.nam
          test -s v4/lead-amp.nam

          curl -fL --retry 4 --retry-delay 2 \
            'https://www.jester-dyne-productions.com/content/files/2023/04/JestersBrutalPack_1.0.zip' \
            -o /tmp/jester-brutal.zip
          unzip -q /tmp/jester-brutal.zip -d /tmp/jester-brutal
          find /tmp/jester-brutal -type f -iname '*.wav' -print | sort > v4/ir-files.txt
          test -s v4/ir-files.txt

          IR="$(find /tmp/jester-brutal -type f -path '*/48kHz/*' -iname '6_Vertical_Lip_Stabber.wav' -print -quit)"
          if [ -z "$IR" ]; then
            IR="$(find /tmp/jester-brutal -type f -path '*/48kHz/*' -iname '*.wav' -print -quit)"
          fi
          test -s "$IR"
          printf '%s\n' "$IR" > v4/ir-path.txt
          echo "Using IR: $IR"

      - name: Neural reamp at two drive levels
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          import torch
          from scipy.signal import resample_poly, fftconvolve, butter, sosfilt
          from nam.models import init_from_nam

          with open('v4/lead-amp.nam','r') as fp:
              cfg=json.load(fp)
          model=init_from_nam(cfg)
          model.eval()

          MODEL_SR=int(round(model.sample_rate or 48000))
          RF=int(model.receptive_field)
          print('NAM',cfg.get('architecture'),cfg.get('version'),'sr',MODEL_SR,'rf',RF)

          def resamp(x,sr,target):
              if sr==target:
                  return x.astype(np.float32)
              g=math.gcd(int(sr),int(target))
              return resample_poly(x,target//g,sr//g).astype(np.float32)

          def load_mono(path):
              x,sr=sf.read(path,dtype='float32',always_2d=False)
              if x.ndim>1:
                  x=x.mean(axis=1)
              x=resamp(x,int(sr),MODEL_SR)
              hp=butter(2,28/(MODEL_SR/2),btype='highpass',output='sos')
              return sosfilt(hp,x).astype(np.float32)

          def set_rms(x,db):
              rms=float(np.sqrt(np.mean(x*x)+1e-12))
              target=10**(db/20)
              g=target/max(rms,1e-9)
              return (x*g).astype(np.float32),g

          def infer(x):
              chunk=131072
              out=[]
              pos=0
              with torch.inference_mode():
                  while pos<len(x):
                      end=min(len(x),pos+chunk)
                      cur=x[pos:end]
                      if pos==0:
                          y=model(torch.from_numpy(cur.copy()),pad_start=True)
                      else:
                          hist=x[max(0,pos-(RF-1)):pos]
                          if len(hist)<RF-1:
                              hist=np.pad(hist,(RF-1-len(hist),0))
                          inp=np.concatenate([hist,cur]).astype(np.float32)
                          y=model(torch.from_numpy(inp),pad_start=False)
                      yy=y.detach().cpu().numpy().astype(np.float32)
                      if len(yy)!=len(cur):
                          raise RuntimeError(f'NAM output mismatch {len(yy)} != {len(cur)}')
                      out.append(yy)
                      pos=end
              return np.concatenate(out)

          ir_path=Path('v4/ir-path.txt').read_text().strip()
          ir,irsr=sf.read(ir_path,dtype='float32',always_2d=False)
          if ir.ndim>1:
              ir=ir.mean(axis=1)
          ir=resamp(ir,int(irsr),MODEL_SR)
          nz=np.where(np.abs(ir)>max(1e-8,float(np.max(np.abs(ir)))*1e-4))[0]
          if len(nz):
              ir=ir[max(0,int(nz[0])-8):]
          ir=ir[:min(len(ir),int(.25*MODEL_SR))]
          ir=ir/(float(np.max(np.abs(ir)))+1e-12)
          print('IR',ir_path,'samples',len(ir),'sr',MODEL_SR)

          source={side:load_mono(f'v4/{side}-di.wav') for side in ('left','right')}
          settings={'balanced':-22.0,'hot':-18.0}

          for label,target_db in settings.items():
              rendered={}
              for side,x in source.items():
                  driven,gain=set_rms(x,target_db)
                  print(label,side,'input gain',gain,'target rms',target_db)
                  head=infer(driven)
                  sf.write(f'v4/{side}-{label}-nam-head.wav',head,MODEL_SR,subtype='PCM_24')
                  cab=fftconvolve(head,ir,mode='full')[:len(head)].astype(np.float32)
                  hp=butter(2,72/(MODEL_SR/2),btype='highpass',output='sos')
                  lp=butter(2,11800/(MODEL_SR/2),btype='lowpass',output='sos')
                  cab=sosfilt(hp,cab)
                  cab=sosfilt(lp,cab).astype(np.float32)
                  rendered[side]=cab

              n=min(len(rendered['left']),len(rendered['right']))
              stereo=np.column_stack([
                  rendered['left'][:n]*.97,
                  rendered['right'][:n]*.91
              ])
              peak=float(np.max(np.abs(stereo)))+1e-12
              if peak>.82:
                  stereo*=.82/peak
              sf.write(f'v4/metal-gtx-nam-ir-{label}-raw.wav',stereo,MODEL_SR,subtype='PCM_24')
          PY

          for mode in balanced hot; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "v4/metal-gtx-nam-ir-${mode}-raw.wav" \
              -af "acompressor=threshold=-18dB:ratio=1.35:attack=28:release=130,loudnorm=I=-16:TP=-1.0:LRA=10" \
              -ar 48000 -c:a pcm_s24le "v4/metal-gtx-nam-ir-${mode}.wav"
            ffmpeg -hide_banner -loglevel error -y \
              -i "v4/metal-gtx-nam-ir-${mode}.wav" -t 24 \
              -ar 48000 -c:a pcm_s24le "v4/metal-gtx-nam-ir-${mode}-preview-24s.wav"
          done

      - name: Validate audio
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import numpy as np, soundfile as sf
          for mode in ('balanced','hot'):
              p=f'v4/metal-gtx-nam-ir-{mode}.wav'
              x,sr=sf.read(p,always_2d=True)
              peak=float(np.max(np.abs(x)))
              rms=float(np.sqrt(np.mean(x*x)))
              print(mode,'sr',sr,'channels',x.shape[1],'duration',len(x)/sr,'peak',peak,'rms',rms)
              assert sr==48000 and x.shape[1]==2 and len(x)>sr*10
              assert peak>0.05 and peak<=1.0
          PY

      - name: Manifest
        shell: bash
        run: |
          {
            echo 'Pawn Slug guitar V4 — NAM neural reamp'
            echo 'Source DI: approved Metal GTX V3 artifact 10614075946'
            echo 'Amp: Neural Amp Modeler — Bug1990 Lead NoDrive amp-only capture'
            echo 'Cab: Jester Dyne Brutal Pack real 4x12 IR'
            printf 'Selected IR: '; cat v4/ir-path.txt
            echo 'Variants: balanced (-22 dBFS RMS into NAM), hot (-18 dBFS RMS into NAM)'
            echo 'Output: 48 kHz / 24-bit PCM'
            echo 'Double tracking preserved from independent V3 L/R performances'
            echo
            sha256sum v4/metal-gtx-nam-ir-balanced.wav v4/metal-gtx-nam-ir-hot.wav
          } > v4/MANIFEST.txt

      - name: Upload V4 audio
        uses: actions/upload-artifact@v4
        with:
          name: pawn-slug-guitar-v4-nam-ir
          path: |
            v4/metal-gtx-nam-ir-balanced.wav
            v4/metal-gtx-nam-ir-balanced-preview-24s.wav
            v4/metal-gtx-nam-ir-hot.wav
            v4/metal-gtx-nam-ir-hot-preview-24s.wav
            v4/left-balanced-nam-head.wav
            v4/right-balanced-nam-head.wav
            v4/left-hot-nam-head.wav
            v4/right-hot-nam-head.wav
            v4/MANIFEST.txt
            v4/ir-path.txt
            v4/ir-files.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
