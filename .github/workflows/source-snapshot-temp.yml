name: Temporary source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/source-snapshot-temp.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: ChessStudio_main_0a7045b_COMPLETE
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
          path: |
            .
            !.git/**
            !.github/workflows/source-snapshot-temp.yml
            !frontend/node_modules/**
            !e2e/node_modules/**
            !.venv/**
            !.trivy-cache/**
            !.tools/**
