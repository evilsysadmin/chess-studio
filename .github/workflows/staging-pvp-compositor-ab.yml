name: Staging · PvP compositor A/B

# Manual-only diagnostic; no deployment or promotion.
on:
  workflow_dispatch:
    inputs:
      renderer:
        description: 'Chromium flags: default matches canonical CI; software forces ANGLE SwiftShader'
        type: choice
        required: true
        default: default
        options: [default, software]
      comparison:
        description: 'product/prehidden: opening A/B; native: full post-ready CDP'
        type: choice
        default: product
        options: [product, prehidden, native]

permissions:
  contents: read
  actions: read

concurrency:
  group: chess-studio-staging-pvp-compositor-ab
  cancel-in-progress: false

jobs:
  compare:
    name: Compare PvP A/B or trace post-ready native stall
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
      DEPLOY_SHA: ${{ github.sha }}
      CHESS_STAGING_RENDERER: ${{ inputs.renderer || 'default' }}
      CHESS_STAGING_PVP_OPEN_ONLY: '1'
      PVP_COMPARISON: ${{ inputs.comparison || 'product' }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - name: Checkout the exact main SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Pin native CDP to the last complete staging generation
        if: inputs.comparison == 'native'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/staging_pvp_native_generation.py --self-test
          runtime="$(python3 -S scripts/staging_pvp_native_generation.py --source-sha "$GITHUB_SHA")"
          echo "DEPLOY_SHA=$runtime" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin "$runtime"
          git -c advice.detachedHead=false checkout --detach "$runtime"
          # Keep runtime files pinned, but use the current main diagnostic spec.
          # Otherwise a smoke-only test improvement disappears on checkout.
          git show "$GITHUB_SHA:e2e/staging-live.spec.js" > e2e/staging-live.spec.js
          grep -Fq "stopDeepDiagnostics('settled')" e2e/staging-live.spec.js &&
            grep -Fq 'STAGING_PVP_WEBGL ' e2e/staging-live.spec.js ||
            { echo "::error::Current native diagnostic spec is missing CDP/WebGL markers"; exit 1; }

      - name: Reject stale or non-main runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::A/B must run on main"; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid SHA"; exit 1; }
          python3 -S scripts/staging_generation.py wait \
            --sha "$DEPLOY_SHA" --surfaces backend,frontend,worker --attempts 1 --interval 0 --root

      - name: Restore cached OCI SDK toolchain
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'
          cache-layout: portable

      - name: Load protected ephemeral staging credentials
        run: python3 scripts/staging_smoke_env.py secrets

      - name: Prepare staging browser
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'

      - name: Run A/B openings or one full native CDP diagnosis
        shell: bash
        timeout-minutes: 21
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/staging-pvp-ab.txt"
          printf 'source_sha=%s runtime_sha=%s renderer_requested=%s\n' "$GITHUB_SHA" "$DEPLOY_SHA" "$CHESS_STAGING_RENDERER" > "$summary"
          if [[ "$PVP_COMPARISON" == native ]]; then
            modes=(off)
            export CHESS_STAGING_PVP_OPEN_ONLY=0 CHESS_STAGING_CDP_DIAGNOSTICS=1
          else
            if [[ "$PVP_COMPARISON" == product ]]; then control=product-home-canvas; else control=hide-home-canvas; fi
            modes=(keep-home-canvas "$control" "$control" keep-home-canvas)
          fi
          for mode in "${modes[@]}"; do
            python3 -S scripts/staging_generation.py wait \
              --sha "$DEPLOY_SHA" --surfaces backend,frontend,worker --attempts 1 --interval 0 --root
            env_file="$(mktemp "$RUNNER_TEMP/staging-pvp-identity.XXXXXXXX")"
            GITHUB_ENV="$env_file" python3 -S scripts/staging_smoke_env.py identity
            cat "$env_file" >> "$GITHUB_ENV"
            set -a
            # Already masked helper-generated credentials.
            source "$env_file"
            set +a
            rm -f "$env_file"
            printf 'leg=%s\n' "$mode" >> "$summary"
            echo "::group::PvP compositor A/B: $mode"
            leg_log="$(mktemp "$RUNNER_TEMP/staging-pvp-leg.XXXXXXXX")"
            set +e
            (
              cd e2e
              CHESS_STAGING_PVP_ABLATION="$mode" \
                ./node_modules/.bin/playwright test staging-live.spec.js \
                  --config=playwright.staging.config.js
            ) 2>&1 | tee "$leg_log"
            browser_rc="${PIPESTATUS[0]}"
            python3 -S scripts/staging_smoke_user_cleanup.py
            cleanup_rc="$?"
            set -e
            grep -E 'STAGING_PVP_(ABLATION|GPU|OPEN|INPUT_FRAME|RENDER|PHASE|DIAGNOSTICS|CPU|NATIVE|WEBGL|LAYERS|LOAF)' "$leg_log" >> "$summary" || true
            rm -f "$leg_log"
            echo "::endgroup::"
            unset STAGING_E2E_USERNAME STAGING_E2E_PASSWORD
            if [[ "$browser_rc" -ne 0 || "$cleanup_rc" -ne 0 ]]; then
              echo "::error::PvP A/B leg $mode: browser=$browser_rc cleanup=$cleanup_rc"
              exit 1
            fi
            python3 -S scripts/staging_generation.py wait \
              --sha "$DEPLOY_SHA" --surfaces backend,frontend,worker --attempts 1 --interval 0 --root
          done
          {
            echo '### PvP manual diagnostic — no deployment or accreditation'
            echo "Source: $GITHUB_SHA; deployed runtime: $DEPLOY_SHA; renderer: $CHESS_STAGING_RENDERER"
            if [[ "$PVP_COMPARISON" == native ]]; then
              echo 'Native: runtime generation pinned; diagnostic spec from current main SHA; one full staging-live smoke, CDP 20s max.'
            else
              echo "A/B: keep / $control / $control / keep, opening-only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retry cleanup after any interrupted leg
        if: always()
        shell: bash
        run: |
          if [[ -z "${STAGING_E2E_USERNAME:-}" ]]; then
            echo 'No synthetic identity to clean.'
          else
            python3 -S scripts/staging_smoke_user_cleanup.py
          fi

      - name: Upload bounded timing receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-pvp-compositor-ab-${{ github.sha }}
          path: ${{ runner.temp }}/staging-pvp-ab.txt
          if-no-files-found: ignore
          retention-days: 7
