name: Chronicles · temporary corpus export
on:
  pull_request:
    paths:
      - '.github/workflows/chronicles-corpus-export.yml'
      - 'backend-python/chronicles_maps/**'
permissions:
  contents: write
jobs:
  generate:
    name: Export exact Python parity fixture
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/chronicles-world-authoritative-maps-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt
      - name: Install backend runtime requirements
        run: python -m pip install -r backend-python/requirements-dev.txt
      - name: Generate authoritative cross-runtime fixtures
        run: python scripts/chronicles_contracts.py
      - name: Upload generated corpus for review before committing
        uses: actions/upload-artifact@v7
        with:
          name: chronicles-world-corpus
          path: |
            backend-go/internal/chronicles/testdata/python_chronicles_area_corpus.json
            backend-go/internal/gamesapi/testdata/python_chronicles_runs_corpus.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit deterministic fixtures back to this same source PR
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-go/internal/chronicles/testdata/python_chronicles_area_corpus.json
          git add backend-go/internal/gamesapi/testdata/python_chronicles_runs_corpus.json
          if git diff --cached --quiet; then
            echo "Both parity fixtures already match."
            exit 0
          fi
          git commit -m "test(chronicles): regenerate Go/Python run fixtures for 13 published maps"
          git push origin "HEAD:refs/heads/$PR_HEAD_REF"
