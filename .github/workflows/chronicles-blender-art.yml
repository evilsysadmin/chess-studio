name: Chronicles · Blender canonical art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_chronicles_tactics_party.py'
      - 'scripts/blender/render_chronicles_party_preview.py'
      - 'scripts/blender/build_home_matthias.py'
      - 'scripts/blender/home_matthias_*.py'
      - '.github/workflows/chronicles-blender-art.yml'
  workflow_dispatch:
    inputs:
      asset:
        description: Canonical asset to rebuild
        required: true
        default: all
        type: choice
        options:
          - all
          - party
          - matthias

permissions:
  contents: read

concurrency:
  group: chronicles-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify canonical Blender work
    runs-on: ubuntu-latest
    outputs:
      party: ${{ steps.scope.outputs.party }}
      matthias: ${{ steps.scope.outputs.matthias }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Detect affected canonical assets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ASSET: ${{ inputs.asset || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          party=false
          matthias=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DISPATCH_ASSET" == "all" || "$DISPATCH_ASSET" == "party" ]] && party=true
            [[ "$DISPATCH_ASSET" == "all" || "$DISPATCH_ASSET" == "matthias" ]] && matthias=true
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if grep -Eq '^(scripts/blender/build_chronicles_tactics_party.py|scripts/blender/render_chronicles_party_preview.py|\.github/workflows/chronicles-blender-art.yml)$' <<<"$changed"; then
              party=true
            fi
            if grep -Eq '^(scripts/blender/build_home_matthias.py|scripts/blender/home_matthias_[^/]+\.py|\.github/workflows/chronicles-blender-art.yml)$' <<<"$changed"; then
              matthias=true
            fi
          fi
          echo "party=$party" >> "$GITHUB_OUTPUT"
          echo "matthias=$matthias" >> "$GITHUB_OUTPUT"

  party:
    name: Build · Chronicles party canonical
    needs: scope
    if: needs.scope.outputs.party == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - name: Install Blender + image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
      - name: Build canonical party blend + GLB
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/chronicles-art/party/previews
          blender --background \
            --python scripts/blender/build_chronicles_tactics_party.py \
            -- \
            --blend /tmp/chronicles-art/party/chronicles-tactics-party.blend \
            --glb /tmp/chronicles-art/party/chronicles-tactics-party.glb
      - name: Render deterministic party previews
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          blender --background \
            --python scripts/blender/render_chronicles_party_preview.py \
            -- \
            --blend /tmp/chronicles-art/party/chronicles-tactics-party.blend \
            --output-dir /tmp/chronicles-art/party/previews
      - name: Sanity-check canonical party contract
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          test -s /tmp/chronicles-art/party/chronicles-tactics-party.blend
          test -s /tmp/chronicles-art/party/chronicles-tactics-party.glb
          for member in rook bishop knight; do
            test -s "/tmp/chronicles-art/party/previews/chronicles-party-${member}.png"
          done
          test -s /tmp/chronicles-art/party/previews/chronicles-party-group.png
          blender --background /tmp/chronicles-art/party/chronicles-tactics-party.blend --python-expr "import bpy; members=('rook','bishop','knight'); roots=[bpy.data.objects.get('ChroniclesParty__'+m) for m in members]; assert all(roots), roots; assert bpy.context.scene.get('chronicles_cast') == 'rook,bishop,knight'; [(_ for _ in ()).throw(AssertionError((r.name, len([o for o in r.children if o.type == 'MESH'])))) if len([o for o in r.children if o.type == 'MESH']) < 10 else None for r in roots]"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('/tmp/chronicles-art/party/previews')
          for name in ('rook', 'bishop', 'knight'):
              image = Image.open(root / f'chronicles-party-{name}.png').convert('RGB')
              assert image.size == (720, 820), (name, image.size)
              extrema = image.getextrema()
              assert any(high - low > 24 for low, high in extrema), (name, extrema)
          group = Image.open(root / 'chronicles-party-group.png')
          assert group.size == (1280, 720), group.size
          PY
          sha256sum /tmp/chronicles-art/party/chronicles-tactics-party.blend \
            /tmp/chronicles-art/party/chronicles-tactics-party.glb \
            /tmp/chronicles-art/party/previews/*.png \
            > /tmp/chronicles-art/party/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicles-party-canonical-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/chronicles-art/party/
          if-no-files-found: error
          retention-days: 7

  matthias:
    name: Build · Matthias canonical
    needs: scope
    if: needs.scope.outputs.matthias == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - name: Install Blender + image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
      - name: Build canonical Matthias blend + GLB + preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/chronicles-art/matthias
          blender --background \
            --python scripts/blender/build_home_matthias.py \
            -- \
            --blend /tmp/chronicles-art/matthias/matthias-home-canonical.blend \
            --glb /tmp/chronicles-art/matthias/matthias-home-canonical.glb \
            --preview /tmp/chronicles-art/matthias/matthias-home-canonical.png
      - name: Sanity-check canonical Matthias contract
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          test -s /tmp/chronicles-art/matthias/matthias-home-canonical.blend
          test -s /tmp/chronicles-art/matthias/matthias-home-canonical.glb
          test -s /tmp/chronicles-art/matthias/matthias-home-canonical.png
          blender --background /tmp/chronicles-art/matthias/matthias-home-canonical.blend --python-expr "import bpy; rig=bpy.data.objects.get('MatthiasRig'); assert rig is not None; assert rig.get('matthias_asset_version'); meshes=[o for o in bpy.data.objects if o.type == 'MESH']; assert len(meshes) >= 20, len(meshes)"
          python3 - <<'PY'
          from PIL import Image
          path = '/tmp/chronicles-art/matthias/matthias-home-canonical.png'
          image = Image.open(path).convert('RGB')
          assert image.size == (560, 700), image.size
          extrema = image.getextrema()
          assert any(high - low > 24 for low, high in extrema), extrema
          PY
          sha256sum /tmp/chronicles-art/matthias/* > /tmp/chronicles-art/matthias/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matthias-canonical-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/chronicles-art/matthias/
          if-no-files-found: error
          retention-days: 7
