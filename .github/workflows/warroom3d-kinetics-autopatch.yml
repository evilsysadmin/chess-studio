name: War Room 3D kinetics autopatch

on:
  push:
    branches:
      - feature/warroom3d-kinetics

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[warroom3d-kinetics-seed]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/warroom3d-kinetics
          fetch-depth: 0
      - name: Apply focused War Room 3D kinetics patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          motion = r'''export function clamp01(value) {
            return Math.min(1, Math.max(0, Number(value) || 0));
          }

          export function easeOutCubic(value) {
            const t = clamp01(value);
            return 1 - Math.pow(1 - t, 3);
          }

          export function smoothstep(edge0, edge1, value) {
            if (edge0 === edge1) return value >= edge1 ? 1 : 0;
            const t = clamp01((value - edge0) / (edge1 - edge0));
            return t * t * (3 - 2 * t);
          }

          export function inferCapturedPiece(previousPieces = [], nextPieces = [], animate = null) {
            if (!animate?.capture || !animate?.from || !animate?.to) return null;
            const mover = previousPieces.find((piece) => piece.square === animate.from) || null;
            if (!mover) return null;
            const direct = previousPieces.find((piece) => piece.square === animate.to && piece.color !== mover.color);
            if (direct) return direct;
            return previousPieces.find((piece) => {
              if (piece.square === animate.from || piece.color === mover.color) return false;
              return !nextPieces.some((next) => next.square === piece.square && next.color === piece.color && next.type === piece.type);
            }) || null;
          }

          export function deriveMoveKinetics({ movingType = 'p', capture = false, promotion = false, castling = false, coarsePointer = false } = {}) {
            const type = String(movingType || 'p').toLowerCase();
            const duration = coarsePointer ? (capture ? 250 : 210) : (capture ? 330 : type === 'n' ? 300 : 255);
            const lift = coarsePointer ? 0.08 : type === 'n' ? 0.28 : capture ? 0.19 : 0.13;
            return {
              duration,
              lift,
              impactStart: capture ? 0.48 : 1,
              captureTilt: capture ? 0.78 : 0,
              promotionPulse: promotion ? 0.085 : 0,
              rookDelay: castling ? 0.16 : 0,
            };
          }

          export function reactiveLightProfile({ check = false, gameOver = false, coarsePointer = false } = {}) {
            const baseExposure = coarsePointer ? 1.02 : 1.05;
            if (gameOver) return { key: 1.65, rim: 8.4, warm: 3.1, exposure: baseExposure - 0.08, fogDensity: 0.022 };
            if (check) return { key: 2.7, rim: 18.5, warm: 5.2, exposure: baseExposure + 0.01, fogDensity: 0.0195 };
            return { key: 2.35, rim: 14.5, warm: 5.8, exposure: baseExposure, fogDensity: 0.018 };
          }

          export function adaptiveRenderScale({ coarsePointer = false, slowFrameCount = 0 } = {}) {
            if (coarsePointer) return slowFrameCount >= 8 ? 1 : 1.25;
            return slowFrameCount >= 10 ? 1.35 : 1.75;
          }
          '''
          Path('frontend/src/components/WarRoom3DMotion.js').write_text(motion, encoding='utf-8')

          motion_test = r'''import { describe, expect, it } from 'vitest';
          import {
            adaptiveRenderScale,
            deriveMoveKinetics,
            inferCapturedPiece,
            reactiveLightProfile,
            smoothstep,
          } from './WarRoom3DMotion.js';

          describe('WarRoom3DMotion', () => {
            it('finds direct and en-passant-style captured pieces from real board deltas', () => {
              expect(inferCapturedPiece(
                [{ square: 'e4', type: 'p', color: 'w' }, { square: 'd5', type: 'p', color: 'b' }],
                [{ square: 'd5', type: 'p', color: 'w' }],
                { from: 'e4', to: 'd5', capture: true },
              )).toMatchObject({ square: 'd5', color: 'b' });

              expect(inferCapturedPiece(
                [{ square: 'e5', type: 'p', color: 'w' }, { square: 'd5', type: 'p', color: 'b' }],
                [{ square: 'd6', type: 'p', color: 'w' }],
                { from: 'e5', to: 'd6', capture: true },
              )).toMatchObject({ square: 'd5', color: 'b' });
            });

            it('gives knights and captures more physical travel than quiet rook-like moves', () => {
              const quiet = deriveMoveKinetics({ movingType: 'r' });
              const knight = deriveMoveKinetics({ movingType: 'n' });
              const capture = deriveMoveKinetics({ movingType: 'q', capture: true });
              expect(knight.lift).toBeGreaterThan(quiet.lift);
              expect(capture.duration).toBeGreaterThan(quiet.duration);
              expect(capture.captureTilt).toBeGreaterThan(0.5);
            });

            it('uses restrained check light and a dimmer terminal tableau', () => {
              const normal = reactiveLightProfile();
              const check = reactiveLightProfile({ check: true });
              const terminal = reactiveLightProfile({ gameOver: true });
              expect(check.rim).toBeGreaterThan(normal.rim);
              expect(terminal.exposure).toBeLessThan(normal.exposure);
              expect(terminal.fogDensity).toBeGreaterThan(normal.fogDensity);
            });

            it('degrades render scale only after sustained slow frames', () => {
              expect(adaptiveRenderScale({ slowFrameCount: 2 })).toBe(1.75);
              expect(adaptiveRenderScale({ slowFrameCount: 12 })).toBe(1.35);
              expect(adaptiveRenderScale({ coarsePointer: true, slowFrameCount: 12 })).toBe(1);
            });

            it('smoothstep stays bounded', () => {
              expect(smoothstep(0.4, 0.8, -1)).toBe(0);
              expect(smoothstep(0.4, 0.8, 2)).toBe(1);
            });
          });
          '''
          Path('frontend/src/components/WarRoom3DMotion.test.js').write_text(motion_test, encoding='utf-8')

          path = Path('frontend/src/components/Board3D.jsx')
          text = path.read_text(encoding='utf-8')

          text = replace_once(text,
              "import { USER_PREFERENCES_CHANGED_EVENT, getEffectiveReducedMotion } from '../userPreferences.js';\n",
              "import { USER_PREFERENCES_CHANGED_EVENT, getEffectiveReducedMotion } from '../userPreferences.js';\nimport { adaptiveRenderScale, deriveMoveKinetics, easeOutCubic, inferCapturedPiece, reactiveLightProfile, smoothstep } from './WarRoom3DMotion.js';\n",
              'motion import')

          text = replace_once(text,
              "  camera.lookAt(target);\n  camera.updateProjectionMatrix();\n",
              "  camera.lookAt(target);\n  camera.userData.basePosition = camera.position.clone();\n  camera.userData.baseTarget = target.clone();\n  camera.updateProjectionMatrix();\n",
              'camera base pose')

          text = replace_once(text,
              "  checkSquare,\n  showCoordinates = true,\n",
              "  checkSquare,\n  gameOver = false,\n  showCoordinates = true,\n",
              'gameOver prop')

          text = replace_once(text,
              "  const animationFrameRef = useRef(0);\n  const lastAnimatedSeqRef = useRef(0);\n",
              "  const animationFrameRef = useRef(0);\n  const ambientFrameRef = useRef(0);\n  const previousFenRef = useRef(fen);\n  const lastAnimatedSeqRef = useRef(0);\n  const inspectModeRef = useRef(false);\n  const cameraMotionRef = useRef({ x: 0, y: 0, targetX: 0, targetY: 0, yaw: 0, pitch: 0, dragging: false, lastX: 0, lastY: 0 });\n",
              'motion refs')

          text = replace_once(text,
              "  const [rendererLabel, setRendererLabel] = useState('3D');\n  const [focusedSquare, setFocusedSquare] = useState(() => orientation === 'black' ? 'e8' : 'e1');\n",
              "  const [rendererLabel, setRendererLabel] = useState('3D');\n  const [focusedSquare, setFocusedSquare] = useState(() => orientation === 'black' ? 'e8' : 'e1');\n  const [inspectMode, setInspectMode] = useState(false);\n",
              'inspect state')

          text = replace_once(text,
              "  useEffect(() => {\n    setFocusedSquare(orientation === 'black' ? 'e8' : 'e1');\n  }, [orientation]);\n\n",
              "  useEffect(() => {\n    setFocusedSquare(orientation === 'black' ? 'e8' : 'e1');\n  }, [orientation]);\n\n  useEffect(() => {\n    inspectModeRef.current = inspectMode;\n    if (!inspectMode) {\n      const motion = cameraMotionRef.current;\n      motion.yaw = 0;\n      motion.pitch = 0;\n      motion.dragging = false;\n    }\n  }, [inspectMode]);\n\n",
              'inspect ref sync')

          text = replace_once(text,
              "    function onPointerDown(event) {\n      pointerStartRef.current = { x: event.clientX, y: event.clientY, id: event.pointerId };\n    }\n\n    function onPointerUp(event) {\n      const start = pointerStartRef.current;\n      pointerStartRef.current = null;\n      if (!start || start.id !== event.pointerId) return;\n      if (Math.hypot(event.clientX - start.x, event.clientY - start.y) > 8) return;\n      const square = squareFromPointer(event);\n      if (!square) return;\n      setFocusedSquare(square);\n      latestPropsRef.current.onSquareClick?.(square);\n    }\n",
              "    function onPointerDown(event) {\n      pointerStartRef.current = { x: event.clientX, y: event.clientY, id: event.pointerId };\n      if (inspectModeRef.current) {\n        const motion = cameraMotionRef.current;\n        motion.dragging = true;\n        motion.lastX = event.clientX;\n        motion.lastY = event.clientY;\n        renderer.domElement.setPointerCapture?.(event.pointerId);\n      }\n    }\n\n    function onPointerMove(event) {\n      const rect = renderer.domElement.getBoundingClientRect();\n      const motion = cameraMotionRef.current;\n      if (inspectModeRef.current && motion.dragging) {\n        const dx = event.clientX - motion.lastX;\n        const dy = event.clientY - motion.lastY;\n        motion.lastX = event.clientX;\n        motion.lastY = event.clientY;\n        motion.yaw = THREE.MathUtils.clamp(motion.yaw - dx * 0.0023, -0.14, 0.14);\n        motion.pitch = THREE.MathUtils.clamp(motion.pitch - dy * 0.0018, -0.08, 0.075);\n        return;\n      }\n      motion.targetX = THREE.MathUtils.clamp(((event.clientX - rect.left) / Math.max(1, rect.width) - 0.5) * 2, -1, 1);\n      motion.targetY = THREE.MathUtils.clamp(((event.clientY - rect.top) / Math.max(1, rect.height) - 0.5) * 2, -1, 1);\n    }\n\n    function onPointerLeave() {\n      const motion = cameraMotionRef.current;\n      motion.targetX = 0;\n      motion.targetY = 0;\n      motion.dragging = false;\n    }\n\n    function onPointerUp(event) {\n      const start = pointerStartRef.current;\n      pointerStartRef.current = null;\n      if (inspectModeRef.current) {\n        cameraMotionRef.current.dragging = false;\n        renderer.domElement.releasePointerCapture?.(event.pointerId);\n        return;\n      }\n      if (!start || start.id !== event.pointerId) return;\n      if (Math.hypot(event.clientX - start.x, event.clientY - start.y) > 8) return;\n      const square = squareFromPointer(event);\n      if (!square) return;\n      setFocusedSquare(square);\n      latestPropsRef.current.onSquareClick?.(square);\n    }\n",
              'pointer handlers')

          text = replace_once(text,
              "    renderer.domElement.addEventListener('pointerdown', onPointerDown, { passive: true });\n    renderer.domElement.addEventListener('pointerup', onPointerUp, { passive: true });\n    renderer.domElement.addEventListener('webglcontextlost', onContextLost, false);\n\n    sceneStateRef.current = {\n      scene,\n      camera,\n      renderer,\n      pieceGroup,\n      pieceMeshes,\n      highlightMeshes,\n      coarsePointer,\n      render,\n    };\n",
              "    renderer.domElement.addEventListener('pointerdown', onPointerDown, { passive: true });\n    renderer.domElement.addEventListener('pointermove', onPointerMove, { passive: true });\n    renderer.domElement.addEventListener('pointerleave', onPointerLeave, { passive: true });\n    renderer.domElement.addEventListener('pointerup', onPointerUp, { passive: true });\n    renderer.domElement.addEventListener('webglcontextlost', onContextLost, false);\n\n    let lastAmbientPaint = 0;\n    function ambientFrame(now) {\n      const motion = cameraMotionRef.current;\n      const reduced = getEffectiveReducedMotion();\n      const activeMotion = motion.dragging || Math.abs(motion.x - motion.targetX) > 0.003 || Math.abs(motion.y - motion.targetY) > 0.003;\n      const interval = activeMotion ? 16 : 33;\n      if (!document.hidden && !reduced && !coarsePointer && now - lastAmbientPaint >= interval) {\n        lastAmbientPaint = now;\n        motion.x += (motion.targetX - motion.x) * 0.075;\n        motion.y += (motion.targetY - motion.y) * 0.075;\n        const basePosition = camera.userData.basePosition;\n        const baseTarget = camera.userData.baseTarget;\n        if (basePosition && baseTarget) {\n          const breathYaw = Math.sin(now * 0.00018) * 0.0045;\n          const breathPitch = Math.sin(now * 0.00014 + 1.1) * 0.0022;\n          const yaw = (inspectModeRef.current ? motion.yaw : motion.x * 0.025) + breathYaw;\n          const pitch = (inspectModeRef.current ? motion.pitch : -motion.y * 0.012) + breathPitch;\n          const offset = basePosition.clone().sub(baseTarget).applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));\n          camera.position.copy(baseTarget).add(offset);\n          camera.lookAt(baseTarget.clone().add(new THREE.Vector3(motion.x * 0.035, -motion.y * 0.018, 0)));\n          render();\n        }\n      }\n      ambientFrameRef.current = window.requestAnimationFrame(ambientFrame);\n    }\n    if (!coarsePointer) ambientFrameRef.current = window.requestAnimationFrame(ambientFrame);\n\n    sceneStateRef.current = {\n      scene,\n      camera,\n      renderer,\n      pieceGroup,\n      pieceMeshes,\n      highlightMeshes,\n      coarsePointer,\n      key,\n      rim,\n      warm,\n      render,\n      renderScale: Math.min(window.devicePixelRatio || 1, coarsePointer ? 1.25 : 1.75),\n      slowFrameCount: 0,\n    };\n",
              'ambient camera loop')

          text = replace_once(text,
              "      window.cancelAnimationFrame(animationFrameRef.current);\n      animationFrameRef.current = 0;\n      observer?.disconnect();\n      renderer.domElement.removeEventListener('pointerdown', onPointerDown);\n      renderer.domElement.removeEventListener('pointerup', onPointerUp);\n",
              "      window.cancelAnimationFrame(animationFrameRef.current);\n      animationFrameRef.current = 0;\n      window.cancelAnimationFrame(ambientFrameRef.current);\n      ambientFrameRef.current = 0;\n      observer?.disconnect();\n      renderer.domElement.removeEventListener('pointerdown', onPointerDown);\n      renderer.domElement.removeEventListener('pointermove', onPointerMove);\n      renderer.domElement.removeEventListener('pointerleave', onPointerLeave);\n      renderer.domElement.removeEventListener('pointerup', onPointerUp);\n",
              'listener cleanup')

          start_marker = "  useEffect(() => {\n    const state = sceneStateRef.current;\n    if (!state) return undefined;\n    window.cancelAnimationFrame(animationFrameRef.current);\n    animationFrameRef.current = 0;\n\n    for (const child of [...state.pieceGroup.children]) {"
          start = text.find(start_marker)
          end = text.find("\n\n  const legalMap = useMemo", start)
          if start < 0 or end < 0:
              raise SystemExit('missing move effect block')

          new_effect = r'''  useEffect(() => {
            const state = sceneStateRef.current;
            if (!state) return undefined;
            window.cancelAnimationFrame(animationFrameRef.current);
            animationFrameRef.current = 0;

            const previousPieces = parseFen(previousFenRef.current);
            const nextPieces = parseFen(fen);
            const movingBefore = animate?.from ? previousPieces.find((piece) => piece.square === animate.from) : null;
            const movingAfter = animate?.to ? nextPieces.find((piece) => piece.square === animate.to) : null;
            const capturedPiece = inferCapturedPiece(previousPieces, nextPieces, animate);
            const promotion = Boolean(movingBefore?.type === 'p' && movingAfter && movingAfter.type !== 'p');
            const fromFile = FILES.indexOf(animate?.from?.[0]);
            const toFile = FILES.indexOf(animate?.to?.[0]);
            const castling = Boolean(movingBefore?.type === 'k' && fromFile >= 0 && toFile >= 0 && Math.abs(toFile - fromFile) === 2);

            for (const child of [...state.pieceGroup.children]) {
              state.pieceGroup.remove(child);
              disposeObject(child);
            }
            state.pieceMeshes.clear();

            for (const piece of nextPieces) {
              const matthiasKing = isMatthiasRivalKing(piece, matthiasKingColor);
              const mesh = buildPiece(piece.type, piece.color, skinId, state.coarsePointer, {
                matthiasKing,
                faceTowardCamera: orientation !== 'black',
              });
              const { x, z } = squarePosition(piece.square);
              mesh.position.set(x, 0.1, z);
              mesh.userData.square = piece.square;
              mesh.userData.type = piece.type;
              mesh.userData.color = piece.color;
              if (matthiasKing) mesh.userData.matthiasKing = true;
              mesh.traverse((object) => { object.userData.square = piece.square; });
              state.pieceGroup.add(mesh);
              state.pieceMeshes.set(piece.square, mesh);
            }

            previousFenRef.current = fen;
            const animatedMesh = animate?.to ? state.pieceMeshes.get(animate.to) : null;
            const shouldAnimate = Boolean(
              animatedMesh
              && animate?.from
              && animate?.to
              && animate?.seq
              && animate.seq !== lastAnimatedSeqRef.current
              && !getEffectiveReducedMotion(),
            );

            if (!shouldAnimate) {
              if (animate?.seq) lastAnimatedSeqRef.current = animate.seq;
              state.render();
              return undefined;
            }

            lastAnimatedSeqRef.current = animate.seq;
            const from = squarePosition(animate.from);
            const to = squarePosition(animate.to);
            const kinetics = deriveMoveKinetics({
              movingType: movingBefore?.type || movingAfter?.type,
              capture: Boolean(animate.capture),
              promotion,
              castling,
              coarsePointer: state.coarsePointer,
            });
            const start = performance.now();
            const baseScale = animatedMesh.scale.clone();
            let capturedGhost = null;
            let castleRook = null;
            let castleFrom = null;
            let castleTo = null;

            if (capturedPiece) {
              capturedGhost = buildPiece(capturedPiece.type, capturedPiece.color, skinId, state.coarsePointer, {
                matthiasKing: isMatthiasRivalKing(capturedPiece, matthiasKingColor),
                faceTowardCamera: orientation !== 'black',
              });
              const capturedPosition = squarePosition(capturedPiece.square);
              capturedGhost.position.set(capturedPosition.x, 0.1, capturedPosition.z);
              capturedGhost.userData.captureGhost = true;
              state.pieceGroup.add(capturedGhost);
            }

            if (castling) {
              const rank = animate.to[1];
              const kingSide = toFile > fromFile;
              const rookFromSquare = `${kingSide ? 'h' : 'a'}${rank}`;
              const rookToSquare = `${kingSide ? 'f' : 'd'}${rank}`;
              castleRook = state.pieceMeshes.get(rookToSquare) || null;
              castleFrom = squarePosition(rookFromSquare);
              castleTo = squarePosition(rookToSquare);
              if (castleRook) castleRook.position.set(castleFrom.x, 0.1, castleFrom.z);
            }

            function setOpacity(group, opacity) {
              group?.traverse?.((object) => {
                const materials = Array.isArray(object.material) ? object.material : [object.material];
                materials.forEach((material) => {
                  if (!material) return;
                  material.transparent = opacity < 0.999;
                  material.opacity = opacity;
                  if (opacity < 0.999) material.depthWrite = false;
                });
              });
            }

            function frame(now) {
              const raw = Math.min(1, Math.max(0, (now - start) / kinetics.duration));
              const progress = animate.kind === 'miss'
                ? (raw < 0.5 ? raw * 0.72 : (1 - raw) * 0.72)
                : easeOutCubic(raw);
              animatedMesh.position.x = to.x + (from.x - to.x) * (1 - progress);
              animatedMesh.position.z = to.z + (from.z - to.z) * (1 - progress);
              animatedMesh.position.y = 0.1 + Math.sin(raw * Math.PI) * (animate.kind === 'miss' ? 0.08 : kinetics.lift);

              if (animate.capture && capturedGhost) {
                const impact = smoothstep(kinetics.impactStart, 0.9, raw);
                const side = orientation === 'black' ? -1 : 1;
                capturedGhost.rotation.z = side * kinetics.captureTilt * impact;
                capturedGhost.rotation.x = impact * 0.16;
                capturedGhost.position.y = 0.1 - impact * 0.075;
                capturedGhost.scale.multiplyScalar(1 - impact * 0.0016);
                setOpacity(capturedGhost, 1 - impact * 0.92);
                animatedMesh.rotation.z = Math.sin(impact * Math.PI) * 0.045 * side;
              }

              if (promotion && raw > 0.62) {
                const pulseT = (raw - 0.62) / 0.38;
                const pulse = Math.sin(Math.min(1, pulseT) * Math.PI) * kinetics.promotionPulse;
                animatedMesh.scale.copy(baseScale).multiplyScalar(1 + pulse);
                state.rim.intensity = 14.5 + pulse * 56;
              }

              if (castleRook && castleFrom && castleTo) {
                const rookRaw = clamp01((raw - kinetics.rookDelay) / Math.max(0.01, 1 - kinetics.rookDelay));
                const rookProgress = easeOutCubic(rookRaw);
                castleRook.position.x = castleTo.x + (castleFrom.x - castleTo.x) * (1 - rookProgress);
                castleRook.position.z = castleTo.z + (castleFrom.z - castleTo.z) * (1 - rookProgress);
                castleRook.position.y = 0.1 + Math.sin(rookRaw * Math.PI) * 0.075;
              }

              const dt = state.lastAnimationFrameAt ? now - state.lastAnimationFrameAt : 16;
              state.lastAnimationFrameAt = now;
              state.slowFrameCount = dt > 23 ? state.slowFrameCount + 1 : Math.max(0, state.slowFrameCount - 1);
              const requestedScale = adaptiveRenderScale({ coarsePointer: state.coarsePointer, slowFrameCount: state.slowFrameCount });
              const cappedScale = Math.min(window.devicePixelRatio || 1, requestedScale);
              if (cappedScale + 0.05 < state.renderScale) {
                state.renderScale = cappedScale;
                state.renderer.setPixelRatio(cappedScale);
                const host = hostRef.current;
                if (host) state.renderer.setSize(Math.max(280, host.clientWidth || 280), Math.max(300, host.clientHeight || 300), false);
              }

              state.render();
              if (raw < 1) animationFrameRef.current = window.requestAnimationFrame(frame);
              else {
                animatedMesh.position.set(to.x, 0.1, to.z);
                animatedMesh.rotation.z = 0;
                animatedMesh.scale.copy(baseScale);
                if (castleRook && castleTo) castleRook.position.set(castleTo.x, 0.1, castleTo.z);
                if (capturedGhost) {
                  state.pieceGroup.remove(capturedGhost);
                  disposeObject(capturedGhost);
                  capturedGhost = null;
                }
                const lights = reactiveLightProfile({ check: Boolean(checkSquare), gameOver, coarsePointer: state.coarsePointer });
                state.key.intensity = lights.key;
                state.rim.intensity = lights.rim;
                state.warm.intensity = lights.warm;
                state.renderer.toneMappingExposure = lights.exposure;
                state.render();
                animationFrameRef.current = 0;
                state.lastAnimationFrameAt = 0;
              }
            }

            animatedMesh.position.set(from.x, 0.1, from.z);
            state.render();
            animationFrameRef.current = window.requestAnimationFrame(frame);
            return () => {
              window.cancelAnimationFrame(animationFrameRef.current);
              animationFrameRef.current = 0;
              if (capturedGhost) {
                state.pieceGroup.remove(capturedGhost);
                disposeObject(capturedGhost);
              }
            };
          }, [fen, skinId, animate, boardTheme, orientation, showCoordinates, matthiasKingColor, checkSquare, gameOver]);'''
          # The effect uses clamp01; keep the import list explicit.
          text = text.replace("adaptiveRenderScale, deriveMoveKinetics, easeOutCubic, inferCapturedPiece, reactiveLightProfile, smoothstep", "adaptiveRenderScale, clamp01, deriveMoveKinetics, easeOutCubic, inferCapturedPiece, reactiveLightProfile, smoothstep", 1)
          text = text[:start] + new_effect + text[end:]

          highlight_marker = "  }, [selectedSquare, legalMap, lastMove, hintMove, checkSquare, focusedSquare, boardTheme, orientation, showCoordinates]);\n\n  function handleKeyDown(event) {"
          reactive = r'''  }, [selectedSquare, legalMap, lastMove, hintMove, checkSquare, focusedSquare, boardTheme, orientation, showCoordinates]);

          useEffect(() => {
            const state = sceneStateRef.current;
            if (!state) return;
            const lights = reactiveLightProfile({ check: Boolean(checkSquare), gameOver, coarsePointer: state.coarsePointer });
            state.key.intensity = lights.key;
            state.rim.intensity = lights.rim;
            state.warm.intensity = lights.warm;
            state.renderer.toneMappingExposure = lights.exposure;
            if (state.scene.fog?.isFogExp2) state.scene.fog.density = lights.fogDensity;
            state.render();
          }, [checkSquare, gameOver, boardTheme, orientation, showCoordinates]);

          function handleKeyDown(event) {'''
          text = replace_once(text, highlight_marker, reactive, 'reactive lights effect')

          text = replace_once(text,
              "      className=\"board3d-main-shell\"\n      data-board3d-war-room=\"true\"\n      data-board3d-scene=\"premium\"\n      data-board3d-surface=\"premium-v2\"\n",
