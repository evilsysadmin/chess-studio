          game_path.write_text(game, encoding='utf-8')

          css_path = Path('frontend/src/components/Board3D.css')
          css = css_path.read_text(encoding='utf-8')
          css += r'''

          /* War Room 3D kinetics: the board moves, the camera only breathes. */
          .board3d-inspect {
