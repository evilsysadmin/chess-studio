name: Quality · periodic signals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-periodic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    name: Frontend · V8 coverage
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Coverage frontend (informativo)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  backend-coverage:
    name: Backend · branch coverage
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt

      - name: Restore exact backend virtualenv
        uses: ./.github/actions/cache-python-venv

      - name: Coverage backend (informativo)
        working-directory: backend-python
        run: ../.venv/bin/python -m pytest -q --cov=. --cov-branch --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=0

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend-python/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL · ${{ matrix.language }}
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
