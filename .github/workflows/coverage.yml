name: Coverage report (informativo)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Coverage frontend (informativo)
        working-directory: frontend
        shell: bash
        run: |
          if [ ! -d node_modules/@vitest/coverage-v8 ]; then
            echo "::warning::@vitest/coverage-v8 no está declarado/instalado; coverage frontend omitido hasta sincronizar package.json + lockfile."
            exit 0
          fi
          npm run test:coverage
      - name: Publicar coverage frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  backend-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend-python
        run: pip install -r requirements-dev.txt
      - name: Coverage backend (informativo)
        working-directory: backend-python
        run: pytest -q --cov=. --cov-branch --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=0
      - name: Publicar coverage backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend-python/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
