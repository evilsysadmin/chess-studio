name: OCI ARM64 Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-python/Dockerfile'
      - 'backend-python/requirements*.txt'
      - 'scripts/oci_arm64_smoke.sh'
      - '.github/workflows/oci-arm64-readiness.yml'

permissions:
  contents: read

concurrency:
  group: oci-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-arm64:
    name: Backend · linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and execute ARM64 backend
        run: bash scripts/oci_arm64_smoke.sh
