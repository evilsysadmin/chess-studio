name: Game network race regressions

on:
  pull_request:
    paths:
      - 'e2e/offline-pending-move-reconnect.spec.js'
      - 'e2e/late-move-response-exit.spec.js'
      - 'frontend/src/useGameReconnect.js'
      - 'frontend/src/gameReconnect.js'
      - 'frontend/src/gameMutationCoordinator.js'
      - 'frontend/src/components/GameScreen.jsx'
      - '.github/workflows/offline-pending-move-reconnect.yml'
      - '.github/actions/setup-browser-e2e/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-network-race-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  network-races:
    name: Browser required · game network race regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore browser runtime and build frontend once
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'true'
          build-frontend: 'true'

      - name: Run reconnect and late-response contracts
        working-directory: e2e
        run: >-
          ./node_modules/.bin/playwright test
          offline-pending-move-reconnect.spec.js
          late-move-response-exit.spec.js
          --workers=1 --retries=0 --timeout=75000

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: game-network-race-regressions-${{ github.sha }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
