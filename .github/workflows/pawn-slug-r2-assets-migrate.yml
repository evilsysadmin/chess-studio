name: Temp · Pawn Slug Matthias → R2

on:
  push:
    branches:
      - chore/pawn-slug-r2-assets-1
    paths:
      - .github/workflows/pawn-slug-r2-assets-migrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Reconcile public R2 origin
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/cloudflare_r2_assets.py reconcile
          python3 -S scripts/cloudflare_r2_assets.py check

      - name: Verify canonical master
        shell: bash
        run: |
          set -euo pipefail
          echo '9c21264274777d012a2941073f6cbae94df090db0459624e6031207c0a288c5f  frontend/src/assets/pawnSlug/matthias_canonical_sprite_sheet_v1.png' | sha256sum -c -

      - name: Decode tracked runtime payloads to temporary WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pawn-slug-r2
          base64 -d frontend/src/assets/pawnSlug/matthias_machinegun_premium_v3.b64 > /tmp/pawn-slug-r2/matthias_machinegun_premium_v3.webp
          base64 -d frontend/src/assets/pawnSlug/matthias_shotgun_premium_v3.b64 > /tmp/pawn-slug-r2/matthias_shotgun_premium_v3.webp
          base64 -d frontend/src/assets/pawnSlug/matthias_panzerfaust_premium_v3.b64 > /tmp/pawn-slug-r2/matthias_panzerfaust_premium_v3.webp
          base64 -d frontend/src/assets/pawnSlug/matthias_motion_atlas_v5_payload.b64 > /tmp/pawn-slug-r2/matthias_motion_atlas_v5.webp
          file /tmp/pawn-slug-r2/*.webp

      - name: Publish immutable Matthias assets to R2
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/r2_asset_publish.py publish \
            frontend/src/assets/pawnSlug/matthias_canonical_sprite_sheet_v1.png \
            --logical-id pawnSlug.matthias.canonicalMaster \
            --prefix pawn-slug/matthias/master
          python3 -S scripts/r2_asset_publish.py publish \
            frontend/src/assets/pawnSlug/matthias_canonical_pistol_v1.webp \
            --logical-id pawnSlug.matthias.pistol \
            --prefix pawn-slug/matthias/pistol
          python3 -S scripts/r2_asset_publish.py publish \
            /tmp/pawn-slug-r2/matthias_machinegun_premium_v3.webp \
            --logical-id pawnSlug.matthias.machinegun \
            --prefix pawn-slug/matthias/machinegun
          python3 -S scripts/r2_asset_publish.py publish \
            /tmp/pawn-slug-r2/matthias_shotgun_premium_v3.webp \
            --logical-id pawnSlug.matthias.shotgun \
            --prefix pawn-slug/matthias/shotgun
          python3 -S scripts/r2_asset_publish.py publish \
            /tmp/pawn-slug-r2/matthias_panzerfaust_premium_v3.webp \
            --logical-id pawnSlug.matthias.panzerfaust \
            --prefix pawn-slug/matthias/panzerfaust
          python3 -S scripts/r2_asset_publish.py publish \
            /tmp/pawn-slug-r2/matthias_motion_atlas_v5.webp \
            --logical-id pawnSlug.matthias.motion \
            --prefix pawn-slug/matthias/motion
          python3 -S scripts/r2_asset_publish.py check-manifest

      - name: Verify public CDN bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.error, urllib.request

          path = pathlib.Path('frontend/src/assets/r2-assets-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          wanted = [k for k in manifest['assets'] if k.startswith('pawnSlug.matthias.')]
          assert len(wanted) == 6, wanted

          headers = {
              'User-Agent': 'Mozilla/5.0 ChessStudio-R2-Migration/1.0',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Origin': 'https://chess-studio.shadowops.dpdns.org',
          }
          for logical_id in sorted(wanted):
              entry = manifest['assets'][logical_id]
              last_error = None
              body = None
              for attempt in range(1, 13):
                  request = urllib.request.Request(entry['url'], headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = response.read()
                      break
                  except urllib.error.HTTPError as exc:
                      preview = exc.read(300).decode('utf-8', 'replace').replace('\n', ' ')
                      last_error = f'HTTP {exc.code}: {preview}'
                  except Exception as exc:
                      last_error = repr(exc)
                  print(f'CDN_WAIT {logical_id} attempt={attempt}/12 error={last_error}')
                  if attempt < 12:
                      time.sleep(5)
              if body is None:
                  raise RuntimeError(f'{logical_id}: public CDN unavailable after retries: {last_error}')
              digest = hashlib.sha256(body).hexdigest()
              assert digest == entry['sha256'], (logical_id, digest, entry['sha256'])
              assert len(body) == entry['bytes'], (logical_id, len(body), entry['bytes'])
              print(f'CDN_OK {logical_id} {entry["bytes"]} {entry["sha256"]}')
          PY

      - name: Commit R2 manifest pointer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/assets/r2-assets-manifest.json; then
            echo 'Manifest already committed; nothing to do.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/assets/r2-assets-manifest.json
          git commit -m 'chore: point Matthias runtime assets at R2'
          git push
