name: R2 · Chronicles public asset read-only probe
on:
  pull_request:
    paths:
      - .github/workflows/chronicles-r2-public-probe.yml
      - scripts/chronicles_r2_public_probe.py
      - tests/test_chronicles_r2_public_probe.py
  push:
    branches: [main]
    paths:
      - .github/workflows/chronicles-r2-public-probe.yml
      - scripts/chronicles_r2_public_probe.py
      - tests/test_chronicles_r2_public_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -S -m unittest discover -s tests -p 'test_chronicles_r2_public_probe.py' -v
  live:
    needs: contracts
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/chess-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read existing Chronicles R2 public domain and object headers
        run: python3 -S scripts/chronicles_r2_public_probe.py
