name: Apply zfrj product mechanics

on:
  push:
    branches:
      - feat/zfrj-product-mechanics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release delta safely
        shell: bash
        run: |
          set -euo pipefail
          cat .github/zfrj-bootstrap/part*.patch > /tmp/zfrj.patch

          set +e
          git apply --check /tmp/zfrj.patch > /tmp/zfrj-apply.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/zfrj-apply.log .github/zfrj-bootstrap/apply-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/zfrj-bootstrap/apply-error.txt
            git commit -m "chore: capture zfrj patch conflict"
            git push origin HEAD:feat/zfrj-product-mechanics
            exit "$rc"
          fi

          git apply --whitespace=nowarn /tmp/zfrj.patch

          set +e
          make static-preflight > /tmp/zfrj-preflight.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/zfrj-preflight.log .github/zfrj-bootstrap/preflight-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/zfrj-bootstrap/preflight-error.txt
            git commit -m "chore: capture zfrj preflight failure"
            git push origin HEAD:feat/zfrj-product-mechanics
            exit "$rc"
          fi

          rm -rf .github/zfrj-bootstrap .github/workflows/zfrj-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add classified ops, recovery and personal seasons"
          git push origin HEAD:feat/zfrj-product-mechanics

      - name: Package exact release tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip \
            --prefix=ChessStudio_v16.6dm46zfrj_COMPLETE/ \
            -o /tmp/ChessStudio_v16.6dm46zfrj_COMPLETE.zip HEAD

      - name: Upload complete release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChessStudio_v16.6dm46zfrj_COMPLETE
          path: /tmp/ChessStudio_v16.6dm46zfrj_COMPLETE.zip
          if-no-files-found: error
          retention-days: 7
