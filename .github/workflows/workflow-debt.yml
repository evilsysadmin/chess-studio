name: Quality · workflow debt ratchet

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/branch_housekeeping.sh'
      - 'scripts/cloudflare_exporter_config.py'
      - 'scripts/cloudflare_exporter_health.py'
      - 'scripts/main_lineage_guard.py'
      - 'scripts/staging_release_identity.py'
      - 'scripts/workflow_budget_gate.py'
      - 'scripts/workflow_inventory_gate.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/branch_housekeeping.sh'
      - 'scripts/cloudflare_exporter_config.py'
      - 'scripts/cloudflare_exporter_health.py'
      - 'scripts/main_lineage_guard.py'
      - 'scripts/staging_release_identity.py'
      - 'scripts/workflow_budget_gate.py'
      - 'scripts/workflow_inventory_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-debt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-budget:
    name: Workflow debt gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate debt helpers
        run: |
          bash scripts/branch_housekeeping.sh --self-test
          python3 -S scripts/cloudflare_exporter_config.py --self-test
          python3 -S scripts/cloudflare_exporter_health.py --self-test
          python3 -S scripts/main_lineage_guard.py --self-test
          python3 -S scripts/staging_release_identity.py --self-test
          python3 -S scripts/workflow_budget_gate.py --self-test
          python3 -S scripts/workflow_inventory_gate.py --self-test

      - name: Enforce workflow ownership inventory
        run: python3 -S scripts/workflow_inventory_gate.py

      - name: Enforce workflow budgets
        run: python3 -S scripts/workflow_budget_gate.py
