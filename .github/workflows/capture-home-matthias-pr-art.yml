name: Home Matthias · PR visual artifact

# Read-only visual proof for an exact in-repo PR head. Comment
# `/capture-home-matthias` after materializing the GLB to get deterministic
# desktop/mobile screenshots from the real Home Three.js runtime.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: capture-home-matthias-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Home Matthias from PR head
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/capture-home-matthias' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve and authorize PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          if [[ "${head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Refusing to execute PR art from fork: ${head_repo}" >&2
            exit 1
          fi
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'true'

      - name: Capture deterministic Home Matthias desktop + mobile
        working-directory: e2e
        env:
          APP_VISUAL_ARTIFACT: '1'
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright test matthias-home-visual-artifact.spec.js --workers=1 --retries=0

      - name: Record exact PR head
        if: always()
        shell: bash
        run: printf '%s\n' '${{ steps.pr.outputs.head_sha }}' > .artifacts/app-visual/home-matthias-pr-head.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: home-matthias-pr-${{ github.event.issue.number }}
          path: |
            .artifacts/app-visual/home-matthias-*.png
            .artifacts/app-visual/home-matthias-pr-head.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
