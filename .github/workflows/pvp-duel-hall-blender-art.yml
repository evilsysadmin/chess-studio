name: PvP Duel Hall · Blender art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_pvp_duel_hall.py'
      - 'scripts/blender/configure_eevee_premium.py'
      - 'scripts/blender/publish_pvp_duel_hall.py'
      - '.github/workflows/pvp-duel-hall-blender-art.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/blender/build_pvp_duel_hall.py'
      - 'scripts/blender/configure_eevee_premium.py'
      - 'scripts/blender/publish_pvp_duel_hall.py'
      - '.github/workflows/pvp-duel-hall-blender-art.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvp-duel-hall-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render PvP Duel Hall
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build authored scene + runtime shell + preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_EEVEE_PREMIUM: '1'
          BLENDER_PREVIEW_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && '64' || (github.event_name == 'pull_request' && '20' || '32') }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pvp-duel-hall
          blender --background --python-exit-code 1 \
            --python scripts/blender/configure_eevee_premium.py \
            --python scripts/blender/build_pvp_duel_hall.py -- \
            --blend /tmp/pvp-duel-hall/pvp-duel-hall.blend \
            --glb /tmp/pvp-duel-hall/pvp-duel-hall-shell.glb \
            --preview /tmp/pvp-duel-hall/pvp-duel-hall-preview.png \
            --manifest /tmp/pvp-duel-hall/pvp-duel-hall-manifest.json

      - name: Validate Duel Hall artifact envelope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct
          from PIL import Image

          root = Path('/tmp/pvp-duel-hall')
          blend = root / 'pvp-duel-hall.blend'
          glb = root / 'pvp-duel-hall-shell.glb'
          preview = root / 'pvp-duel-hall-preview.png'
          manifest = root / 'pvp-duel-hall-manifest.json'

          assert blend.stat().st_size > 100_000, blend.stat().st_size
          assert glb.stat().st_size > 40_000, glb.stat().st_size

          image = Image.open(preview).convert('RGB')
          assert image.size == (1600, 900), image.size
          extrema = image.getextrema()
          assert max(channel[1] for channel in extrema) > 90, extrema
          assert min(channel[0] for channel in extrema) < 35, extrema

          data = json.loads(manifest.read_text())
          assert data['contract'] == 'pvp-duel-hall-gothic-lobby-v1'
          names = {row['name'] for row in data['objects']}
          required = {
              'PVP_HALL_floor',
              'PVP_HALL_window_glass',
              'PVP_HALL_identity_plinth',
              'PVP_HALL_identity_pawn_head',
              'PVP_HALL_strategy_top',
              'PVP_HALL_roster_frame',
              'PVP_HALL_herald_tray',
              'PVP_HALL_chat_frame',
              'PVP_HALL_owl_body',
              'PVP_HALL_ANCHOR_identity',
              'PVP_HALL_ANCHOR_roster',
              'PVP_HALL_ANCHOR_herald',
              'PVP_HALL_ANCHOR_chat',
          }
          assert not (required - names), sorted(required - names)
          assert not any(name.startswith(('WR_ARCH_', 'WR_CANON_', 'WR3_OBS_', 'PVP_DUEL_')) for name in names)

          raw = glb.read_bytes()
          assert raw[:4] == b'glTF'
          chunk_length, chunk_type = struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A
          gltf = json.loads(raw[20:20 + chunk_length].decode('utf-8').rstrip('\x00 \t\r\n'))
          assert 'EXT_meshopt_compression' in gltf.get('extensionsUsed', [])
          node_names = {row.get('name') for row in gltf.get('nodes', [])}
          for anchor in (
              'PVP_HALL_ANCHOR_identity',
              'PVP_HALL_ANCHOR_roster',
              'PVP_HALL_ANCHOR_herald',
              'PVP_HALL_ANCHOR_chat',
          ):
              assert anchor in node_names, anchor
          PY

      - name: Publish PvP Duel Hall shell
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 -S scripts/blender/publish_pvp_duel_hall.py \
            /tmp/pvp-duel-hall/pvp-duel-hall-shell.glb \
            --revision '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}' \
            --channel '${{ github.event_name == 'push' && 'runtime' || 'staging' }}'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pvp-duel-hall-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/pvp-duel-hall/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
