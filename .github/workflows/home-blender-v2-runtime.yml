name: Home · publish Blender runtime scene

on:
  push:
    branches: [main]
    paths:
      # Generic R2 publisher changes are validated by r2-assets-infra.yml;
      # rebuilding a non-deterministic Home GLB here would only create churn.
      - 'scripts/blender/build_home_v2_blockout.py'
      - 'scripts/blender/export_home_v2_runtime.py'
      - 'scripts/blender/references/home_canon_20260918.webp.b64'
      - '.github/workflows/home-blender-v2-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-blender-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Home Blender runtime GLB
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      published: ${{ steps.entry.outputs.published }}
      key: ${{ steps.entry.outputs.key }}
      sha256: ${{ steps.entry.outputs.sha256 }}
      bytes: ${{ steps.entry.outputs.bytes }}
      url: ${{ steps.entry.outputs.url }}
      contentType: ${{ steps.entry.outputs.contentType }}
    steps:
      - uses: actions/checkout@v7
      - name: Reject broken exporter syntax before Blender setup
        run: python3 -m py_compile scripts/blender/export_home_v2_runtime.py
      - uses: ./.github/actions/setup-blender-canonical
        with:
          extra-packages: webp
      - name: Export canonical Home runtime GLB
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_EEVEE_PREMIUM: '1'
          # The runtime loader decodes Meshopt; refuse to publish an uncompressed scene.
          HOME_RUNTIME_REQUIRE_MESHOPT: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-v2-runtime
          blender --background --python-exit-code 1 \
            --python scripts/blender/configure_eevee_premium.py \
            --python scripts/blender/export_home_v2_runtime.py -- \
            --reference scripts/blender/references/home_canon_20260918.webp.b64 \
            --out-dir /tmp/home-v2-runtime \
            --samples 16 \
            --max-width 1000
          test "$(head -c 4 /tmp/home-v2-runtime/home-v2-runtime.glb)" = 'glTF'
          test "$(stat -c%s /tmp/home-v2-runtime/home-v2-runtime.glb)" -lt 52428800
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('/tmp/home-v2-runtime')
          meta = json.loads((root / 'home-v2-runtime.json').read_text())
          assert meta['contract'] == 'home-blender-runtime-v1'
          assert meta['source_contract'] == 'home-blender-canon-20260918-v1'
          assert meta['logical_id'] == 'home.scene.runtime'
          assert meta['mesh_count'] >= 80
          assert meta['bytes'] == (root / 'home-v2-runtime.glb').stat().st_size
          print(json.dumps(meta, indent=2))
          PY
      - name: Validate R2 publish contract
        run: |
          set -euo pipefail
          python3 -S scripts/r2_asset_publish.py self-test
          python3 -S scripts/r2_asset_publish.py publish /tmp/home-v2-runtime/home-v2-runtime.glb \
            --logical-id home.scene.runtime \
            --prefix home/scene/canonical \
            --dry-run
      - name: Publish immutable runtime scene
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 -S scripts/r2_asset_publish.py publish /tmp/home-v2-runtime/home-v2-runtime.glb \
            --logical-id home.scene.runtime \
            --prefix home/scene/canonical
          python3 -S scripts/r2_asset_publish.py check-manifest
      - name: Expose the published entry for the gate/promote jobs
        if: github.event_name != 'pull_request'
        id: entry
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          manifest = json.load(open("frontend/src/assets/r2-assets-manifest.json"))
          entry = manifest["assets"]["home.scene.runtime"]
          print("published=true")
          for key in ("key", "sha256", "bytes", "url", "contentType"):
              print(f"{key}={entry[key]}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: home-blender-runtime-${{ github.run_number }}
          path: |
            /tmp/home-v2-runtime/
            frontend/src/assets/r2-assets-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  gate:
    name: Gate · Home runtime regression check
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'true'
          build-frontend: 'false'
      - name: Fetch the just-published runtime GLB
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 \
            '${{ needs.build.outputs.url }}' -o /tmp/home-v2-runtime-candidate.glb
          test "$(sha256sum /tmp/home-v2-runtime-candidate.glb | awk '{print $1}')" = '${{ needs.build.outputs.sha256 }}'
      - name: Run the runtime health gate
        working-directory: e2e
        env:
          HOME_RUNTIME_GATE_GLB: /tmp/home-v2-runtime-candidate.glb
          PLAYWRIGHT_SOURCE_SERVER: '1'
        run: ./node_modules/.bin/playwright test home-scene-runtime-gate.spec.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: home-scene-runtime-gate-failure-${{ github.run_number }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  promote:
    name: Promote · Home runtime manifest
    needs: [build, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # main requires a PR + passing status checks (repository rule), so this
      # can't push straight to main -- and it can't use the default
      # GITHUB_TOKEN to open that PR either: GitHub suppresses downstream
      # workflow runs (including the required status checks themselves) for
      # anything a workflow does with its own GITHUB_TOKEN, specifically to
      # prevent recursive triggering. A PAT from a real account doesn't have
      # that restriction, so the PR it opens runs checks normally and can
      # carry real auto-merge.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.CI_PR_BOT_PAT }}
      - name: Promote the gated hash
        id: promote
        run: |
          set -euo pipefail
          python3 scripts/promote_home_scene_runtime.py \
            --key '${{ needs.build.outputs.key }}' \
            --sha256 '${{ needs.build.outputs.sha256 }}' \
            --bytes '${{ needs.build.outputs.bytes }}' \
            --content-type '${{ needs.build.outputs.contentType }}'
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the promotion PR
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_PR_BOT_PAT }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          short_hash="$(echo '${{ needs.build.outputs.sha256 }}' | cut -c1-8)"
          branch="chore/auto-promote-home-scene-runtime-${short_hash}"
          git checkout -b "$branch"
          cat > /tmp/promote-commit-message.txt <<EOF
          chore(home): auto-promote runtime scene to ${{ needs.build.outputs.key }}

          Published by this workflow (run ${{ github.run_id }}) from commit ${{ github.sha }}.
          Gated by "Gate · Home runtime regression check" before promotion: the
          scene mounted (compositor=blender-runtime), no page errors, and no
          large missing-texture regions in the freshly published GLB.
          EOF
          git add frontend/src/assets/r2-assets-manifest.json frontend/src/components/HomeCastle3DR2Asset.test.js
          git commit -F /tmp/promote-commit-message.txt
          git push origin "$branch" --force-with-lease
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "chore(home): auto-promote runtime scene to ${short_hash}" \
            --body-file /tmp/promote-commit-message.txt)"
          echo "Opened $pr_url"
          gh pr merge "$branch" --auto --squash
