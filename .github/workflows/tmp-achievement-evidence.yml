name: Temporary achievement evidence patch

on:
  push:
    branches:
      - feat/achievement-evidence-links

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply factual achievement evidence wiring
        run: python tools/tmp_patch_achievement_evidence.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Focused achievement tests
        working-directory: frontend
        run: npx vitest run src/achievements.test.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit real changes and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-achievement-evidence.yml tools/tmp_patch_achievement_evidence.py
          git add frontend/src/components/GameScreen.jsx frontend/src/components/useCombatController.js frontend/src/achievements.test.js
          git diff --cached --check
          git commit -m 'feat: link achievements to real game evidence'
          git push
