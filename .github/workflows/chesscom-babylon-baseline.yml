name: CHESSCOM · Babylon baseline
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - e2e/chesscom-visual-artifact.spec.js
      - .github/workflows/chesscom-babylon-baseline.yml
permissions: {contents: read}
# Explicit opt-in by label; Dependabot's grouped PR titles need not mention Babylon.
jobs:
  baseline:
    if: contains(github.event.pull_request.labels.*.name, 'track-chesscom')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.event.pull_request.base.sha }}'}
      - uses: ./.github/actions/setup-browser-e2e
        env: {VITE_WAR_ROOM_VARIANTS_ENABLE: 'true', VITE_APP_VISUAL_CAPTURE: 'true'}
        with: {browser-scope: chromium, build-frontend: 'true'}
      - name: Capture exact main baseline
        working-directory: e2e
        env: {APP_VISUAL_ARTIFACT: '1'}
        run: ./node_modules/.bin/playwright test chesscom-visual-artifact.spec.js --workers=1 --retries=0
      - name: Stamp provenance
        run: |
          echo "${{ github.event.pull_request.base.sha }}" > .artifacts/chesscom-visual/base-sha.txt
          node -p "require('./frontend/package.json').dependencies.babylonjs" > .artifacts/chesscom-visual/babylon-version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: chesscom-baseline-${{ github.event.pull_request.number }}
          path: .artifacts/chesscom-visual/
          if-no-files-found: error
  candidate:
    if: contains(github.event.pull_request.labels.*.name, 'track-chesscom')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: ./.github/actions/setup-browser-e2e
        env: {VITE_WAR_ROOM_VARIANTS_ENABLE: 'true', VITE_APP_VISUAL_CAPTURE: 'true'}
        with: {browser-scope: chromium, build-frontend: 'true'}
      - name: Capture exact PR candidate
        working-directory: e2e
        env: {APP_VISUAL_ARTIFACT: '1'}
        run: ./node_modules/.bin/playwright test chesscom-visual-artifact.spec.js --workers=1 --retries=0
      - name: Stamp provenance
        run: |
          echo "${{ github.event.pull_request.head.sha }}" > .artifacts/chesscom-visual/head-sha.txt
          echo "${{ github.event.pull_request.base.sha }}" > .artifacts/chesscom-visual/base-sha.txt
          node -p "require('./frontend/package.json').dependencies.babylonjs" > .artifacts/chesscom-visual/babylon-version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: chesscom-candidate-${{ github.event.pull_request.number }}
          path: .artifacts/chesscom-visual/
          if-no-files-found: error
