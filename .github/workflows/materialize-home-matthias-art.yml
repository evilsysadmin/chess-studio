name: Home Matthias · materialize canonical art

# Temporary trusted-only recovery path for generated Home Matthias binaries.
# Comment `/materialize-home-matthias` on an in-repo PR after approving its
# Blender preview. Remove this workflow again after #4332 is materialized.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: materialize-home-matthias-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize approved Home Matthias binaries
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/materialize-home-matthias' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Resolve and authorize PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          if [[ "${head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Refusing to materialize binaries into fork PR: ${head_repo}" >&2
            exit 1
          fi
          [[ -n "${head_ref}" && "${head_ref}" != null ]]
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build and validate canonical Home Matthias
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_PREVIEW_SAMPLES: '64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-matthias-materialize
          blender --background             --python scripts/blender/build_home_matthias.py             --             --blend /tmp/home-matthias-materialize/matthias-home-canonical.blend             --glb /tmp/home-matthias-materialize/matthias-home-canonical.glb             --preview /tmp/home-matthias-materialize/matthias-home-canonical.png
          blender --background             /tmp/home-matthias-materialize/matthias-home-canonical.blend             --python scripts/blender/validate_home_matthias_contract.py
          blender --background             /tmp/home-matthias-materialize/matthias-home-canonical.blend             --python scripts/blender/validate_home_matthias_actions.py

      - name: Refuse stale materialization
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${HEAD_REF}"
          actual_head="$(git rev-parse "origin/${HEAD_REF}")"
          if [[ "${actual_head}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "PR head advanced during Blender render; refusing stale binaries." >&2
            exit 1
          fi

      - name: Materialize validated binaries on PR branch
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/home-matthias-materialize/matthias-home-canonical.blend             frontend/art-source/matthias-home-canonical.blend
          cp /tmp/home-matthias-materialize/matthias-home-canonical.glb             frontend/public/models/matthias-home-canonical.glb
          python3 -S scripts/blender/compare_glb_semantics.py --self-test
          python3 -S scripts/blender/compare_glb_semantics.py             frontend/public/models/matthias-home-canonical.glb             /tmp/home-matthias-materialize/matthias-home-canonical.glb
          git add             frontend/art-source/matthias-home-canonical.blend             frontend/public/models/matthias-home-canonical.glb
          if git diff --cached --quiet; then
            echo 'Canonical binaries are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Home Matthias: materialize approved canonical binaries [matthias-art-materialized]'
          git push origin "HEAD:${HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-matthias-materialized-pr-${{ github.event.issue.number }}
          path: /tmp/home-matthias-materialize/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
