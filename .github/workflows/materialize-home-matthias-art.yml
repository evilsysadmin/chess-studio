name: Home Matthias · materialize canonical art

# Large Blender binaries are generated inside GitHub instead of being pushed
# through API/connectors. The command is intentionally explicit and trusted-only:
# comment `/materialize-home-matthias` on an in-repo pull request after visually
# approving its Blender preview artifact.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: materialize-home-matthias-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize approved Home Matthias binaries
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/materialize-home-matthias' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Resolve and authorize PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          if [[ "${head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Refusing to materialize binaries into fork PR: ${head_repo}" >&2
            exit 1
          fi
          [[ -n "${head_ref}" && "${head_ref}" != null ]]
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build and validate canonical Home Matthias
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_PREVIEW_SAMPLES: '64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-matthias-materialize
          blender --background \
            --python scripts/blender/build_home_matthias.py \
            -- \
            --blend /tmp/home-matthias-materialize/matthias-home-canonical.blend \
            --glb /tmp/home-matthias-materialize/matthias-home-canonical.glb \
            --preview /tmp/home-matthias-materialize/matthias-home-canonical.png
          blender --background \
            /tmp/home-matthias-materialize/matthias-home-canonical.blend \
            --python scripts/blender/validate_home_matthias_contract.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          sys.path.insert(0, 'scripts/blender')
          from home_matthias_contract import CANONICAL_REFERENCE_FILE, CANONICAL_REFERENCE_SHA256

          reference = Path(CANONICAL_REFERENCE_FILE)
          assert reference.is_file(), reference
          assert hashlib.sha256(reference.read_bytes()).hexdigest() == CANONICAL_REFERENCE_SHA256
          for name, minimum in (
              ('matthias-home-canonical.blend', 100_000),
              ('matthias-home-canonical.glb', 50_000),
              ('matthias-home-canonical.png', 10_000),
          ):
              path = Path('/tmp/home-matthias-materialize') / name
              assert path.stat().st_size > minimum, (name, path.stat().st_size)
          PY

      - name: Refuse stale materialization
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${HEAD_REF}"
          actual_head="$(git rev-parse "origin/${HEAD_REF}")"
          if [[ "${actual_head}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "PR head advanced during Blender render; refusing stale binaries." >&2
            echo "expected=${EXPECTED_HEAD_SHA} actual=${actual_head}" >&2
            exit 1
          fi

      - name: Materialize validated binaries on PR branch
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/home-matthias-materialize/matthias-home-canonical.blend \
            frontend/art-source/matthias-home-canonical.blend
          cp /tmp/home-matthias-materialize/matthias-home-canonical.glb \
            frontend/public/models/matthias-home-canonical.glb

          python3 -S scripts/blender/compare_glb_semantics.py --self-test
          python3 -S scripts/blender/compare_glb_semantics.py \
            frontend/public/models/matthias-home-canonical.glb \
            /tmp/home-matthias-materialize/matthias-home-canonical.glb

          git add \
            frontend/art-source/matthias-home-canonical.blend \
            frontend/public/models/matthias-home-canonical.glb
          if git diff --cached --quiet; then
            echo 'Canonical binaries are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Home Matthias: materialize approved canonical binaries [matthias-art-materialized]'
          git push origin "HEAD:${HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-matthias-materialized-pr-${{ github.event.issue.number }}
          path: /tmp/home-matthias-materialize/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
