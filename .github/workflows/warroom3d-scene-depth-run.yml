name: War Room scene depth runner
on:
  push:
    branches: [feature/warroom3d-scene-depth]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[warroom3d-scene-depth-run]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/warroom3d-scene-depth
          fetch-depth: 0
      - name: Apply scene depth patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/warroom_scene_depth.py
          python /tmp/warroom_scene_depth.py
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deepen War Room 3D set dressing"
          git push origin HEAD:feature/warroom3d-scene-depth
