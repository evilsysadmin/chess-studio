name: Pawn Slug · Godot strict Matthias v18 P99

on:
  pull_request:
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v18.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v18.py'
      - 'scripts/art/build_pawn_slug_v18_review.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v18_atlas_smoke.gd'
      - 'games/pawn-slug-godot/art/matthias-v18-worksheet.json'
      - '.github/workflows/pawn-slug-godot-strict-v18.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v18.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v18.py'
      - 'scripts/art/build_pawn_slug_v18_review.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v18_atlas_smoke.gd'
      - 'games/pawn-slug-godot/art/matthias-v18-worksheet.json'
      - '.github/workflows/pawn-slug-godot-strict-v18.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-v18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
  SOURCE_URL: 'https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v16/pistol/v16-670506b5307a1756.png'

jobs:
  build-strict-v18-pistol:
    name: Build + gate strict-v18 · P99 pistol
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7

      - name: Install deterministic 2D sprite toolchain
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
            'numpy==2.2.6' 'Pillow==12.3.0'

      - name: Tool sanity
        run: |
          set -euo pipefail
          python3 scripts/art/pack_pawn_slug_godot_strict_v18.py --self-test
          python3 -m py_compile \
            scripts/art/pack_pawn_slug_godot_strict_v18.py \
            scripts/art/validate_pawn_slug_godot_atlas_v18.py \
            scripts/art/build_pawn_slug_v18_review.py

      - name: Download promoted strict-v16 pistol baseline
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v18/pistol'
          mkdir -p "$ROOT"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
            "$SOURCE_URL" --output "$ROOT/source-pistol-v16.png"

      - name: Build + gate strict-v18 candidate
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v18/pistol'
          python3 scripts/art/pack_pawn_slug_godot_strict_v18.py \
            --source "$ROOT/source-pistol-v16.png" \
            --output "$ROOT/v18.png" \
            --manifest "$ROOT/manifest.json"
          python3 scripts/art/validate_pawn_slug_godot_atlas_v18.py \
            --atlas "$ROOT/v18.png" \
            --manifest "$ROOT/manifest.json" \
            --baseline "$ROOT/source-pistol-v16.png" \
            --report "$ROOT/health.json"
          python3 scripts/art/build_pawn_slug_v18_review.py \
            --baseline "$ROOT/source-pistol-v16.png" \
            --atlas "$ROOT/v18.png" \
            --output "$ROOT/review.png"

      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: pawn-slug-strict-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version

      - name: Consume candidate in real Godot SpriteFrames
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v18/pistol'
          .godot-ci/$GODOT_VERSION/godot --headless --path games/pawn-slug-godot \
            --script res://tests/matthias_strict_v18_atlas_smoke.gd -- \
            "$ROOT/v18.png" "$ROOT/manifest.json"

      - name: Publish immutable strict-v18 pistol to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v18/pistol'
          python3 -S scripts/r2_asset_publish.py publish \
            "$ROOT/v18.png" \
            --logical-id 'pawnSlug.godot.matthias.pistol.strictV18' \
            --prefix 'pawn-slug-godot/matthias/strict-v18/pistol' \
            | tee "$ROOT/publish.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-godot-strict-v18-pistol-${{ github.event.pull_request.number || github.run_number }}
          path: |
            /tmp/pawn-slug-godot-strict-v18/pistol/v18.png
            /tmp/pawn-slug-godot-strict-v18/pistol/manifest.json
            /tmp/pawn-slug-godot-strict-v18/pistol/health.json
            /tmp/pawn-slug-godot-strict-v18/pistol/review.png
            /tmp/pawn-slug-godot-strict-v18/pistol/publish.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
