name: tmp-sync-castle-wave-a

on:
  push:
    branches:
      - visual/castle-life-wave-a
    paths:
      - .github/workflows/_tmp_sync_castle_wave_a.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/castle-life-wave-a
          fetch-depth: 0
      - name: Merge latest main and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/_tmp_sync_castle_wave_a.yml
          git commit -m "Remove temporary sync workflow"
          git push origin HEAD:visual/castle-life-wave-a
