name: Pawn Slug · Godot strict Matthias v10

on:
  pull_request:
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v10.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v10.py'
      - 'scripts/pawn_slug_godot_pr_capture.mjs'
      - 'games/pawn-slug-godot/tests/matthias_strict_v10_atlas_smoke.gd'
      - 'games/pawn-slug-godot/scripts/matthias_art.gd'
      - '.github/workflows/pawn-slug-godot-strict-v10.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v10.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v10.py'
      - 'scripts/pawn_slug_godot_pr_capture.mjs'
      - 'games/pawn-slug-godot/tests/matthias_strict_v10_atlas_smoke.gd'
      - 'games/pawn-slug-godot/scripts/matthias_art.gd'
      - '.github/workflows/pawn-slug-godot-strict-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-v10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
  GODOT_TEMPLATES_SHA256: 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011'
  V10_SOURCE_URL: 'https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v10/source/pistol/matthias_v10_source_q25-2fae2e70dc090e5b.avif'
  V10_SOURCE_SHA256: '2fae2e70dc090e5bbc8ab110a7ba6ab60f3b4cba58ef36015f975bb9006ee8f3'

jobs:
  build-strict-v10:
    name: Build + gate strict-v10 · pistol
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7

      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Strict v10 tool sanity
        run: |
          set -euo pipefail
          python3 scripts/art/pack_pawn_slug_godot_strict_v10.py --self-test
          python3 -m py_compile \
            scripts/art/pack_pawn_slug_godot_strict_v10.py \
            scripts/art/validate_pawn_slug_godot_atlas_v10.py
          node --check scripts/pawn_slug_godot_pr_capture.mjs

      - name: Download immutable v10 source from R2
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          mkdir -p "$ROOT"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
            "$V10_SOURCE_URL" --output "$ROOT/matthias_v10_source.avif"
          echo "$V10_SOURCE_SHA256  $ROOT/matthias_v10_source.avif" | sha256sum -c -

      - name: Pack strict variable-frame v10
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          python3 scripts/art/pack_pawn_slug_godot_strict_v10.py \
            --source "$ROOT/matthias_v10_source.avif" \
            --output "$ROOT/matthias_pistol_godot_strict_12x9_256_v10.png" \
            --manifest "$ROOT/matthias_pistol_strict_v10_manifest.json" \
            --weapon pistol

      - name: Strict v10 contract gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          python3 scripts/art/validate_pawn_slug_godot_atlas_v10.py \
            --atlas "$ROOT/matthias_pistol_godot_strict_12x9_256_v10.png" \
            --manifest "$ROOT/matthias_pistol_strict_v10_manifest.json"

      - name: Build v10 visual review artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          python3 - "$ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path(sys.argv[1])
          atlas = Image.open(root / 'matthias_pistol_godot_strict_12x9_256_v10.png').convert('RGBA')
          data = json.loads((root / 'matthias_pistol_strict_v10_manifest.json').read_text())
          cell = int(data['atlas']['cell_size']); cols = int(data['atlas']['columns'])
          thumb = 112; label = 190; row_h = 132
          board = Image.new('RGBA', (label + cols * thumb, len(data['actions']) * row_h), (18,18,18,255))
          draw = ImageDraw.Draw(board)
          strips = root / 'strips'; strips.mkdir(exist_ok=True)
          for action in data['actions']:
              row = int(action['row']); count = int(action['frames']); name = action['name']; y0 = row * row_h
              draw.text((8, y0 + 8), f"{row:02d} {name} ({count})", fill=(245,245,245,255))
              draw.text((8, y0 + 28), f"{action['fps']:g} fps · {'loop' if action['loop'] else 'once'}", fill=(165,165,165,255))
              strip = atlas.crop((0, row*cell, count*cell, (row+1)*cell))
              strip.save(strips / f"{row:02d}_{name}.png", 'PNG', optimize=True)
              for col in range(count):
                  frame = atlas.crop((col*cell,row*cell,(col+1)*cell,(row+1)*cell)).resize((thumb,thumb), Image.Resampling.LANCZOS)
                  x = label + col*thumb
                  board.alpha_composite(frame, (x,y0+16))
                  draw.rectangle((x,y0+16,x+thumb-1,y0+16+thumb-1), outline=(75,75,75,255), width=1)
          board.save(root / 'matthias_pistol_strict_v10_review_board.png', 'PNG', optimize=True)
          PY

      - name: Restore pinned Godot editor + Web templates
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: pawn-slug-strict-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-web-v1

      - name: Install pinned Godot editor + Web templates
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi

          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          debug_template="$template_dir/web_nothreads_debug.zip"
          release_template="$template_dir/web_nothreads_release.zip"
          if [[ ! -f "$debug_template" || ! -f "$release_template" ]]; then
            template_archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            rm -rf "$unpack"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
              -o "$template_archive"
            echo "$GODOT_TEMPLATES_SHA256  $template_archive" | sha256sum -c -
            mkdir -p "$template_dir" "$unpack"
            unzip -q "$template_archive" \
              templates/web_nothreads_debug.zip \
              templates/web_nothreads_release.zip \
              -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$debug_template"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$release_template"
          fi
          "$godot" --version
          test -s "$debug_template"
          test -s "$release_template"

      - name: Consume variable-frame atlas in real Godot SpriteFrames
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless \
            --path games/pawn-slug-godot \
            --script res://tests/matthias_strict_v10_atlas_smoke.gd -- \
            "$ROOT/matthias_pistol_godot_strict_12x9_256_v10.png" \
            "$ROOT/matthias_pistol_strict_v10_manifest.json"

      - name: Export Pawn Slug with candidate v10 atlas wired locally
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('games/pawn-slug-godot/scripts/matthias_art.gd')
          text = path.read_text(encoding='utf-8')
          prefix = 'const V10_PISTOL_ATLAS_URL := "'
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f'expected one V10_PISTOL_ATLAS_URL declaration, got {len(matches)}')
          lines[matches[0]] = 'const V10_PISTOL_ATLAS_URL := "http://127.0.0.1:4179/matthias_v10_candidate.png"'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          rm -rf games/pawn-slug-godot/build/web
          mkdir -p games/pawn-slug-godot/build/web
          pushd games/pawn-slug-godot >/dev/null
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html
          popd >/dev/null
          cp "$ROOT/matthias_pistol_godot_strict_12x9_256_v10.png" \
            games/pawn-slug-godot/build/web/matthias_v10_candidate.png
          python3 -S scripts/pawn_slug_godot_bundle.py check

      - name: Restore browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'

      - name: Exercise candidate inside live Pawn Slug and capture action bursts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4179 --directory games/pawn-slug-godot/build/web >"$RUNNER_TEMP/pawn-slug-v10-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS "http://127.0.0.1:4179/index.html?stage=industrial_front_v1" >/dev/null; then
              break
            fi
            sleep 1
          done
          PAWN_SLUG_GODOT_INDEX_URL="http://127.0.0.1:4179/index.html?stage=industrial_front_v1" \
            PAWN_SLUG_CAPTURE_DIR="$RUNNER_TEMP/matthias-v10/runtime" \
            node scripts/pawn_slug_godot_pr_capture.mjs

      - name: Publish immutable strict-v10 atlas to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matthias-v10"
          python3 -S scripts/r2_asset_publish.py publish \
            "$ROOT/matthias_pistol_godot_strict_12x9_256_v10.png" \
            --logical-id "pawnSlug.godot.matthias.pistol.strictV10" \
            --prefix "pawn-slug-godot/matthias/strict-v10/pistol" \
            | tee "$ROOT/publish.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-godot-strict-v10-pistol-${{ github.event.pull_request.number || github.run_number }}
          path: |
            ${{ runner.temp }}/matthias-v10/matthias_pistol_godot_strict_12x9_256_v10.png
            ${{ runner.temp }}/matthias-v10/matthias_pistol_strict_v10_manifest.json
            ${{ runner.temp }}/matthias-v10/matthias_pistol_strict_v10_review_board.png
            ${{ runner.temp }}/matthias-v10/strips/*.png
            ${{ runner.temp }}/matthias-v10/runtime/*.png
            ${{ runner.temp }}/matthias-v10/runtime/*.json
            ${{ runner.temp }}/matthias-v10/publish.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
