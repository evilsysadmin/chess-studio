name: Pawn Slug · enemy cast v2

on:
  pull_request:
    paths:
      - games/pawn-slug-godot/scripts/enemy_visual.gd
      - frontend/src/assets/r2-assets-manifest.json
      - scripts/art/build_pawn_slug_enemy_cast_v2.py
      - scripts/art/derive_pawn_slug_enemy_commando_v2.py
      - scripts/art/derive_pawn_slug_enemy_grenadier_v2.py
      - scripts/art/derive_pawn_slug_enemy_knight_v2.py
      - scripts/art/derive_pawn_slug_enemy_queen_v2.py
      - scripts/art/derive_pawn_slug_enemy_rook_v2.py
      - scripts/art/derive_pawn_slug_enemy_scout_v2.py
      - scripts/art/derive_pawn_slug_enemy_shield_v2.py
      - .github/workflows/pawn-slug-enemy-cast-v2.yml
  push:
    branches: [main]
    paths:
      - games/pawn-slug-godot/scripts/enemy_visual.gd
      - scripts/art/build_pawn_slug_enemy_cast_v2.py
      - scripts/art/derive_pawn_slug_enemy_commando_v2.py
      - scripts/art/derive_pawn_slug_enemy_grenadier_v2.py
      - scripts/art/derive_pawn_slug_enemy_queen_v2.py
      - scripts/art/derive_pawn_slug_enemy_scout_v2.py
      - scripts/art/derive_pawn_slug_enemy_shield_v2.py
      - .github/workflows/pawn-slug-enemy-cast-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'
      - name: Build deterministic 8-row enemy cast
        run: |
          set -euo pipefail
          python3 scripts/art/build_pawn_slug_enemy_cast_v2.py \
            --gdscript games/pawn-slug-godot/scripts/enemy_visual.gd \
            --output-dir /tmp/pawn-slug-enemy-cast-v2
      - name: Upload visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-enemy-cast-v2-${{ github.sha }}
          path: /tmp/pawn-slug-enemy-cast-v2/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish immutable WebP to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -f /tmp/pawn-slug-enemy-cast-v2/r2-manifest.json
          python3 scripts/r2_asset_publish.py publish \
            /tmp/pawn-slug-enemy-cast-v2/enemy-cast-v2.webp \
            --logical-id pawnSlug.enemy.castV2 \
            --prefix pawn-slug/enemies/cast-v2 \
            --manifest /tmp/pawn-slug-enemy-cast-v2/r2-manifest.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/pawn-slug-enemy-cast-v2/r2-manifest.json"))["assets"]["pawnSlug.enemy.castV2"]["sha256"])')" = "0433d3f4640f2c13edd5b270fd17db10f3b22139b28dd496c4f885555a7c8f11"
      - name: Verify public asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          url='https://assets.chess-studio.shadowops.dpdns.org/pawn-slug/enemies/cast-v2/enemy-cast-v2-0433d3f4640f2c13.webp'
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 "$url" -o /tmp/published.webp; then
              test "$(sha256sum /tmp/published.webp | awk '{print $1}')" = "0433d3f4640f2c13edd5b270fd17db10f3b22139b28dd496c4f885555a7c8f11"
              exit 0
            fi
            sleep 3
          done
          exit 1
