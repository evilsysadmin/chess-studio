name: Branch housekeeping

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-housekeeping.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: chess-studio-branch-housekeeping
  cancel-in-progress: true

jobs:
  prune:
    name: Prune merged and verified stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete verified stale branches
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          protected_branch() {
            case "$1" in
              main|gh-pages|artifact/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          delete_branch_if_safe() {
            local branch="$1"

            [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || {
              echo "::warning::Rama con nombre inesperado; se omite: $branch"
              return 0
            }

            if protected_branch "$branch"; then
              echo "Protegida por política: $branch"
              return 0
            fi

            if ! gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Ya no existe: $branch"
              return 0
            fi

            local open_count
            open_count="$(gh api "repos/$repo/pulls?state=open&head=${owner}:${branch}&per_page=1" --jq 'length')"
            if [[ "$open_count" != "0" ]]; then
              echo "Con PR abierta; se conserva: $branch"
              return 0
            fi

            gh api --method DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            echo "Eliminada: $branch"
          }

          # Ramas históricas auditadas contra main o contra una PR ya mergeada.
          # La lista es deliberadamente explícita: nada de borrados por wildcard.
          legacy_stale=(
            'audit/zfrt-cross-mode-continuity'
            'chatgpt/zfrh-matthias-brand-tests-clean'
            'chore/branch-housekeeping-once'
            'chore/zfrs-actions-cleanup'
            'feat/zfri-combat-mission-orders'
            'feat/zfrj-product-mechanics'
            'feat/zfrk-combat-economy-gate'
            'feat/zfrl-enemy-doctrine'
            'feat/zfrn-dynamic-nemesis'
            'feat/zfro-hard-campaign-choices'
            'feat/zfro-hard-campaign-decisions'
            'feat/zfrp-backend-performance'
            'feature/zfrq-feedback-delete'
            'feature/zfrq-feedback-delete-actual'
            'feature/zfrq-feedback-delete-clean'
            'feature/zfrq-feedback-delete-final'
            'feature/zfrq-feedback-delete-last'
            'feature/zfrq-feedback-delete-no-more'
            'feature/zfrq-feedback-delete-pr'
            'feature/zfrq-feedback-delete-ready'
            'feature/zfrq-feedback-delete-stop'
            'feature/zfrr-admin-workspace'
            'feature/zfrr-game-viewport'
            'fix/combat-economy-empty-credits'
            'fix/matthias-home-assets'
            'fix/matthias-school-replay-zfrm'
            'fix/zfrq-game-mode-legality-audit'
            'noop-test'
            'quality/e2e-tutorial-seed-parity'
            'quality/home-matthias-image-e2e'
            'quality/matthias-asset-integrity'
            'quality/personal-puzzle-validation'
            'quality/replay-refresh-continuity'
            'ux/mobile-home-labels'
          )

          for branch in "${legacy_stale[@]}"; do
            delete_branch_if_safe "$branch"
          done

          # Previene que vuelva a crecer el cementerio: sólo ramas de PRs ya
          # mergeadas en este mismo repo, sin PR abierta y fuera de la lista
          # protegida. La operación es idempotente.
          while IFS=$'\t' read -r head_repo branch; do
            [[ "$head_repo" == "$repo" ]] || continue
            delete_branch_if_safe "$branch"
          done < <(
            gh api --paginate \
              "repos/$repo/pulls?state=closed&per_page=100&sort=updated&direction=desc" \
              --jq '.[] | select(.merged_at != null) | [.head.repo.full_name, .head.ref] | @tsv'
          )
