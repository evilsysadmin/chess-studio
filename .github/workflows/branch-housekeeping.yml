name: Maintenance · branch housekeeping

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: chess-studio-branch-housekeeping
  cancel-in-progress: true

jobs:
  prune:
    name: Prune merged branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate branch housekeeping helper
        run: bash scripts/branch_housekeeping.sh --self-test

      - name: Delete merged branches that are safe to remove
        run: bash scripts/branch_housekeeping.sh
