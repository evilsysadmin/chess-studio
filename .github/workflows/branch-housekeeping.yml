name: Maintenance · branch housekeeping

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: chess-studio-branch-housekeeping
  cancel-in-progress: true

jobs:
  prune:
    name: Prune merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete merged branches that are safe to remove
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          protected_branch() {
            case "$1" in
              main|artifact/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          delete_branch_if_safe() {
            local branch="$1"

            [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || {
              echo "::warning::Rama con nombre inesperado; se omite: $branch"
              return 0
            }

            if protected_branch "$branch"; then
              echo "Protegida por política: $branch"
              return 0
            fi

            if ! gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              return 0
            fi

            local open_count
            open_count="$(gh api "repos/$repo/pulls?state=open&head=${owner}:${branch}&per_page=1" --jq 'length')"
            if [[ "$open_count" != "0" ]]; then
              echo "Con PR abierta; se conserva: $branch"
              return 0
            fi

            gh api --method DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            echo "Eliminada: $branch"
          }

          # Sólo ramas de PR ya mergeadas en este repo. Nada de listas de
          # cadáveres versionados: si una rama histórica ya no existe, deja de
          # formar parte de la política en vez de vivir eternamente en YAML.
          while IFS=$'\t' read -r head_repo branch; do
            [[ "$head_repo" == "$repo" ]] || continue
            delete_branch_if_safe "$branch"
          done < <(
            gh api --paginate \
              "repos/$repo/pulls?state=closed&per_page=100&sort=updated&direction=desc" \
              --jq '.[] | select(.merged_at != null) | [.head.repo.full_name, .head.ref] | @tsv'
          )
