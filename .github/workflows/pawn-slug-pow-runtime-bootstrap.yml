name: Pawn Slug POW runtime bootstrap

on:
  push:
    branches:
      - fix/pawn-slug-pow-blender-v2-runtime
    paths:
      - '.github/workflows/pawn-slug-pow-runtime-bootstrap.yml'

permissions:
  contents: write
  actions: read

jobs:
  materialize-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pawn-slug-pow-blender-v2-runtime

      - uses: actions/download-artifact@v4
        with:
          name: pawn-slug-pow-blender-v2-2033
          path: /tmp/pawn-slug-pow-v2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35022804638

      - name: Materialize approved Blender v2 runtime payload
        run: |
          set -euo pipefail
          mkdir -p frontend/src/assets/pawnSlug
          gzip -n -9 -c /tmp/pawn-slug-pow-v2/pawn_slug_pow_squad_v2.glb | base64 -w0 > frontend/src/assets/pawnSlug/pow_squad_v2_glb_gzip.b64
          printf '\n' >> frontend/src/assets/pawnSlug/pow_squad_v2_glb_gzip.b64
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import struct
          from pathlib import Path

          asset = Path('frontend/src/assets/pawnSlug/pow_squad_v2_glb_gzip.b64')
          raw = gzip.decompress(base64.b64decode(asset.read_text(encoding='utf-8').strip()))
          assert raw[:4] == b'glTF'
          json_len, json_type = struct.unpack_from('<II', raw, 12)
          assert json_type == 0x4E4F534A
          doc = json.loads(raw[20:20 + json_len].decode('utf-8').rstrip(' \t\r\n\x00'))
          generator = str(doc.get('asset', {}).get('generator', ''))
          assert 'Blender' in generator, generator
          assert len(raw) > 1_000_000, len(raw)

          runtime = Path('frontend/src/pawnSlugPowBlenderArt.js')
          text = runtime.read_text(encoding='utf-8')
          replacements = {
              "./assets/pawnSlug/pow_squad_v1_glb_gzip.b64?raw": "./assets/pawnSlug/pow_squad_v2_glb_gzip.b64?raw",
              "const POSES = Object.freeze(['bound', 'kneeling', 'caged']);\n": "const POSES = Object.freeze(['bound', 'kneeling', 'caged']);\nconst POW_BLENDER_RUNTIME_SCALE = 0.78;\n",
              "      const visual = splitPoseVisual(template, pose);\n      hideFallbackGeometry(root);": "      const visual = splitPoseVisual(template, pose);\n      visual.root.scale.setScalar(POW_BLENDER_RUNTIME_SCALE);\n      hideFallbackGeometry(root);",
              "root.userData.pawnSlugArtSource = 'blender-glb-v1';": "root.userData.pawnSlugArtSource = 'blender-glb-v2';",
              "style: 'blender-authored-premium-military-arcade-prisoner-v3',": "style: 'blender-authored-premium-military-arcade-prisoner-v4',",
              "sourceOfTruth: 'scripts/blender/build_pawn_slug_pows.py',": "sourceOfTruth: 'scripts/blender/build_pawn_slug_pows_v2.py',",
              "  glbPoses: POSES,\n": "  glbPoses: POSES,\n  glbVersion: 'blender-glb-v2',\n  runtimeScale: POW_BLENDER_RUNTIME_SCALE,\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)
          runtime.write_text(text, encoding='utf-8')

          test = Path('frontend/src/pawnSlugPowBlenderArt.test.js')
          text = test.read_text(encoding='utf-8')
          old_import = "./assets/pawnSlug/pow_squad_v1_glb_gzip.b64?raw"
          assert text.count(old_import) == 1
          text = text.replace(old_import, "./assets/pawnSlug/pow_squad_v2_glb_gzip.b64?raw")
          old_case = """  it('ships one compressed real GLB containing every stable POW pose contract', () => {\n    const json = glbJson(decodedGlb());\n    const names = (json.nodes || []).map((node) => node.name || '');\n    expect(PAWN_SLUG_POW_ART_META.glbPoses).toEqual(['bound', 'kneeling', 'caged']);\n    for (const pose of PAWN_SLUG_POW_ART_META.glbPoses) {\n      expect(names.some((name) => name.startsWith(`${pose}__body__`))).toBe(true);\n    }\n    expect(names.some((name) => name.startsWith('bound__chains__'))).toBe(true);\n    expect(names.some((name) => name.startsWith('caged__cage__'))).toBe(true);\n    expect(PAWN_SLUG_POW_ART_META.payloadCompression).toBe('gzip');\n  });\n"""
          new_case = """  it('ships the approved Blender v2 GLB with every stable POW pose contract', () => {\n    const buffer = decodedGlb();\n    const json = glbJson(buffer);\n    const names = (json.nodes || []).map((node) => node.name || '');\n    expect(buffer.byteLength).toBeGreaterThan(1_000_000);\n    expect(json.asset?.generator).toMatch(/Blender/i);\n    expect(PAWN_SLUG_POW_ART_META.glbPoses).toEqual(['bound', 'kneeling', 'caged']);\n    for (const pose of PAWN_SLUG_POW_ART_META.glbPoses) {\n      expect(names.filter((name) => name.startsWith(`${pose}__body__`)).length).toBeGreaterThanOrEqual(25);\n    }\n    expect(names.filter((name) => name.startsWith('bound__chains__')).length).toBeGreaterThanOrEqual(8);\n    expect(names.filter((name) => name.startsWith('kneeling__chains__')).length).toBeGreaterThanOrEqual(8);\n    expect(names.filter((name) => name.startsWith('caged__cage__')).length).toBeGreaterThanOrEqual(16);\n    expect(PAWN_SLUG_POW_ART_META.payloadCompression).toBe('gzip');\n    expect(PAWN_SLUG_POW_ART_META.glbVersion).toBe('blender-glb-v2');\n    expect(PAWN_SLUG_POW_ART_META.runtimeScale).toBeCloseTo(0.78);\n  });\n"""
          assert text.count(old_case) == 1
          text = text.replace(old_case, new_case)
          old_source = "expect(PAWN_SLUG_POW_ART_META.sourceOfTruth).toContain('scripts/blender/');"
          assert text.count(old_source) == 1
          text = text.replace(old_source, "expect(PAWN_SLUG_POW_ART_META.sourceOfTruth).toBe('scripts/blender/build_pawn_slug_pows_v2.py');")
          test.write_text(text, encoding='utf-8')
          PY

          rm -f frontend/src/assets/pawnSlug/pow_squad_v1_glb_gzip.b64
          git rm .github/workflows/pawn-slug-pow-runtime-bootstrap.yml
          git add frontend/src/pawnSlugPowBlenderArt.js frontend/src/pawnSlugPowBlenderArt.test.js frontend/src/assets/pawnSlug/pow_squad_v2_glb_gzip.b64 frontend/src/assets/pawnSlug/pow_squad_v1_glb_gzip.b64 || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pawn-slug): ship genuine Blender v2 POW runtime art'
          git push origin HEAD:fix/pawn-slug-pow-blender-v2-runtime
