name: War Room 3D kinetics fix
on:
  push:
    branches: [feature/warroom3d-kinetics]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, '[warroom3d-kinetics-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/warroom3d-kinetics
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/Board3D.jsx')
          s = p.read_text(encoding='utf-8')
          bad = "  }, [boardTheme, orientation, showCoordin  useEffect(() => {"
          good = "  }, [boardTheme, orientation, showCoordinates]);\n\n  useEffect(() => {"
          if bad not in s:
              raise SystemExit('corrupt boundary marker not found')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          Path('.github/workflows/warroom3d-kinetics-fix.yml').unlink()
          PY
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair War Room 3D kinetics effect boundary"
          git push origin HEAD:feature/warroom3d-kinetics
