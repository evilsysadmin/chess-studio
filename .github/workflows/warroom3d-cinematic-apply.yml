name: War Room cinematic replay apply
on:
  push:
    branches: [feature/warroom3d-cinematic-replay]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[warroom3d-cinematic-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/warroom3d-cinematic-replay
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          python .github/scripts/warroom_cinematic_replay_patch.py
          rm -f .github/scripts/warroom_cinematic_replay_patch.py .github/workflows/warroom3d-cinematic-apply.yml
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add cinematic 3D movie replay"
          git push origin HEAD:feature/warroom3d-cinematic-replay
