name: War Room runtime marathon

# Deep stress/continuity/GPU diagnostics are intentionally manual. The PR gate
# already runs the path-aware War Room browser contracts from Quality, while the
# weekly Browser E2E sweep exercises the complete Playwright suite. Keeping this
# workflow as an escape hatch avoids three extra browser builds on every relevant
# War Room PR without deleting the diagnostic tool.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: war-room-runtime-marathon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marathon:
    name: Browser deep-dive · War Room ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: stress
            specs: war-room-runtime-marathon.spec.js
            artifact: war-room-runtime-stress
          - label: continuity
            specs: war-room-interrupted-restore.spec.js war-room-undo-rewind.spec.js war-room-ephemeral-cleanup.spec.js
            artifact: war-room-runtime-continuity
          - label: GPU
            specs: war-room-webgl-fallback.spec.js war-room-render-budget.spec.js
            artifact: war-room-runtime-gpu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore browser runtime and build frontend
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'true'
          build-frontend: 'true'

      - name: Run War Room ${{ matrix.label }} marathon
        working-directory: e2e
        run: ./node_modules/.bin/playwright test ${{ matrix.specs }} --workers=1 --retries=0 --timeout=360000

      - name: Upload ${{ matrix.label }} diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
