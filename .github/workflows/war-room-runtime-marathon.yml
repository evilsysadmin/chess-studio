name: War Room runtime marathon

on:
  pull_request:
    paths:
      - 'e2e/war-room-runtime-marathon.spec.js'
      - 'e2e/war-room-interrupted-restore.spec.js'
      - 'e2e/war-room-undo-rewind.spec.js'
      - 'e2e/war-room-ephemeral-cleanup.spec.js'
      - 'e2e/war-room-webgl-fallback.spec.js'
      - 'e2e/war-room-render-budget.spec.js'
      - 'e2e/war-room-board-input.js'
      - 'frontend/src/components/Board3D*.js'
      - 'frontend/src/components/Board3D*.jsx'
      - 'frontend/src/components/WarRoom3D*.js'
      - 'frontend/src/components/WarRoom3D*.jsx'
      - 'frontend/src/components/GameBoardView.jsx'
      - 'frontend/src/components/useGameBoardRenderer.js'
      - '.github/workflows/war-room-runtime-marathon.yml'
      - '.github/actions/setup-browser-e2e/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: war-room-runtime-marathon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Browser required · War Room stress
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore browser runtime and build frontend
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'true'
          build-frontend: 'true'

      - name: Run War Room stress marathon
        working-directory: e2e
        run: ./node_modules/.bin/playwright test war-room-runtime-marathon.spec.js --workers=1 --retries=0 --timeout=360000

      - name: Upload stress diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: war-room-runtime-stress-${{ github.sha }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  continuity:
    name: Browser required · War Room continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore browser runtime and build frontend
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'true'
          build-frontend: 'true'

      - name: Run War Room continuity marathon
        working-directory: e2e
        run: ./node_modules/.bin/playwright test war-room-interrupted-restore.spec.js war-room-undo-rewind.spec.js war-room-ephemeral-cleanup.spec.js --workers=1 --retries=0 --timeout=360000

      - name: Upload continuity diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: war-room-runtime-continuity-${{ github.sha }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gpu:
    name: Browser required · War Room GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore browser runtime and build frontend
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'true'
          build-frontend: 'true'

      - name: Run War Room GPU marathon
        working-directory: e2e
        run: ./node_modules/.bin/playwright test war-room-webgl-fallback.spec.js war-room-render-budget.spec.js --workers=1 --retries=0 --timeout=360000

      - name: Upload GPU diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: war-room-runtime-gpu-${{ github.sha }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
