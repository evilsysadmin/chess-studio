name: Blender art factory

on:
  push:
    branches-ignore:
      - main
    paths:
      - scripts/blender/build_home_matthias.py
      - scripts/blender/home_matthias_parts.py
      - scripts/blender/home_matthias_animations.py
      - .github/workflows/blender-art-factory.yml

permissions:
  contents: write

concurrency:
  group: blender-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-matthias:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -2

      - name: Build Matthias editable source, GLB and preview
        run: |
          mkdir -p /tmp/chess-studio-blender
          blender --background \
            --python scripts/blender/build_home_matthias.py -- \
            --blend frontend/art-source/matthias-home-canonical.blend \
            --glb frontend/public/models/matthias-home-canonical.glb \
            --preview /tmp/chess-studio-blender/matthias-home-preview.png
          test -s frontend/art-source/matthias-home-canonical.blend
          test -s frontend/public/models/matthias-home-canonical.glb
          test -s /tmp/chess-studio-blender/matthias-home-preview.png

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: matthias-home-blender-preview
          path: /tmp/chess-studio-blender/matthias-home-preview.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Commit deterministic Blender outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/art-source/matthias-home-canonical.blend frontend/public/models/matthias-home-canonical.glb
          if git diff --cached --quiet; then
            echo 'Generated Blender outputs already match the branch.'
            exit 0
          fi
          git commit -m 'build(home): regenerate Matthias Blender asset'
          git push origin "HEAD:${GITHUB_REF_NAME}"
