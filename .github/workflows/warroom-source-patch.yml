name: War Room source patch

on:
  push:
    branches:
      - warroom-matthias-personality

permissions:
  contents: write

jobs:
  patch-board3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warroom-matthias-personality
          fetch-depth: 0

      - name: Remove legacy duplicate pawn and rename chamber
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/components/Board3D.jsx')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r"\n  const emblemSkin = \{.*?\n  room\.add\(emblem\);\n",
              "\n  // El blasón premium es el único peón ceremonial de la pared.\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'legacy pawn block replacements: {count}')

          old_aria = 'Tablero de ajedrez 3D en sala de mando. Cámara fija desde tu lado. Usa flechas y Enter para jugar con teclado.'
          new_aria = 'Tablero de ajedrez 3D en Sala de guerra. Cámara táctica fija desde tu lado. Usa flechas y Enter para jugar con teclado.'
          if text.count(old_aria) != 1:
              raise SystemExit(f'aria label matches: {text.count(old_aria)}')
          text = text.replace(old_aria, new_aria, 1)

          old_label = "SALA DE MANDO · {inspectMode ? 'INSPECCIÓN' : 'CÁMARA TÁCTICA'}"
          new_label = "SALA DE GUERRA · {inspectMode ? 'INSPECCIÓN' : 'CÁMARA TÁCTICA'}"
          if text.count(old_label) != 1:
              raise SystemExit(f'chamber label matches: {text.count(old_label)}')
          text = text.replace(old_label, new_label, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/warroom-source-patch.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/Board3D.jsx .github/workflows/warroom-source-patch.yml
          git commit -m "Remove legacy War Room pawn and rename tactical chamber"
          git push origin HEAD:warroom-matthias-personality
