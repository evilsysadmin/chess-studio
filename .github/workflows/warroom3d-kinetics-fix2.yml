name: War Room 3D kinetics fix 2
on:
  push:
    branches: [feature/warroom3d-kinetics]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, '[warroom3d-kinetics-fix2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/warroom3d-kinetics
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/Board3D.jsx')
          s = p.read_text(encoding='utf-8')
          bad = "]);gColor]);"
          if bad not in s:
              raise SystemExit('stale suffix marker not found')
          p.write_text(s.replace(bad, "]);", 1), encoding='utf-8')
          Path('.github/workflows/warroom3d-kinetics-fix2.yml').unlink()
          PY
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove stale War Room effect suffix"
          git push origin HEAD:feature/warroom3d-kinetics
