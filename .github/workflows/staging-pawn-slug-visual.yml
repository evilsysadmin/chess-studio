name: Staging · Pawn Slug visual

on:
  workflow_run:
    workflows:
      - Deploy to staging
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-studio-staging-pawn-slug-visual
  cancel-in-progress: true

env:
  STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
  STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api

jobs:
  capture:
    name: Pawn Slug Godot · live visual evidence
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Admit exact staging generation
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          echo 'run=false' >> "$GITHUB_OUTPUT"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA inválido: $DEPLOY_SHA"; exit 1; }

          # Every coherent staging generation gets Pawn Slug Godot visual evidence.
          # Looking only at the deployed commit's file list created false-green
          # skips when a later unrelated merge superseded the Pawn Slug merge.
          # The exact backend/frontend SHA checks below already prevent validating
          # stale or mismatched staging generations.

          backend="$RUNNER_TEMP/pawnslug-backend-release.json"
          frontend="$RUNNER_TEMP/pawnslug-frontend-release.json"
          backend_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$backend" --write-out '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$STAGING_API_URL/release?sha=$DEPLOY_SHA" || true)"
          frontend_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$frontend" --write-out '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$STAGING_URL/release.json?sha=$DEPLOY_SHA" || true)"
          if [[ "$backend_status" != 200 || "$frontend_status" != 200 ]] || ! python3 - "$backend" "$frontend" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          expected = sys.argv[3].lower()
          values = []
          for path in sys.argv[1:3]:
              try:
                  payload = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  raise SystemExit(1)
              values.append(str(payload.get('build') or '').lower())
          raise SystemExit(0 if all(value == expected for value in values) else 1)
          PY
          then
            echo "Staging ya no sirve exactamente $DEPLOY_SHA; generación visual superseded, sin fallo."
            exit 0
          fi

          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "Pawn Slug visual admitted para $DEPLOY_SHA"

      - name: Restore cached OCI SDK toolchain
        if: steps.admission.outputs.run == 'true'
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'

      - name: Load ephemeral staging invite code from OCI runtime
        if: steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          import oci
          from oci_runtime_bundle import read_private_runtime_value

          invite = read_private_runtime_value(oci, 'INVITE_CODE')
          if not invite:
              raise SystemExit('INVITE_CODE de staging falta en el bundle privado de OCI')
          print(f'::add-mask::{invite}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'STAGING_INVITE_CODE={invite}\n')
          PY

      - name: Generate isolated Pawn Slug smoke credentials
        if: steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          username="ci_smoke_$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          password="CS!$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "STAGING_E2E_USERNAME=$username" >> "$GITHUB_ENV"
          echo "STAGING_E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Restore staging browser runtime
        if: steps.admission.outputs.run == 'true'
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'

      - name: Capture real Pawn Slug Godot boot, run and SMG
        if: steps.admission.outputs.run == 'true'
        timeout-minutes: 5
        working-directory: e2e
        run: ./node_modules/.bin/playwright test staging-pawn-slug-godot.spec.js --config=playwright.staging.config.js

      - name: Cleanup staging smoke identity
        if: always() && steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_E2E_USERNAME:-}" ]]; then echo 'No se creó identidad de smoke; cleanup no necesario.'; exit 0; fi
          python3 -S scripts/staging_smoke_user_cleanup.py

      - name: Upload Pawn Slug staging evidence
        if: always() && steps.admission.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-pawn-slug-godot-visual-${{ env.DEPLOY_SHA }}
          path: e2e/test-results/
          if-no-files-found: error
          retention-days: 7
