name: Staging · Pawn Slug visual

on:
  workflow_run:
    workflows:
      - Staging · deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-studio-staging-pawn-slug-visual
  cancel-in-progress: true

env:
  STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
  STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api

jobs:
  capture:
    name: Pawn Slug Godot · live visual evidence
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Admit only current Pawn Slug generations
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          echo 'run=false' >> "$GITHUB_OUTPUT"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA inválido: $DEPLOY_SHA"; exit 1; }

          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$DEPLOY_SHA")"
            if ! grep -Eq '^(games/pawn-slug-godot/|scripts/pawn_slug_godot_|frontend/src/pawnSlugGodotRuntime|frontend/src/components/PawnSlugGodot|frontend/src/pawnSlug|frontend/src/components/PawnSlug|frontend/src/assets/pawnSlug/|frontend/src/assets/r2-assets-manifest\.json|e2e/(pawn-slug|staging-pawn-slug)|\.github/workflows/staging-pawn-slug-visual\.yml)' <<<"$changed"; then
              echo 'No hay cambios de Pawn Slug en esta generación; captura live omitida.'
              exit 0
            fi
          fi

          backend="$RUNNER_TEMP/pawnslug-backend-release.json"
          frontend="$RUNNER_TEMP/pawnslug-frontend-release.json"
          backend_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$backend" --write-out '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$STAGING_API_URL/release?sha=$DEPLOY_SHA" || true)"
          frontend_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$frontend" --write-out '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$STAGING_URL/release.json?sha=$DEPLOY_SHA" || true)"
          if [[ "$backend_status" != 200 || "$frontend_status" != 200 ]] || ! python3 - "$backend" "$frontend" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          expected = sys.argv[3].lower()
          values = []
          for path in sys.argv[1:3]:
              try:
                  payload = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  raise SystemExit(1)
              values.append(str(payload.get('build') or '').lower())
          raise SystemExit(0 if all(value == expected for value in values) else 1)
          PY
          then
            echo "Staging ya no sirve exactamente $DEPLOY_SHA; generación visual superseded, sin fallo."
            exit 0
          fi

          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "Pawn Slug visual admitted para $DEPLOY_SHA"

      - name: Load ephemeral staging invite code
        if: steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import render_staging_bootstrap as render
          service = render.find_service(render.SERVICE_NAME)
          service_id = str((service or {}).get('id') or '').strip()
          if not service_id:
              raise SystemExit('No existe el servicio Render staging legado para leer INVITE_CODE')
          invite = render.read_env(service_id, 'INVITE_CODE') or ''
          if not invite:
              raise SystemExit('INVITE_CODE de staging falta')
          render.export_github_secret_env('STAGING_INVITE_CODE', invite)
          PY

      - name: Derive isolated Pawn Slug smoke credentials
        if: steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          identity="$(printf 'chess-studio-staging-smoke-user:v3:%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$DEPLOY_SHA" 'pawnslug-visual' "$RENDER_API_KEY" | sha256sum | awk '{print substr($1,1,16)}')"
          secret="$(printf 'chess-studio-staging-smoke-password:v3:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" 'pawnslug-visual' "$RENDER_API_KEY" | sha256sum | awk '{print $1}')"
          username="ci_smoke_${identity}"
          password="CS!${secret}"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "STAGING_E2E_USERNAME=$username" >> "$GITHUB_ENV"
          echo "STAGING_E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Restore staging browser runtime
        if: steps.admission.outputs.run == 'true'
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'

      - name: Capture real Pawn Slug Godot boot, run and SMG
        if: steps.admission.outputs.run == 'true'
        timeout-minutes: 5
        working-directory: e2e
        run: ./node_modules/.bin/playwright test staging-pawn-slug-godot.spec.js --config=playwright.staging.config.js

      - name: Cleanup staging smoke identity
        if: always() && steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_E2E_USERNAME:-}" ]]; then echo 'No se creó identidad de smoke; cleanup no necesario.'; exit 0; fi
          python3 -S scripts/staging_smoke_user_cleanup.py

      - name: Upload Pawn Slug staging evidence
        if: always() && steps.admission.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-pawn-slug-godot-visual-${{ env.DEPLOY_SHA }}
          path: e2e/test-results/
          if-no-files-found: error
          retention-days: 7
