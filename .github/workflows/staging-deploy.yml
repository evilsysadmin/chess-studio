name: Deploy to staging
on:
  workflow_run:
    workflows:
      - Main · admission
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
# running generation finishes while newer pending.
concurrency:
  group: chess-studio-staging-deploy
  cancel-in-progress: false
env:
  STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
  STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
  STAGING_AI_URL: https://ai-staging.shadowops.dpdns.org
jobs:
  prepare:
    name: Prepare coherent staging generation
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      deploy_sha: ${{ steps.admission.outputs.deploy_sha }}
      admitted: ${{ steps.admission.outputs.admitted }}
      pawn_slug_visual_required: ${{ steps.admission.outputs.pawn_slug_visual_required }}
      resend_bootstrap_required: ${{ steps.admission.outputs.resend_bootstrap_required }}
      continuity_required: ${{ steps.admission.outputs.continuity_required }}
    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2
      - name: Prepare staging generation
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -S scripts/staging_deploy_prepare.py --self-test
          python3 -S scripts/staging_deploy_prepare.py --sha "$DEPLOY_SHA" --github-output "$GITHUB_OUTPUT"
  backend:
    name: Backend · exact OCI generation
    needs: prepare
    if: needs.prepare.outputs.admitted == 'true'
    outputs:
      superseded: ${{ steps.backend_state.outputs.superseded }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: oci-staging-mutations
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Validate zero-cost host watcher contract
        run: |
          python3 -S scripts/oci_staging_deploy_watcher.py --self-test
          python3 -S scripts/staging_generation.py --self-test
      - name: Wait for zero-cost host watcher fast-path
        id: watcher
        # The host publishes /_deploy/committed only after its post-cutover
        # attestations pass; a rollback restores the previous SHA.
        run: python3 -S scripts/staging_generation.py watch-committed --sha "$DEPLOY_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Re-check main before OCI fallback
        id: fallback_admission
        if: steps.watcher.outputs.converged != 'true'
        run: python3 -S scripts/staging_generation.py main-head --sha "$DEPLOY_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Restore cached OCI SDK toolchain
        if: steps.watcher.outputs.converged != 'true' && steps.fallback_admission.outputs.superseded != 'true'
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'
      - name: Validate OCI deploy contracts
        if: steps.watcher.outputs.converged != 'true' && steps.fallback_admission.outputs.superseded != 'true'
        run: |
          python3 -S scripts/oci_run_command.py --self-test
          python3 -S scripts/oci_runtime_config.py --self-test
          python3 -S scripts/oci_vault_sync.py --self-test
          python3 -S scripts/verify_backend_staging.py --self-test
      - name: Deploy exact backend commit to OCI staging
        if: steps.watcher.outputs.converged != 'true' && steps.fallback_admission.outputs.superseded != 'true'
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
        run: |
          set -euo pipefail
          # A transient exact /release is not enough: the host may still be
          # inside post-cutover accreditation and can roll back afterwards.
          if python3 scripts/verify_backend_staging.py --api-url "$STAGING_API_URL" --sha "$DEPLOY_SHA" --attempts 1 --interval 0 >/dev/null 2>&1; then
            echo "::notice title=OCI fallback avoided::A1 terminó y acreditó $DEPLOY_SHA; skip Run Command."
            exit 0
          fi
          python3 scripts/oci_run_command.py deploy --repo-ref "$DEPLOY_SHA"
      - name: Re-check main after OCI fallback
        id: post_deploy
        if: steps.watcher.outputs.converged != 'true' && steps.fallback_admission.outputs.superseded != 'true'
        run: python3 -S scripts/staging_generation.py main-head --sha "$DEPLOY_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Resolve backend generation state
        id: backend_state
        if: always()
        env:
          SUPERSEDED: ${{ steps.fallback_admission.outputs.superseded == 'true' || steps.post_deploy.outputs.superseded == 'true' }}
        run: echo "superseded=$SUPERSEDED" >> "$GITHUB_OUTPUT"
      - name: Verify backend public path reaches exact OCI generation
        if: steps.backend_state.outputs.superseded != 'true'
        run: >-
          python3 scripts/verify_backend_staging.py
          --api-url "$STAGING_API_URL"
          --sha "$DEPLOY_SHA"
          --attempts 20
          --interval 2
  frontend:
    name: Frontend · exact Pages generation
    needs: prepare
    if: needs.prepare.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Restore prebuilt frontend from admission
        id: prebuilt_frontend_download
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: staging-frontend-${{ env.DEPLOY_SHA }}
          path: frontend/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate prebuilt frontend or select fallback build
        id: frontend_artifact
        shell: bash
        run: |
          set -euo pipefail
          if python3 -S scripts/staging_generation.py dist-identity --sha "$DEPLOY_SHA"; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend fast-path::Reuso dist de $DEPLOY_SHA."
          else
            rm -rf frontend/dist
            echo 'hit=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend fallback::Artifact ausente/inválido; recompilo."
          fi
      - name: CF auth guard
        run: python3 -S scripts/cloudflare_staging_pages_smoke.py && python3 scripts/cloudflare_auth_rate_limit.py --staging-best-effort
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore cached Wrangler toolchain
        uses: ./.github/actions/setup-wrangler
        with:
          version: '4.127.1'
          node-version: '22'
      - name: Verify release-critical Pages topology
        id: pages_bootstrap
        run: python3 scripts/cloudflare_staging_pages.py --release-fast-path
      - name: Build frontend for staging
        if: steps.frontend_artifact.outputs.hit != 'true'
        uses: ./.github/actions/build-staging-frontend
        with:
          sha: ${{ env.DEPLOY_SHA }}
          api-url: ${{ env.STAGING_API_URL }}
          repo-vars: ${{ toJSON(vars) }}
      - name: Retain immutable JS/CSS across Pages generations
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/pages_runtime_asset_grace.py --self-test
          python3 -S scripts/pages_runtime_asset_grace.py \
            --dist frontend/dist \
            --origin "https://staging.chess-studio.shadowops.dpdns.org"
      - name: Deploy tested frontend to Cloudflare Pages
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" pages deploy dist \
            --project-name chess-studio-staging \
            --branch main \
            --commit-hash "$DEPLOY_SHA" \
            --commit-dirty=false
      - name: Verify frontend staging build identity
        run: python3 -S scripts/staging_generation.py wait --sha "$DEPLOY_SHA" --surfaces frontend --attempts 150 --interval 2 --root
  worker:
    name: Worker · exact AI generation
    needs: prepare
    if: needs.prepare.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore cached Wrangler toolchain
        uses: ./.github/actions/setup-wrangler
        with:
          version: '4.127.1'
          node-version: '22'
      - name: Staging Worker isolation contract
        run: python3 -S scripts/deploy_staging_ai_worker.py --self-test
      - name: Deploy and verify exact staging Worker generation
        run: python3 scripts/deploy_staging_ai_worker.py
      - name: Shared Workers AI live contract
        run: python3 scripts/cloudflare_ai_preflight.py --worker-url "$STAGING_AI_URL"
  smoke:
    name: Browser smoke · ${{ matrix.label }}
    needs: [prepare, backend, frontend, worker]
    if: needs.prepare.outputs.admitted == 'true' && needs.backend.outputs.superseded != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: live
            label: War Room live
            spec: staging-live.spec.js
          - key: restore
            label: authoritative F5 restore
            spec: staging-war-room-restore.spec.js
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Verify staging generation parity before browser smoke
        run: python3 -S scripts/staging_generation.py wait --sha "$DEPLOY_SHA" --surfaces backend,frontend,worker --attempts 60 --interval 5
      - name: Restore cached OCI SDK toolchain
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'
      - name: Load ephemeral staging invite code from OCI runtime
        run: python3 scripts/staging_smoke_env.py secrets
      - name: Prepare and sweep staging smoke janitor
        if: matrix.key == 'live'
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/staging_smoke_user_cleanup.py --self-test
          python3 -S scripts/staging_smoke_user_cleanup.py --sweep
      - name: Generate isolated staging smoke credentials
        run: python3 -S scripts/staging_smoke_env.py identity
      - name: Restore staging browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'
      - name: Live browser smoke against deployed staging
        timeout-minutes: 5
        working-directory: e2e
        env:
          STAGING_SMOKE_SPEC: ${{ matrix.spec }}
        run: ./node_modules/.bin/playwright test "$STAGING_SMOKE_SPEC" --config=playwright.staging.config.js
      - name: Cleanup staging smoke identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_E2E_USERNAME:-}" ]]; then echo 'No se creó identidad de smoke; cleanup no necesario.'; exit 0; fi
          python3 -S scripts/staging_smoke_user_cleanup.py
      - name: Upload staging browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-live-playwright-${{ env.DEPLOY_SHA }}-${{ matrix.key }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
  pawn_slug_visual:
    name: Pawn Slug Godot · live visual evidence
    needs: [prepare, backend, frontend, worker, smoke]
    if: needs.prepare.outputs.admitted == 'true' && needs.prepare.outputs.pawn_slug_visual_required == 'true' && needs.backend.outputs.superseded != 'true'
    uses: ./.github/workflows/staging-pawn-slug-visual.yml
    with:
      deploy_sha: ${{ needs.prepare.outputs.deploy_sha }}
    secrets: inherit
  summary:
    name: Staging generation complete
    needs: [prepare, backend, frontend, worker, smoke]
    if: needs.prepare.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      BACKEND: ${{ needs.backend.result }}
      FRONTEND: ${{ needs.frontend.result }}
      WORKER: ${{ needs.worker.result }}
      SMOKE: ${{ needs.smoke.result }}
      RESEND_BOOTSTRAP_REQUIRED: ${{ needs.prepare.outputs.resend_bootstrap_required }}
      CONTINUITY_REQUIRED: ${{ needs.prepare.outputs.continuity_required }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Summary
        run: echo "### Staging $DEPLOY_SHA · backend=$BACKEND · frontend=$FRONTEND · worker=$WORKER · smoke=$SMOKE" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch scoped post-staging work
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESEND_BOOTSTRAP_REQUIRED" == true ]]; then
            gh workflow run oci-resend-bootstrap.yml --ref main -f bootstrap_sha="$DEPLOY_SHA"
            echo "::notice title=Resend recovery dispatched::$DEPLOY_SHA"
          fi
          if [[ "$CONTINUITY_REQUIRED" == true ]]; then
            gh workflow run staging-deploy-continuity.yml --ref main -f deploy_sha="$DEPLOY_SHA"
            echo "::notice title=Continuity drill dispatched::$DEPLOY_SHA"
          fi
          if [[ "$RESEND_BOOTSTRAP_REQUIRED" != true && "$CONTINUITY_REQUIRED" != true ]]; then
            echo "::notice::No follow-up"
          fi
