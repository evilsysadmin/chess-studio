name: Staging · deploy

on:
  workflow_run:
    workflows:
      - Quality · CI gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-studio-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Backend + frontend + AI staging generation
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
      STAGING_AI_URL: https://ai-staging.shadowops.dpdns.org

    steps:
      - name: Validate staging credentials and commit
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo '::error::Falta RENDER_API_KEY'; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::Falta CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::Falta CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA no es un commit completo: $DEPLOY_SHA"; exit 1; }

      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Este es el único stale guard de la generación. Una vez que empieza la
      # primera mutación, el SHA queda fijado y backend/frontend/Worker deben
      # completar juntos aunque main avance mientras tanto.
      - name: Refuse stale staging commit
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "::error::CI aprobó $DEPLOY_SHA, pero main ya apunta a $current_main. No despliego staging obsoleto."
            exit 1
          fi

      - name: Install pinned Render CLI
        shell: bash
        run: |
          set -euo pipefail
          version='2.25.0'
          archive="$RUNNER_TEMP/render-cli.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/render-oss/cli/releases/download/v${version}/cli_${version}_linux_amd64.zip" \
            --output "$archive"
          echo '3b3f1f839ef36b81f12d84ac7288f1c96f9f7519b39c53fe6f866612f704e7cd  '"$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP/render-cli"
          render_bin="$(find "$RUNNER_TEMP/render-cli" -type f -name "cli_v${version}" -print -quit)"
          [[ -n "$render_bin" ]] || { echo "::error::El ZIP verificado no contiene cli_v${version}"; exit 1; }
          install "$render_bin" "$RUNNER_TEMP/render"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Reconcile Render staging configuration
        id: render_bootstrap
        run: python3 scripts/render_staging_bootstrap.py

      - name: Deploy exact backend commit to Render staging
        id: render_deploy
        shell: bash
        run: |
          set -euo pipefail
          service_id='${{ steps.render_bootstrap.outputs.service_id }}'
          [[ -n "$service_id" ]] || { echo '::error::Bootstrap no devolvió service_id'; exit 1; }
          response="$RUNNER_TEMP/render-staging-deploy.json"
          status="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$DEPLOY_SHA\"}" \
            --output "$response" \
            --write-out '%{http_code}' \
            "https://api.render.com/v1/services/$service_id/deploys")"
          [[ "$status" == 201 || "$status" == 202 ]] || { echo "::error::Render deploy devolvió HTTP $status"; exit 1; }
          deploy_id="$(python3 - "$response" <<'PY'
          import json, pathlib, sys
          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          deploy = body.get('deploy') if isinstance(body, dict) and isinstance(body.get('deploy'), dict) else body
          print((deploy or {}).get('id', ''))
          PY
          )"
          [[ -n "$deploy_id" ]] || { echo '::error::Render no devolvió deploy id'; cat "$response"; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Render staging deploy
        shell: bash
        run: |
          set -euo pipefail
          service_id='${{ steps.render_bootstrap.outputs.service_id }}'
          deploy_id='${{ steps.render_deploy.outputs.deploy_id }}'
          live=false
          for attempt in {1..180}; do
            response="$RUNNER_TEMP/render-staging-status-$attempt.json"
            http="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              --output "$response" \
              --write-out '%{http_code}' \
              "https://api.render.com/v1/services/$service_id/deploys/$deploy_id")"
            [[ "$http" == 200 ]] || { echo "::error::Consultar deploy Render devolvió HTTP $http"; exit 1; }
            readarray -t deploy_meta < <(python3 - "$response" <<'PY'
          import json, pathlib, sys
          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          deploy = body.get('deploy') if isinstance(body, dict) and isinstance(body.get('deploy'), dict) else body
          deploy = deploy or {}
          print(deploy.get('status', 'unknown'))
          print(deploy.get('commit', {}).get('id', '') if isinstance(deploy.get('commit'), dict) else deploy.get('commitId', ''))
          PY
          )
            deploy_status="${deploy_meta[0]:-unknown}"
            deployed_commit="${deploy_meta[1]:-}"
            echo "Render staging: $deploy_status · ${deployed_commit:-commit-pendiente} (intento $attempt/180)"
            case "$deploy_status" in
              live)
                if [[ -n "$deployed_commit" && "$deployed_commit" != "$DEPLOY_SHA" ]]; then
                  echo "::error::Render marcó live el commit $deployed_commit, esperaba $DEPLOY_SHA"
                  exit 1
                fi
                live=true
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy staging terminó en $deploy_status"
                exit 1
                ;;
            esac
            sleep 5
          done
          [[ "$live" == true ]] || { echo '::error::Render staging no llegó a live en 15 minutos'; exit 1; }

      - name: Verify backend staging readiness and build identity
        shell: bash
        run: |
          set -euo pipefail
          gate_ok=false
          for attempt in {1..60}; do
            ready_body="$RUNNER_TEMP/staging-api-ready-$attempt.json"
            ready_status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              --output "$ready_body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: chess-studio-staging-deploy/2' \
              "$STAGING_API_URL/ready" || true)"

            release_body="$RUNNER_TEMP/staging-api-release-$attempt.json"
            release_status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              --output "$release_body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: chess-studio-staging-deploy/2' \
              "$STAGING_API_URL/release?sha=$DEPLOY_SHA" || true)"

            if [[ "$ready_status" == 200 && "$release_status" == 200 ]] && \
              python3 - "$ready_body" "$release_body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          ready = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected = sys.argv[3].lower()
          readiness_ok = ready.get('ok') is True and ready.get('storage') == 'mongo'
          build_ok = str(release.get('build') or '').lower() == expected
          raise SystemExit(0 if readiness_ok and build_ok else 1)
          PY
            then
              gate_ok=true
              break
            fi

            echo "Backend staging aún no acredita Mongo ready + SHA $DEPLOY_SHA (ready=${ready_status:-curl-error}, release=${release_status:-curl-error}, intento $attempt/60)"
            sleep 5
          done
          [[ "$gate_ok" == true ]] || { echo '::error::Backend staging no acreditó readiness y SHA esperado tras 5 minutos'; exit 1; }

      - name: Cloudflare bootstrap contract smoke
        run: python3 -S scripts/cloudflare_staging_pages_smoke.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Reconcile Pages project, domains and staging DNS
        id: pages_bootstrap
        run: python3 scripts/cloudflare_staging_pages.py

      - name: Build frontend for staging
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_PUBLIC_BASE: /
          VITE_BUILD_SHA: ${{ env.DEPLOY_SHA }}
          VITE_GRAFANA_CLOUD_URL: ${{ vars.VITE_GRAFANA_CLOUD_URL }}
          VITE_GRAFANA_LOGS_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_LOGS_DASHBOARD_URL }}
          VITE_GRAFANA_HEALTH_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_HEALTH_DASHBOARD_URL }}
          VITE_GRAFANA_TRACES_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_TRACES_DASHBOARD_URL }}
        run: npm run build

      - name: Deploy tested frontend to Cloudflare Pages
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name chess-studio-staging \
            --branch main \
            --commit-hash "$DEPLOY_SHA" \
            --commit-dirty=false

      - name: Verify frontend staging build identity
        shell: bash
        run: |
          set -euo pipefail
          release_ok=false
          for attempt in {1..60}; do
            body="$RUNNER_TEMP/staging-release-$attempt.json"
            status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output "$body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              "$STAGING_URL/release.json?sha=$DEPLOY_SHA" || true)"
            if [[ "$status" == 200 ]] && python3 - "$body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          actual = str(payload.get('build') or '').lower()
          expected = sys.argv[2].lower()
          raise SystemExit(0 if actual == expected else 1)
          PY
            then
              release_ok=true
              break
            fi
            echo "Frontend staging aún no sirve $DEPLOY_SHA (HTTP ${status:-curl-error}, intento $attempt/60)"
            sleep 5
          done
          [[ "$release_ok" == true ]] || { echo '::error::Pages no sirvió el SHA esperado tras 5 minutos'; exit 1; }

          root_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$STAGING_URL/")"
          [[ "$root_status" == 200 ]] || { echo "::error::Frontend staging raíz devuelve HTTP $root_status"; exit 1; }

      # El Worker forma parte de la misma generación serializada. Ya no existe
      # un segundo stale guard entre Pages y Workers AI que pueda dejar la app
      # a N y el Worker a N-1 cuando main avanza durante el despliegue.
      - name: Staging Worker isolation contract
        run: python3 -S scripts/deploy_staging_ai_worker.py --self-test

      - name: Deploy exact staging Worker and synchronize shared secret
        run: python3 scripts/deploy_staging_ai_worker.py --service-id '${{ steps.render_bootstrap.outputs.service_id }}'

      - name: Wait for staging Worker Custom Domain and health
        shell: bash
        run: |
          set -euo pipefail
          health_ok=false
          for attempt in {1..60}; do
            body="$RUNNER_TEMP/staging-ai-health-$attempt.json"
            status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output "$body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: chess-studio-staging-ai-health/2' \
              "$STAGING_AI_URL/health" || true)"
            if [[ "$status" == 200 ]] && python3 scripts/cloudflare_health_contract.py "$body"; then
              health_ok=true
              break
            fi
            echo "Workers AI staging aún no está healthy (HTTP ${status:-curl-error}, intento $attempt/60)"
            sleep 5
          done
          [[ "$health_ok" == true ]] || { echo '::error::Workers AI staging no quedó healthy tras 5 minutos'; exit 1; }

      - name: Shared Workers AI live contract
        run: python3 scripts/cloudflare_ai_preflight.py --worker-url "$STAGING_AI_URL"

      - name: Verify staging generation parity before browser smoke
        shell: bash
        run: |
          set -euo pipefail
          backend="$RUNNER_TEMP/generation-backend.json"
          frontend="$RUNNER_TEMP/generation-frontend.json"
          ai="$RUNNER_TEMP/generation-ai.json"

          backend_status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "$backend" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_API_URL/release?sha=$DEPLOY_SHA")"
          frontend_status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "$frontend" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_URL/release.json?sha=$DEPLOY_SHA")"
          ai_status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "$ai" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$STAGING_AI_URL/health")"

          [[ "$backend_status" == 200 ]] || { echo "::error::Generation parity: backend HTTP $backend_status"; exit 1; }
          [[ "$frontend_status" == 200 ]] || { echo "::error::Generation parity: frontend HTTP $frontend_status"; exit 1; }
          [[ "$ai_status" == 200 ]] || { echo "::error::Generation parity: AI HTTP $ai_status"; exit 1; }

          python3 scripts/cloudflare_health_contract.py "$ai"
          python3 - "$backend" "$frontend" "$ai" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          expected = sys.argv[4].lower()
          backend = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          frontend = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          ai = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          actual = {
              'backend': str(backend.get('build') or '').lower(),
              'frontend': str(frontend.get('build') or '').lower(),
              'worker': str(ai.get('build') or '').lower(),
          }
          mismatched = {name: value for name, value in actual.items() if value != expected}
          if mismatched:
              raise SystemExit(f"generation skew: {mismatched} expected={expected}")
          PY
          echo "Staging generation coherent: backend=$DEPLOY_SHA frontend=$DEPLOY_SHA Worker=$DEPLOY_SHA"

      - name: Prepare and sweep staging smoke janitor
        env:
          RENDER_STAGING_SERVICE_ID: ${{ steps.render_bootstrap.outputs.service_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/staging_smoke_user_cleanup.py --self-test
          python3 -m pip install --disable-pip-version-check --quiet 'pymongo>=4.9,<5'
          python3 scripts/staging_smoke_user_cleanup.py --sweep

      - name: Derive isolated staging smoke credentials
        shell: bash
        run: |
          set -euo pipefail
          identity="$(printf 'chess-studio-staging-smoke-user:v2:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$DEPLOY_SHA" "$RENDER_API_KEY" | sha256sum | awk '{print substr($1,1,16)}')"
          secret="$(printf 'chess-studio-staging-smoke-password:v2:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RENDER_API_KEY" | sha256sum | awk '{print $1}')"
          username="ci_smoke_${identity}"
          password="CS!${secret}"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "STAGING_E2E_USERNAME=$username" >> "$GITHUB_ENV"
          echo "STAGING_E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      # Same cache key as CI: when the lockfile pins the same Playwright browser,
      # staging reuses the exact Chromium payload instead of downloading it again.
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install staging E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Ensure cached Chromium is present
        working-directory: e2e
        run: npx playwright install chromium

      - name: Live browser smoke against deployed staging
        timeout-minutes: 5
        working-directory: e2e
        run: npx playwright test --config=playwright.staging.config.js

      - name: Cleanup staging smoke identity
        if: always()
        env:
          RENDER_STAGING_SERVICE_ID: ${{ steps.render_bootstrap.outputs.service_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_E2E_USERNAME:-}" ]]; then
            echo 'No se creó identidad de smoke; cleanup no necesario.'
            exit 0
          fi
          python3 scripts/staging_smoke_user_cleanup.py

      - name: Upload staging browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-live-playwright-${{ env.DEPLOY_SHA }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Staging desplegado como una generación coherente'
            echo
            echo '- Frontend: `https://staging.chess-studio.shadowops.dpdns.org`'
            echo '- API: `https://api-staging.chess-studio.shadowops.dpdns.org/api`'
            echo '- Workers AI: `https://ai-staging.shadowops.dpdns.org`'
            echo '- Render: `chess-study-backend-staging`'
            echo '- Pages project: `chess-studio-staging`'
            echo "- Generation SHA: \`$DEPLOY_SHA\`"
            echo '- Backend SHA: `mismo generation SHA · verificado`'
            echo '- Frontend SHA: `mismo generation SHA · verificado`'
            echo '- Worker SHA: `mismo generation SHA · verificado por /health`'
            echo "- Web Analytics: \`${{ steps.pages_bootstrap.outputs.analytics || 'revisar permiso Account Settings' }}\`"
            echo '- Mongo staging: `ready`'
            echo '- Generation parity gate: `N/N/N · OK`'
            echo '- Live browser smoke: `login → Home → War Room → F5 → chunk recovery → e2-e4 · OK`'
            echo '- Visual evidence: `vídeo Chromium retenido 7 días en el artefacto staging-live-playwright-*`'
            echo '- Identidad CI: `eliminada y verificada`'
          } >> "$GITHUB_STEP_SUMMARY"
