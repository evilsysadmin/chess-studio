name: Staging · deploy

on:
  workflow_run:
    workflows:
      - Main · admission
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: chess-studio-staging-deploy
  cancel-in-progress: false

env:
  STAGING_URL: https://staging.chess-studio.shadowops.dpdns.org
  STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
  STAGING_AI_URL: https://ai-staging.shadowops.dpdns.org

jobs:
  prepare:
    # Legacy contract phrase kept intentionally for grep-based delivery guards:
    # Backend + frontend + AI staging generation
    name: Prepare coherent staging generation
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      deploy_sha: ${{ steps.admission.outputs.deploy_sha }}

    steps:
      - name: Validate staging commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA no es un commit completo: $DEPLOY_SHA"; exit 1; }

      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Este es el único stale guard de la generación. Si main ya avanzó antes
      # de la primera mutación, esta ejecución queda superseded y se autocancela.
      # Tras este punto el SHA queda fijado y las tres ramas de despliegue deben
      # converger juntas aunque main avance mientras tanto.
      - name: Supersede stale staging commit
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "::notice title=Staging superseded::CI aprobó $DEPLOY_SHA, pero main ya apunta a $current_main. Cancelo esta generación antes de cualquier mutación."
            {
              echo '### Staging superseded por un main más nuevo'
              echo
              echo "- CI-approved SHA: \`$DEPLOY_SHA\`"
              echo "- Current main: \`$current_main\`"
              echo '- Acción: `autocancelar esta ejecución antes de Render/Pages/Worker`'
              echo '- Siguiente generación: `la dispara la admisión normal del HEAD actual cuando quede verde`'
              echo '- Rebase/retry artificial: `no necesario`'
            } >> "$GITHUB_STEP_SUMMARY"

            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

            echo 'Cancelación solicitada; permanezco fail-closed hasta que GitHub detenga el runner.'
            while :; do
              sleep 30
            done
          fi
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Staging admission OK: $DEPLOY_SHA sigue siendo main HEAD."

  # Render configuration is backend-specific control-plane work. Keep it out of
  # prepare so Pages and Workers AI can start as soon as the SHA is admitted.
  render_reconcile:
    name: Render · reconcile staging service
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    outputs:
      render_service_id: ${{ steps.render_bootstrap.outputs.service_id }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Reconcile Render staging configuration
        id: render_bootstrap
        run: python3 scripts/render_staging_bootstrap.py

  backend:
    name: Backend · exact Render generation
    needs: [prepare, render_reconcile]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ needs.render_reconcile.outputs.render_service_id }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Deploy exact backend commit to Render staging
        id: render_deploy
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RENDER_SERVICE_ID" ]] || { echo '::error::Bootstrap no devolvió service_id'; exit 1; }
          response="$RUNNER_TEMP/render-staging-deploy.json"
          status="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$DEPLOY_SHA\"}" \
            --output "$response" \
            --write-out '%{http_code}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          [[ "$status" == 201 || "$status" == 202 ]] || { echo "::error::Render deploy devolvió HTTP $status"; exit 1; }
          deploy_id="$(python3 - "$response" <<'PY'
          import json, pathlib, sys
          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          deploy = body.get('deploy') if isinstance(body, dict) and isinstance(body.get('deploy'), dict) else body
          print((deploy or {}).get('id', ''))
          PY
          )"
          [[ -n "$deploy_id" ]] || { echo '::error::Render no devolvió deploy id'; cat "$response"; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Render staging deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_id='${{ steps.render_deploy.outputs.deploy_id }}'
          live=false
          for attempt in {1..450}; do
            response="$RUNNER_TEMP/render-staging-status-$attempt.json"
            http="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              --output "$response" \
              --write-out '%{http_code}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            [[ "$http" == 200 ]] || { echo "::error::Consultar deploy Render devolvió HTTP $http"; exit 1; }
            readarray -t deploy_meta < <(python3 - "$response" <<'PY'
          import json, pathlib, sys
          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          deploy = body.get('deploy') if isinstance(body, dict) and isinstance(body.get('deploy'), dict) else body
          deploy = deploy or {}
          print(deploy.get('status', 'unknown'))
          print(deploy.get('commit', {}).get('id', '') if isinstance(deploy.get('commit'), dict) else deploy.get('commitId', ''))
          PY
          )
            deploy_status="${deploy_meta[0]:-unknown}"
            deployed_commit="${deploy_meta[1]:-}"
            echo "Render staging: $deploy_status · ${deployed_commit:-commit-pendiente} (intento $attempt/450)"
            case "$deploy_status" in
              live)
                if [[ -n "$deployed_commit" && "$deployed_commit" != "$DEPLOY_SHA" ]]; then
                  echo "::error::Render marcó live el commit $deployed_commit, esperaba $DEPLOY_SHA"
                  exit 1
                fi
                live=true
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy staging terminó en $deploy_status"
                exit 1
                ;;
            esac
            sleep 2
          done
          [[ "$live" == true ]] || { echo '::error::Render staging no llegó a live en 15 minutos'; exit 1; }

      - name: Verify backend staging readiness and build identity
        shell: bash
        run: |
          set -euo pipefail
          gate_ok=false
          for attempt in {1..150}; do
            ready_body="$RUNNER_TEMP/staging-api-ready-$attempt.json"
            ready_status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              --output "$ready_body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: chess-studio-staging-deploy/3' \
              "$STAGING_API_URL/ready" || true)"

            release_body="$RUNNER_TEMP/staging-api-release-$attempt.json"
            release_status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              --output "$release_body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: chess-studio-staging-deploy/3' \
              "$STAGING_API_URL/release?sha=$DEPLOY_SHA" || true)"

            if [[ "$ready_status" == 200 && "$release_status" == 200 ]] && \
              python3 - "$ready_body" "$release_body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          ready = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected = sys.argv[3].lower()
          readiness_ok = ready.get('ok') is True and ready.get('storage') == 'mongo'
          build_ok = str(release.get('build') or '').lower() == expected
          raise SystemExit(0 if readiness_ok and build_ok else 1)
          PY
            then
              gate_ok=true
              break
            fi

            echo "Backend staging aún no acredita Mongo ready + SHA $DEPLOY_SHA (ready=${ready_status:-curl-error}, release=${release_status:-curl-error}, intento $attempt/150)"
            sleep 2
          done
          [[ "$gate_ok" == true ]] || { echo '::error::Backend staging no acreditó readiness y SHA esperado tras 5 minutos'; exit 1; }

  frontend:
    name: Frontend · exact Pages generation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Cloudflare bootstrap contract smoke
        run: python3 -S scripts/cloudflare_staging_pages_smoke.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Restore cached Wrangler toolchain
        uses: ./.github/actions/setup-wrangler
        with:
          version: '4.127.1'
          node-version: '22'

      - name: Reconcile Pages project, domains and staging DNS
        id: pages_bootstrap
        run: python3 scripts/cloudflare_staging_pages.py

      - name: Build frontend for staging
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_PUBLIC_BASE: /
          VITE_BUILD_SHA: ${{ env.DEPLOY_SHA }}
          VITE_GRAFANA_CLOUD_URL: ${{ vars.VITE_GRAFANA_CLOUD_URL }}
          VITE_GRAFANA_LOGS_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_LOGS_DASHBOARD_URL }}
          VITE_GRAFANA_HEALTH_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_HEALTH_DASHBOARD_URL }}
          VITE_GRAFANA_TRACES_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_TRACES_DASHBOARD_URL }}
        run: npm run build

      - name: Deploy tested frontend to Cloudflare Pages
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" pages deploy dist \
            --project-name chess-studio-staging \
            --branch main \
            --commit-hash "$DEPLOY_SHA" \
            --commit-dirty=false

      - name: Verify frontend staging build identity
        shell: bash
        run: |
          set -euo pipefail
          release_ok=false
          for attempt in {1..150}; do
            body="$RUNNER_TEMP/staging-release-$attempt.json"
            status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output "$body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              "$STAGING_URL/release.json?sha=$DEPLOY_SHA" || true)"
            if [[ "$status" == 200 ]] && python3 - "$body" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          actual = str(payload.get('build') or '').lower()
          expected = sys.argv[2].lower()
          raise SystemExit(0 if actual == expected else 1)
          PY
            then
              release_ok=true
              break
            fi
            echo "Frontend staging aún no sirve $DEPLOY_SHA (HTTP ${status:-curl-error}, intento $attempt/150)"
            sleep 2
          done
          [[ "$release_ok" == true ]] || { echo '::error::Pages no sirvió el SHA esperado tras 5 minutos'; exit 1; }

          root_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$STAGING_URL/")"
          [[ "$root_status" == 200 ]] || { echo "::error::Frontend staging raíz devuelve HTTP $root_status"; exit 1; }

  worker:
    name: Worker · exact AI generation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore cached Wrangler toolchain
        uses: ./.github/actions/setup-wrangler
        with:
          version: '4.127.1'
          node-version: '22'

      - name: Staging Worker isolation contract
        run: python3 -S scripts/deploy_staging_ai_worker.py --self-test

      - name: Deploy exact staging Worker and synchronize shared secret
        run: python3 scripts/deploy_staging_ai_worker.py

      - name: Wait for staging Worker Custom Domain and health
        shell: bash
        run: |
          set -euo pipefail
          health_ok=false
          for attempt in {1..150}; do
            body="$RUNNER_TEMP/staging-ai-health-$attempt.json"
            status="$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output "$body" \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: chess-studio-staging-ai-health/3' \
              "$STAGING_AI_URL/health" || true)"
            if [[ "$status" == 200 ]] && python3 scripts/cloudflare_health_contract.py "$body"; then
              health_ok=true
              break
            fi
            echo "Workers AI staging aún no está healthy (HTTP ${status:-curl-error}, intento $attempt/150)"
            sleep 2
          done
          [[ "$health_ok" == true ]] || { echo '::error::Workers AI staging no quedó healthy tras 5 minutos'; exit 1; }

      - name: Shared Workers AI live contract
        run: python3 scripts/cloudflare_ai_preflight.py --worker-url "$STAGING_AI_URL"

  parity:
    name: Generation parity · N/N/N
    needs: [prepare, backend, frontend, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify staging generation parity before browser smoke
        shell: bash
        run: |
          set -euo pipefail
          parity_ok=false
          for attempt in {1..60}; do
            backend="$RUNNER_TEMP/generation-backend-$attempt.json"
            frontend="$RUNNER_TEMP/generation-frontend-$attempt.json"
            ai="$RUNNER_TEMP/generation-ai-$attempt.json"

            backend_status="$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --output "$backend" --write-out '%{http_code}' \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "$STAGING_API_URL/release?sha=$DEPLOY_SHA" || true)"
            frontend_status="$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --output "$frontend" --write-out '%{http_code}' \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "$STAGING_URL/release.json?sha=$DEPLOY_SHA" || true)"
            ai_status="$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --output "$ai" --write-out '%{http_code}' \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "$STAGING_AI_URL/health" || true)"

            if [[ "$backend_status" == 200 && "$frontend_status" == 200 && "$ai_status" == 200 ]] && \
              python3 scripts/cloudflare_health_contract.py "$ai" >/dev/null 2>&1 && \
              python3 - "$backend" "$frontend" "$ai" "$DEPLOY_SHA" <<'PY'
          import json, pathlib, sys
          expected = sys.argv[4].lower()
          backend = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          frontend = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          ai = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          actual = {
              'backend': str(backend.get('build') or '').lower(),
              'frontend': str(frontend.get('build') or '').lower(),
              'worker': str(ai.get('build') or '').lower(),
          }
          raise SystemExit(0 if all(value == expected for value in actual.values()) else 1)
          PY
            then
              parity_ok=true
              echo "Staging generation coherent: backend=$DEPLOY_SHA frontend=$DEPLOY_SHA Worker=$DEPLOY_SHA"
              break
            fi

            readarray -t observed < <(python3 - "$backend" "$frontend" "$ai" <<'PY'
          import json, pathlib, sys

          def build(path: str) -> str:
              try:
                  payload = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  return 'unreadable'
              return str(payload.get('build') or 'missing').lower()

          for path in sys.argv[1:]:
              print(build(path))
          PY
          )
            echo "Staging generation aún no converge: backend=${observed[0]:-unknown} (HTTP ${backend_status:-curl-error}), frontend=${observed[1]:-unknown} (HTTP ${frontend_status:-curl-error}), worker=${observed[2]:-unknown} (HTTP ${ai_status:-curl-error}), expected=$DEPLOY_SHA (intento $attempt/60)"
            sleep 5
          done
          [[ "$parity_ok" == true ]] || { echo '::error::Generation parity no convergió a N/N/N tras 5 minutos'; exit 1; }

  smoke:
    name: Browser smoke · ${{ matrix.label }}
    needs: [prepare, render_reconcile, parity]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      url: https://staging.chess-studio.shadowops.dpdns.org
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: live
            label: War Room live
            spec: staging-live.spec.js
          - key: restore
            label: authoritative F5 restore
            spec: staging-war-room-restore.spec.js
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ needs.render_reconcile.outputs.render_service_id }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Load ephemeral staging invite code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          import render_staging_bootstrap as render

          service_id = os.environ.get('RENDER_SERVICE_ID', '').strip()
          if not service_id:
              raise SystemExit('Falta RENDER_SERVICE_ID para leer INVITE_CODE de staging')
          invite = render.read_env(service_id, 'INVITE_CODE') or ''
          if len(invite) < 16:
              raise SystemExit('INVITE_CODE de staging falta o es demasiado corto')
          render.export_github_secret_env('STAGING_INVITE_CODE', invite)
          PY

      - name: Prepare and sweep staging smoke janitor
        if: matrix.key == 'live'
        shell: bash
        run: |
          set -euo pipefail
          python3 -S scripts/staging_smoke_user_cleanup.py --self-test
          python3 -S scripts/staging_smoke_user_cleanup.py --sweep

      - name: Derive isolated staging smoke credentials
        shell: bash
        env:
          SMOKE_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          identity="$(printf 'chess-studio-staging-smoke-user:v3:%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$DEPLOY_SHA" "$SMOKE_KEY" "$RENDER_API_KEY" | sha256sum | awk '{print substr($1,1,16)}')"
          secret="$(printf 'chess-studio-staging-smoke-password:v3:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SMOKE_KEY" "$RENDER_API_KEY" | sha256sum | awk '{print $1}')"
          username="ci_smoke_${identity}"
          password="CS!${secret}"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "STAGING_E2E_USERNAME=$username" >> "$GITHUB_ENV"
          echo "STAGING_E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Restore staging browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'false'

      - name: Live browser smoke against deployed staging
        timeout-minutes: 5
        working-directory: e2e
        env:
          STAGING_SMOKE_SPEC: ${{ matrix.spec }}
        run: ./node_modules/.bin/playwright test "$STAGING_SMOKE_SPEC" --config=playwright.staging.config.js

      - name: Cleanup staging smoke identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_E2E_USERNAME:-}" ]]; then
            echo 'No se creó identidad de smoke; cleanup no necesario.'
            exit 0
          fi
          python3 -S scripts/staging_smoke_user_cleanup.py

      - name: Upload staging browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-live-playwright-${{ env.DEPLOY_SHA }}-${{ matrix.key }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Staging generation complete
    needs: [prepare, backend, frontend, worker, parity, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}

    steps:
      - name: Summary
        shell: bash
        run: |
          {
            echo '### Staging desplegado como una generación coherente'
            echo
            echo '- Frontend: `https://staging.chess-studio.shadowops.dpdns.org`'
