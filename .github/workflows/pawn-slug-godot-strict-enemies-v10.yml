name: Pawn Slug · Godot strict enemies v10

on:
  pull_request:
    paths:
      - 'scripts/blender/render_pawn_slug_enemy_sheets_v1.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_enemy_v10.py'
      - 'scripts/art/validate_pawn_slug_godot_enemy_atlas_v10.py'
      - 'games/pawn-slug-godot/tests/enemy_strict_v10_atlas_smoke.gd'
      - '.github/workflows/pawn-slug-godot-strict-enemies-v10.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/blender/render_pawn_slug_enemy_sheets_v1.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_enemy_v10.py'
      - 'scripts/art/validate_pawn_slug_godot_enemy_atlas_v10.py'
      - 'games/pawn-slug-godot/tests/enemy_strict_v10_atlas_smoke.gd'
      - '.github/workflows/pawn-slug-godot-strict-enemies-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-enemies-v10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'

jobs:
  build-pawn:
    name: Build + gate strict-enemy-v10 · pawn
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENEMY_TYPE: pawn

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-blender-canonical

      - name: Render complete canonical enemy action set
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pawn-slug-enemy-strict-v10"
          mkdir -p "$ROOT/source"
          blender --background \
            --python scripts/blender/render_pawn_slug_enemy_sheets_v1.py \
            -- --output-dir "$ROOT/source" --enemy-type "$ENEMY_TYPE" --strict-runtime
          test -s "$ROOT/source/manifest.json"

      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: 'Pillow==12.3.0'

      - name: Static tool sanity
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/art/pack_pawn_slug_godot_strict_enemy_v10.py \
            scripts/art/validate_pawn_slug_godot_enemy_atlas_v10.py

      - name: Pack strict Godot enemy atlas
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pawn-slug-enemy-strict-v10"
          python3 scripts/art/pack_pawn_slug_godot_strict_enemy_v10.py \
            --source-dir "$ROOT/source" \
            --enemy-type "$ENEMY_TYPE" \
            --output "$ROOT/enemy_${ENEMY_TYPE}_godot_strict_16x7_96_v10.png" \
            --manifest "$ROOT/enemy_${ENEMY_TYPE}_strict_v10_manifest.json" \
            --review-board "$ROOT/enemy_${ENEMY_TYPE}_strict_v10_review_board.png" \
            --strips-dir "$ROOT/strips"

      - name: Strict enemy atlas gate
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pawn-slug-enemy-strict-v10"
          python3 scripts/art/validate_pawn_slug_godot_enemy_atlas_v10.py \
            --atlas "$ROOT/enemy_${ENEMY_TYPE}_godot_strict_16x7_96_v10.png" \
            --manifest "$ROOT/enemy_${ENEMY_TYPE}_strict_v10_manifest.json" \
            --enemy-type "$ENEMY_TYPE"

      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: pawn-slug-strict-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version

      - name: Consume strict enemy atlas in real Godot SpriteFrames
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pawn-slug-enemy-strict-v10"
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless \
            --path games/pawn-slug-godot \
            --script res://tests/enemy_strict_v10_atlas_smoke.gd -- \
            "$ROOT/enemy_${ENEMY_TYPE}_godot_strict_16x7_96_v10.png" \
            "$ROOT/enemy_${ENEMY_TYPE}_strict_v10_manifest.json"

      - name: Publish immutable strict enemy atlas to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pawn-slug-enemy-strict-v10"
          python3 -S scripts/r2_asset_publish.py publish \
            "$ROOT/enemy_${ENEMY_TYPE}_godot_strict_16x7_96_v10.png" \
            --logical-id "pawnSlug.godot.enemy.${ENEMY_TYPE}.strictV10" \
            --prefix "pawn-slug-godot/enemies/strict-v10/${ENEMY_TYPE}" \
            | tee "$ROOT/publish-atlas.txt"
          python3 -S scripts/r2_asset_publish.py publish \
            "$ROOT/enemy_${ENEMY_TYPE}_strict_v10_manifest.json" \
            --logical-id "pawnSlug.godot.enemy.${ENEMY_TYPE}.strictV10Manifest" \
            --prefix "pawn-slug-godot/enemies/strict-v10/${ENEMY_TYPE}/manifest" \
            | tee "$ROOT/publish-manifest.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-enemy-strict-v10-pawn-${{ github.event.pull_request.number || github.run_number }}
          path: |
            ${{ runner.temp }}/pawn-slug-enemy-strict-v10/enemy_pawn_godot_strict_16x7_96_v10.png
            ${{ runner.temp }}/pawn-slug-enemy-strict-v10/enemy_pawn_strict_v10_manifest.json
            ${{ runner.temp }}/pawn-slug-enemy-strict-v10/enemy_pawn_strict_v10_review_board.png
            ${{ runner.temp }}/pawn-slug-enemy-strict-v10/strips/*.png
            ${{ runner.temp }}/pawn-slug-enemy-strict-v10/publish-*.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
