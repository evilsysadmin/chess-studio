name: War Room mobile decor hotfix
on:
  push:
    branches:
      - fix/warroom3d-android-touch-targets
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/warroom3d-android-touch-targets
          fetch-depth: 0
      - name: Apply mobile decor patch
        run: |
          python scripts/patch_warroom3d_mobile_decor.py
          rm -f scripts/patch_warroom3d_mobile_decor.py
          rm -f .github/workflows/warroom3d-mobile-decor-hotfix.yml
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Brighten War Room decor on Android"
          git push origin HEAD:fix/warroom3d-android-touch-targets
