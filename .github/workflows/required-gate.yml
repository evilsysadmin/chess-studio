name: CI · required gate publisher

on:
  workflow_run:
    workflows:
      - Quality · CI gate
      - Blender setup · smoke
      - Home Matthias · Blender canonical art
      - Chronicles party · Blender canonical art
      - Pawn Slug · Blender canonical art
      - Pawn Slug · Enemy Blender canonical art
      - Pawn Slug · POW Blender canonical art
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: required-gate-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish consolidated required gate
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Evaluate required checks for this PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          pr_number="${EVENT_PR_NUMBER:-}"

          if [[ -z "$pr_number" || "$pr_number" == 'null' ]]; then
            pr_number="$(gh api "repos/${repo}/commits/${TRIGGER_HEAD_SHA}/pulls" \
              --jq 'sort_by(.number) | last | .number // empty')"
          fi

          if [[ -z "$pr_number" ]]; then
            echo 'No pull request is associated with this workflow run; nothing to publish.'
            exit 0
          fi

          pr_json="$(gh api "repos/${repo}/pulls/${pr_number}")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          pr_url="$(jq -r '.html_url' <<<"$pr_json")"

          declare -A required=()
          declare -A labels=(
            [cicd.yml]='Quality'
            [blender-setup-smoke.yml]='Blender setup'
            [home-matthias-blender-art.yml]='Home art'
            [chronicles-party-blender-art.yml]='Chronicles art'
            [pawn-slug-blender-art.yml]='Pawn Slug Matthias art'
            [pawn-slug-enemy-blender-art.yml]='Pawn Slug enemy art'
            [pawn-slug-pow-blender-art.yml]='Pawn Slug POW art'
          )
          ordered_workflows=(
            cicd.yml
            blender-setup-smoke.yml
            home-matthias-blender-art.yml
            chronicles-party-blender-art.yml
            pawn-slug-blender-art.yml
            pawn-slug-enemy-blender-art.yml
            pawn-slug-pow-blender-art.yml
          )

          # Quality is always required. Specialized art lanes are required only
          # when the PR diff matches the same source surface that starts them.
          required[cicd.yml]=1
          while IFS= read -r path; do
            case "$path" in
              .github/actions/setup-blender-canonical/*|scripts/blender/blender_setup_smoke.py|.github/workflows/blender-setup-smoke.yml)
                required[blender-setup-smoke.yml]=1
                ;;
            esac
            case "$path" in
              scripts/blender/build_home_matthias.py|scripts/blender/home_matthias_parts.py|scripts/blender/home_matthias_animations.py|scripts/blender/home_matthias_contract.py|scripts/blender/validate_home_matthias_contract.py|.github/workflows/home-matthias-blender-art.yml)
                required[home-matthias-blender-art.yml]=1
                ;;
            esac
            case "$path" in
              scripts/blender/build_chronicles_humanoid_party.py|scripts/blender/render_chronicles_party_preview.py|.github/workflows/chronicles-party-blender-art.yml)
                required[chronicles-party-blender-art.yml]=1
                ;;
            esac
            case "$path" in
              scripts/blender/render_pawn_slug_matthias_premium.py|scripts/blender/pawn_slug_matthias_premium_common.py|scripts/blender/pawn_slug_matthias_premium_weapons.py|scripts/blender/pawn_slug_matthias_premium_character.py|.github/workflows/pawn-slug-blender-art.yml)
                required[pawn-slug-blender-art.yml]=1
                ;;
            esac
            case "$path" in
              scripts/blender/render_pawn_slug_enemy_sheets_v1.py|.github/workflows/pawn-slug-enemy-blender-art.yml)
                required[pawn-slug-enemy-blender-art.yml]=1
                ;;
            esac
            case "$path" in
              scripts/blender/build_pawn_slug_pows_v2.py|.github/workflows/pawn-slug-pow-blender-art.yml)
                required[pawn-slug-pow-blender-art.yml]=1
                ;;
            esac
          done < <(gh api --paginate "repos/${repo}/pulls/${pr_number}/files?per_page=100" --jq '.[].filename')

          latest_run() {
            local workflow="$1"
            gh api "repos/${repo}/actions/workflows/${workflow}/runs?event=pull_request&head_sha=${head_sha}&per_page=100" \
              --jq '.workflow_runs | sort_by([.run_number, .run_attempt]) | last // {}'
          }

          waiting=()
          failed=()
          passed=()
          failure_url=''

          for workflow in "${ordered_workflows[@]}"; do
            [[ -n "${required[$workflow]:-}" ]] || continue

            run_json="$(latest_run "$workflow")"
            status="$(jq -r '.status // "missing"' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            run_url="$(jq -r '.html_url // empty' <<<"$run_json")"
            label="${labels[$workflow]}"

            echo "Required lane · ${label}: ${status}/${conclusion:-n/a}"
            if [[ "$status" != 'completed' ]]; then
              waiting+=("$label")
            elif [[ "$conclusion" != 'success' ]]; then
              failed+=("${label} (${conclusion:-unknown})")
              [[ -n "$failure_url" ]] || failure_url="$run_url"
            else
              passed+=("$label")
            fi
          done

          state='success'
          description="Required checks passed · ${#passed[@]} scoped lane(s)"
          target_url="$pr_url"

          if (( ${#failed[@]} > 0 )); then
            state='failure'
            description="Failed: $(IFS=', '; echo "${failed[*]}")"
            target_url="${failure_url:-$pr_url}"
          elif (( ${#waiting[@]} > 0 )); then
            state='pending'
            description="Waiting: $(IFS=', '; echo "${waiting[*]}")"
          fi

          # GitHub commit-status descriptions are bounded; keep the useful prefix.
          description="${description:0:140}"

          echo "PR #${pr_number} (${pr_state}) · required=${!required[*]}"
          echo "Publishing ${state}: ${description}"

          gh api --method POST "repos/${repo}/statuses/${head_sha}" \
            --raw-field state="$state" \
            --raw-field context='CI · required gate' \
            --raw-field description="$description" \
            --raw-field target_url="$target_url" >/dev/null
