name: Observability · production synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

concurrency:
  group: chess-studio-production-synthetic
  cancel-in-progress: true

jobs:
  probe:
    name: Liveness + readiness + authenticated gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      CHESS_SYNTHETIC_BASE_URL: ${{ vars.CHESS_SYNTHETIC_BASE_URL || 'https://api.chess-studio.shadowops.dpdns.org/api' }}
      CHESS_SYNTHETIC_USERNAME: ${{ secrets.CHESS_SYNTHETIC_USERNAME }}
      CHESS_SYNTHETIC_PASSWORD: ${{ secrets.CHESS_SYNTHETIC_PASSWORD }}
      CHESS_SYNTHETIC_GAMEPLAY: '1'
      CHESS_SYNTHETIC_EPHEMERAL: '1'
      CHESS_SYNTHETIC_INVITE_CODE: ${{ secrets.CHESS_SYNTHETIC_INVITE_CODE }}
      CHESS_SYNTHETIC_HEALTH_SLO_MS: ${{ vars.CHESS_SYNTHETIC_HEALTH_SLO_MS || '3000' }}
      CHESS_SYNTHETIC_AUTH_SLO_MS: ${{ vars.CHESS_SYNTHETIC_AUTH_SLO_MS || '10000' }}
    steps:
      - uses: actions/checkout@v7
      - name: Assert runner Python
        run: python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"
      - name: Restore OCI SDK for ephemeral production identity
        if: env.CHESS_SYNTHETIC_USERNAME == '' && env.CHESS_SYNTHETIC_INVITE_CODE == ''
        uses: ./.github/actions/setup-oci-sdk

      - name: Load production invite from OCI Vault
        if: env.CHESS_SYNTHETIC_USERNAME == '' && env.CHESS_SYNTHETIC_INVITE_CODE == ''
        run: python3 scripts/oci_production_runtime.py export-synthetic-invite

      - name: Probe production
        run: python3 scripts/synthetic_health_check.py --timeout 75
