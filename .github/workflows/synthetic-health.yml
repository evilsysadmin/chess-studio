name: Observability · production synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/synthetic-health.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: chess-studio-production-synthetic
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'push'
    name: Liveness + readiness + authenticated gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHESS_SYNTHETIC_BASE_URL: ${{ vars.CHESS_SYNTHETIC_BASE_URL || 'https://api.chess-studio.shadowops.dpdns.org/api' }}
      CHESS_SYNTHETIC_USERNAME: ${{ secrets.CHESS_SYNTHETIC_USERNAME }}
      CHESS_SYNTHETIC_PASSWORD: ${{ secrets.CHESS_SYNTHETIC_PASSWORD }}
      CHESS_SYNTHETIC_GAMEPLAY: '1'
      CHESS_SYNTHETIC_AUTH_SLO_MS: ${{ vars.CHESS_SYNTHETIC_AUTH_SLO_MS || '10000' }}
    steps:
      - uses: actions/checkout@v7
      - name: Assert runner Python
        run: python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"
      - name: Probe production
        run: python3 scripts/synthetic_health_check.py --timeout 75

  cleanup-retired-runs:
    if: github.event_name == 'push'
    name: One-shot cleanup of retired Actions runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete retired workflow runs only
        shell: bash
        run: |
          set -euo pipefail
          paths='[
            ".github/workflows/auto-merge.yml",
            ".github/workflows/main-delivery-handoff.yml",
            ".github/workflows/matthias-visual.yml",
            ".github/workflows/oci-arm64-readiness.yml",
            ".github/workflows/oci-terraform-readiness.yml",
            ".github/workflows/war-room-runtime-marathon.yml",
            ".github/workflows/codeql.yml"
          ]'

          gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
            | jq -r --argjson paths "${paths}" '.workflow_runs[] | select(.path as $p | $paths | index($p)) | .id' \
            | sort -un > /tmp/retired-run-ids

          total="$(wc -l < /tmp/retired-run-ids)"
          echo "Retired runs found: ${total}"

          deleted=0
          while IFS= read -r run_id; do
            [[ -n "${run_id}" ]] || continue
            gh api --method DELETE "repos/${REPO}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
          done < /tmp/retired-run-ids

          echo "Retired runs deleted: ${deleted}"

      - name: Restore synthetic workflow from previous main
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          path=".github/workflows/synthetic-health.yml"
          current_sha="$(gh api "repos/${REPO}/contents/${path}?ref=main" --jq '.sha')"
          original_b64="$(gh api "repos/${REPO}/contents/${path}?ref=${BEFORE_SHA}" --jq '.content' | tr -d '\n')"

          if gh api --method PUT "repos/${REPO}/contents/${path}" \
            -f message="chore: restore synthetic workflow after one-shot cleanup" \
            -f content="${original_b64}" \
            -f sha="${current_sha}" \
            -f branch="main"; then
            echo "Synthetic workflow restored."
          else
            echo "::warning::Cleanup succeeded but branch protection blocked self-restore."
          fi
