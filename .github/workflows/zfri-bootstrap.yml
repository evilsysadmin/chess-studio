name: Apply zfri delta

on:
  push:
    branches:
      - feat/zfri-combat-mission-orders

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/zfri-bootstrap/part*.patch > /tmp/zfri.patch
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/zfri.patch')
          text = patch.read_text()
          start = text.index('diff --git a/README.md b/README.md')
          end = text.index('diff --git a/RELEASE.txt b/RELEASE.txt')
          patch.write_text(text[:start] + text[end:])
          PY
          set +e
          git apply --check /tmp/zfri.patch > /tmp/zfri-apply.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/zfri-apply.log .github/zfri-bootstrap/apply-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/zfri-bootstrap/apply-error.txt
            git commit -m "chore: capture zfri patch conflict"
            git push origin HEAD:feat/zfri-combat-mission-orders
            exit "$rc"
          fi
          git apply --whitespace=nowarn /tmp/zfri.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          heading = '### v16.6dm46zfri · Órdenes opcionales de misión en Combat Chess'
          entry = '''### v16.6dm46zfri · Órdenes opcionales de misión en Combat Chess

- Cada sector de batalla, élite o boss genera dos órdenes opcionales deterministas basadas en la seed y el nodo; no hay reroll ni objetivo inventado por IA.
- Las órdenes usan únicamente métricas reales que Combat ya calcula: bajas propias, capturas, mérito táctico y acciones underdog.
- Completar órdenes concede suministros temporales de campaña (2–4 por orden), nunca créditos persistentes, para añadir tensión táctica sin abrir una granja económica.
- El briefing las muestra antes del despliegue y el resultado del sector resume qué órdenes se cumplieron.
- El battle record conserva un bloque `combatMetrics` mínimo para que campaña, historial y tests compartan la misma fuente factual.

'''
          if heading not in text:
              path.write_text(entry + text)
          PY
          rm -rf .github/zfri-bootstrap .github/workflows/zfri-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Combat mission orders"
          git push origin HEAD:feat/zfri-combat-mission-orders
