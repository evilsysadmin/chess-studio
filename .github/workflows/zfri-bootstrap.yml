name: Apply zfri delta

on:
  push:
    branches:
      - feat/zfri-combat-mission-orders

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/zfri-bootstrap/part*.patch > /tmp/zfri.patch
          git apply --3way --whitespace=nowarn /tmp/zfri.patch
          rm -rf .github/zfri-bootstrap .github/workflows/zfri-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Combat mission orders"
          git push origin HEAD:feat/zfri-combat-mission-orders
