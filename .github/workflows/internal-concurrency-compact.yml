name: Internal · compact concurrency patch

on:
  push:
    branches:
      - fix/filter-nonmutating-concurrency-20260915
    paths:
      - .github/workflows/internal-concurrency-compact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compact queue isolation without relaxing contracts
        shell: python
        run: |
          from pathlib import Path

          dollar = "$"
          replacements = {
              Path('.github/workflows/staging-deploy.yml'): [
                  (
                      "concurrency:\n  # Contract marker: group: chess-studio-staging-deploy\n  group: " + dollar + "{{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('chess-studio-staging-deploy-skip-{0}', github.run_id) || 'chess-studio-staging-deploy' }}\n  cancel-in-progress: false\n  queue: max",
                      "concurrency:\n  group: " + dollar + "{{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'chess-studio-staging-deploy' || github.run_id }} # group: chess-studio-staging-deploy\n  cancel-in-progress: false\n  queue: max",
                  ),
              ],
              Path('.github/workflows/staging-ai-worker.yml'): [
                  (
                      "concurrency:\n  # Contract marker: group: chess-studio-staging-ai-worker\n  group: " + dollar + "{{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('chess-studio-staging-ai-worker-skip-{0}', github.run_id) || 'chess-studio-staging-ai-worker' }}\n  cancel-in-progress: false",
                      "concurrency:\n  group: " + dollar + "{{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'chess-studio-staging-ai-worker' || github.run_id }} # group: chess-studio-staging-ai-worker\n  cancel-in-progress: false",
                  ),
                  (
                      "      # Staging · deploy owns the mutation queue until parity + browser smoke pass.\n      # Its automatic success is the immutable proof for DEPLOY_SHA. After it\n      # releases the lock, N+1 may mutate staging, so this downstream must not\n      # gate N by rereading mutable live endpoints. Manual runs stay strict.\n",
                      "      # Automatic deploy success is immutable proof; manual dispatch keeps live probes strict.\n",
                  ),
              ],
              Path('.github/workflows/production-promote.yml'): [
                  (
                      "concurrency:\n  # Contract marker: group: chess-studio-production-promote\n  group: " + dollar + "{{ github.event.workflow_run.conclusion != 'success' && format('chess-studio-production-promote-skip-{0}', github.run_id) || 'chess-studio-production-promote' }}\n  cancel-in-progress: false",
                      "concurrency:\n  group: " + dollar + "{{ github.event.workflow_run.conclusion == 'success' && 'chess-studio-production-promote' || github.run_id }} # group: chess-studio-production-promote\n  cancel-in-progress: false",
                  ),
                  (
                      "  # Legacy source-reader compatibility marker only. Promotion provenance must\n  # come from the immutable accreditation artifact, never from this wrapper SHA:\n",
                      "  # Legacy source-reader marker; provenance comes from the accreditation artifact.\n",
                  ),
                  (
                      "      # These three checks are deliberately diagnostic only. The immutable\n      # staging accreditation already proves that this exact SHA passed coherent\n      # backend/frontend/Worker verification. Staging may legitimately have moved\n      # on to N+1 while production N waits in the serialized promotion queue.\n",
                      "      # Diagnostic only: immutable accreditation remains authoritative after staging advances.\n",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: compact replacement did not match exactly once')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/internal-concurrency-compact.yml').unlink()

      - name: Commit compact queue fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Linux Pirate Ninja'
          git config user.email '12677236+evilsysadmin@users.noreply.github.com'
          git add .github/workflows/staging-deploy.yml \
                  .github/workflows/staging-ai-worker.yml \
                  .github/workflows/production-promote.yml \
                  .github/workflows/internal-concurrency-compact.yml
          git diff --cached --check
          git commit -m 'fix(ci): isolate skipped runs without workflow bloat'
          git rev-parse HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
