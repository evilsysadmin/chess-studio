name: Temporary · install verified Home master

on:
  push:
    branches:
      - fix/home-single-matthias-sharp-desktop

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-single-matthias-sharp-desktop
          fetch-depth: 1
      - name: Reconstruct and verify canonical Home master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='frontend/src/assets/home-canonical/great-hall-dungeon.webp'
          tmp="${target}.tmp"
          : > "$tmp"
          blobs=(
            f565935e9168d54f62a00f88bbf534937bfafe56
            e41b76f2cc084184836d1e70a97ec604ba5ab4a4
            e1b400c704bcfffcaecae850ce6189e4c55cae7f
            5a4e467cbdee73d359301ef88775b544dde5322b
            5f104bf34084c60b6ed871f4c8ec115780f7b151
            a35606b3afa2f67ff3e9cd6566aa7daf606df2bb
            6a1a7e05ac3526985b414fde48b2f79991f50b39
            268897cebc185409fcf94b22c46570cdfdb33cb7
            1ce506680f86514fd514f2f1a4815045a84e52c0
            29bf99a1d2f07da5d40d8709a0b36a276ebdbc6e
            aebf167229ede01b3e519106d160406bd230c383
            53e856dcaa21d92b1da6cafab0063688e923742d
            54a55e2bb807fc247ea2636e594340390e1fcb9f
            a358c5d945a84e21e48805fa60cc86900e546135
            5568d0bc578a4cfe00a807a0c21c43ce8470afbb
            a056dcbb878501fd557a7da4b4454f49912b9084
            591a8f6f75a12e953d3b4058973ef8aba518e45f
            75257b22ad69c5137b146b48c003b50b34bb0227
            d245bbd49020d4c681787ff4e756017eeeb3cd0c
          )
          for sha in "${blobs[@]}"; do
            echo "fetch ${sha}"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -er '.content' \
              | tr -d '\n' \
              | base64 -d >> "$tmp"
          done
          bytes="$(wc -c < "$tmp" | tr -d ' ')"
          sha="$(git hash-object "$tmp")"
          echo "reconstructed bytes=${bytes} sha=${sha}"
          test "$bytes" = '172392'
          test "$sha" = 'f898f1e302e6f7358601b4da0ca8e7c50b41fe08'
          mv "$tmp" "$target"
          rm .github/workflows/tmp-install-home-master.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$target" .github/workflows/tmp-install-home-master.yml
          git diff --cached --stat
          git commit -m 'fix(home): install verified canonical master'
          git push origin HEAD:fix/home-single-matthias-sharp-desktop
