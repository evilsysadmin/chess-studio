name: War Room 3D interaction polish

on:
  push:
    branches:
      - feat/warroom3d-interaction-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run_warroom3d_interaction_polish.py 2>&1 | tee warroom-patch.log

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: warroom-patch-diagnostics
          path: warroom-patch.log
          if-no-files-found: warn

      - name: Commit product changes
        if: success()
        run: |
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Polish War Room 3D interactions and Matthias"
          git push origin HEAD
