name: Playwright full / War Room gate

on:
  pull_request:
    paths:
      - 'frontend/src/components/Board3D.jsx'
      - 'frontend/src/components/Board3D*.js'
      - 'frontend/src/components/Board3D*.css'
      - 'frontend/src/components/WarRoom3D*.js'
      - 'frontend/src/components/WarRoom3D*.css'
      - 'frontend/src/components/WarRoom3DAnimation.js'
      - 'frontend/src/components/PremiumWarRoomScene.js'
      - 'frontend/src/components/WarRoomCastleArchitecture.js'
      - 'frontend/src/components/WarRoomPremiumPaintings.js'
      - 'frontend/src/components/GameBoardView.jsx'
      - 'frontend/src/styles/19-game-focus.css'
      - 'frontend/src/warRoomPointerCapture.js'
      - 'frontend/src/warRoomPointerCapture.test.js'
      - 'frontend/src/main.jsx'
      - 'e2e/three-d-war-room.spec.js'
      - 'e2e/three-d-war-room-android-touch.spec.js'
      - 'e2e/three-d-war-room-special-states.spec.js'
      - 'e2e/war-room-desktop-scale.spec.js'
      - 'e2e/android-game-focus.spec.js'
      - 'e2e/helpers.js'
      - '.github/workflows/e2e-full.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: playwright-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify War Room PR surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_logic: ${{ steps.scope.outputs.full_logic }}
      visual: ${{ steps.scope.outputs.visual }}
      focus: ${{ steps.scope.outputs.focus }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed surface
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"

          full_logic=false
          visual=false
          focus=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              frontend/src/components/WarRoomCastleArchitecture.js|frontend/src/components/WarRoomPremiumPaintings.js|frontend/src/components/PremiumWarRoomScene.js|frontend/src/components/WarRoom3DAnimation.js|frontend/src/components/Board3D*.css|frontend/src/components/WarRoom3D*.css|e2e/war-room-desktop-scale.spec.js)
                visual=true
                ;;
              frontend/src/styles/19-game-focus.css|e2e/android-game-focus.spec.js)
                visual=true
                focus=true
                ;;
              frontend/src/components/Board3D.jsx|frontend/src/components/Board3D*.js|frontend/src/components/WarRoom3D*.js|frontend/src/components/GameBoardView.jsx|frontend/src/warRoomPointerCapture.js|frontend/src/warRoomPointerCapture.test.js|frontend/src/main.jsx|e2e/three-d-war-room.spec.js|e2e/three-d-war-room-android-touch.spec.js|e2e/three-d-war-room-special-states.spec.js|e2e/helpers.js|.github/workflows/e2e-full.yml)
                full_logic=true
                visual=true
                focus=true
                ;;
            esac
          done <<< "$files"

          if [[ "$full_logic" != true && "$visual" != true && "$focus" != true ]]; then
            full_logic=true
            visual=true
            focus=true
          fi

          {
            echo "full_logic=$full_logic"
            echo "visual=$visual"
            echo "focus=$focus"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### War Room browser scope'
            echo
            echo "- Rules/input parity: \`$full_logic\`"
            echo "- 3D mount/scale: \`$visual\`"
            echo "- Android Focus: \`$focus\`"
            echo '- PR gates run on separate hosted runners; the five special-state scenarios are also sharded so each heavyweight WebGL case owns its VM.'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-logic:
    name: War Room · ${{ matrix.label }}
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_logic == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android-selection
            label: Android selection
            command: './node_modules/.bin/playwright test three-d-war-room-android-touch.spec.js --workers=1 --retries=0'
          - id: desktop-input
            label: desktop input
            command: './node_modules/.bin/playwright test three-d-war-room.spec.js --grep "War Room · desktop input mantiene cámara fija y juega e2→e4" --workers=1 --retries=0 --timeout=75000'
          - id: special-state-1
            label: special-state 1/5
            command: './node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard=1/5'
          - id: special-state-2
            label: special-state 2/5
            command: './node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard=2/5'
          - id: special-state-3
            label: special-state 3/5
            command: './node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard=3/5'
          - id: special-state-4
            label: special-state 4/5
            command: './node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard=4/5'
          - id: special-state-5
            label: special-state 5/5
            command: './node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard=5/5'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright runner
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: ./node_modules/.bin/playwright install chromium

      - name: Run ${{ matrix.label }}
        working-directory: e2e
        run: ${{ matrix.command }}

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-war-room-${{ matrix.id }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  pr-visual:
    name: War Room · desktop board scale
    if: github.event_name == 'pull_request' && needs.scope.outputs.visual == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright runner
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: ./node_modules/.bin/playwright install chromium

      - name: Prove War Room desktop board scale
        working-directory: e2e
        run: ./node_modules/.bin/playwright test war-room-desktop-scale.spec.js --workers=1 --retries=0 --timeout=75000

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-war-room-desktop-scale
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  pr-focus:
    name: War Room · Android Focus
    if: github.event_name == 'pull_request' && needs.scope.outputs.focus == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright runner
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: ./node_modules/.bin/playwright install chromium

      - name: Prove Android game Focus
        working-directory: e2e
        run: ./node_modules/.bin/playwright test android-game-focus.spec.js --workers=1 --retries=0 --timeout=30000

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-war-room-android-focus
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-full:
    name: Full browser E2E (informative)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright runner
        working-directory: e2e
        run: npm ci

      - name: Install Chromium + Firefox + WebKit
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Run full Playwright suite
        continue-on-error: true
        working-directory: e2e
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
        run: ./node_modules/.bin/playwright test --workers=2

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
