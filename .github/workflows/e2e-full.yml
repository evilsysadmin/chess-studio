name: Playwright full (informative)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  playwright-full:
    name: Full browser E2E (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright runner
        working-directory: e2e
        run: npm ci

      - name: Install Chromium + Firefox + WebKit
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Run full Playwright suite
        continue-on-error: true
        working-directory: e2e
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
        run: ./node_modules/.bin/playwright test --workers=2

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
