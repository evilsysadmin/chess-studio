name: Browser E2E gates

on:
  pull_request:
    paths:
      - 'frontend/src/components/Board3D.jsx'
      - 'frontend/src/components/Board3D*.js'
      - 'frontend/src/components/Board3D*.css'
      - 'frontend/src/components/WarRoom*.js'
      - 'frontend/src/components/WarRoom*.css'
      - 'frontend/src/components/PremiumWarRoomScene.js'
      - 'frontend/src/components/GameBoardView.jsx'
      - 'frontend/src/components/GameCommandDeck.jsx'
      - 'frontend/src/components/GamePlayerRail.jsx'
      - 'frontend/src/components/GameSideColumn.jsx'
      - 'frontend/src/components/GameStatusStrips.jsx'
      - 'frontend/src/components/GameWarRoomCommandColumn.jsx'
      - 'frontend/src/components/useGameBoardRenderer.js'
      - 'frontend/src/components/useGameMobileFocus.js'
      - 'frontend/src/components/useMatthiasBoardReactions.js'
      - 'frontend/src/styles/19-game-focus.css'
      - 'frontend/src/warRoomPointerCapture.js'
      - 'frontend/src/warRoomPointerCapture.test.js'
      - 'frontend/src/main.jsx'
      - 'frontend/src/components/Matthias*.jsx'
      - 'frontend/src/components/Matthias*.js'
      - 'frontend/src/components/Matthias*.css'
      - 'frontend/src/components/matthias*.jsx'
      - 'frontend/src/components/matthias*.js'
      - 'frontend/src/components/matthias*.css'
      - 'frontend/src/components/InsightsMatthiasMotion.jsx'
      - 'frontend/src/matthias*.js'
      - 'frontend/src/assets/matthias-*/**'
      - 'e2e/three-d-war-room.spec.js'
      - 'e2e/three-d-war-room-android-touch.spec.js'
      - 'e2e/three-d-war-room-special-states.spec.js'
      - 'e2e/war-room-desktop-scale.spec.js'
      - 'e2e/android-game-focus.spec.js'
      - 'e2e/matthias-home-visual-critical.spec.js'
      - 'e2e/matthias-read-book-regression.spec.js'
      - 'e2e/matthias-war-room-android-motion.spec.js'
      - 'e2e/insights-matthias-motion.spec.js'
      - 'e2e/helpers.js'
      - '.github/actions/setup-browser-e2e/action.yml'
      - '.github/actions/cache-node-modules/action.yml'
      - '.github/workflows/e2e-full.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify browser PR surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_cases: ${{ steps.scope.outputs.has_cases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build minimal browser matrix
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"

          full_logic=false
          visual=false
          focus=false
          matthias=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              frontend/src/components/WarRoomCastleArchitecture.js|frontend/src/components/WarRoomPremiumPaintings.js|frontend/src/components/WarRoomArchitectural*.js|frontend/src/components/WarRoomPracticalLighting.js|frontend/src/components/WarRoomPremiumFinishPass.js|frontend/src/components/WarRoomTeutonicDecor.js|frontend/src/components/PremiumWarRoomScene.js|frontend/src/components/WarRoom3DAnimation.js|frontend/src/components/Board3D*.css|frontend/src/components/WarRoom3D*.css|e2e/war-room-desktop-scale.spec.js)
                visual=true
                ;;
              frontend/src/styles/19-game-focus.css|e2e/android-game-focus.spec.js)
                visual=true
                focus=true
                ;;
              frontend/src/components/Board3D.jsx|frontend/src/components/Board3D*.js|frontend/src/components/WarRoom3D*.js|frontend/src/components/GameBoardView.jsx|frontend/src/components/GameCommandDeck.jsx|frontend/src/components/GamePlayerRail.jsx|frontend/src/components/GameSideColumn.jsx|frontend/src/components/GameStatusStrips.jsx|frontend/src/components/GameWarRoomCommandColumn.jsx|frontend/src/components/useGameBoardRenderer.js|frontend/src/components/useGameMobileFocus.js|frontend/src/components/useMatthiasBoardReactions.js|frontend/src/warRoomPointerCapture.js|frontend/src/warRoomPointerCapture.test.js|frontend/src/main.jsx|e2e/three-d-war-room.spec.js|e2e/three-d-war-room-android-touch.spec.js|e2e/three-d-war-room-special-states.spec.js|e2e/helpers.js)
                full_logic=true
                visual=true
                focus=true
                ;;
            esac

            case "$file" in
              frontend/src/components/Matthias*.jsx|frontend/src/components/Matthias*.js|frontend/src/components/Matthias*.css|frontend/src/components/matthias*.jsx|frontend/src/components/matthias*.js|frontend/src/components/matthias*.css|frontend/src/components/InsightsMatthiasMotion.jsx|frontend/src/matthias*.js|frontend/src/assets/matthias-*/*|e2e/matthias-home-visual-critical.spec.js|e2e/matthias-read-book-regression.spec.js|e2e/matthias-war-room-android-motion.spec.js|e2e/insights-matthias-motion.spec.js)
                matthias=true
                ;;
            esac

            case "$file" in
              .github/actions/setup-browser-e2e/action.yml|.github/actions/cache-node-modules/action.yml|.github/workflows/e2e-full.yml)
                full_logic=true
                visual=true
                focus=true
                matthias=true
                ;;
            esac
          done <<< "$files"

          matrix="$(python3 - "$full_logic" "$visual" "$focus" "$matthias" <<'PY'
          import json, sys
          full_logic, visual, focus, matthias = [value == 'true' for value in sys.argv[1:]]
          cases = []
          if full_logic:
              cases.extend([
                  {'id': 'android-selection', 'label': 'War Room · Android selection', 'command': './node_modules/.bin/playwright test three-d-war-room-android-touch.spec.js --workers=1 --retries=0'},
                  {'id': 'desktop-input', 'label': 'War Room · desktop input', 'command': './node_modules/.bin/playwright test three-d-war-room.spec.js --grep "War Room · desktop input mantiene cámara fija y juega e2→e4" --workers=1 --retries=0 --timeout=75000'},
              ])
              for shard in range(1, 6):
                  cases.append({
                      'id': f'special-state-{shard}',
                      'label': f'War Room · special-state {shard}/5',
                      'command': f'./node_modules/.bin/playwright test three-d-war-room-special-states.spec.js --workers=1 --retries=0 --timeout=75000 --shard={shard}/5',
                  })
          if visual:
              cases.append({
                  'id': 'desktop-scale',
                  'label': 'War Room · desktop board scale',
                  'command': './node_modules/.bin/playwright test war-room-desktop-scale.spec.js --workers=1 --retries=0 --timeout=75000',
              })
          if focus:
              cases.append({
                  'id': 'android-focus',
                  'label': 'War Room · Android Focus',
                  'command': './node_modules/.bin/playwright test android-game-focus.spec.js --workers=1 --retries=0 --timeout=30000',
              })
          if matthias:
              cases.append({
                  'id': 'matthias-motion',
                  'label': 'Matthias · browser motion',
                  'command': './node_modules/.bin/playwright test matthias-home-visual-critical.spec.js matthias-read-book-regression.spec.js matthias-war-room-android-motion.spec.js insights-matthias-motion.spec.js --workers=4 --retries=0',
              })
          print(json.dumps({'include': cases}, separators=(',', ':')))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo 'has_cases=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_cases=true' >> "$GITHUB_OUTPUT"
          fi

          {
            echo '### Browser E2E scope'
            echo
            echo "- War Room rules/input parity: \`$full_logic\`"
            echo "- War Room mount/scale: \`$visual\`"
            echo "- Android Focus: \`$focus\`"
            echo "- Matthias motion/paint: \`$matthias\`"
            echo '- Cada escenario WebGL pesado conserva runner propio; el setup de dependencias/browser es común y cacheado.'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-browser:
    name: ${{ matrix.label }}
    if: github.event_name == 'pull_request' && needs.scope.outputs.has_cases == 'true'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore browser test runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          build-frontend: 'true'

      - name: Run ${{ matrix.label }}
        working-directory: e2e
        run: ${{ matrix.command }}

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-${{ matrix.id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  playwright-full:
    name: Full browser E2E (informative)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Restore full browser test runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: all
          build-frontend: 'true'

      - name: Run full Playwright suite
        working-directory: e2e
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
        run: ./node_modules/.bin/playwright test --workers=2

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
