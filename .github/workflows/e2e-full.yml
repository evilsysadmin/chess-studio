name: Browser E2E sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: browser-e2e-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-full:
    name: Full browser E2E (informative)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Restore full browser test runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: all
          build-frontend: 'true'

      - name: Run full Playwright suite
        working-directory: e2e
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
        run: ./node_modules/.bin/playwright test --workers=2

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
