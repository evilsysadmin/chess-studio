      - 'scripts/art/build_pawn_slug_pose_review.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_v20.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_v18.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v21.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v20.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v18.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_v17.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v17.py'
      - 'scripts/art/build_pawn_slug_v17_review.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v17_atlas_smoke.gd'
      - 'games/pawn-slug-godot/art/matthias-v21-pistol-full-source.png'
      - 'games/pawn-slug-godot/art/matthias-v21-worksheet.json'
      - 'games/pawn-slug-godot/art/matthias-v20-pistol-source.png'
      - 'games/pawn-slug-godot/art/matthias-v20-worksheet.json'
