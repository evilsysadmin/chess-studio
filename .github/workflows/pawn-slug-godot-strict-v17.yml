      - name: Build + gate reviewed P99 combat bank
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v20/pistol'
          python3 scripts/art/pack_pawn_slug_godot_strict_v20.py \
            --source games/pawn-slug-godot/art/matthias-v20-pistol-source.png \
            --baseline "$ROOT/baseline-v19.png" \
