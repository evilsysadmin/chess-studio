name: Pawn Slug · Godot strict Matthias v17

on:
  pull_request:
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v18.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v18.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_v17.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v17.py'
      - 'scripts/art/build_pawn_slug_v17_review.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v17_atlas_smoke.gd'
      - 'games/pawn-slug-godot/art/matthias-v17-worksheet.json'
      - '.github/workflows/pawn-slug-godot-strict-v17.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/pack_pawn_slug_godot_strict_v18.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v18.py'
      - 'scripts/art/pack_pawn_slug_godot_strict_v17.py'
      - 'scripts/art/validate_pawn_slug_godot_atlas_v17.py'
      - 'scripts/art/build_pawn_slug_v17_review.py'
      - 'games/pawn-slug-godot/tests/matthias_strict_v17_atlas_smoke.gd'
      - 'games/pawn-slug-godot/art/matthias-v17-worksheet.json'
      - '.github/workflows/pawn-slug-godot-strict-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-strict-v17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
  SOURCE_URL: 'https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v16/shotgun/v16-c2a67fc5a7f50926.png'
  BASELINE_URL: 'https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v16/machinegun/v16-32227acfdc2e0cff.png'
  PISTOL_SOURCE_URL: 'https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v16/pistol/v16-670506b5307a1756.png'

jobs:
  build-strict-v17-machinegun:
    name: Build + gate strict-v17 · machinegun
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7

      - name: Install deterministic 2D sprite toolchain
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==12.3.0'

      - name: Tool sanity
        run: |
          set -euo pipefail
          python3 scripts/art/pack_pawn_slug_godot_strict_v17.py --self-test
          python3 -m py_compile \
            scripts/art/pack_pawn_slug_godot_strict_v17.py \
            scripts/art/validate_pawn_slug_godot_atlas_v17.py \
            scripts/art/build_pawn_slug_v17_review.py

      - name: Download strict-v16 source + old machinegun baseline
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v17/machinegun'
          mkdir -p "$ROOT"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 "$SOURCE_URL" --output "$ROOT/source-shotgun-v16.png"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 "$BASELINE_URL" --output "$ROOT/baseline-machinegun-v16.png"

      - name: Build + gate strict-v17 candidate
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v17/machinegun'
          python3 scripts/art/pack_pawn_slug_godot_strict_v17.py \
            --source "$ROOT/source-shotgun-v16.png" \
            --output "$ROOT/v17.png" \
            --manifest "$ROOT/manifest.json"
          python3 scripts/art/validate_pawn_slug_godot_atlas_v17.py \
            --atlas "$ROOT/v17.png" \
            --manifest "$ROOT/manifest.json" \
            --source "$ROOT/source-shotgun-v16.png" \
            --report "$ROOT/health.json"
          python3 scripts/art/build_pawn_slug_v17_review.py \
            --baseline "$ROOT/baseline-machinegun-v16.png" \
            --atlas "$ROOT/v17.png" \
            --output "$ROOT/review.png"

      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: pawn-slug-strict-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version

      - name: Consume candidate in real Godot SpriteFrames
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v17/machinegun'
          .godot-ci/$GODOT_VERSION/godot --headless --path games/pawn-slug-godot \
            --script res://tests/matthias_strict_v17_atlas_smoke.gd -- \
            "$ROOT/v17.png" "$ROOT/manifest.json"

      - name: Publish immutable strict-v17 machinegun to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v17/machinegun'
          python3 -S scripts/r2_asset_publish.py publish \
            "$ROOT/v17.png" \
            --logical-id 'pawnSlug.godot.matthias.machinegun.strictV17' \
            --prefix 'pawn-slug-godot/matthias/strict-v17/machinegun' \
            | tee "$ROOT/publish.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-godot-strict-v17-machinegun-${{ github.event.pull_request.number || github.run_number }}
          path: |
            /tmp/pawn-slug-godot-strict-v17/machinegun/v17.png
            /tmp/pawn-slug-godot-strict-v17/machinegun/manifest.json
            /tmp/pawn-slug-godot-strict-v17/machinegun/health.json
            /tmp/pawn-slug-godot-strict-v17/machinegun/review.png
            /tmp/pawn-slug-godot-strict-v17/machinegun/publish.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0


