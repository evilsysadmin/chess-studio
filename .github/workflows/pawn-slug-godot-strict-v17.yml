          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ROOT='/tmp/pawn-slug-godot-strict-v18/pistol'
          python3 -S scripts/r2_asset_publish.py publish             "$ROOT/v18.png"             --logical-id 'pawnSlug.godot.matthias.pistol.strictV18'             --prefix 'pawn-slug-godot/matthias/strict-v18/pistol'             | tee "$ROOT/publish.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-godot-strict-v18-p99-${{ github.event.pull_request.number || github.run_number }}
          path: |
            /tmp/pawn-slug-godot-strict-v18/pistol/v18.png
            /tmp/pawn-slug-godot-strict-v18/pistol/manifest.json
            /tmp/pawn-slug-godot-strict-v18/pistol/health.json
            /tmp/pawn-slug-godot-strict-v18/pistol/review.png
            /tmp/pawn-slug-godot-strict-v18/pistol/publish.txt
          if-no-files-found: warn
          retention-days: 14
