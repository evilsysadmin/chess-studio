            --baseline "$ROOT/baseline-v19.png" \
            --atlas "$ROOT/v20.png" \
            --output "$ROOT/review.png"
          test "$(sha256sum "$ROOT/v20.png" | awk '{print $1}')" = "2b12fd13f4f73f742d3a94faf0dd36af4c116a10d59ff5482c19516c47c02d29"

      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
