name: Hotfix · release restore WebGL budget

on:
  push:
    branches:
      - hotfix/release-restore-webgl-budget

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/release-restore-webgl-budget
      - name: Patch only the stale post-reload assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/regression-journeys.spec.js')
          text = path.read_text()
          old = "  await page.reload({ waitUntil: 'domcontentloaded', timeout: 10_000 });\n  await expect(gameStatus(page)).toBeVisible({ timeout: 5_000 });\n  await expect(page.getByRole('region', { name: 'Hoy en Chess Studio' })).toHaveCount(0);"
          new = "  await page.reload({ waitUntil: 'domcontentloaded', timeout: 10_000 });\n  // Reload restores the default Three/WebGL room; hosted software rendering can\n  // legitimately exceed the old 2D-era 5 s assertion while continuity remains intact.\n  await expect(gameStatus(page)).toBeVisible({ timeout: 20_000 });\n  await expect(page.getByRole('region', { name: 'Hoy en Chess Studio' })).toHaveCount(0);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one release-restore assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/hotfix-release-restore-webgl-budget.yml
          git diff --check
          git diff -- e2e/regression-journeys.spec.js
          test "$(git status --short | wc -l)" -eq 2
      - name: Commit clean hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Linux Pirate Ninja'
          git config user.email '12677236+evilsysadmin@users.noreply.github.com'
          git add e2e/regression-journeys.spec.js .github/workflows/hotfix-release-restore-webgl-budget.yml
          git commit -m 'Stabilize release restore on default WebGL room'
          git push origin HEAD:hotfix/release-restore-webgl-budget
