name: Observability · Cloudflare metrics exporter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-prometheus-exporter.yml'
      - 'scripts/cloudflare_exporter_config.py'
      - 'scripts/cloudflare_exporter_health.py'

permissions:
  contents: read

concurrency:
  group: chess-studio-cloudflare-prometheus-exporter
  cancel-in-progress: false

env:
  EXPORTER_NAME: chess-studio-cloudflare-prometheus
  EXPORTER_HOSTNAME: metrics.shadowops.dpdns.org
  EXPORTER_UPSTREAM_SHA: c98fd6772a4ff806e40ba08cb5d4edb002ef13dc
  BUN_VERSION: '1.2.22'

jobs:
  deploy:
    name: Deploy official exporter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EXPORTER_API_TOKEN: ${{ secrets.CLOUDFLARE_EXPORTER_API_TOKEN }}
      CLOUDFLARE_EXPORTER_BASIC_AUTH_USER: ${{ secrets.CLOUDFLARE_EXPORTER_BASIC_AUTH_USER }}
      CLOUDFLARE_EXPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.CLOUDFLARE_EXPORTER_BASIC_AUTH_PASSWORD }}
    steps:
      - name: Check exporter credentials
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_EXPORTER_API_TOKEN \
            CLOUDFLARE_EXPORTER_BASIC_AUTH_USER \
            CLOUDFLARE_EXPORTER_BASIC_AUTH_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Cloudflare Prometheus exporter pendiente de credenciales'
              echo
              echo 'El código está preparado, pero no se despliega con secretos incompletos.'
              echo
              printf -- '- Falta `%s`\n' "${missing[@]}"
              echo
              echo 'El token runtime del exporter debe ser dedicado y de sólo lectura; no se reutiliza el token de Terraform/Pages.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Checkout Chess Studio deployment helpers
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          path: chess-studio

      - name: Validate exporter deployment helpers
        if: steps.gate.outputs.configured == 'true'
        run: |
          python3 -S chess-studio/scripts/cloudflare_exporter_config.py --self-test
          python3 -S chess-studio/scripts/cloudflare_exporter_health.py --self-test

      - name: Checkout pinned official exporter
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          repository: cloudflare/cloudflare-prometheus-exporter
          ref: ${{ env.EXPORTER_UPSTREAM_SHA }}
          path: upstream-exporter

      - name: Setup Bun
        if: steps.gate.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore exact exporter dependency tree
        if: steps.gate.outputs.configured == 'true'
        id: exporter_deps
        uses: actions/cache@v6
        with:
          path: upstream-exporter/node_modules
          key: cf-exporter-node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ env.BUN_VERSION }}-${{ env.EXPORTER_UPSTREAM_SHA }}

      - name: Install pinned exporter dependencies on cache miss
        if: steps.gate.outputs.configured == 'true' && steps.exporter_deps.outputs.cache-hit != 'true'
        working-directory: upstream-exporter
        run: bun install --frozen-lockfile

      - name: Verify exact exporter toolchain
        if: steps.gate.outputs.configured == 'true'
        working-directory: upstream-exporter
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/wrangler
          test -x node_modules/.bin/vitest
          test -x node_modules/.bin/tsc
          echo "Exporter dependency tree ready · upstream=$EXPORTER_UPSTREAM_SHA · bun=$BUN_VERSION"

      - name: Build hardened Chess Studio exporter config
        if: steps.gate.outputs.configured == 'true'
        run: python3 -S chess-studio/scripts/cloudflare_exporter_config.py --root upstream-exporter

      - name: Validate upstream exporter
        if: steps.gate.outputs.configured == 'true'
        working-directory: upstream-exporter
        run: |
          bun run typecheck
          bun test

      - name: Deploy pinned exporter Worker
        if: steps.gate.outputs.configured == 'true'
        working-directory: upstream-exporter
        run: ./node_modules/.bin/wrangler deploy --config wrangler.chess-studio.json

      - name: Install least-privilege runtime and Basic Auth secrets
        if: steps.gate.outputs.configured == 'true'
        working-directory: upstream-exporter
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_EXPORTER_API_TOKEN" \
            | ./node_modules/.bin/wrangler secret put CLOUDFLARE_API_TOKEN --config wrangler.chess-studio.json
          printf '%s' "$CLOUDFLARE_EXPORTER_BASIC_AUTH_USER" \
            | ./node_modules/.bin/wrangler secret put BASIC_AUTH_USER --config wrangler.chess-studio.json
          printf '%s' "$CLOUDFLARE_EXPORTER_BASIC_AUTH_PASSWORD" \
            | ./node_modules/.bin/wrangler secret put BASIC_AUTH_PASSWORD --config wrangler.chess-studio.json

      - name: Verify protected exporter health and metrics
        if: steps.gate.outputs.configured == 'true'
        run: python3 -S chess-studio/scripts/cloudflare_exporter_health.py
