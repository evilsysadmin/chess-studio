name: Pawn Slug · Matthias canonical-scale assets

on:
  pull_request:
    paths:
      - 'scripts/art/migrate_matthias_legacy_bank.py'
      - '.github/workflows/pawn-slug-matthias-scale-assets.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/art/migrate_matthias_legacy_bank.py'
      - '.github/workflows/pawn-slug-matthias-scale-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + verify canonical-scale candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ROOT: ${{ runner.temp }}/pawn-slug-matthias-scale-assets
    steps:
      - uses: actions/checkout@v7
      - name: Compile migration tool
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/art/sprite_forge.py scripts/art/migrate_matthias_legacy_bank.py
          python3 scripts/art/migrate_matthias_legacy_bank.py --self-test
      - name: Fetch canonical + legacy inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/reference" "$ROOT/shotgun" "$ROOT/panzerfaust"
          curl -fL --retry 3             "https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v21/pistol/v21-24640d861efc3087.png"             -o "$ROOT/reference/pistol-full.png"
          curl -fL --retry 3             "https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/run12-v22/pistol/v22-07d2a11a2249989b.png"             -o "$ROOT/reference/pistol-run12.png"
          curl -fL --retry 3             "https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v16/shotgun/v16-c2a67fc5a7f50926.png"             -o "$ROOT/shotgun/source-full.png"
          curl -fL --retry 3             "https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/run12-v22/shotgun/v22-8a75bce5f9cbd359.png"             -o "$ROOT/shotgun/source-run12.png"
          curl -fL --retry 3             "https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/strict-v16/panzerfaust/v16-80a0297d66e3dcf3.png"             -o "$ROOT/panzerfaust/source-full.png"
          curl -fL --retry 3             "https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/matthias/run12-v22/panzerfaust/v22-c791733b6240399f.png"             -o "$ROOT/panzerfaust/source-run12.png"
      - name: Rebuild candidates deterministically
        shell: bash
        run: |
          set -euo pipefail
          for weapon in shotgun panzerfaust; do
            python3 scripts/art/migrate_matthias_legacy_bank.py               --source "$ROOT/$weapon/source-full.png"               --reference "$ROOT/reference/pistol-full.png"               --rows 2,6               --output "$ROOT/$weapon/candidate-full.png"               --report "$ROOT/$weapon/full-health.json"
            python3 scripts/art/migrate_matthias_legacy_bank.py               --source "$ROOT/$weapon/source-run12.png"               --reference "$ROOT/reference/pistol-run12.png"               --columns 12 --row-count 1 --rows 0               --output "$ROOT/$weapon/candidate-run12.png"               --report "$ROOT/$weapon/run12-health.json"
            test -s "$ROOT/$weapon/candidate-full.png"
            test -s "$ROOT/$weapon/candidate-run12.png"
          done
          sha256sum             "$ROOT/shotgun/candidate-full.png"             "$ROOT/shotgun/candidate-run12.png"             "$ROOT/panzerfaust/candidate-full.png"             "$ROOT/panzerfaust/candidate-run12.png"             | tee "$ROOT/sha256.txt"
      - name: R2 publication dry-run
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          manifest="$ROOT/publish-manifest.json"
          python3 -S scripts/r2_asset_publish.py self-test
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/shotgun/candidate-full.png"             --logical-id pawnSlug.godot.matthias.shotgun.canonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/shotgun/full             --manifest "$manifest" --dry-run
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/shotgun/candidate-run12.png"             --logical-id pawnSlug.godot.matthias.shotgun.runCanonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/shotgun/run12             --manifest "$manifest" --dry-run
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/panzerfaust/candidate-full.png"             --logical-id pawnSlug.godot.matthias.panzerfaust.canonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/panzerfaust/full             --manifest "$manifest" --dry-run
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/panzerfaust/candidate-run12.png"             --logical-id pawnSlug.godot.matthias.panzerfaust.runCanonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/panzerfaust/run12             --manifest "$manifest" --dry-run
      - name: Upload review evidence
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-matthias-scale-assets-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ runner.temp }}/pawn-slug-matthias-scale-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish canonical-scale assets to R2
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOT: ${{ runner.temp }}/pawn-slug-matthias-scale-assets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: pawn-slug-matthias-scale-assets-${{ github.run_number }}
          path: ${{ runner.temp }}/pawn-slug-matthias-scale-assets
      - name: Publish immutable objects
        shell: bash
        run: |
          set -euo pipefail
          manifest="$ROOT/published-manifest.json"
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/shotgun/candidate-full.png"             --logical-id pawnSlug.godot.matthias.shotgun.canonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/shotgun/full             --manifest "$manifest" | tee "$ROOT/publish-shotgun-full.txt"
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/shotgun/candidate-run12.png"             --logical-id pawnSlug.godot.matthias.shotgun.runCanonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/shotgun/run12             --manifest "$manifest" | tee "$ROOT/publish-shotgun-run12.txt"
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/panzerfaust/candidate-full.png"             --logical-id pawnSlug.godot.matthias.panzerfaust.canonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/panzerfaust/full             --manifest "$manifest" | tee "$ROOT/publish-panzerfaust-full.txt"
          python3 -S scripts/r2_asset_publish.py publish "$ROOT/panzerfaust/candidate-run12.png"             --logical-id pawnSlug.godot.matthias.panzerfaust.runCanonicalScale             --prefix pawn-slug-godot/matthias/canonical-scale/panzerfaust/run12             --manifest "$manifest" | tee "$ROOT/publish-panzerfaust-run12.txt"
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-matthias-scale-publish-${{ github.run_number }}
          path: ${{ runner.temp }}/pawn-slug-matthias-scale-assets/
          if-no-files-found: error
          retention-days: 14
