name: Observability · Grafana dashboards

on:
  push:
    branches: [main]
    paths:
      - "infra/grafana/dashboards/**"
      - "scripts/grafana_publish.py"
      - "scripts/grafana_dashboard_check.py"
      - ".github/workflows/grafana-dashboards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-dashboards-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dashboards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      GRAFANA_METRICS_DATASOURCE_UID: ${{ vars.GRAFANA_METRICS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-prom' }}
      GRAFANA_LOGS_DATASOURCE_UID: ${{ vars.GRAFANA_LOGS_DATASOURCE_UID || 'grafanacloud-humbletoucan355-logs' }}
      GRAFANA_TRACES_DATASOURCE_UID: ${{ vars.GRAFANA_TRACES_DATASOURCE_UID || 'grafanacloud-humbletoucan355-traces' }}

    steps:
      - uses: actions/checkout@v7

      - name: Static dashboard contract
        run: python3 scripts/grafana_dashboard_check.py

      - name: Publisher self-test
        run: python3 -S scripts/grafana_publish.py --self-test

      - name: Publish idempotently through Grafana API
        run: python3 -S scripts/grafana_publish.py

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Grafana dashboards publicados'
            echo
            echo '- Mecanismo: `Grafana HTTP API`'
            echo '- Estado Terraform: `eliminado para dashboards`'
            echo '- State/import/plan/apply: `0`'
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
