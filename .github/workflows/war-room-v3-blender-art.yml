name: War Room v3 · Blender art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_war_room_premium.py'
      - 'scripts/blender/build_war_room_v3.py'
      - 'scripts/blender/configure_eevee_premium.py'
      - 'scripts/blender/publish_war_room_v3.py'
      - '.github/workflows/war-room-v3-blender-art.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/blender/build_war_room_premium.py'
      - 'scripts/blender/build_war_room_v3.py'
      - 'scripts/blender/configure_eevee_premium.py'
      - 'scripts/blender/publish_war_room_v3.py'
      - '.github/workflows/war-room-v3-blender-art.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: war-room-v3-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render War Room v3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build editable scene + runtime shell + hero preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_EEVEE_PREMIUM: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          BLENDER_PREVIEW_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && '64' || (github.event_name == 'pull_request' && '16' || '32') }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/war-room-v3
          blender --background --python-exit-code 1 \
            --python scripts/blender/configure_eevee_premium.py \
            --python scripts/blender/build_war_room_v3.py -- \
            --blend /tmp/war-room-v3/war-room-v3.blend \
            --glb /tmp/war-room-v3/war-room-v3-shell.glb \
            --preview /tmp/war-room-v3/war-room-v3-preview.png \
            --manifest /tmp/war-room-v3/war-room-v3-manifest.json

      - name: Validate generated artifact envelope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct
          from PIL import Image

          root = Path('/tmp/war-room-v3')
          blend = root / 'war-room-v3.blend'
          glb = root / 'war-room-v3-shell.glb'
          preview = root / 'war-room-v3-preview.png'
          manifest = root / 'war-room-v3-manifest.json'
          assert blend.stat().st_size > 150_000, blend.stat().st_size
          assert glb.stat().st_size > 60_000, glb.stat().st_size

          raw = glb.read_bytes()
          assert raw[:4] == b'glTF'
          chunk_length, chunk_type = struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A
          gltf = json.loads(raw[20:20 + chunk_length].decode('utf-8').rstrip('\x00 \t\r\n'))
          extension = 'EXT_meshopt_compression'
          assert extension in gltf.get('extensionsUsed', []), gltf.get('extensionsUsed', [])
          compressed_views = sum(
              1 for row in gltf.get('bufferViews', [])
              if extension in row.get('extensions', {})
          )
          assert compressed_views >= 12, compressed_views
          runtime_meshes = len(gltf.get('meshes', []))
          assert 50 <= runtime_meshes <= 150, runtime_meshes
          node_names = {row.get('name') for row in gltf.get('nodes', [])}
          assert 'WR_ANCHOR_right_fireplace_practical' not in node_names
          assert 'WR3_OBS_stove_flame_body' in node_names
          assert 'WR3_OBS_stove_flame_0' in node_names

          image = Image.open(preview).convert('RGB')
          assert image.size == (1600, 900), image.size
          assert max(channel[1] for channel in image.getextrema()) > 80
          data = json.loads(manifest.read_text())
          assert data['contract'] == 'war-room-celestial-observatory-v3'
          assert data['board_anchor']['name'] == 'WR_ANCHOR_board_origin'
          assert len(data['objects']) >= 190, len(data['objects'])
          source_names = {row['name'] for row in data['objects']}
          assert 'WR3_OBS_celestial_window' in source_names
          assert 'WR3_OBS_window_crescent' in source_names
          assert 'WR3_OBS_window_star_0' in source_names
          assert not any(name.startswith('WR3_OBS_window_orbit_') for name in source_names)
          assert not any(name.startswith('WR3_OBS_window_constellation_') for name in source_names)
          assert not any(name.startswith('WR3_OBS_canopy_rib_') for name in source_names)
          assert 'WR3_OBS_bookshelf_frame' in source_names
          assert 'WR3_OBS_entry_rug' in source_names
          assert 'WR3_OBS_table_drum' in source_names
          assert 'WR3_OBS_stove_body' in source_names
          assert 'WR3_OBS_telescope_tube' in source_names
          assert 'WR3_OBS_entry_door' in source_names
          assert not any(name.startswith('WR_ARCH_') for name in source_names)
          assert not any(name.startswith('WR_CANON_') for name in source_names)
          assert not any(name.startswith('WR3_OBS_drafting_') for name in source_names)
          assert not any(name.startswith('WR3_OBS_map_') for name in source_names)
          assert not any(name.startswith('WR3_OBS_window_spoke_') for name in source_names)
          assert 'WR3_OBS_window_moon' not in source_names
          PY

      - name: Publish War Room v3 shell
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 -S scripts/blender/publish_war_room_v3.py \
            /tmp/war-room-v3/war-room-v3-shell.glb \
            --revision '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}' \
            --channel '${{ github.event_name == 'push' && 'runtime' || 'staging' }}'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: war-room-v3-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/war-room-v3/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
