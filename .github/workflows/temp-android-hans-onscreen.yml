name: Temp Android Hans onscreen patch

on:
  push:
    branches:
      - fix/android-hans-onscreen-entry

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply verified Hans onscreen patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hans-onscreen.patch.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/hans-onscreen.patch.b64 > /tmp/hans-onscreen.patch
          git apply --check /tmp/hans-onscreen.patch
          git apply /tmp/hans-onscreen.patch
          rm .github/workflows/temp-android-hans-onscreen.yml
          git config user.name "Linux Pirate Ninja"
          git config user.email "12677236+evilsysadmin@users.noreply.github.com"
          git add frontend/src/components/WarRoomHansIteration.js \
                  frontend/src/components/WarRoomTeutonicDecor.js \
                  frontend/src/components/Board3DCore.jsx \
                  e2e/three-d-war-room-android-touch.spec.js \
                  frontend/src/components/WarRoomHansIteration.test.js \
                  .github/workflows/temp-android-hans-onscreen.yml
          git diff --cached --check
          git commit -m "War Room: keep Hans onscreen on Android entrance"
          git push origin HEAD:fix/android-hans-onscreen-entry
