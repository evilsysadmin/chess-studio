name: Main · admission

on:
  push:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

# La admisión no muta infraestructura. Si main avanza mientras comprobamos una
# generación anterior, cancelar ese run ahorra minutos y evita acreditar basura
# obsoleta. Staging conserva además su propio stale guard antes de mutar nada.
concurrency:
  group: chess-studio-main-admission
  cancel-in-progress: true

jobs:
  # Build the exact staging frontend while admission/backend work is still
  # running. This job mutates nothing and is deliberately best-effort: staging
  # verifies the SHA before consuming it and falls back to its local build on
  # any miss/corruption.
  frontend_staging_artifact:
    name: Main · prebuild staging frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build exact staging frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_WAR_ROOM_V2_ENABLE: '1'
          VITE_PUBLIC_BASE: /
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_GRAFANA_CLOUD_URL: ${{ vars.VITE_GRAFANA_CLOUD_URL }}
          VITE_GRAFANA_LOGS_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_LOGS_DASHBOARD_URL }}
          VITE_GRAFANA_HEALTH_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_HEALTH_DASHBOARD_URL }}
          VITE_GRAFANA_TRACES_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_TRACES_DASHBOARD_URL }}
        run: npm run build

      - name: Verify prebuilt frontend identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path('frontend/dist/release.json').read_text(encoding='utf-8'))
          actual = str(payload.get('build') or '').lower()
          expected = sys.argv[1].lower()
          raise SystemExit(0 if actual == expected else f"Artifact build={actual or '<vacío>'}, esperaba {expected}")
          PY

      - name: Upload exact staging frontend
        uses: actions/upload-artifact@v6
        with:
          name: staging-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  source:
    name: Main · classify HEAD provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.source }}
      pr_number: ${{ steps.source.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Main source classifier self-test
        run: python3 -S scripts/main_ci_source.py --self-test

      - name: Classify exact main HEAD
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S scripts/main_ci_source.py

  admit_pr:
    name: Main · accredited PR gate
    needs: source
    if: needs.source.outputs.source == 'pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Admission logic self-test
        run: python3 -S scripts/main_ci_admission.py --self-test

      - name: Admission wait policy self-test
        run: python3 -S scripts/main_ci_admission_wait.py --self-test

      # Un admin/auto-merge puede adelantar el merge mientras el Quality exacto
      # de ese head sigue vivo. No desplegamos todavía: esperamos su resultado.
      # Si main avanza, cancel-in-progress convierte esta generación obsoleta en
      # cancelled/superseded; si Quality termina rojo, admission sigue fallando.
      - name: Wait for / reuse green PR quality gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_ADMISSION_WAIT_ATTEMPTS: 25
          MAIN_ADMISSION_WAIT_SECONDS: 12
        run: python3 -S scripts/main_ci_admission_wait.py

      # Seguimos validando en el SHA final de main los contratos baratos que no
      # necesitan dependencias pesadas ni navegador. Así un squash/merge jamás
      # salta directamente de "PR verde" a staging sin inspeccionar el artefacto
      # final que realmente vamos a desplegar.
      - name: Static preflight on final main SHA
        run: make static-preflight

      - name: Staging preview isolation contract
        run: python3 scripts/staging_preview_contract.py

  admit_direct:
    name: Main · direct HEAD full fallback gate
    needs: source
    if: needs.source.outputs.source == 'direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt

      - name: Resolve Trivy cache epoch
        id: trivy_epoch
        shell: bash
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        uses: actions/cache@v6
        with:
          path: |
            .tools/trivy
            .trivy-cache
          key: direct-main-trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-${{ steps.trivy_epoch.outputs.day }}
          restore-keys: |
            direct-main-trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-
            trivy-${{ runner.os }}-${{ runner.arch }}-v0.74.0-

      - name: Explain exceptional full gate
        run: |
          echo '::warning title=Direct main fallback::Este SHA no procede de un PR mergeado.'
          echo 'Se ejecutará el gate completo sobre el HEAD exacto antes de permitir staging.'

      # Este camino es deliberadamente más caro que el fast-path de PR. Un push
      # directo no obtiene un bypass: debe demostrar por sí mismo frontend,
      # backend, security, Playwright, imágenes Docker y stack real.
      - name: Full exact-HEAD quality fallback
        env:
          TRIVY_DB_TTL_MINUTES: '1440'
        run: make tests security-images compose-smoke

  publish_backend_image:
    name: Main · publish backend linux/arm64
    needs: [source, admit_pr, admit_direct]
    if: >-
      always() &&
      needs.source.result == 'success' &&
      (needs.admit_pr.result == 'success' || needs.admit_direct.result == 'success')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-python
          file: ./backend-python/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chess-studio-backend:oci-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=oci-backend-arm64
          cache-to: type=gha,mode=max,scope=oci-backend-arm64

      - name: Verify immutable image is publicly pullable
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chess-studio-backend:oci-${GITHUB_SHA}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$image" >/dev/null 2>&1 || true
          docker pull "$image"

      - name: Report immutable image
        run: >-
          echo "Backend image ready and public: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chess-studio-backend:oci-${GITHUB_SHA}"
