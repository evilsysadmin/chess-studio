name: Main · admission

on:
  push:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

# La admisión no muta infraestructura. Si main avanza mientras comprobamos una
# generación anterior, cancelar ese run ahorra minutos y evita acreditar basura
# obsoleta. Staging conserva además su propio stale guard antes de mutar nada.
concurrency:
  group: chess-studio-main-admission
  cancel-in-progress: true

jobs:
  # Build the exact staging frontend while admission/backend work is still
  # running. This job mutates nothing and is deliberately best-effort: staging
  # verifies the SHA before consuming it and falls back to its local build on
  # any miss/corruption.
  frontend_staging_artifact:
    name: Main · prebuild staging frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      STAGING_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore exact frontend dependencies
        uses: ./.github/actions/cache-node-modules
        with:
          working-directory: frontend
          lockfile: frontend/package-lock.json
          node-version: '22'

      - name: Build exact staging frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_WAR_ROOM_VARIANTS_ENABLE: '1'
          VITE_PUBLIC_BASE: /
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_GRAFANA_CLOUD_URL: ${{ vars.VITE_GRAFANA_CLOUD_URL }}
          VITE_GRAFANA_LOGS_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_LOGS_DASHBOARD_URL }}
          VITE_GRAFANA_HEALTH_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_HEALTH_DASHBOARD_URL }}
          VITE_GRAFANA_TRACES_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_TRACES_DASHBOARD_URL }}
        run: npm run build

      - name: Verify prebuilt frontend identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path('frontend/dist/release.json').read_text(encoding='utf-8'))
          actual = str(payload.get('build') or '').lower()
          expected = sys.argv[1].lower()
          raise SystemExit(0 if actual == expected else f"Artifact build={actual or '<vacío>'}, esperaba {expected}")
          PY

      - name: Upload exact staging frontend
        uses: actions/upload-artifact@v7
        with:
          name: staging-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  source:
    name: Main · classify HEAD provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.source }}
      pr_number: ${{ steps.source.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Main source classifier self-test
        run: python3 -S scripts/main_ci_source.py --self-test

      - name: Classify exact main HEAD
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S scripts/main_ci_source.py

  admit_pr:
    name: Main · accredited PR gate
    needs: source
    if: needs.source.outputs.source == 'pr'
    runs-on: ubuntu-24.04
    # The exact-HEAD fallback waits for a full parallel Quality run (~30-45 min).
    timeout-minutes: 100
    # actions: write only to dispatch Quality · CI gate on main for the fallback.
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Admission logic self-test
        run: python3 -S scripts/main_ci_admission.py --self-test

      - name: Admission wait policy self-test
        run: python3 -S scripts/main_ci_admission_wait.py --self-test

      # Un admin/auto-merge puede adelantar el merge mientras el Quality exacto
      # de ese head sigue vivo. No desplegamos todavía: esperamos su resultado.
      # Si main avanza, cancel-in-progress convierte esta generación obsoleta en
      # cancelled/superseded; si Quality termina rojo, admission sigue fallando.
      - name: Wait for / reuse green PR quality gate
        id: pr_admission
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_ADMISSION_WAIT_ATTEMPTS: 25
          MAIN_ADMISSION_WAIT_SECONDS: 12
        run: python3 -S scripts/main_ci_admission_wait.py

      # Exact-base receipts already include static-preflight + staging contract
      # for the same source tree. Only a disjoint concurrent main advance needs
      # those cheap integration contracts rerun on the composed final tree.
      - uses: actions/setup-node@v7
        if: steps.pr_admission.outcome == 'success' && steps.pr_admission.outputs.concurrency_reused == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Static preflight on concurrent composed main SHA
        if: steps.pr_admission.outcome == 'success' && steps.pr_admission.outputs.concurrency_reused == 'true'
        run: make static-preflight

      - name: Staging preview isolation contract · concurrent composition
        if: steps.pr_admission.outcome == 'success' && steps.pr_admission.outputs.concurrency_reused == 'true'
        run: python3 scripts/staging_preview_contract.py

      - name: Exact PR receipt reused without duplicate static gate
        if: steps.pr_admission.outcome == 'success' && steps.pr_admission.outputs.concurrency_reused != 'true'
        run: echo 'Main exact-base tree already passed Quality static-preflight + staging-preview contract.'

      # Slow but safe path: if the PR receipt cannot be reused (for example two
      # concurrent PRs touched the same file), test the exact final main SHA
      # instead of weakening the concurrency proof or blocking staging forever.
      # The full Quality · CI gate runs in its fail-closed --all mode (frontend,
      # backend, security, Docker images, compose stack, every browser lane), in
      # parallel, on this exact SHA. Serial `make tests` replayed every spec,
      # visual-artifact producers included, and never fitted in the timeout.
      - name: Explain exact-HEAD PR fallback
        if: steps.pr_admission.outcome == 'failure'
        run: |
          echo '::warning title=PR admission fallback::El recibo Quality del PR no puede reutilizarse de forma segura para este árbol final.'
          echo 'Se ejecutará Quality · CI gate completo (--all) sobre el HEAD exacto de main antes de permitir staging.'

      - name: Full exact-HEAD quality fallback
        if: steps.pr_admission.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -S scripts/main_admission_quality_dispatch.py --self-test
          python3 -S scripts/main_admission_quality_dispatch.py

  admit_direct:
    name: Main · direct HEAD full fallback gate
    needs: source
    if: needs.source.outputs.source == 'direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    # actions: write only to dispatch Quality · CI gate on main.
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Explain exceptional full gate
        run: |
          echo '::warning title=Direct main fallback::Este SHA no procede de un PR mergeado.'
          echo 'Se ejecutará Quality · CI gate completo (--all) sobre el HEAD exacto antes de permitir staging.'

      # Este camino es deliberadamente más caro que el fast-path de PR. Un push
      # directo no obtiene un bypass: debe demostrar por sí mismo frontend,
      # backend, security, Playwright, imágenes Docker y stack real, con el
      # Quality · CI gate completo (--all) sobre este SHA exacto.
      - name: Full exact-HEAD quality fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -S scripts/main_admission_quality_dispatch.py --self-test
          python3 -S scripts/main_admission_quality_dispatch.py
