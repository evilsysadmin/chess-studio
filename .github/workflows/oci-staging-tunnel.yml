name: OCI staging · Cloudflare Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

# Tunnel/DNS control-plane state is persistent. Reconcile it only when explicitly
# requested, and serialize it with every other OCI staging mutation.
concurrency:
  group: oci-staging-mutations
  cancel-in-progress: false

jobs:
  reconcile:
    name: OCI staging · expose through Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tunnel recovery always uses trusted tooling already merged on main.
          ref: main
          fetch-depth: 1

      - name: Restore cached OCI SDK toolchain
        uses: ./.github/actions/setup-oci-sdk
        with:
          version: '2.185.2'
          python-version: '3.13'

      - name: Validate tunnel contract
        run: python3 -S scripts/oci_cloudflare_tunnel.py --self-test

      - name: Reconcile private tunnel and staging API DNS
        run: python3 scripts/oci_cloudflare_tunnel.py reconcile
