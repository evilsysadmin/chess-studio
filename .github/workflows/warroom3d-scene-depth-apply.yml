name: War Room scene depth apply
on:
  push:
    branches: [feature/warroom3d-scene-depth]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[warroom3d-scene-depth-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/warroom3d-scene-depth
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          python .github/scripts/warroom_scene_depth_patch.py
          rm -f .github/workflows/warroom3d-scene-depth-apply.yml
          git config user.name "chess-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deepen War Room 3D set dressing"
          git push origin HEAD:feature/warroom3d-scene-depth
