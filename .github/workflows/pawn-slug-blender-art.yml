name: Pawn Slug · Blender canonical art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_pawn_slug_matthias_integrated.py'
      - 'scripts/blender/render_pawn_slug_matthias_weapon_sheet.py'
      - '.github/workflows/pawn-slug-blender-art.yml'
      - 'frontend/src/assets/pawnSlug/matthias_*_atlas_v1.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-matthias:
    name: Render Matthias · integrated weapons
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Install Blender + headless GL + WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender webp libegl1 libgl1-mesa-dri
      - name: Render canonical weapon sheets in Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/pawn-slug-art
          for weapon in pistol machinegun shotgun panzerfaust; do
            blender --background \
              --python scripts/blender/render_pawn_slug_matthias_weapon_sheet.py \
              -- --output-dir /tmp/pawn-slug-art --weapon "$weapon"
            cwebp -quiet -q 86 -alpha_q 95 -m 6 \
              "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.png" \
              -o "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.webp"
            base64 -w0 "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.webp" \
              > "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.b64"
          done
      - name: Sanity-check atlas contract
        run: |
          set -euo pipefail
          for weapon in pistol machinegun shotgun panzerfaust; do
            test -s "/tmp/pawn-slug-art/matthias_${weapon}_integrated_v1.blend"
            test -s "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.png"
            test -s "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.webp"
            test -s "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.b64"
            file "/tmp/pawn-slug-art/matthias_${weapon}_atlas_v1.webp"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pawn-slug-matthias-blender-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/pawn-slug-art/
          retention-days: 7
