name: Pawn Slug · Blender canonical art

on:
  pull_request:
    paths:
      - 'scripts/blender/render_pawn_slug_matthias_canonical_chibi.py'
      - 'scripts/blender/render_pawn_slug_matthias_canonical_heavy.py'
      - 'scripts/blender/pawn_slug_matthias_premium_common.py'
      - 'scripts/blender/pawn_slug_matthias_premium_weapons.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/art/pack_pawn_slug_canonical_runtime.py'
      - '.github/workflows/pawn-slug-blender-art.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/blender/render_pawn_slug_matthias_canonical_chibi.py'
      - 'scripts/blender/render_pawn_slug_matthias_canonical_heavy.py'
      - 'scripts/blender/pawn_slug_matthias_premium_common.py'
      - 'scripts/blender/pawn_slug_matthias_premium_weapons.py'
      - 'scripts/blender/home_matthias_parts.py'
      - 'scripts/art/pack_pawn_slug_canonical_runtime.py'
      - '.github/workflows/pawn-slug-blender-art.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAWN_SLUG_CANONICAL_SAMPLES: '32'

jobs:
  canonical-weapon-proof:
    if: github.event_name != 'push'
    name: Render canonical ${{ matrix.weapon }} run cycle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        weapon: [pistol, machinegun, shotgun, panzerfaust]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-blender-canonical
      - name: Render canonical weighted proof cells
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          OUT="/tmp/pawn-slug-canonical-${WEAPON}-proof"
          rm -rf "$OUT"
          blender --background -noaudio \
            --python-expr "import bpy, os; scene=bpy.context.scene; samples=max(1, int(os.environ.get('PAWN_SLUG_CANONICAL_SAMPLES', '32'))); eevee=getattr(scene, 'eevee', None); setattr(eevee, 'taa_render_samples', samples) if eevee is not None and hasattr(eevee, 'taa_render_samples') else None; scene.render.use_persistent_data=True; print(f'Canonical render: {samples} EEVEE samples, persistent data enabled')" \
            --python scripts/blender/render_pawn_slug_matthias_canonical_heavy.py \
            -- --output-dir "$OUT" --weapon "$WEAPON" --profile proof
          test -s "$OUT/matthias_${WEAPON}_idle_00.png"
          for FRAME in 00 04 08 12; do
            test -s "$OUT/matthias_${WEAPON}_run_${FRAME}.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-canonical-${{ matrix.weapon }}-proof-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/pawn-slug-canonical-${{ matrix.weapon }}-proof/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-canonical-r2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish canonical ${{ matrix.weapon }} atlas · R2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        weapon: [pistol, machinegun, shotgun, panzerfaust]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-blender-canonical
      - name: Render full weighted canonical runtime bank
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          OUT="/tmp/pawn-slug-canonical-${WEAPON}-runtime"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          blender --background -noaudio \
            --python-expr "import bpy, os; scene=bpy.context.scene; samples=max(1, int(os.environ.get('PAWN_SLUG_CANONICAL_SAMPLES', '32'))); eevee=getattr(scene, 'eevee', None); setattr(eevee, 'taa_render_samples', samples) if eevee is not None and hasattr(eevee, 'taa_render_samples') else None; scene.render.use_persistent_data=True; print(f'Canonical render: {samples} EEVEE samples, persistent data enabled')" \
            --python scripts/blender/render_pawn_slug_matthias_canonical_heavy.py \
            -- --output-dir "$OUT" --weapon "$WEAPON" --profile runtime
      - name: Pack lossless 16x5 runtime atlas
        env:
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          OUT="/tmp/pawn-slug-canonical-${WEAPON}-runtime"
          ATLAS="$OUT/matthias_${WEAPON}_canonical_v4.webp"
          python3 scripts/art/pack_pawn_slug_canonical_runtime.py \
            --frames-dir "$OUT" \
            --weapon "$WEAPON" \
            --output "$ATLAS"
          test -s "$ATLAS"
      - name: Publish immutable atlas to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAPON: ${{ matrix.weapon }}
        run: |
          set -euo pipefail
          OUT="/tmp/pawn-slug-canonical-${WEAPON}-runtime"
          ATLAS="$OUT/matthias_${WEAPON}_canonical_v4.webp"
          python3 -S scripts/r2_asset_publish.py publish \
            "$ATLAS" \
            --logical-id "pawnSlug.matthias.${WEAPON}" \
            --prefix "pawn-slug/matthias/${WEAPON}" | tee "/tmp/pawn-slug-${WEAPON}-r2-publish.txt"
          python3 -S scripts/r2_asset_publish.py check-manifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-canonical-${{ matrix.weapon }}-r2-${{ github.run_number }}
          path: |
            frontend/src/assets/r2-assets-manifest.json
            /tmp/pawn-slug-${{ matrix.weapon }}-r2-publish.txt
          if-no-files-found: warn
          retention-days: 7
