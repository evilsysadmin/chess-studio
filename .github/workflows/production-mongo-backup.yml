name: Production · Mongo weekly backup

on:
  schedule:
    # Sunday, off the release train and away from the top-of-hour scheduler herd.
    - cron: '17 4 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/oci_production_mongo_backup.py'
      - 'scripts/oci_production_mongo_backup.sh'
      - '.github/workflows/production-mongo-backup.yml'

permissions:
  contents: read

concurrency:
  group: production-mongo-weekly-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup production Mongo local + off-host
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore OCI SDK
        uses: ./.github/actions/setup-oci-sdk

      - name: Validate backup orchestration
        run: |
          set -euo pipefail
          python3 -S scripts/oci_production_mongo_backup.py --self-test
          bash -n scripts/oci_production_mongo_backup.sh

      - name: Wait for staging generation containing latest backup wrapper source
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the .sh wrapper is installed on OCI staging. A change to the
          # GitHub-only Python orchestrator/workflow must not wait for its full
          # main SHA when staging intentionally skips non-runtime deployments.
          wrapper_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/commits?path=scripts/oci_production_mongo_backup.sh&sha=$GITHUB_SHA&per_page=1" \
              --jq '.[0].sha'
          )"
          [[ "$wrapper_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::unable to resolve latest backup wrapper source commit"
            exit 1
          }
          release_url=https://api-staging.chess-studio.shadowops.dpdns.org/api/release
          for attempt in $(seq 1 40); do
            served_sha="$(
              curl --fail --silent --show-error --max-time 10 \
                -H 'Accept: application/json' \
                -H 'Cache-Control: no-cache' \
                -H 'User-Agent: ChessStudio-MongoBackupLineage/1' \
                "$release_url" 2>/dev/null \
                | jq -r '.build // empty' 2>/dev/null \
                || true
            )"
            if [[ "$served_sha" =~ ^[0-9a-f]{40}$ ]]; then
              compare_status="$(
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "/repos/$GITHUB_REPOSITORY/compare/$wrapper_sha...$served_sha" \
                  --jq '.status' 2>/dev/null || true
              )"
              if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                echo "::notice::staging serves $served_sha, which contains backup wrapper change $wrapper_sha"
                exit 0
              fi
            fi
            echo "::notice::waiting for staging to install latest backup wrapper source $wrapper_sha ($attempt/40)"
            sleep 15
          done
          echo "::error::staging never converged to a generation containing the latest backup/restore wrapper source"
          exit 1

      - name: Refresh production runtime from OCI Vault
        run: python3 scripts/oci_production_runtime.py sync-current

      - name: Create, upload and rotate production Mongo backup
        run: python3 scripts/oci_production_mongo_backup.py backup

      - name: Summary
        if: success()
        run: |
          {
            echo '### Production Mongo backup'
            echo '- Targets: OCI A1 local block storage + private OCI Object Storage'
            echo '- Database: `chess_study`'
            echo '- Retention: newest 2 local + newest 8 remote successful weekly backups'
            echo '- Order: mongorestore dry-run → SHA-256 checked remote upload → remote download → isolated real restore → remote/local prune'
            echo '- Restore drill: the exact Object Storage archive is downloaded, checksum-verified, restored into an unexposed temporary Mongo container, queried, then destroyed'
            echo '- Production Mongo is never a restore target; the drill publishes no scratch port'
            echo '- Remote retention deletes exact object versions only after the restore drill succeeds'
          } >> "$GITHUB_STEP_SUMMARY"
