name: Pawn Slug · inspect canonical R2 motion

on:
  push:
    branches:
      - ops/pawn-slug-r2-courier-canon2d
    paths:
      - '.github/workflows/pawn-slug-canon2d-r2-courier.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOTION: /tmp/matthias_motion_atlas_v5.webp
      MOTION_URL: https://assets.chess-studio.shadowops.dpdns.org/pawn-slug/matthias/motion/matthias_motion_atlas_v5_payload-85988118befde412.webp
    steps:
      - name: Fetch canonical motion atlas directly from R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$MOTION_URL" -o "$MOTION"
          test "$(stat -c %s "$MOTION")" = "9334"
          echo "85988118befde41238cedc4ba772af38d08789bdcfb1671e874ff6743470c393  $MOTION" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: pawn-slug-r2-canonical-motion-${{ github.run_number }}
          path: /tmp/matthias_motion_atlas_v5.webp
          if-no-files-found: error
          retention-days: 2
