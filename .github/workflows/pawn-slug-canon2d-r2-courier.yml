name: Pawn Slug · inspect canonical R2 pistol

on:
  push:
    branches:
      - ops/pawn-slug-r2-courier-canon2d
    paths:
      - '.github/workflows/pawn-slug-canon2d-r2-courier.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS: /tmp/matthias_canonical_pistol_v1.webp
      ATLAS_URL: https://assets.chess-studio.shadowops.dpdns.org/pawn-slug/matthias/pistol/matthias_canonical_pistol_v1-42a01598d26b6ded.webp
    steps:
      - name: Fetch canonical pistol atlas directly from R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$ATLAS_URL" -o "$ATLAS"
          test "$(stat -c %s "$ATLAS")" = "130478"
          echo "42a01598d26b6dedb7f0bfa70c392c6cbd80df9cea1bea7c7224f9a6d8cf2829  $ATLAS" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: pawn-slug-r2-canonical-pistol-${{ github.run_number }}
          path: /tmp/matthias_canonical_pistol_v1.webp
          if-no-files-found: error
          retention-days: 2
