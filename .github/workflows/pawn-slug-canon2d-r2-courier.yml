name: Pawn Slug · inspect canonical R2 master

on:
  push:
    branches:
      - ops/pawn-slug-r2-courier-canon2d
    paths:
      - '.github/workflows/pawn-slug-canon2d-r2-courier.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MASTER: /tmp/matthias_canonical_sprite_sheet_v1.png
      MASTER_URL: https://assets.chess-studio.shadowops.dpdns.org/pawn-slug/matthias/master/matthias_canonical_sprite_sheet_v1-9c21264274777d01.png
    steps:
      - name: Fetch canonical master directly from R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$MASTER_URL" -o "$MASTER"
          test "$(stat -c %s "$MASTER")" = "3119009"
          echo "9c21264274777d012a2941073f6cbae94df090db0459624e6031207c0a288c5f  $MASTER" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: pawn-slug-r2-canonical-master-${{ github.run_number }}
          path: /tmp/matthias_canonical_sprite_sheet_v1.png
          if-no-files-found: error
          retention-days: 2
