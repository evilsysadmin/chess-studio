name: Pawn Slug · POW Blender canonical art

on:
  pull_request:
    paths:
      - 'scripts/blender/build_pawn_slug_pows_v2.py'
      - '.github/workflows/pawn-slug-pow-blender-art.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-pow-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-pows:
    name: Render POW squad · Blender v2
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-blender-canonical

      - name: Build genuine Blender source, GLB and previews
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDER_PREVIEW_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && '64' || '24' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pawn-slug-pow-v2
          blender --background \
            --python-expr "import bpy, os; samples=max(1, int(os.environ.get('BLENDER_PREVIEW_SAMPLES', '64'))); eevee=getattr(bpy.context.scene, 'eevee', None); setattr(eevee, 'taa_render_samples', samples) if eevee is not None and hasattr(eevee, 'taa_render_samples') else None; print('POW preview samples:', samples)" \
            --python scripts/blender/build_pawn_slug_pows_v2.py \
            -- --output-dir /tmp/pawn-slug-pow-v2
          test -s /tmp/pawn-slug-pow-v2/pawn_slug_pow_squad_v2.blend
          test -s /tmp/pawn-slug-pow-v2/pawn_slug_pow_squad_v2.glb
          test -s /tmp/pawn-slug-pow-v2/pow_bound_v2.png
          test -s /tmp/pawn-slug-pow-v2/pow_kneeling_v2.png
          test -s /tmp/pawn-slug-pow-v2/pow_caged_v2.png

      - name: Verify Blender provenance + runtime contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw

          root = Path('/tmp/pawn-slug-pow-v2')
          blend = root / 'pawn_slug_pow_squad_v2.blend'
          glb = root / 'pawn_slug_pow_squad_v2.glb'
          assert blend.stat().st_size > 50_000, blend.stat().st_size
          assert glb.stat().st_size > 20_000, glb.stat().st_size
          assert glb.stat().st_size < 3_000_000, glb.stat().st_size

          payload = glb.read_bytes()
          assert payload[:4] == b'glTF'
          version, total = struct.unpack_from('<II', payload, 4)
          assert version == 2, version
          assert total == len(payload), (total, len(payload))
          json_len, json_type = struct.unpack_from('<II', payload, 12)
          assert json_type == 0x4E4F534A
          doc = json.loads(payload[20:20 + json_len].decode('utf-8').rstrip(' \t\r\n\x00'))
          generator = str(doc.get('asset', {}).get('generator', ''))
          assert 'Blender' in generator, f'GLB must be genuinely Blender-exported: {generator!r}'

          names = [str(node.get('name', '')) for node in doc.get('nodes', [])]
          for pose in ('bound', 'kneeling', 'caged'):
              body = [name for name in names if name.startswith(f'{pose}__body__')]
              assert len(body) >= 25, f'{pose} body too simple: {len(body)} nodes'
          assert sum(name.startswith('bound__chains__') for name in names) >= 8
          assert sum(name.startswith('kneeling__chains__') for name in names) >= 8
          assert sum(name.startswith('caged__cage__') for name in names) >= 16

          previews = {}
          for pose in ('bound', 'kneeling', 'caged'):
              path = root / f'pow_{pose}_v2.png'
              image = Image.open(path).convert('RGBA')
              assert image.size == (640, 640), image.size
              alpha = image.getchannel('A').point(lambda value: 255 if value >= 32 else 0)
              bbox = alpha.getbbox()
              assert bbox is not None, f'empty {pose} preview'
              left, top, right, bottom = bbox
              width, height = right - left, bottom - top
              assert width >= 150, (pose, bbox)
              assert height >= 300, (pose, bbox)
              assert left > 5 and top > 5 and right < 635 and bottom < 635, (pose, bbox)
              visible = [
                  0.2126 * r + 0.7152 * g + 0.0722 * b
                  for r, g, b, a in image.getdata()
                  if a >= 32
              ]
              assert visible and sum(visible) / len(visible) >= 25.0, f'{pose} preview too dark'
              previews[pose] = image

          assert ImageChops.difference(previews['bound'], previews['kneeling']).getbbox() is not None
          assert ImageChops.difference(previews['kneeling'], previews['caged']).getbbox() is not None

          canvas = Image.new('RGBA', (640 * 3, 700), (16, 18, 20, 255))
          draw = ImageDraw.Draw(canvas)
          for index, pose in enumerate(('bound', 'kneeling', 'caged')):
              canvas.alpha_composite(previews[pose], (index * 640, 60))
              draw.text((index * 640 + 16, 18), pose.upper(), fill=(235, 235, 235, 255))
          canvas.save(root / 'pow_squad_v2_triptych.png', optimize=True)
          print('GLB generator:', generator)
          print('GLB bytes:', len(payload))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawn-slug-pow-blender-v2-${{ github.event.pull_request.number || github.run_number }}
          path: /tmp/pawn-slug-pow-v2/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
