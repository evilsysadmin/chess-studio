name: Apply zfrk economy gate
on:
  push:
    branches: [feat/zfrk-combat-economy-gate]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply product delta
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/zfrk-bootstrap.patch
          git apply --whitespace=nowarn .github/zfrk-bootstrap.patch
          make static-preflight
          rm -f .github/zfrk-bootstrap.patch .github/workflows/zfrk-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebalance Combat mission supply economy"
          git push origin HEAD:feat/zfrk-combat-economy-gate
