name: zfro finalize

on:
  push:
    branches:
      - feat/zfro-hard-campaign-decisions

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hard-decision iteration and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          campaign = Path('frontend/src/combatCampaign.js')
          text = campaign.read_text(encoding='utf-8')
          start = text.index('export function campaignEventOptions(state) {')
          end = text.index('\nexport function resolveCampaignEvent(state, choiceId) {', start)
          replacement = '''export function campaignEventOptions(state) {
            const node = campaignNode(state);
            if (!node || state.phase !== 'event') return [];
            const archetype = campaignEventArchetype(node);
            const supplyPerk = rewardOptionsForFloor(state.seed, node.floor + 37)[0];
            const available = Math.max(0, Number(state.operationalCredits) || 0);
            const withCost = (option) => {
              const creditCost = Math.max(0, Number(option.creditCost) || 0);
              const disabled = creditCost > available;
              const costText = creditCost
                ? ` Coste: ${creditCost} suministros${disabled ? ' (saldo insuficiente).' : '.'}`
                : '';
              return { ...option, creditCost, disabled, description: `${option.description}${costText}` };
            };
            const choices = archetype === 'radio' ? [
              { id:'decrypt', label:'Descifrar el tráfico', description:'Obtienes el Cifrador de campaña. Si ya lo tienes, recuperas 4 suministros.', creditCost:2, ...relicChoice(state, 'fieldCipher', 4) },
              { id:'jam', label:'Interferir la red', description:'Silencias coordinación enemiga: −5 de dificultad en el próximo combate.', creditCost:3, difficultyDelta:-5 },
              { id:'trace', label:'Rastrear al operador', description:'Obtienes Óptica del observador, pero la búsqueda genera ruido: +2 al próximo combate.', difficultyDelta:2, ...relicChoice(state, 'forwardObserver', 4) },
            ] : archetype === 'depot' ? [
              { id:'inventory', label:'Inventariar bajo presión', description:'Recuperas 6 suministros, pero el registro del depósito deja +4 de amenaza.', credits:6, difficultyDelta:4 },
              { id:'salvage', label:`Vaciar el depósito · ${supplyPerk.label}`, description:'Obtienes una ventaja temporal, pero haces ruido: +4 al próximo combate.', difficultyDelta:4, perkId:supplyPerk.id },
              { id:'ledger', label:'Recuperar libro logístico', description:'Obtienes Libro de retaguardia. Si ya lo tienes, recuperas 4 suministros.', creditCost:2, ...relicChoice(state, 'campLedger', 4) },
            ] : archetype === 'scouts' ? [
              { id:'shadow', label:'Seguirlos sin contacto', description:'Aprendes la ruta enemiga: −6 de dificultad en el próximo combate.', creditCost:3, difficultyDelta:-6 },
              { id:'seizeMaps', label:'Confiscar sus mapas', description:'Obtienes Equipo de infiltración, pero el forcejeo deja +3 de ruido.', difficultyDelta:3, ...relicChoice(state, 'silentBoots', 4) },
              { id:'trade', label:'Intercambiar información', description:'Recuperas 4 suministros, pero la negociación expone tu ruta: +3 de amenaza.', credits:4, difficultyDelta:3 },
            ] : [
              { id:'recon', label:'Reconocimiento silencioso', description:'Rodeas el convoy sin tocarlo: −6 de dificultad en el próximo combate.', creditCost:3, difficultyDelta:-6 },
              { id:'salvage', label:`Saquear suministros · ${supplyPerk.label}`, description:'Ganas una ventaja temporal, pero haces ruido: +4 al próximo combate.', difficultyDelta:4, perkId:supplyPerk.id },
              { id:'manifest', label:'Recuperar el manifiesto', description:'Obtienes Sello de intendencia. Si ya lo tienes, recuperas 4 suministros.', creditCost:2, ...relicChoice(state, 'quartermasterSeal', 4) },
            ];
            return choices.map(withCost);
          }
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          text = text[:start] + replacement + text[end:]

          old = "  const option = campaignEventOptions(state).find((item) => item.id === choiceId);\n  if (!option) return state;"
          new = "  const option = campaignEventOptions(state).find((item) => item.id === choiceId);\n  if (!option || option.disabled) return state;\n  const creditCost = Math.max(0, Number(option.creditCost) || 0);"
          if old not in text:
            raise SystemExit('resolve option guard not found')
          text = text.replace(old, new, 1)

          old = "  const rewardBits = [option.label];"
          new = "  const rewardBits = [option.label];\n  if (creditCost) rewardBits.push(`−${creditCost} suministros`);"
          if old not in text:
            raise SystemExit('rewardBits marker not found')
          text = text.replace(old, new, 1)

          old = "    operationalCredits: (Number(state.operationalCredits) || 0) + credits,"
          new = "    operationalCredits: Math.max(0, (Number(state.operationalCredits) || 0) - creditCost + credits),"
          if old not in text:
            raise SystemExit('operationalCredits event update not found')
          text = text.replace(old, new, 1)
          campaign.write_text(text, encoding='utf-8')

          screen = Path('frontend/src/components/RoguelikeScreen.jsx')
          text = screen.read_text(encoding='utf-8')
          old = '''                  <button type="button" key={option.id} className="roguelike-reward-card" onClick={() => handleCampaignEvent(option.id)}>
                    <strong>{option.label}</strong><span>{option.description}</span>
                  </button>'''
          new = '''                  <button type="button" key={option.id} className="roguelike-reward-card" disabled={option.disabled} aria-disabled={option.disabled} onClick={() => handleCampaignEvent(option.id)}>
                    <strong>{option.label}</strong><span>{option.description}</span>
                  </button>'''
          if old not in text:
            raise SystemExit('campaign event button block not found')
          screen.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('frontend/src/combatCampaign.test.js')
          text = tests.read_text(encoding='utf-8')
          old = "          const options = campaignEventOptions(run);\n          expect(options.length, `seed ${seedIndex} evento sin opciones`).toBeGreaterThan(0);\n          run = resolveCampaignEvent(run, options[seedIndex % options.length].id);"
          new = "          const options = campaignEventOptions(run).filter((option) => !option.disabled);\n          expect(options.length, `seed ${seedIndex} evento sin opciones disponibles`).toBeGreaterThan(0);\n          run = resolveCampaignEvent(run, options[seedIndex % options.length].id);"
          if old not in text:
            raise SystemExit('campaign flow audit event block not found')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_release = 'v16.6dm46zfrn'
          new_release = 'v16.6dm46zfro'
          Path('RELEASE.txt').write_text(new_release + '\n', encoding='utf-8')
          for filename in ['frontend/src/release.js', 'backend-python/release_info.py']:
            path = Path(filename)
            body = path.read_text(encoding='utf-8')
            if old_release not in body:
              raise SystemExit(f'old release marker not found in {filename}')
            path.write_text(body.replace(old_release, new_release, 1), encoding='utf-8')
          Path('frontend/public/release.json').write_text(json.dumps({'release': new_release}, indent=2) + '\n', encoding='utf-8')

          notes = Path('frontend/src/userReleaseNotes.js')
          text = notes.read_text(encoding='utf-8')
          anchor = 'export const USER_RELEASE_NOTES = Object.freeze([\n'
          entry = '\n'.join([
            '  {',
            "    release: 'v16.6dm46zfro',",
            "    title: 'Las decisiones de campaña ya tienen dientes',",
            '    highlights: [',
            "      'Los eventos de Combat Chess dejan de regalar suministros o reducciones de amenaza sin contrapartida: las ventajas cómodas cuestan recursos y el botín fácil genera riesgo.',",
            "      'Siempre queda al menos una salida sin coste para que una campaña con pocos suministros nunca quede bloqueada.',",
            "      'Las opciones que no puedes pagar se muestran como no disponibles y la campaña rechaza también intentos programáticos de ejecutarlas.',",
            '    ],',
            '  },',
            '',
          ])
          if anchor not in text:
            raise SystemExit('release notes anchor not found')
          notes.write_text(text.replace(anchor, anchor + entry, 1), encoding='utf-8')
          PY
          git rm .github/workflows/zfro-finalize.yml
          make static-preflight
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v16.6dm46zfro · Hard campaign decisions'
          git push origin HEAD:feat/zfro-hard-campaign-decisions
