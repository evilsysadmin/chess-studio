name: Build · Pawn Slug Godot Web

on:
  pull_request:
    paths:
      - games/pawn-slug-godot/**
      - scripts/pawn_slug_godot_bundle.py
      - scripts/pawn_slug_godot_2d_gate.py
      - scripts/pawn_slug_enemy_roster_gate.py
      - scripts/pawn_slug_godot_live_smoke.mjs
      - scripts/pawn_slug_godot_pr_capture.mjs
      - .github/workflows/pawn-slug-godot-web.yml
      - .github/workflows/cicd.yml
      - Makefile
      - scripts/apply_frontend_csp.mjs
  push:
    branches: [main]
    paths:
      - games/pawn-slug-godot/**
      - scripts/pawn_slug_godot_bundle.py
      - scripts/pawn_slug_godot_2d_gate.py
      - scripts/pawn_slug_enemy_roster_gate.py
      - scripts/pawn_slug_godot_live_smoke.mjs
      - scripts/pawn_slug_godot_pr_capture.mjs
      - .github/workflows/pawn-slug-godot-web.yml
      - .github/workflows/cicd.yml
      - Makefile
      - scripts/apply_frontend_csp.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawn-slug-godot-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
  GODOT_TEMPLATES_SHA256: 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011'

jobs:
  validate:
    name: Validate · Pawn Slug Godot contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      export_required: ${{ steps.classify.outputs.export_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Restore pinned Godot editor for PR parse gate
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: pawn-slug-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v3
      - name: Install pinned Godot editor for PR parse gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - name: Parse Godot project before merge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pawn-slug-godot-parse.log"
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          set +e
          "$godot" --headless --path games/pawn-slug-godot --editor --quit 2>&1 | tee "$log"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [[ "$godot_status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Pawn Slug Godot contains GDScript load/parse errors.'
            exit 1
          fi
      - name: Runtime mechanics smoke · crouch + aim + respawn
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          "$godot" --headless --path games/pawn-slug-godot --script res://tests/player_runtime_smoke.gd
      - name: Bundle publisher self-test
        run: python3 -S scripts/pawn_slug_godot_bundle.py self-test
      - name: Enemy roster composition gate
        run: |
          python3 -S scripts/pawn_slug_enemy_roster_gate.py self-test
          python3 -S scripts/pawn_slug_enemy_roster_gate.py
      - name: Godot runtime stays strictly 2D
        run: python3 -S scripts/pawn_slug_godot_2d_gate.py
      - name: Web export stays iframe-safe and single-threaded
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'platform="Web"' games/pawn-slug-godot/export_presets.cfg
          grep -q 'variant/thread_support=false' games/pawn-slug-godot/export_presets.cfg
          grep -q 'vram_texture_compression/for_mobile=false' games/pawn-slug-godot/export_presets.cfg
          grep -q 'renderer/rendering_method="gl_compatibility"' games/pawn-slug-godot/project.godot
          grep -q '_notify_parent("ready")' games/pawn-slug-godot/scripts/main.gd
          grep -q '_notify_parent("exit")' games/pawn-slug-godot/scripts/main.gd
          grep -Fq "frame-src 'self' https://assets.chess-studio.shadowops.dpdns.org" scripts/apply_frontend_csp.mjs
      - name: Classify export surface
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          export_required=false
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export_required=true
          elif [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              changed="$(git diff --name-only HEAD^ HEAD)"
              printf 'Changed files:\n%s\n' "$changed"
              if grep -Eq '^(games/pawn-slug-godot/|scripts/pawn_slug_godot_bundle\.py$|scripts/pawn_slug_godot_2d_gate\.py$|scripts/pawn_slug_enemy_roster_gate\.py$|\.github/workflows/pawn-slug-godot-web\.yml$)' <<<"$changed"; then
                export_required=true
              fi
            else
              export_required=true
            fi
          fi
          echo "export_required=$export_required" >> "$GITHUB_OUTPUT"
          echo "Pawn Slug Godot export required: $export_required" >> "$GITHUB_STEP_SUMMARY"

  build_publish:
    name: Export + publish · Pawn Slug Godot Web
    if: github.event_name != 'pull_request' && needs.validate.outputs.export_required == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache pinned Godot editor and Web templates
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: pawn-slug-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v3
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - name: Install pinned Godot Web export templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          debug_template="$template_dir/web_nothreads_debug.zip"
          release_template="$template_dir/web_nothreads_release.zip"
          if [[ ! -f "$debug_template" || ! -f "$release_template" ]]; then
            archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            rm -rf "$unpack"
            curl -fL --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
              -o "$archive"
            echo "$GODOT_TEMPLATES_SHA256  $archive" | sha256sum -c -
            mkdir -p "$template_dir" "$unpack"
            unzip -q "$archive" \
              templates/web_nothreads_debug.zip \
              templates/web_nothreads_release.zip \
              -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$debug_template"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$release_template"
          fi
          test -s "$debug_template"
          test -s "$release_template"
      - name: Export Godot Web release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf games/pawn-slug-godot/build/web
          mkdir -p games/pawn-slug-godot/build/web
          export_log="$RUNNER_TEMP/pawn-slug-godot-export.log"
          pushd games/pawn-slug-godot >/dev/null
          set +e
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html 2>&1 | tee "$export_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          popd >/dev/null
          if [[ "$godot_status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$export_log"; then
            echo '::error::Godot export produced script load/parse errors; refusing to publish R2 pointer.'
            exit 1
          fi
          python3 -S scripts/pawn_slug_godot_bundle.py check
      - name: Publish immutable R2 release + atomic pointer
        run: python3 -S scripts/pawn_slug_godot_bundle.py publish
      - name: Public R2 smoke
        shell: bash
        run: |
          set -euo pipefail
          pointer='https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/current.json'
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$pointer?sha=$GITHUB_SHA&attempt=$attempt" -o "$RUNNER_TEMP/pawn-slug-godot-current.json"; then
              break
            fi
            sleep 2
          done
          index_url="$(python3 -S scripts/pawn_slug_godot_bundle.py verify-pointer \
            "$RUNNER_TEMP/pawn-slug-godot-current.json" \
            --expected-source-sha "$GITHUB_SHA")"
          curl -fsS --retry 3 "$index_url" -o "$RUNNER_TEMP/pawn-slug-godot-index.html"
          test -s "$RUNNER_TEMP/pawn-slug-godot-index.html"
          echo "PAWN_SLUG_GODOT_INDEX_URL=$index_url" >> "$GITHUB_ENV"
          echo "Pawn Slug Godot Web published: $index_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Godot browser smoke runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'
      - name: Browser lifecycle + gameplay smoke
        timeout-minutes: 4
        run: node scripts/pawn_slug_godot_live_smoke.mjs

  smoke_existing:
    name: Smoke existing · Pawn Slug Godot Web
    if: github.event_name == 'push' && needs.validate.outputs.export_required != 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current R2 release
        shell: bash
        run: |
          set -euo pipefail
          pointer='https://assets.chess-studio.shadowops.dpdns.org/pawn-slug-godot/current.json'
          curl -fsS --retry 3 "$pointer?smoke=$GITHUB_SHA" -o "$RUNNER_TEMP/pawn-slug-godot-current.json"
          index_url="$(python3 -S scripts/pawn_slug_godot_bundle.py verify-pointer \
            "$RUNNER_TEMP/pawn-slug-godot-current.json")"
          curl -fsS --retry 3 "$index_url" -o "$RUNNER_TEMP/pawn-slug-godot-index.html"
          test -s "$RUNNER_TEMP/pawn-slug-godot-index.html"
          echo "PAWN_SLUG_GODOT_INDEX_URL=$index_url" >> "$GITHUB_ENV"
          echo "Pawn Slug Godot smoke reused: $index_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Godot browser smoke runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'
      - name: Browser lifecycle + gameplay smoke
        timeout-minutes: 4
        run: node scripts/pawn_slug_godot_live_smoke.mjs


  pr_visual_capture:
    name: PR visual evidence · Pawn Slug Godot
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Restore pinned Godot editor and Web templates
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: pawn-slug-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v3
      - name: Install pinned Godot editor + Web templates
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            editor_archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3               "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"               -o "$editor_archive"
            echo "$GODOT_EDITOR_SHA256  $editor_archive" | sha256sum -c -
            unzip -q "$editor_archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          debug_template="$template_dir/web_nothreads_debug.zip"
          release_template="$template_dir/web_nothreads_release.zip"
          if [[ ! -f "$debug_template" || ! -f "$release_template" ]]; then
            template_archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            rm -rf "$unpack"
            curl -fL --retry 3               "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz"               -o "$template_archive"
            echo "$GODOT_TEMPLATES_SHA256  $template_archive" | sha256sum -c -
            mkdir -p "$template_dir" "$unpack"
            unzip -q "$template_archive"               templates/web_nothreads_debug.zip               templates/web_nothreads_release.zip               -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$debug_template"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$release_template"
          fi
          "$godot" --version
      - name: Export local PR Web build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf games/pawn-slug-godot/build/web
          mkdir -p games/pawn-slug-godot/build/web
          pushd games/pawn-slug-godot >/dev/null
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html
          popd >/dev/null
          python3 -S scripts/pawn_slug_godot_bundle.py check
      - name: Restore browser runtime
        uses: ./.github/actions/setup-browser-e2e
        with:
          browser-scope: chromium
          restore-frontend-deps: 'false'
          build-frontend: 'false'
      - name: Capture all stage runtime PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4179 --directory games/pawn-slug-godot/build/web >"$RUNNER_TEMP/pawn-slug-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS "http://127.0.0.1:4179/index.html?stage=industrial_front_v1" >/dev/null; then
              break
            fi
            sleep 1
          done
          PAWN_SLUG_GODOT_INDEX_URL="http://127.0.0.1:4179/index.html?stage=industrial_front_v1"             node scripts/pawn_slug_godot_pr_capture.mjs
      - name: Upload Pawn Slug runtime visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pawn-slug-godot-visual-pr-${{ github.event.pull_request.number }}
          path: /tmp/pawn-slug-visual/
          if-no-files-found: error
          retention-days: 7
