name: Infra · R2 assets

on:
  pull_request:
    paths:
      - infra/cloudflare/r2-assets.json
      - scripts/cloudflare_r2_assets.py
      - scripts/r2_asset_publisher.py
      - scripts/r2_asset_publish.py
      - scripts/r2_asset_gc.py
      - scripts/r2_storage_governance.py
      - frontend/src/assets/r2-assets-manifest.json
      - .github/workflows/r2-assets-infra.yml
      - docs/r2-assets.md
      - docs/r2-asset-publisher.md
  push:
    branches: [main]
    paths:
      - infra/cloudflare/r2-assets.json
      - scripts/cloudflare_r2_assets.py
      - scripts/r2_asset_publisher.py
      - scripts/r2_asset_publish.py
      - scripts/r2_asset_gc.py
      - scripts/r2_storage_governance.py
      - frontend/src/assets/r2-assets-manifest.json
      - .github/workflows/r2-assets-infra.yml
      - docs/r2-assets.md
      - docs/r2-asset-publisher.md
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-studio-r2-assets-infra
  cancel-in-progress: false

jobs:
  validate:
    name: Validate · R2 assets contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Static infra contract
        run: python3 -S scripts/cloudflare_r2_assets.py self-test
      - name: Validate declarative config
        run: python3 -S scripts/cloudflare_r2_assets.py validate
      - name: Static publisher contract
        run: python3 -S scripts/r2_asset_publish.py self-test
      - name: Static retention contract
        run: python3 -S scripts/r2_asset_gc.py self-test
      - name: Static storage governance contract
        run: python3 -S scripts/r2_storage_governance.py self-test
      - name: Validate asset manifest
        run: python3 -S scripts/r2_asset_publish.py check-manifest

  reconcile:
    name: Reconcile · R2 assets
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Reconcile bucket, custom domain and CORS
        run: python3 -S scripts/cloudflare_r2_assets.py reconcile
      - name: Verify reconciled state
        run: python3 -S scripts/cloudflare_r2_assets.py check
      - name: Smoke object upload/get/delete
        run: python3 -S scripts/r2_asset_publish.py smoke
      - name: Emit reviewed R2 manifest
        run: cat frontend/src/assets/r2-assets-manifest.json
      - name: Summary
        shell: bash
        run: |
          {
            echo '### R2 assets'
            echo
            echo '- Bucket: `chess-studio-assets`'
            echo '- Public origin: `https://assets.chess-studio.shadowops.dpdns.org`'
            echo '- Location hint: `weur`'
            echo '- Storage: `Standard`'
            echo '- `r2.dev`: disabled'
            echo '- CORS: public read (`GET`, `HEAD`)'
            echo '- Object REST publisher: raw PUT verified with upload/get/delete smoke'
            echo '- Pawn Slug Matthias: immutable objects stay referenced by the reviewed manifest'
            echo '- Pawn Slug enemies: immutable premium/action atlases stay referenced by the reviewed manifest; new blobs are published explicitly with the generic publisher'
          } >> "$GITHUB_STEP_SUMMARY"


  retention:
    name: Retention · R2 assets
    permissions:
      contents: read
      issues: write
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply conservative R2 retention
        run: python3 -S scripts/r2_asset_gc.py apply --report /tmp/r2-retention-report.json
      - name: Enforce R2 budget and maintain issue alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -S scripts/r2_storage_governance.py report --report /tmp/r2-retention-report.json --issue
      - name: Upload retention audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-retention-${{ github.sha }}
          path: /tmp/r2-retention-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/r2-retention-report.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/r2-retention-report.json").read_text())
          gb = lambda value: value / 1_000_000_000
          print("### R2 retention")
          print()
          print(f"- Inventory: {report['totalObjects']} objects / {gb(report['totalBytes']):.3f} GB")
          print(f"- Protected: {report['protectedObjects']} objects / {gb(report.get('protectedBytes', 0)):.3f} GB")
          print(f"- Repo URL pins: runtime {gb(report.get('repoPinRuntimeBytes', 0)):.3f} GB; tooling-only {gb(report.get('repoPinOperationalOnlyBytes', 0)):.3f} GB")
          for item in report.get('repoPinOperationalOnlyByScope', []):
              print(f"  - tooling {item['scope']}: {item['objects']} objects / {gb(item['bytes']):.3f} GB")
          print(f"- Deleted/planned: {report['deleteObjects']} objects / {gb(report['deleteBytes']):.3f} GB")
          print(f"- Projected footprint: {gb(report['projectedBytes']):.3f} GB")
          if 'actualAfterBytes' in report:
              print(f"- Actual footprint after apply: {gb(report['actualAfterBytes']):.3f} GB / {report['actualAfterObjects']} objects")
          print(f"- Soft ceiling: {gb(report['softLimitBytes']):.1f} GB; target: {gb(report['targetBytes']):.1f} GB")
          print(f"- Retained but unprotected: {gb(report['retainedUnprotectedBytes']):.3f} GB")
          for item in report.get('retainedUnprotectedByReason', []):
              print(f"  - {item['reason']}: {item['objects']} objects / {gb(item['bytes']):.3f} GB")
          if report.get('topRetainedUnprotectedPrefixes'):
              print("- Largest retained unprotected prefixes:")
              for item in report['topRetainedUnprotectedPrefixes'][:8]:
                  reason_text = ", ".join(
                      f"{reason['reason']} {gb(reason['bytes']):.3f} GB"
                      for reason in item.get('reasons', [])[:3]
                  )
                  print(f"  - {item['prefix']}: {gb(item['bytes']):.3f} GB ({reason_text})")
          print("- Largest retained prefixes:")
          for item in report.get('topRetainedPrefixes', [])[:8]:
              print(f"  - {item['prefix']}: {gb(item['bytes']):.3f} GB")
          if report.get('topOperationalOnlyPinPrefixes'):
              print("- Largest tooling-only pinned prefixes:")
              for item in report['topOperationalOnlyPinPrefixes'][:8]:
                  print(f"  - {item['prefix']}: {gb(item['bytes']):.3f} GB")
          print(f"- Guard truncated: {report['truncatedByGuard']}")
          print(f"- Blocked over soft limit: {report['blockedOverSoftLimit']}")
          PY
          fi
