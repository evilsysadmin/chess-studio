name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Gate de reglas críticas del cliente
        working-directory: frontend
        run: npx vitest run src/combat.test.js src/combatRoster.test.js src/roguelikeMode.test.js src/moveAvailability.test.js src/voiceCommentary.test.js src/playerRating.test.js src/auth.test.js src/sound.test.js

      - name: Correr suite completa
        working-directory: frontend
        run: npm test

      - name: Verificar que compila
        working-directory: frontend
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend-python
        run: pip install -r requirements-dev.txt

      - name: Gate del core ajedrecístico
        working-directory: backend-python
        run: pytest -q test_chess_ai.py test_core_game.py -x

      - name: Correr suite completa
        working-directory: backend-python
        run: pytest -v

      - name: Comprobar dependencias Python
        working-directory: backend-python
        run: pip check
