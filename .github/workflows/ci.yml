name: CI

# Corre toda la suite de tests (frontend y backend) en cada push y cada pull
# request — vaya o no a desplegarse. Es la diferencia entre "tengo 119
# tests" y "tengo 119 tests que realmente protegen algo": sin esto, nadie
# se entera de que algo se rompió hasta que lo corre a mano.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Gate de reglas críticas del cliente
        working-directory: frontend
        run: npx vitest run src/combat.test.js src/combatRoster.test.js src/roguelikeMode.test.js src/moveAvailability.test.js src/voiceCommentary.test.js src/playerRating.test.js src/auth.test.js src/admin.test.js src/adminWorstMove.test.js src/sound.test.js src/puzzles.test.js

      - name: Correr suite completa
        working-directory: frontend
        run: npm test

      - name: Verificar que compila
        working-directory: frontend
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend-python
        run: pip install -r requirements-dev.txt

      - name: Gate del core ajedrecístico
        working-directory: backend-python
        run: pytest -q test_chess_ai.py test_core_game.py -x

      - name: Correr API + persistencia (core ya validado arriba)
        working-directory: backend-python
        run: pytest -q test_main.py test_profile.py

      - name: Comprobar dependencias Python
        working-directory: backend-python
        run: pip check

  security-gate:
    name: Security gate (CRITICAL blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt

      - name: Preparar informes
        run: mkdir -p .security

      - name: Node dependency audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > ../.security/npm-audit.json
          rc=$?
          set -e
          test -s ../.security/npm-audit.json || { echo "npm audit no produjo informe (rc=$rc)"; exit 2; }
          python3 ../scripts/npm_audit_gate.py ../.security/npm-audit.json

      - name: Instalar pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Python dependency audit
        shell: bash
        run: |
          set +e
          python -m pip_audit -r backend-python/requirements.txt --format=json --output .security/pip-audit.json
          rc=$?
          set -e
          test -s .security/pip-audit.json || { echo "pip-audit no produjo informe (rc=$rc)"; exit 2; }
          python scripts/pip_audit_report.py .security/pip-audit.json

      - name: Trivy — vulns, secrets y misconfiguración
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: .security/trivy.json
          exit-code: '0'
          skip-dirs: node_modules,.venv,.git,.tools,.trivy-cache,.security

      - name: Política de severidad
        run: python scripts/security_report.py .security/trivy.json
