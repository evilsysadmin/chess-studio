# Add a step to run the new health tests if not already present.
# This snippet assumes the CI workflow already runs pytest; we only
# ensure the test directory is included.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi
      - name: Run tests
        run: |
          poetry run pytest -q
