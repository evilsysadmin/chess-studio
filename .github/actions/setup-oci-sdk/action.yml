name: Setup cached OCI SDK
description: Restore an exact OCI Python virtualenv and self-heal it when the cache is unusable.

inputs:
  version:
    description: Exact OCI SDK version.
    required: false
    default: '2.185.2'
  python-version:
    description: Python version used to create the virtualenv.
    required: false
    default: '3.13'
  cache-version:
    description: Manual cache namespace bump.
    required: false
    default: 'v2'
  cache-layout:
    description: 'venv (legacy default) or portable (location-independent site-packages)'
    required: false
    default: 'venv'

outputs:
  cache-hit:
    description: Whether the exact cache key was restored by Actions cache.
    value: ${{ inputs.cache-layout == 'portable' && steps.oci-portable-cache.outputs.cache-hit || steps.oci-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore exact OCI SDK virtualenv
      if: inputs.cache-layout != 'portable'
      id: oci-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/chess-studio-oci-sdk/py${{ inputs.python-version }}/oci-${{ inputs.version }}
        key: oci-sdk-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ inputs.cache-version }}-${{ inputs.version }}

    - name: Ensure usable OCI SDK virtualenv
      if: inputs.cache-layout != 'portable'
      shell: bash
      env:
        OCI_VERSION: ${{ inputs.version }}
        PY_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TOOL_CACHE/chess-studio-oci-sdk/py${PY_VERSION}/oci-${OCI_VERSION}"
        stamp="$(cat "$tool_dir/.chess-oci-version" 2>/dev/null || true)"
        installed=""
        if [[ -x "$tool_dir/bin/python" ]]; then
          installed="$("$tool_dir/bin/python" -c 'import oci; print(oci.__version__)' 2>/dev/null || true)"
        fi

        if [[ "$stamp" != "$OCI_VERSION" || "$installed" != "$OCI_VERSION" ]]; then
          echo "::warning title=OCI SDK cache repair::Rebuilding unusable cached virtualenv (stamp=${stamp:-missing}, import=${installed:-missing})"
          rm -rf "$tool_dir"
          python3 -m venv "$tool_dir"
          "$tool_dir/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "oci==$OCI_VERSION"
          printf '%s\n' "$OCI_VERSION" > "$tool_dir/.chess-oci-version"
        fi

        installed="$("$tool_dir/bin/python" -c 'import oci; print(oci.__version__)')"
        [[ "$installed" == "$OCI_VERSION" ]] || {
          echo "::error::OCI SDK verification failed: expected $OCI_VERSION, got ${installed:-missing}"
          exit 1
        }
        echo "OCI SDK ready: $installed"
        echo "$tool_dir/bin" >> "$GITHUB_PATH"
        echo "OCI_PYTHON=$tool_dir/bin/python" >> "$GITHUB_ENV"
    # Cached virtualenv interpreter paths are not necessarily portable between
    # hosted runners. Keep the original layout for other OCI jobs, but allow
    # staging browser smokes to cache a pure pip --target package tree.
    - name: Restore portable OCI SDK package tree
      if: inputs.cache-layout == 'portable'
      id: oci-portable-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/chess-studio-oci-sdk-portable/py${{ inputs.python-version }}/oci-${{ inputs.version }}
        key: oci-sdk-portable-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-v1-${{ inputs.version }}

    - name: Validate or rebuild portable OCI SDK
      if: inputs.cache-layout == 'portable'
      shell: bash
      env:
        OCI_VERSION: ${{ inputs.version }}
        PY_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        target="$RUNNER_TOOL_CACHE/chess-studio-oci-sdk-portable/py${PY_VERSION}/oci-${OCI_VERSION}"
        stamp="$(cat "$target/.chess-oci-version" 2>/dev/null || true)"
        installed=""
        if [[ -f "$target/oci/__init__.py" ]]; then
          installed="$(PYTHONPATH="$target" python3 -c 'import oci; print(oci.__version__)' 2>/dev/null || true)"
        fi
        if [[ "$stamp" != "$OCI_VERSION" || "$installed" != "$OCI_VERSION" ]]; then
          echo "::notice title=OCI portable cache miss::Installing exact SDK package tree (cache may be cold or invalid)."
          rm -rf "$target"
          mkdir -p "$target"
          python3 -m pip install --disable-pip-version-check --no-cache-dir --target "$target" "oci==$OCI_VERSION"
          printf '%s\n' "$OCI_VERSION" > "$target/.chess-oci-version"
        else
          echo "::notice title=OCI portable cache hit::Reusing valid OCI SDK $OCI_VERSION without pip."
        fi
        installed="$(PYTHONPATH="$target" python3 -c 'import oci; print(oci.__version__)')"
        [[ "$installed" == "$OCI_VERSION" ]] || {
          echo "::error::Portable OCI SDK import/version verification failed."
          exit 1
        }
        echo "PYTHONPATH=$target${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
        echo "OCI_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
