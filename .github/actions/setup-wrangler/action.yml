name: Setup cached Wrangler
description: Restore a pinned Wrangler CLI from Actions cache and install it only when that exact toolchain cache is absent.

inputs:
  version:
    description: Exact Wrangler version to use.
    required: false
    default: '4.127.1'
  node-version:
    description: Node major used by the runner.
    required: false
    default: '22'
  cache-version:
    description: Manual cache namespace bump for the installed Wrangler layout.
    required: false
    default: 'v1'

outputs:
  cache-hit:
    description: Whether Wrangler was restored without npm installation.
    value: ${{ steps.wrangler-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore pinned Wrangler toolchain
      id: wrangler-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/chess-studio-wrangler/${{ inputs.version }}
        key: wrangler-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ inputs.cache-version }}-${{ inputs.version }}

    - name: Install pinned Wrangler on cache miss
      if: steps.wrangler-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WRANGLER_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TOOL_CACHE/chess-studio-wrangler/$WRANGLER_VERSION"
        rm -rf "$tool_dir"
        mkdir -p "$tool_dir"
        npm install --global --prefix "$tool_dir" --prefer-offline --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
        printf '%s\n' "$WRANGLER_VERSION" > "$tool_dir/.chess-wrangler-version"

    - name: Export and verify Wrangler
      shell: bash
      env:
        WRANGLER_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TOOL_CACHE/chess-studio-wrangler/$WRANGLER_VERSION"
        actual="$(cat "$tool_dir/.chess-wrangler-version" 2>/dev/null || true)"
        [[ "$actual" == "$WRANGLER_VERSION" ]] || {
          echo "::error::Wrangler cache stamp mismatch: expected $WRANGLER_VERSION, got ${actual:-missing}"
          exit 1
        }
        test -x "$tool_dir/bin/wrangler"
        "$tool_dir/bin/wrangler" --version

        # Existing workflows and the staging Worker helper currently call
        # `npx --yes wrangler@4`. Keep those call sites stable while making
        # Wrangler registry-independent on cache hits. Every other npx command
        # is delegated to the runner's original npx binary unchanged.
        real_npx="$(command -v npx)"
        printf '%s\n' "$real_npx" > "$tool_dir/.chess-real-npx"
        cat > "$tool_dir/bin/npx" <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        tool_dir="$(cd "$(dirname "$0")/.." && pwd)"
        if [[ "${1:-}" == "--yes" && "${2:-}" == "wrangler@4" ]]; then
          shift 2
          exec "$tool_dir/bin/wrangler" "$@"
        fi
        if [[ "${1:-}" == "wrangler@4" ]]; then
          shift
          exec "$tool_dir/bin/wrangler" "$@"
        fi
        real_npx="$(cat "$tool_dir/.chess-real-npx")"
        exec "$real_npx" "$@"
        SH
        chmod +x "$tool_dir/bin/npx"

        echo "$tool_dir/bin" >> "$GITHUB_PATH"
        echo "WRANGLER_BIN=$tool_dir/bin/wrangler" >> "$GITHUB_ENV"
