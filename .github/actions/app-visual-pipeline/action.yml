name: App visual pipeline
description: Classify first, then build/capture only affected canonical visuals plus scoped Hans/Chesscom artifacts.
inputs:
  mode:
    description: canonical or hans
    required: true
runs:
  using: composite
  steps:
    - name: Resolve visual capture scope
      if: inputs.mode == 'canonical'
      id: scope
      shell: bash
      run: |
        set -euo pipefail
        python3 -S scripts/app_visual_scope.py --self-test
        python3 -S scripts/app_visual_producer_scope.py --self-test
        python3 -S scripts/app_visual_changed_files.py --self-test
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          python3 -S scripts/app_visual_scope.py --all --github-output "$GITHUB_OUTPUT"
          python3 -S scripts/app_visual_producer_scope.py --all --github-output "$GITHUB_OUTPUT"
          exit 0
        fi
        files="$(git diff --name-only HEAD^ HEAD)"
        scoped_files="$(printf '%s\n' "$files" | python3 -S scripts/app_visual_changed_files.py)"
        printf '%s\n' "$files"
        if [[ "$scoped_files" != "$files" ]]; then
          echo 'Normalized visual ownership:'
          printf '%s\n' "$scoped_files"
        fi
        printf '%s\n' "$scoped_files" | python3 -S scripts/app_visual_scope.py --github-output "$GITHUB_OUTPUT"
        printf '%s\n' "$scoped_files" | python3 -S scripts/app_visual_producer_scope.py --github-output "$GITHUB_OUTPUT"

    - name: Restore browser + build when capture is required
      if: >-
        inputs.mode == 'hans' ||
        steps.scope.outputs.capture_groups != 'none' ||
        steps.scope.outputs.hans == 'true' ||
        steps.scope.outputs.chesscom == 'true'
      uses: ./.github/actions/setup-browser-e2e
      env:
        VITE_WAR_ROOM_V2_ENABLE: 'true'
        VITE_APP_VISUAL_CAPTURE: 'true'
      with:
        browser-scope: chromium
        build-frontend: 'true'

    - name: Capture affected canonical surfaces
      if: inputs.mode == 'hans' || (inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none')
      shell: bash
      run: |
        set -euo pipefail
        groups='${{ steps.scope.outputs.capture_groups }}'
        experiments='${{ steps.scope.outputs.experiments_scope }}'
        chronicles_avatar='${{ steps.scope.outputs.chronicles_avatar }}'
        producers='${{ steps.scope.outputs.producer_scope }}'
        [[ -n "$groups" ]] || groups=all
        [[ -n "$experiments" ]] || experiments=all
        [[ -n "$producers" ]] || producers=all
        [[ "$chronicles_avatar" == 'true' || "$chronicles_avatar" == 'false' ]] || chronicles_avatar=true
        bash scripts/app_visual_capture.sh "${{ inputs.mode }}" "$groups" "$experiments" "$chronicles_avatar" "$producers"

    - name: Enforce War Room visual freeze
      if: inputs.mode == 'canonical' && steps.scope.outputs.warroom == 'true'
      shell: bash
      run: node scripts/war_room_visual_freeze_check.mjs

    - name: Validate canonical PNG contract
      if: always() && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none'
      shell: bash
      run: |
        set -euo pipefail
        groups='${{ steps.scope.outputs.capture_groups }}'
        dir='.artifacts/app-visual'
        [[ -d "$dir" ]] || { echo "::error::No canonical visual artifact directory"; exit 1; }
        if [[ "$groups" != "health" ]]; then
          count="$(find "$dir" -type f -name '*.png' | wc -l | tr -d ' ')"
          [[ "$count" -gt 0 ]] || { echo "::error::Visual PR produced no PNG proof"; exit 1; }
          echo "Inspectable canonical PNGs: $count"
          find "$dir" -type f -name '*.png' -print | sort
        fi

    - name: Validate summary
      if: always() && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none'
      shell: bash
      run: node scripts/app_visual_summary.mjs --self-test

    - name: Summary
      if: always() && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none'
      shell: bash
      run: node scripts/app_visual_summary.mjs

    - name: Upload canonical artifact
      if: always() && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none'
      uses: actions/upload-artifact@v7
      with:
        name: app-visual-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/app-visual/
        if-no-files-found: error
        retention-days: 7
        # PNG/WebP are already compressed. Recompressing them burns runner CPU
        # for very little size reduction and makes the visual lane finish later.
        compression-level: 0

    - name: Capture Hans routines
      if: inputs.mode == 'canonical' && steps.scope.outputs.hans == 'true'
      id: hans_capture
      shell: bash
      run: bash scripts/app_visual_capture.sh hans

    - name: Upload Hans routine artifact
      if: always() && inputs.mode == 'canonical' && steps.scope.outputs.hans == 'true' && steps.hans_capture.outcome != 'skipped'
      uses: actions/upload-artifact@v7
      with:
        name: hans-routines-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/app-visual/hans-routines/
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

    - name: Capture Chesscom desktop + mobile
      if: inputs.mode == 'canonical' && steps.scope.outputs.chesscom == 'true'
      continue-on-error: true
      shell: bash
      working-directory: e2e
      env:
        APP_VISUAL_ARTIFACT: '1'
      run: ./node_modules/.bin/playwright test chesscom-visual-artifact.spec.js --workers=1 --retries=0

    - name: Upload Chesscom visual artifact
      if: always() && inputs.mode == 'canonical' && steps.scope.outputs.chesscom == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: chesscom-visual-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/chesscom-visual/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0

    - name: Upload Hans-only routine artifact
      if: always() && inputs.mode == 'hans'
      uses: actions/upload-artifact@v7
      with:
        name: hans-routines-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/app-visual/hans-routines/
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
