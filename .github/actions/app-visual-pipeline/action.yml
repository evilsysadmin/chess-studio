name: App visual pipeline
description: Classify first, then build/capture only affected canonical visuals plus scoped Hans/Chesscom artifacts.
inputs:
  mode:
    description: canonical or hans
    required: true
  chronicles-lane:
    description: "app, chronicles or tactics selects one independent visual workflow; default keeps the legacy CLI behavior."
    default: default
    required: false
runs:
  using: composite
  steps:
    - name: Resolve visual capture scope
      if: inputs.mode == 'canonical'
      id: scope
      shell: bash
      run: |
        set -euo pipefail
        python3 -S scripts/app_visual_scope.py --self-test
        python3 -S scripts/app_visual_producer_scope.py --self-test
        python3 -S scripts/app_visual_changed_files.py --self-test
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          python3 -S scripts/app_visual_scope.py --all --github-output "$GITHUB_OUTPUT"
          python3 -S scripts/app_visual_producer_scope.py --all --chronicles-lane "${{ inputs.chronicles-lane }}" --github-output "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          # The checkout is a synthetic merge commit. Scope against the PR's
          # actual base/head SHAs so unrelated merge-base history cannot leak
          # visual ownership from other domains into this run.
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          base_ref="${{ github.event.pull_request.base.ref }}"
          pr_number="${{ github.event.pull_request.number }}"
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            # A shallow fetch of the moving base ref only guarantees today's
            # main tip, not the historical base SHA recorded when the PR was
            # opened. Fetch the exact reachable commit first; if the server
            # refuses an unadvertised SHA, deepen main until the base appears.
            git fetch --no-tags --depth=1 origin "$base_sha" || true
            for deepen in 64 256 1024; do
              git cat-file -e "$base_sha^{commit}" 2>/dev/null && break
              git fetch --no-tags --deepen="$deepen" origin "$base_ref"
            done
            git cat-file -e "$base_sha^{commit}" 2>/dev/null || {
              echo "::error::Unable to materialize PR base SHA $base_sha"
              exit 1
            }
          fi
          if ! git cat-file -e "$head_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "pull/$pr_number/head"
          fi
          git cat-file -e "$head_sha^{commit}" 2>/dev/null || {
            echo "::error::Unable to materialize PR head SHA $head_sha"
            exit 1
          }
          # PR ownership is the head-side delta from the common ancestor.
          # A direct base..head diff wrongly includes files that landed on main
          # after this branch forked, which can expand one focused visual PR to
          # every canonical surface.
          merge_base="$(git merge-base "$base_sha" "$head_sha" 2>/dev/null || true)"
          if [[ -z "$merge_base" ]]; then
            for deepen in 64 256 1024; do
              git fetch --no-tags --deepen="$deepen" origin "$base_ref"
              merge_base="$(git merge-base "$base_sha" "$head_sha" 2>/dev/null || true)"
              [[ -n "$merge_base" ]] && break
            done
          fi
          [[ -n "$merge_base" ]] || {
            echo "::error::Unable to resolve PR merge-base for $base_sha..$head_sha"
            exit 1
          }
          # A rescue branch may have a merge HEAD whose first parent is a
          # newer main commit than the base SHA stored in the PR event. Using
          # the stale merge-base would include other teams' merged changes,
          # waking unrelated visual suites (Chronicles/Football/etc.). Only
          # use the first parent when it is PROVEN to be main lineage.
          mapfile -t head_parents < <(git cat-file -p "$head_sha" | sed -n 's/^parent //p')
          if [[ "${#head_parents[@]}" -eq 2 ]]; then
            synced_main="${head_parents[0]}"
            git cat-file -e "$synced_main^{commit}" 2>/dev/null || \
              git fetch --no-tags --depth=1 origin "$synced_main" || true
            for deepen in 0 64 256; do
              if [[ "$deepen" != 0 ]]; then
                git fetch --no-tags --deepen="$deepen" origin "$base_ref"
              fi
              if git merge-base --is-ancestor "$base_sha" "$synced_main" 2>/dev/null && \
                 git merge-base --is-ancestor "$synced_main" "origin/$base_ref" 2>/dev/null; then
                echo "Visual PR ownership: accredited main parent $synced_main (event base $base_sha)"
                merge_base="$synced_main"
                break
              fi
            done
          fi
          files="$(git diff --name-only "$merge_base" "$head_sha")"
        else
          base_sha="HEAD^"
          head_sha="HEAD"
          files="$(git diff --name-only "$base_sha" "$head_sha")"
        fi
        scoped_files="$(
          printf '%s\n' "$files" |
            APP_VISUAL_BASE_SHA="$base_sha" APP_VISUAL_HEAD_SHA="$head_sha" \
            python3 -S scripts/app_visual_changed_files.py
        )"
        printf '%s\n' "$files"
        if [[ "$scoped_files" != "$files" ]]; then
          echo 'Normalized visual ownership:'
          printf '%s\n' "$scoped_files"
        fi
        printf '%s\n' "$scoped_files" | python3 -S scripts/app_visual_scope.py --github-output "$GITHUB_OUTPUT"
        printf '%s\n' "$scoped_files" | python3 -S scripts/app_visual_producer_scope.py --chronicles-lane "${{ inputs.chronicles-lane }}" --github-output "$GITHUB_OUTPUT"

    - name: Restore browser + build when capture is required
      if: >-
        inputs.mode == 'hans' ||
        (steps.scope.outputs.capture_groups != 'none' && steps.scope.outputs.producer_scope != 'none') ||
        ((inputs.chronicles-lane == 'app' || inputs.chronicles-lane == 'default') &&
         (steps.scope.outputs.hans == 'true' || steps.scope.outputs.chesscom == 'true'))
      uses: ./.github/actions/setup-browser-e2e
      env:
        VITE_WAR_ROOM_VARIANTS_ENABLE: 'true'
        VITE_APP_VISUAL_CAPTURE: 'true'
      with:
        browser-scope: chromium
        build-frontend: 'true'

    - name: Wait for War Room v2 revision
      if: inputs.mode == 'canonical' && steps.scope.outputs.warroom_revision_required == 'true'
      env:
        APP_VISUAL_EXPECTED_WAR_ROOM_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      shell: bash
      run: |
        set -euo pipefail
        revision_url="https://assets.chess-studio.shadowops.dpdns.org/war-room/v2/staging/revisions/${APP_VISUAL_EXPECTED_WAR_ROOM_REVISION}.glb"
        probe_file="${RUNNER_TEMP}/war-room-v2-revision.glb"
        deadline=$((SECONDS + 420))
        while (( SECONDS < deadline )); do
          rm -f "$probe_file"
          if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
            -o "$probe_file" "${revision_url}?probe=$(date +%s%N)" \
            && [[ -s "$probe_file" ]] \
            && [[ "$(head -c 4 "$probe_file")" == "glTF" ]]; then
            echo "War Room v2 revision ready: ${APP_VISUAL_EXPECTED_WAR_ROOM_REVISION} ($(wc -c < "$probe_file") bytes)"
            rm -f "$probe_file"
            exit 0
          fi
          sleep 3
        done
        rm -f "$probe_file"
        echo "::error::War Room v2 revision GLB unavailable after preflight: ${APP_VISUAL_EXPECTED_WAR_ROOM_REVISION}"
        exit 1

    - name: Wait for War Room v3 revision
      if: inputs.mode == 'canonical' && steps.scope.outputs.warroom_v3_revision_required == 'true'
      env:
        APP_VISUAL_EXPECTED_WAR_ROOM_V3_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      shell: bash
      run: |
        set -euo pipefail
        revision_url="https://assets.chess-studio.shadowops.dpdns.org/war-room/v3/staging/revisions/${APP_VISUAL_EXPECTED_WAR_ROOM_V3_REVISION}.glb"
        probe_file="${RUNNER_TEMP}/war-room-v3-revision.glb"
        deadline=$((SECONDS + 420))
        while (( SECONDS < deadline )); do
          rm -f "$probe_file"
          if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
            -o "$probe_file" "${revision_url}?probe=$(date +%s%N)" \
            && [[ -s "$probe_file" ]] \
            && [[ "$(head -c 4 "$probe_file")" == "glTF" ]]; then
            echo "War Room v3 revision ready: ${APP_VISUAL_EXPECTED_WAR_ROOM_V3_REVISION} ($(wc -c < "$probe_file") bytes)"
            rm -f "$probe_file"
            exit 0
          fi
          sleep 3
        done
        rm -f "$probe_file"
        echo "::error::War Room v3 revision GLB unavailable after preflight: ${APP_VISUAL_EXPECTED_WAR_ROOM_V3_REVISION}"
        exit 1

    - name: Wait for PvP Duel Room revision
      if: inputs.mode == 'canonical' && steps.scope.outputs.pvp_duel_revision_required == 'true'
      env:
        APP_VISUAL_EXPECTED_PVP_DUEL_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      shell: bash
      run: |
        set -euo pipefail
        revision_url="https://assets.chess-studio.shadowops.dpdns.org/pvp/duel-room/staging/revisions/${APP_VISUAL_EXPECTED_PVP_DUEL_REVISION}.glb"
        probe_file="${RUNNER_TEMP}/pvp-duel-room-revision.glb"
        deadline=$((SECONDS + 420))
        while (( SECONDS < deadline )); do
          rm -f "$probe_file"
          if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
            -o "$probe_file" "${revision_url}?probe=$(date +%s%N)" \
            && [[ -s "$probe_file" ]] \
            && [[ "$(head -c 4 "$probe_file")" == "glTF" ]]; then
            echo "PvP Duel Room revision ready: ${APP_VISUAL_EXPECTED_PVP_DUEL_REVISION} ($(wc -c < "$probe_file") bytes)"
            rm -f "$probe_file"
            exit 0
          fi
          sleep 3
        done
        rm -f "$probe_file"
        echo "::error::PvP Duel Room revision GLB unavailable after preflight: ${APP_VISUAL_EXPECTED_PVP_DUEL_REVISION}"
        exit 1

    - name: Capture affected canonical surfaces
      if: inputs.mode == 'hans' || (inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none' && steps.scope.outputs.producer_scope != 'none')
      env:
        APP_VISUAL_EXPECTED_WAR_ROOM_REVISION: ${{ steps.scope.outputs.warroom_revision_required == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || '' }}
        APP_VISUAL_EXPECTED_WAR_ROOM_V3_REVISION: ${{ steps.scope.outputs.warroom_v3_revision_required == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || '' }}
        APP_VISUAL_EXPECTED_PVP_DUEL_REVISION: ${{ steps.scope.outputs.pvp_duel_revision_required == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || '' }}
        APP_VISUAL_WARROOM_VARIANTS: ${{ steps.scope.outputs.warroom_variants }}
        APP_VISUAL_WARROOM_PROFILE_SCOPE: ${{ steps.scope.outputs.warroom_profile_scope }}
        APP_VISUAL_HOME_PROFILE_SCOPE: ${{ steps.scope.outputs.home_profile_scope }}
      shell: bash
      run: |
        set -euo pipefail
        groups='${{ steps.scope.outputs.capture_groups }}'
        experiments='${{ steps.scope.outputs.experiments_scope }}'
        chronicles_avatar='${{ steps.scope.outputs.chronicles_avatar }}'
        producers='${{ steps.scope.outputs.producer_scope }}'
        [[ -n "$groups" ]] || groups=all
        [[ -n "$experiments" ]] || experiments=all
        [[ -n "$producers" ]] || producers=all
        [[ "$chronicles_avatar" == 'true' || "$chronicles_avatar" == 'false' ]] || chronicles_avatar=true
        bash scripts/app_visual_capture.sh "${{ inputs.mode }}" "$groups" "$experiments" "$chronicles_avatar" "$producers"

    - name: Enforce War Room visual freeze
      if: >-
        inputs.mode == 'canonical' &&
        steps.scope.outputs.warroom == 'true' &&
        (steps.scope.outputs.producer_scope == 'all' || contains(steps.scope.outputs.producer_scope, 'warroom-core'))
      env:
        APP_VISUAL_WARROOM_VARIANTS: ${{ steps.scope.outputs.warroom_variants }}
        APP_VISUAL_WARROOM_PROFILE_SCOPE: ${{ steps.scope.outputs.warroom_profile_scope }}
      shell: bash
      run: node scripts/war_room_visual_freeze_check.mjs

    - name: Validate canonical PNG contract
      if: always() && steps.scope.outcome == 'success' && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none' && steps.scope.outputs.producer_scope != 'none'
      shell: bash
      run: |
        set -euo pipefail
        groups='${{ steps.scope.outputs.capture_groups }}'
        dir='.artifacts/app-visual'
        [[ -d "$dir" ]] || { echo "::error::No canonical visual artifact directory"; exit 1; }
        if [[ "$groups" != "health" ]]; then
          count="$(find "$dir" -type f -name '*.png' | wc -l | tr -d ' ')"
          [[ "$count" -gt 0 ]] || { echo "::error::Visual PR produced no PNG proof"; exit 1; }
          echo "Inspectable canonical PNGs: $count"
          find "$dir" -type f -name '*.png' -print | sort
        fi

    - name: Validate summary
      if: always() && steps.scope.outcome == 'success' && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none' && steps.scope.outputs.producer_scope != 'none'
      shell: bash
      run: node scripts/app_visual_summary.mjs --self-test

    - name: Summary
      if: always() && steps.scope.outcome == 'success' && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none' && steps.scope.outputs.producer_scope != 'none'
      shell: bash
      run: node scripts/app_visual_summary.mjs

    - name: Upload canonical artifact
      if: always() && steps.scope.outcome == 'success' && inputs.mode == 'canonical' && steps.scope.outputs.capture_groups != 'none' && steps.scope.outputs.producer_scope != 'none'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.chronicles-lane == 'tactics' && 'tactics-visual' || inputs.chronicles-lane == 'chronicles' && 'chronicles-visual' || 'app-visual' }}-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/app-visual/
        if-no-files-found: error
        retention-days: 7
        # PNG/WebP are already compressed. Recompressing them burns runner CPU
        # for very little size reduction and makes the visual lane finish later.
        compression-level: 0

    - name: Capture Hans routines
      if: >-
        inputs.mode == 'canonical' &&
        (inputs.chronicles-lane == 'app' || inputs.chronicles-lane == 'default') &&
        steps.scope.outputs.hans == 'true' &&
        (steps.scope.outputs.producer_scope == 'all' || contains(steps.scope.outputs.producer_scope, 'warroom-hans'))
      id: hans_capture
      # Secondary choreography/video evidence. The canonical Hans visual canary
      # above remains fail-closed; routine capture must not block unrelated PRs
      # on SwiftShader timing or recorder instability.
      continue-on-error: true
      shell: bash
      run: bash scripts/app_visual_capture.sh hans

    - name: Upload Hans routine artifact
      if: always() && inputs.mode == 'canonical' && (inputs.chronicles-lane == 'app' || inputs.chronicles-lane == 'default') && steps.scope.outputs.hans == 'true' && steps.hans_capture.outcome != 'skipped'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: hans-routines-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/app-visual/hans-routines/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0

    - name: Report non-blocking Hans routine failure
      if: >-
        always() &&
        inputs.mode == 'canonical' &&
        (inputs.chronicles-lane == 'app' || inputs.chronicles-lane == 'default') &&
        steps.scope.outputs.hans == 'true' &&
        steps.hans_capture.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Hans routine video sidecar failed; canonical Hans visual proof remains the blocking contract."
        {
          echo "### Hans routine sidecar · informativo"
          echo
          echo "La captura secundaria de rutinas de Hans falló. No bloquea la PR."
          echo "El canario visual canónico de Hans continúa siendo fail-closed."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Capture Chesscom desktop + mobile
      if: inputs.mode == 'canonical' && (inputs.chronicles-lane == 'app' || inputs.chronicles-lane == 'default') && steps.scope.outputs.chesscom == 'true'
      continue-on-error: true
      shell: bash
      working-directory: e2e
      env:
        APP_VISUAL_ARTIFACT: '1'
      run: ./node_modules/.bin/playwright test chesscom-visual-artifact.spec.js --workers=1 --retries=0

    - name: Upload Chesscom visual artifact
      if: always() && inputs.mode == 'canonical' && (inputs.chronicles-lane == 'app' || inputs.chronicles-lane == 'default') && steps.scope.outputs.chesscom == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: chesscom-visual-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/chesscom-visual/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0

    - name: Upload Hans-only routine artifact
      if: always() && inputs.mode == 'hans'
      uses: actions/upload-artifact@v7
      with:
        name: hans-routines-${{ github.event.pull_request.number || github.run_id }}
        path: .artifacts/app-visual/hans-routines/
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
