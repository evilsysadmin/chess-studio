name: Setup Blender canonical art
description: Restore cached Blender, EGL, WebP and Pillow toolchains while keeping product-specific host packages minimal.
inputs:
  blender-version:
    description: Portable Blender version shared by canonical art workflows.
    required: false
    default: '4.0.2'
  extra-packages:
    description: Optional space-separated apt packages required by the product-specific renderer.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Restore portable Blender cache
      id: blender-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/blender-${{ inputs.blender-version }}
        key: blender-portable-${{ runner.os }}-${{ runner.arch }}-${{ inputs.blender-version }}-v1

    - name: Materialize portable Blender on cache miss
      shell: bash
      env:
        BLENDER_VERSION: ${{ inputs.blender-version }}
      run: |
        set -euo pipefail
        blender_home="${RUNNER_TEMP}/blender-${BLENDER_VERSION}"
        if [[ ! -x "${blender_home}/blender" ]]; then
          case "$(uname -m)" in
            x86_64) archive_arch='x64' ;;
            *) echo "Unsupported Blender runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          release_series="${BLENDER_VERSION%.*}"
          archive="${RUNNER_TEMP}/blender-${BLENDER_VERSION}.tar.xz"
          url="https://download.blender.org/release/Blender${release_series}/blender-${BLENDER_VERSION}-linux-${archive_arch}.tar.xz"
          rm -rf "${blender_home}"
          mkdir -p "${blender_home}"
          curl --fail --location --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "${url}" -o "${archive}"
          tar -xJf "${archive}" --strip-components=1 -C "${blender_home}"
          rm -f "${archive}"
        fi
        test -x "${blender_home}/blender"
        echo "${blender_home}" >> "${GITHUB_PATH}"
        "${blender_home}/blender" --version | head -n 1

    - name: Resolve host runtime identity
      id: host-runtime
      shell: bash
      run: |
        set -euo pipefail
        os_version="$(. /etc/os-release; printf '%s' "${VERSION_ID//./}")"
        echo "os-version=${os_version}" >> "${GITHUB_OUTPUT}"

    - name: Restore EGL package cache
      id: egl-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/blender-egl-debs
        key: blender-egl-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-runtime.outputs.os-version }}-v2

    - name: Download EGL packages on cache miss
      if: steps.egl-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        deb_root="${RUNNER_TEMP}/blender-egl-debs"
        rm -rf "${deb_root}"
        mkdir -p "${deb_root}"
        cd "${deb_root}"
        apt-get download libegl1 libegl-mesa0 >/dev/null
        test -n "$(find . -maxdepth 1 -name '*.deb' -print -quit)"

    - name: Materialize cached EGL into runner
      id: egl-runtime
      shell: bash
      run: |
        set -euo pipefail
        deb_root="${RUNNER_TEMP}/blender-egl-debs"
        mapfile -t debs < <(find "${deb_root}" -maxdepth 1 -name '*.deb' -type f -print | sort)
        if (( ${#debs[@]} == 0 )); then
          echo 'ready=false' >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        for deb in "${debs[@]}"; do
          sudo dpkg-deb -x "${deb}" /
        done
        sudo ldconfig
        ready=false
        if ldconfig -p | grep -q 'libEGL\.so\.1' && ldconfig -p | grep -q 'libEGL_mesa\.so\.0'; then
          ready=true
          echo 'Cached EGL runtime materialized into runner root.'
        fi
        echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

    - name: Restore WebP tool cache
      id: webp-cache
      if: inputs.extra-packages == 'webp'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/blender-webp-tools
        key: blender-webp-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-runtime.outputs.os-version }}-v1

    - name: Materialize WebP tools on cache miss
      if: inputs.extra-packages == 'webp' && steps.webp-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        webp_root="${RUNNER_TEMP}/blender-webp-tools"
        rm -rf "${webp_root}"
        mkdir -p "${webp_root}/download"
        cd "${webp_root}/download"
        apt-get download webp >/dev/null
        deb="$(find . -maxdepth 1 -name 'webp_*.deb' -type f -print -quit)"
        test -n "${deb}"
        dpkg-deb -x "${deb}" "${webp_root}"
        rm -rf "${webp_root}/download"

    - name: Expose cached WebP tools
      id: webp-runtime
      if: inputs.extra-packages == 'webp'
      shell: bash
      run: |
        set -euo pipefail
        webp_bin="${RUNNER_TEMP}/blender-webp-tools/usr/bin"
        ready=false
        if [[ -x "${webp_bin}/cwebp" && -x "${webp_bin}/webpinfo" ]] \
          && ! ldd "${webp_bin}/cwebp" | grep -q 'not found' \
          && ! ldd "${webp_bin}/webpinfo" | grep -q 'not found'; then
          ready=true
          echo "${webp_bin}" >> "${GITHUB_PATH}"
          "${webp_bin}/cwebp" -version
          echo 'Cached WebP tools ready.'
        fi
        echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

    - name: Install fallback graphics or product helpers
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        EGL_READY: ${{ steps.egl-runtime.outputs.ready }}
        WEBP_READY: ${{ steps.webp-runtime.outputs.ready }}
      run: |
        set -euo pipefail
        packages=()
        if [[ "${EGL_READY}" != 'true' ]]; then
          packages+=(libegl1)
        fi
        if [[ -n "${EXTRA_PACKAGES}" ]]; then
          read -r -a extras <<< "${EXTRA_PACKAGES}"
          for package in "${extras[@]}"; do
            if [[ "${package}" == 'webp' && "${WEBP_READY}" == 'true' ]]; then
              continue
            fi
            packages+=("${package}")
          done
        fi
        if (( ${#packages[@]} == 0 )); then
          echo 'No apt packages needed for Blender canonical art.'
          exit 0
        fi
        install_packages() {
          sudo env \
            DEBIAN_FRONTEND=noninteractive \
            NEEDRESTART_SUSPEND=1 \
            apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=0 \
            "${packages[@]}"
        }
        if ! install_packages; then
          sudo apt-get update -qq
          install_packages
        fi

    - name: Resolve Python cache identity
      id: python-cache-id
      shell: bash
      run: |
        set -euo pipefail
        abi="$(python3 -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}")')"
        echo "abi=${abi}" >> "${GITHUB_OUTPUT}"

    - name: Restore Pillow helper cache
      id: pillow-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/blender-python-tools
        key: blender-python-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-cache-id.outputs.abi }}-pillow-10.4.0-v1

    - name: Materialize Pillow helper on cache miss
      if: steps.pillow-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        pillow_root="${RUNNER_TEMP}/blender-python-tools"
        rm -rf "${pillow_root}"
        python3 -m pip install \
          --quiet \
          --disable-pip-version-check \
          --no-deps \
          --only-binary=:all: \
          --target "${pillow_root}" \
          'Pillow==10.4.0'

    - name: Expose Pillow helper
      shell: bash
      run: |
        set -euo pipefail
        pillow_root="${RUNNER_TEMP}/blender-python-tools"
        PYTHONPATH="${pillow_root}" python3 -c "from PIL import Image; print('Pillow', Image.__version__)"
        python_path="${pillow_root}"
        if [[ -n "${PYTHONPATH:-}" ]]; then
          python_path="${python_path}:${PYTHONPATH}"
        fi
        echo "PYTHONPATH=${python_path}" >> "${GITHUB_ENV}"
