name: Build cached browser frontend
description: Restore a content-addressed frontend/dist for browser CI, or build and cache it on a miss.

inputs:
  node-version:
    description: Node major used when a frontend build is required.
    required: false
    default: '22'

outputs:
  cache-hit:
    description: Whether frontend/dist was restored from the exact content cache.
    value: ${{ steps.dist-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore content-addressed browser frontend
      id: dist-cache
      uses: actions/cache@v6
      with:
        path: frontend/dist
        key: quality-browser-dist-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json', 'frontend/index.html', 'frontend/vite.config.js', 'frontend/public/**', 'frontend/src/**', 'scripts/apply_frontend_csp.mjs', 'scripts/performance_surface_report.mjs') }}

    - name: Setup Node.js for browser frontend build
      if: steps.dist-cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Restore exact frontend dependencies
      if: steps.dist-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/cache-node-modules
      with:
        working-directory: frontend
        lockfile: frontend/package-lock.json
        node-version: ${{ inputs.node-version }}

    - name: Build production frontend on cache miss
      if: steps.dist-cache.outputs.cache-hit != 'true'
      working-directory: frontend
      shell: bash
      run: npm run build
