version: 2

# Keep dependency maintenance boring:
# - weekly checks, in Europe/Madrid;
# - patch/minor version updates grouped per ecosystem to reduce PR noise;
# - coupled major stacks are grouped for one deliberate compatibility review;
# - unrelated major updates remain individual PRs and require deliberate review;
# - security updates remain ungrouped so an urgent fix is not coupled to unrelated changes.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:10"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      react-major:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "major"
      vite-toolchain-major:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vitest"
          - "@vitest/coverage-v8"
        update-types:
          - "major"
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:20"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(e2e)"
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      opentelemetry-stack:
        applies-to: version-updates
        patterns:
          - "opentelemetry-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:40"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:50"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
